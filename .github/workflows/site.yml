name: Publish the wiki site

on:
  push:
    branches: [master]
    paths: ["wiki/**", "site/**", "build/site_content.py", "build/site_art.py", "build/site_charts.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fetch Quartz (pinned)
        run: |
          git clone https://github.com/jackyzha0/quartz.git quartz-src
          git -C quartz-src checkout 97a2d05
      - name: Graphviz (lays out the charts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Public pages only
        run: |
          cp site/quartz.config.yaml quartz-src/quartz.config.yaml
          cp site/custom.scss quartz-src/quartz/styles/custom.scss
          python3 build/site_content.py quartz-src/content
      - name: Build
        working-directory: quartz-src
        run: |
          npm ci
          npx quartz plugin install
          npx quartz build
      - name: Front page and art
        run: cp site/landing.html quartz-src/public/index.html && cp site/404.html quartz-src/public/404.html && cp -r site/assets quartz-src/public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-src/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

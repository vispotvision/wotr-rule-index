# build/casting.yaml — the casting brief, one entry per character.
#
# What this is: for every character with a spec in build/casting/*.json, the voice we are
# after — built from the character's card and from the lines they actually speak in the
# scene archive, with the quotes that argue for it. build/voice_refs.py reads this to pick a
# reference speaker (VCTK / LibriTTS-R, both CC BY 4.0) or to --design one from a clip to
# match; build/voices.yaml then points the render at the result.
#
# What is not allowed: a target that names a real person. "sounds like <actor>" is not a
# brief here and must not be added to one — reference clips come from readers who recorded
# for release under a licence that permits it, or are designed voices that are nobody's.
# Comparisons in these briefs are to roles and trades (a harbour magistrate, a quarry
# foreman, a field medic), never to a named human.
#
# Keys are the speaker tags the cast files use (scenes/cast/<scene>.cast.md) — the plain
# name the prose attributes dialogue to, the way voices.yaml already keys Verinus, Aurelian,
# Gimbzo, Kizami and Darius. Where the spec's name field carries the card title or an
# epithet, the card title sits in the comment above the entry. Two specs cast the same man
# (Darius.json and Ignatius_Sanctus_Sanctorum_Arsenal.json) and are one entry here, so the
# 42 files give 41 characters.
#
# Per entry: gender, age, body, pitch (very low / low / medium-low / medium / medium-high /
# high), texture, pace (slow / measured / moderate / quick), energy, register, accent_hint,
# engine (Chatterbox model: turbo or standard), exaggeration (Chatterbox), design (the
# --design knobs for voice_refs.py: pitch_st semitones, weight / grit / breath 0–1, pace
# stretch), reference_direction (the brief in prose), one_line, evidence (2–4 of the
# strongest quotes, source cited — verbatim from the card or the scene). accent_hint is
# the spec's own accent sentence where it had no separate field; null where the spec said
# nothing about accent. The comment above each entry records how many archive lines the
# spec read; "no archive dialogue" means the brief rests on the card alone.
#
# Field text is carried verbatim from the JSON specs; this file adds only the keys, the
# comments, the evidence selection, and the collision notes at the foot.

# ================================================================================================
# Concordia — Sanctum Lux, the Alabaster Court, the gate
# ================================================================================================


Gimbzo:                 # card: Gimbzo; voices.yaml already keys him Gimbzo; 30 archive lines read
  gender: "male"
  age: >-
    Ancient beyond count — First-Eon generation, a contemporary of Bara, predating the languages later
    peoples used to name his own techniques ('I was here before the mouth that made them'). Reads as a
    weathered elder in bearing and diction, not a young man, but with no decay in him: his cultivation
    was frozen at Zenith, so age shows as wear and patience, never frailty.
  body: >-
    8 feet and up in effect (card lists 7'4", but the prose revises a witness's estimate upward to 'past
    eight feet' once he stands). Barrel torso, slab pectorals, forearms thick as cooper's mallets, neck
    wider than his own jaw, deep umber-bronze sun-leathered skin, bare-chested above a wrapped hakama,
    twin great-axes with blades broad as church doors.
  pitch: "very low"
  texture:
    - "low chest/torso resonance — a body that size has to move air from somewhere deep"
    - "dry, weathered rasp: sun-leathered skin and an 'old lion's mane' beard, not a wet or screamed rasp"
    - "level and unhurried under almost all conditions — the text says outright he speaks 'without heat,' which is what makes the flat delivery land harder than shouting would"
    - "one percussive register break: the bark-laugh 'HOO,' described as going through gate-posts and coming back off a tree trunk — short, huge, then gone"
    - "a second, rarer register break under real threat, where the narration says his voice 'had gone somewhere it had not been' — colder and harder, still not loud"
  pace: "slow"
  energy: >-
    Low and settled at rest, matching a character whose whole magic is described as falling rather than
    flaring and recovering 'in long breaths, not heartbeats.' He delivers even brutal content at the
    same unhurried level; pressure shows as stillness and a longer pause, not volume. Escalation is rare
    and small in absolute terms, but reads as huge because the baseline is so flat.
  register: >-
    Blunt, plainspoken, craftsman/foreman diction — masonry and labor metaphors (arches, keystones, load
    paths, 'a working number'), not scripture or high fantasy declamation despite his mythic age.
    Voice-fingerprint data backs this: long, unbroken declarative sentences (mean 38.8 words, almost
    never clipped short) delivered with heavy contraction (0.79, highest in the cast — 'that's,'
    'don't,' 'it's,' 'you'll') and almost no questions (0.03) — he states things, he doesn't probe.
    Occasional archaic 'Aye' is the only period-flavor tic; otherwise it's the cadence of a foreman
    assigning a work order.
  accent_hint: >-
    Accent flavour should be plain and unaffected — rural or working-class Northern-English-adjacent,
    foreman or stonemason, never posh, never archaic-fantasy declamation, despite him predating recorded
    language.
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: -6, weight: 0.8, grit: 0.4, breath: 0.1, pace: 0.88}
  reference_direction: >-
    Male, and as low as the range allows — pitched from the chest/torso rather than the throat, the way
    a very large man's voice has nowhere else to come from. Texture is dry and weathered, not wet or
    screamed: think sun-cracked leather, old timber, or a worn quarry stone — a low creak and rasp
    that's present at rest, not a growl reached for on cue. Pace is slow and unhurried, with real weight
    given to pauses ('the waiting had the quality of ground'), but the sentences themselves run long and
    unbroken rather than clipped or halting. Accent flavour should be plain and unaffected — rural or
    working-class Northern-English-adjacent, foreman or stonemason, never posh, never archaic-fantasy
    declamation, despite him predating recorded language. One comparison: an old quarry foreman near the
    end of a forty-year career, explaining in complete, unhurried sentences exactly why the wall a
    younger man just built is going to fall down — said at conversational volume because he has never
    once needed to raise it to be obeyed, with one big percussive bark of a laugh held in reserve and a
    rarer, colder register that comes out only when someone is about to get hurt for real.
  one_line: >-
    An ancient, eight-foot anchor of a man who talks the way a mountain would if it bothered to: low,
    slow, dry-graveled, almost never raising the register even when the sentence is lethal, with one
    huge percussive bark of a laugh and one rare, colder gear held in reserve.
  evidence:
    - source: "scenes/seven_labors.md:69"
      quote: >-
        He said it without heat. He said almost everything without heat, which made the flat delivery worse
        than shouting.
    - source: "scenes/seven_labors.md:21"
      quote: >-
        "HOO." The laugh went through the uprights and came back off the trunk.
    - source: "wiki/Volume I — Character Cards/Gimbzo.md:108"
      quote: >-
        7'4". Barrel-torso, slab-pectoraled, forearms thick as cooper's mallets, neck wider than his own
        jaw.
    - source: "scenes/balance_lesson.md:111"
      quote: >-
        "Out." Gimbzo's voice had gone somewhere it had not been.

Lorn:                   # card: Lorn Stark — The Sword-Teacher; one archive line; 1 archive line read
  gender: "male"
  age: >-
    44 — grey at the temples only, brown elsewhere; reads as solid mid-40s, not old
  body: >-
    broad, heavy Stark frame built bigger and heavier than his sister Fern's; a soldier's build that is
    durable and competent rather than impressive — never a gifted swordsman, but trained every day for
    years, so the frame reads as sturdy labor rather than athletic flash
  pitch: "medium-low"
  texture:
    - "plain"
    - "weathered"
    - "flat-affect"
    - "unhurried"
    - "controlled"
    - "faint gravel from age and outdoor soldiering, not a growl"
  pace: "measured"
  energy: >-
    low-key, steady, never raised; the authority sits in the flatness, not in volume
  register: >-
    plain-spoken military direct address — no flourish, no filler, no wasted syllables; reports and
    gives instructions rather than persuades; goes silent or physical (a handclasp, not a speech) at the
    one moment emotion actually threatens the flatness
  accent_hint: >-
    No regional caricature — think a plain northern-frontier soldier's cadence, the voice of a career
    non-commissioned officer giving a status report, not a general rallying troops.
  engine: "turbo"
  exaggeration: 0.25
  design: {pitch_st: -2, weight: 0.45, grit: 0.3, breath: 0.15, pace: 0.96}
  reference_direction: >-
    Male, medium-low pitch, sitting a couple of semitones below neutral without going into deep-bass
    territory. Texture is plain and lightly weathered — a little dry gravel from age and years outdoors,
    not the raspy growl register (that belongs to Darius/Gimbzo, and Lorn is a different kind of man).
    Measured, unhurried pace with short, flat, declarative sentences and no rhetorical lift at the ends
    of lines — he reports and instructs, he doesn't perform. Minimal breathiness; the control is the
    point. No regional caricature — think a plain northern-frontier soldier's cadence, the voice of a
    career non-commissioned officer giving a status report, not a general rallying troops. One
    comparison: the flat, competent voice of a long-serving drill instructor who has never needed to
    shout to be obeyed.
  one_line: >-
    A plain, medium-low, lightly weathered soldier's voice — flat, unhurried, and short-sentenced, with
    the emotion pushed down into a handclasp instead of a raised voice; archive gives him exactly one
    line, so the card's own 'Voice' section (Stark-direct, no wasted syllables, never needs to raise it)
    is doing most of the casting work here.
  evidence:
    - source: "wiki/Volume I — Character Cards/Lorn Stark — The Sword-Teacher.md, section 'Voice'"
      quote: >-
        Stark-direct. No wasted syllables, no wasted steps. He speaks the way he fights: competently,
        without flair, each word placed where the word serves the sentence's purpose and nowhere else. He
        does not raise his voice. He does not need to.
    - source: "wiki/Volume I — Character Cards/Lorn Stark — The Sword-Teacher.md, section 'Physical Description'"
      quote: >-
        Forty-four and showing the specific accelerated grey that the last eleven years produced. Hair grey
        at the temples, brown elsewhere, cut in the northern military style.
    - source: "scenes/01_wotr_muster_breach_road_north.md:173"
      quote: >-
        "That is the third one of those," Lorn said. "And they do not agree."
    - source: "scenes/01_wotr_muster_breach_road_north.md:229"
      quote: >-
        Lorn found that the thing he wanted to say would not come out in any arrangement that was not
        embarrassing, so he put his hand out instead

Muken:                  # card: Muken Moto; no transcript exists, no lines attested; no archive dialogue
  gender: "male"
  age: >-
    Mature adult, roughly early-to-mid 40s at death — sixteen years on the throne, a fourteen-year-old
    son (Sodoku) and two younger children (Tomuka 12, Ezo 9) alive at the assassination, hair already
    white with only the temples still going grey.
  body: >-
    6'1", dense and heavy-shouldered, war-thickened, deep brown skin scored with old scars and
    law-burns, pale fracture lines that glow amber under strain. A load-bearing frame built for standing
    under weight rather than moving fast.
  pitch: "low"
  texture:
    - "weathered"
    - "restrained rasp"
    - "resonant/chest-forward"
    - "unhurried"
  pace: "slow"
  energy: "banked, low-key, weight held in reserve rather than spent"
  register: >-
    terse, sovereign-judicial; a man who renders verdicts, not arguments
  accent_hint: >-
    No regional real-world accent flavor — plain, unornamented, continental-neutral delivery with no
    lilt and no rhetorical rise-and-fall; the pitch barely moves phrase to phrase.
  engine: "turbo"
  exaggeration: 0.35
  design: {pitch_st: -4, weight: 0.7, grit: 0.35, breath: 0.15, pace: 0.88}
  reference_direction: >-
    Male, low-to-very-low pitch anchored in the chest, not the throat — a voice that sits under a room
    rather than filling it. Texture is weathered rather than shredded: a faint scar-tissue roughness at
    the edges of the tone (old wear, not a growl), carried on very little breath, with the vowels held
    long and the sentences deliberately spaced, as if each one has already been weighed before it is
    spent. No regional real-world accent flavor — plain, unornamented, continental-neutral delivery with
    no lilt and no rhetorical rise-and-fall; the pitch barely moves phrase to phrase. Comparable to the
    voice of a career military sovereign or war-court magistrate: a man who has delivered verdicts and
    death sentences far more often than persuasion, so the default setting is flat, final, and
    unhurried, with silence doing as much work as speech.
  one_line: >-
    A big, scarred king's voice pitched low and kept nearly still — brutal judgment delivered at a
    magistrate's unhurried, sentence-final pace, with more said in the pauses than in the words.
  evidence:
    - source: "wiki/Volume I — Character Cards/Muken Moto.md:171 (Psychology > Voice)"
      quote: >-
        Voice · Direct, brutal, controlled, paternal, judgmental. Speaks rarely and finally; silence often
        carries the verdict.
    - source: "wiki/Volume I — Character Cards/Muken Moto.md:173 (Psychology > Posture)"
      quote: >-
        Posture · Load-bearing stillness — present even at rest.
    - source: "wiki/Volume I — Character Cards/Muken Moto.md:158 (Physical Description)"
      quote: >-
        Height 6'1" · Build dense, heavy-shouldered, scarred, war-thickened.
    - source: "scenes/THE_KINGDOM_OF_KHARVEN_buri.md:59"
      quote: >-
        Up close, Muken was warmth and silence and the specific weight of a man who carried the crown so
        that the people around him could learn what it felt like before it was theirs.

Naiser:                 # card: Naiser Yukari; two archive lines; 2 archive lines read
  gender: "male"
  age: >-
    ~50, explicit in the one scene where he appears and speaks ("At about fifty, and not at the end").
    The wiki card describes the founder in mythic/ageless register (elegant, regal,
    twilight-under-cathedral-stone) but gives no age that contradicts this; the card's framing reads as
    in-universe hagiography of the founder at his legendary best, not a casting instruction. Cast from
    the scene's fifty-year-old body, not the legend.
  body: >-
    Broad through the chest and going soft at the middle; heavy jaw; long black hair (worn loose in the
    memory where his son shares the same jaw-line); grey working coat with a cuff worn through, reading
    lenses he habitually loses in his own hair. A lived-in, physically substantial father-and-soldier
    build, not the card's willowy 'long-limbed' elegance -- the two descriptions read as the same
    lineage at different distances: myth vs. memory.
  pitch: "medium-low"
  texture:
    - "dry"
    - "flat / low-resonance carry rather than musical"
    - "light gravel at the edges of age"
    - "unhurried"
    - "wry"
  pace: "measured"
  energy: >-
    coiled and undemonstrative -- he spends almost the whole of his page-time in restraint (dying
    calmly, doing the arithmetic of his own blood loss) and lets exactly one line spike into a bark. The
    rest is dry, plain, and unbothered.
  register: >-
    plain and declarative, faintly paternal-authoritative -- a man who has never needed to perform
    command to get it. His 'Founder's Claim' trait (declarations carry unusual spiritual weight) argues
    for a voice that lands by flat certainty, not volume or ornament.
  accent_hint: null
  engine: "standard"
  exaggeration: 0.65
  design: {pitch_st: -2, weight: 0.6, grit: 0.35, breath: 0.15, pace: 0.95}
  reference_direction: >-
    Male, medium-low pitch, no named-voice comparison. Texture is dry and flat rather than musical or
    aristocratic-smooth -- the prose is explicit that when he raises his voice it 'went out flat,' i.e.
    command by plainness and weight-of-word (his 'Founder's Claim' trait literally makes his
    declarations land harder), not by resonance or theatrical volume. Pace measured and economical,
    holding still through long dry sentences and then landing short blunt ones ('You want control.'). A
    little age-gravel, a little chest weight from the broad-and-softening fifty-year-old build, minimal
    breathiness -- this is a disciplined, controlled speaker (bowstring- and breath-drilled) who stays
    composed even while bleeding out. Think of the low, plain, unhurried voice of a veteran officer or
    foreman-patriarch who has spent decades not needing to raise it -- and the one time in the archive
    he does, it still comes out flat rather than booming.
  one_line: >-
    A dry, unshowy patriarch: broad-chested, heavy-jawed, fifty and going soft at the middle, whose one
    archive outburst still comes out flat rather than musical -- command by plain weight-of-word, not
    performance.
  evidence:
    - source: "scenes/niran_malformation.md:97-99"
      quote: >-
        Naiser stood there. At about fifty, and not at the end, in the grey working coat with the left cuff
        worn through, with the reading-lenses pushed up into his hair... Broad through the chest and going
        soft at the middle. The heavy jaw.
    - source: "scenes/niran_malformation.md:109-111"
      quote: >-
        He raised his voice and it went out flat across a place with no walls to carry it. "REVEAL
        YOURSELF."
    - source: "Volume I — Character Cards/Naiser Yukari.md, Identity and Core Profile"
      quote: >-
        He is elegant without softness, regal without vanity, and cold without emptiness. He does not
        radiate hunger. He radiates conclusion.
    - source: "Volume I — Character Cards/Naiser Yukari.md, Appearance and presence"
      quote: >-
        His presence does not crash into a room. It settles over it.

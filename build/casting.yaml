    the plain-wool 'minor administrator' costume the card describes — a voice built to be overlooked
    until the moment it decides to matter. Comparison: picture a career intelligence handler or a
    hostage negotiator's phone voice — level, exact, giving away nothing, all the pressure converted
    into precision instead of volume.
  one_line: >-
    A tall, narrow, 47-year-old strategist whose voice was drilled the same way his face was — to spend
    nothing it doesn't have to: medium-low, dry, almost ungritted, unhurried, and cast entirely from the
    card's own Voice section and physical description, since the archive gives him no quoted lines of
    his own.
  evidence:
    - source: "wiki/Volume I — Character Cards/Osric of Hallenfeld — The Patient Hand.md, section 'Voice'"
      quote: >-
        Osric speaks in the voice of a man who has spent three years saying nothing important and eleven
        years saying only the things that matter, and the contrast between the two periods produced a voice
        that is careful, precise, and carrying the specific weight of a man who treats every sentence as an
        expenditure and who audits his expenditures.
    - source: "wiki/Volume I — Character Cards/Osric of Hallenfeld — The Patient Hand.md, section 'Voice'"
      quote: >-
        He does not waste words. He does not fill silence. He speaks when speaking changes the room's
        trajectory, and he remains silent when silence serves the trajectory better than speech, and the
        ability to distinguish between the two is the thing that makes him Hild's strategic advisor rather
        than merely her uncle.
    - source: "wiki/Volume I — Character Cards/Osric of Hallenfeld — The Patient Hand.md, section 'Voice'"
      quote: >-
        Unlike Lorn, Osric does not disagree in public. Osric disagrees in the specific private register
        that Lambert also uses: after the room, in the debrief, when the disagreement can be delivered
        without undermining the authority it is attached to.
    - source: "wiki/Volume I — Character Cards/Osric of Hallenfeld — The Patient Hand.md, section 'Physical Description'"
      quote: >-
        Taller than Lorn and narrower, built with the lean angularity of the Kōkan cadet lines. The Moto
        blood expresses itself in the specific vertical architecture that Concord-stock humans do not
        produce — the height, the narrow jaw, the dark eyes that carry a depth that reads as older than the
        face around them.

Wren:                   # card: none (named on Bram's card); the prose attributes him as 'Wren' and 'Wren Greymane'; 9 archive lines read
  gender: "male"
  age: >-
    No number given anywhere in the record. Reads as the elder of the two Greymane brothers — Bram's
    card gives Bram as 23 and 'the one who stayed'; Wren is 'the one who left,' already commanding his
    own six-hundred-man muster and running a sixteen-month solo deception before the record opens. Cast
    as mid-to-late twenties: old enough to have built and held that operation alone, young enough that
    nothing in the prose reads as aged or slowing.
  body: >-
    'A big man' by the text's own word — the line is used to explain why he beats an inhuman blow aside
    with nothing but bulk and a shield angle ('There was no technique in it. A big man and an angle, and
    that was all of it.'). Built for the front rank: takes an eleven-foot magic halberd swung by a
    monster on a four-foot heater shield and is only driven back, not broken; heaves the same weapon up
    and over his own shoulder by main strength; still on his feet, by will, after his shoulder is
    dislocated and put back in. A shield-and-halberd bulwark fighter's frame — heavy through the
    shoulders and forearms, not lean.
  pitch: "low"
  texture:
    - "flat and economical at rest — every attributed line outside combat is a short plain sentence ('They are ready,' 'We rally today,' 'Aye'), nothing florid, nothing explained twice"
    - "goes to full parade volume on the single command word that matters — 'RALLY.' is set alone in the text, in caps, the only time he is written loud"
    - "does not widen into panic or scream register even as his body fails — the dying beats shorten his speech to single clipped syllables ('Bulwark' twice more, then just 'Comp.') rather than to noise; the one involuntary sound he makes he is described as embarrassed by"
    - "the interior voice under the dialogue is dry, exact, and unsentimental even facing death — counts in feet and seconds, corrects its own reads, and lands one flat piece of gallows humor about his brother's defining image of him ('I am sorry about the smiling. I have never been able to account for it.')"
  pace: "measured"
  energy: >-
    Banked and controlled at rest — he does not waste a word addressing his commander or his own men.
    Spends everything held in reserve on the single shouted command that turns the whole column. Under
    mortal pressure the energy does not spike into panic; it compresses, syllable by syllable, until the
    command words themselves are all that is left of it.
  register: >-
    Plain Northern soldier's diction, no polish, no rank-flourish despite commanding six hundred men.
    Matches the scene's own 'Technical' register note for his POV (exhaustive, tactical, exact):
    distances in feet, time in seconds, casualties counted precisely. No archive line from him carries
    an ounce of self-pity even at the very end.
  accent_hint: >-
    Plain Northern/Kharven accent, unornamented consonants, nothing performed.
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: -4, weight: 0.7, grit: 0.3, breath: 0.15, pace: 0.9}
  reference_direction: >-
    Male, low chest-register baritone with real weight and size behind it — a big, broad-framed
    soldier's voice, not a cultivated or aristocratic one. Plain Northern/Kharven accent, unornamented
    consonants, nothing performed. Delivery at rest is flat, spare and economical — a commander who has
    drilled six hundred men and does not repeat an order — with one gear held above that for a single
    parade-ground command shout, and nothing above that gear even as the character is dying: the voice
    compresses to single clipped words under mortal strain rather than breaking or rising into a scream.
    No line in the record softens or explains itself twice. Comparison: a veteran infantry NCO built
    like the front rank he leads from — quiet, deliberate, almost inaudible in ordinary speech until the
    one order that has to reach the whole formation, delivered without visible strain because raising it
    has never been a performance for him.
  one_line: >-
    A big, plainspoken soldier's low baritone — banked and economical at rest, one true parade-ground
    shout in reserve, and even dying it compresses to single flat syllables instead of breaking.
  evidence:
    - source: "scenes/02_wren_bulwark.md:65-69"
      quote: >-
        "You are the traitor's traitor," he said. His voice was flat and did not travel. He had said perhaps
        forty words since the muster and he was spending nine of them here. "Aye," said Wren.
    - source: "scenes/01_wotr_muster_breach_road_north.md:59"
      quote: >-
        "RALLY."
    - source: "scenes/02_wren_bulwark.md:115"
      quote: >-
        There was no technique in it. A big man and an angle, and that was all of it.
    - source: "scenes/03_wren_three_deliveries.md:133-137"
      quote: >-
        *I am sorry about the smiling. I have never been able to account for it.* He pulled the ring with
        his teeth. "Comp."

Bram:                   # card: Bram Greymane — The Ridge; 12 archive lines read
  gender: "male"
  age: >-
    23 in years, but the card and prose both insist he reads decades older — three years on the ridge
    plus the fighting after did the aging work that would normally take a lifetime. Cast the voice for
    the wear, not the birthdate.
  body: >-
    Built to absorb impact, not to move: 'the same structural width through the jaw, the same heavy brow
    ridge designed to withstand impact' (Godfrey's frame inherited whole). Three fingers gone from the
    left hand at the second joint, a bad hip that makes him limp, scars down the whole left side of jaw
    and neck. Unwashed, matted hair — a garrison body, not a groomed one.
  pitch: "low"
  texture:
    - "big chest resonance"
    - "flat / affectless under pressure"
    - "faint gravel from war-wear, not a growl"
    - "unpolished, plain diction"
    - "terse — short declarative sentences, few subordinate clauses"
  pace: "measured"
  energy: >-
    Coiled and contained by default — the voice of a man holding still on purpose. It does not rise with
    emotion; when it rises, it's for battlefield projection (short hammering commands), and it drops
    straight back to flat afterward, including in the middle of an atrocity.
  register: >-
    Blunt frontier-soldier plainness, not a commander's polished authority — a farm boy's directness
    wearing a garrison's flatness. No rhetorical flourish; the same level tone serves an order, a
    confession, and a threat.
  accent_hint: >-
    Plain frontier/garrison speech, unpolished and blunt — no aristocratic lift despite the command
    rank; short declarative sentences over long ones.
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: -4, weight: 0.65, grit: 0.4, breath: 0.15, pace: 0.93}
  reference_direction: >-
    Male, low and weighty — a big chest voice from a body built structurally wide, that projects to a
    crowd without straining ('carried without effort'). Some texture from three years of siege and
    battlefield damage, but this is not a growler or a shouter by nature: his signature is flatness —
    even, unhurried, almost no inflection, delivered at the same level whether he's giving an order or
    saying 'I don't want to kill you' to a man he is mutilating. Diction is plain and unpolished, a
    farm-raised soldier, not a noble's cadence, despite the command rank. Under battlefield pressure the
    voice opens up into a big, carrying, hard-edged shout doing short hammering phrases (four, five
    words at a time), then drops straight back to flat the moment the moment passes. Comparable to a
    heavy-built infantry NCO who's stopped reacting out loud to anything, years past the point where his
    voice needed to perform feeling to be obeyed.
  one_line: >-
    A young giant's frame with an old soldier's flatness — a low, effortlessly carrying voice that only
    ever gets loud to give short battlefield commands, and stays dead level even while doing something
    terrible.
  evidence:
    - source: "wiki/Volume I — Character Cards/Bram Greymane — The Ridge.md:24"
      quote: >-
        Twenty-three and showing the specific accelerated aging that war produces — the three years on the
        ridge and the fighting that followed filled the places that decades would normally fill.
    - source: "scenes/01_wotr_muster_breach_road_north.md:91"
      quote: >-
        Bram had a voice that carried without effort and he had never once been glad of it until this year.
    - source: "scenes/10_wotr_what_the_ground_was_owed.md:315"
      quote: >-
        He said it without heat. That is the thing everyone who was in that yard has said since: there was
        no heat in any part of it, at any point, on any of the eleven days.
    - source: "scenes/01_wotr_muster_breach_road_north.md:93"
      quote: >-
        "PROTECTORS. STEWARDS. DEFENDERS. THOSE ARE WORDS THEY PUT ON A CHARTER IN A WARM ROOM AND THIS
        MORNING WE FIND OUT WHAT THEY COST." ... "WE DIE HERE OR WE LIVE TO TELL IT. THERE IS NO THIRD
        THING."

Renard:                 # card: Renard Greymane — The Left of the Throne; no quoted lines ('Renard by voice only'); no archive dialogue
  gender: "male"
  age: >-
    26 on the card (House Greymane, Stormfold), but written as older than his years in bearing — 'spent
    his youth in the field rather than on the ridge, mobile warfare rather than static defense.'
  body: >-
    Tall, broad through the shoulders in the Greymane manner; an 'architectural build' — 'the body
    designed for holding ground, the frame that settles into position the way a wall settles into its
    foundation.' Face harder and more angular than his cousin Bram's. A big, solidly built line-soldier,
    not a giant.
  pitch: "medium-low"
  texture:
    - "grounded, chest-forward resonance (broad, wall-built frame)"
    - "faint weathering/gravel from campaign life and Kharven cold, not heavy rasp"
    - "near-flat affect that clips off mid-sentence rather than searching for a word"
    - "a battle-voice that can carry across chaos, held on a short leash the rest of the time"
  pace: "measured"
  energy: >-
    Low-burn and banked, not flat-dead — the restraint of a man deliberately not handing out material.
    Composure reads as stillness under pressure (in his one scripted scene he holds ground silently
    against an opponent two Stages above him). Only opens up in volume/urgency in battle, where he is
    'Renard by voice only' — heard, not quoted.
  register: >-
    Vernacular commons register exclusively. Per the wiki's Accent page: 'Does not reach for a Latin
    word even where one would serve, and does not work around it either; he simply stops the sentence...
    Answers questions with actions more often than with clauses, which reads as taciturn and is in fact
    a man who has been placed by his speech before and declines to hand anyone the material.'
  accent_hint: >-
    Vernacular commons register exclusively. Per the wiki's Accent page: 'Does not reach for a Latin
    word even where one would serve, and does not work around it either; he simply stops the sentence...
    Answers questions with actions more often than with clauses, which reads as taciturn and is in fact
    a man who has been placed by his speech before and declines to hand anyone the material.'
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: -3, weight: 0.6, grit: 0.35, breath: 0.15, pace: 0.93}
  reference_direction: >-
    Male, mid-20s but weathered a few years harder by campaign life. Medium-low pitch — chest-resonant
    from a broad, wall-built frame, but human-scaled, not a giant's boom. Texture is mostly clean with a
    faint gravel underneath, like cold air and hard use rather than a smoker's rasp. Delivery is terse
    and vernacular: short declaratives, sentences that stop rather than reach for the fancier word, long
    comfortable silences instead of filler. Near-flat affect at rest, composed under pressure with no
    waver. The one place it opens up is under battle noise, where it has to carry — think the clipped,
    load-bearing voice of a young infantry NCO giving a casualty count over a radio: economical,
    weathered, no theater, and only as loud as the moment requires.
  one_line: >-
    A young, broad-built guard who has been sized up and placed by his voice before and now spends as
    few words as the job allows — flat, vernacular, chest-low, silent by default, and raised only to
    carry a command through battle noise.
  evidence:
    - source: "wiki/Volume I — Character Cards/Renard Greymane — The Left of the Throne.md"
      quote: >-
        He does not speak much. The sword speaks for him. The sword's vocabulary is sufficient.
    - source: "wiki/Common — The Tongue With No Distinctions/Accent — Placement, Prestige and the Shibboleth.md:88"
      quote: >-
        Vernacular core almost exclusively. Does not reach for a Latin word even where one would serve, and
        does not work around it either; he simply stops the sentence.
    - source: "wiki/Volume I — Character Cards/Renard Greymane — The Left of the Throne.md"
      quote: >-
        the body designed for holding ground, the frame that settles into position the way a wall settles
        into its foundation
    - source: "scenes/renard_the_left_of_the_door.md:35"
      quote: >-
        Renard said nothing. The sword was already speaking.

Brida:                  # card: Brida Ashwell — The Warm Diagnosis; 6 archive lines read
  gender: "female"
  age: >-
    31 per the wiki card, but the prose ages her past that — wind-chapped, permanently flushed, and in
    her one extended scene she is eleven days out of a near-fatal abdominal wound, walking on a stick
    with her colour wrong 'for longer than that'; the voice should read as an adult woman worn a decade
    past her years by frontier work and a body that has recently failed and been dragged back
  body: >-
    short and dense through the torso, built close to the ground — a frontier labourer's build ('the
    specific way women are built when their mothers and grandmothers all worked standing up'), not lean,
    not delicate; presently compromised (walking wound, four hundred yards takes her forty minutes)
    without being frail in manner
  pitch: "medium-low"
  texture:
    - "warm and firm at once — the card's own pairing, not a contradiction to resolve toward either pole"
    - "unpolished, plain frontier grain, no court lilt"
    - "economical/declarative — short sentences, almost no hedging or softening words"
    - "can drop to a hushed near-whisper (protecting a sleeping patient) without losing firmness — a stage whisper that still carries an instruction"
    - "capable of flat, unsoftened truth-telling with no comfort-words padding it"
  pace: "measured"
  energy: >-
    steady and unhurried; low-key even under grief or danger — she says the true thing once and stops
    rather than building to it or repeating it
  register: >-
    physician's bedside register: 'the voice of a thousand delivered instructions, each one as though it
    were the first' — declarative, non-negotiable, sparing with words even in comfort; the frontier
    plainness of Concord rather than any court accent
  accent_hint: >-
    No court polish, no lilt: plain frontier grain, closer to a rural midwife or field-hospital doctor
    than a hospital consultant.
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: -2, weight: 0.55, grit: 0.3, breath: 0.3, pace: 0.95}
  reference_direction: >-
    Adult woman, low-to-medium alto — warmer and lower than a typical bright TTS default female voice,
    with real chest weight behind it to match a short, dense, hard-labour build. No court polish, no
    lilt: plain frontier grain, closer to a rural midwife or field-hospital doctor than a hospital
    consultant. The defining move is that 'firm' and 'warm' are the same register, not two settings to
    blend — every line lands as a settled instruction, not a suggestion, but never cold or
    clipped-for-effect. Economical almost to a fault: she says a true thing once, in as few words as it
    takes, and stops rather than cushioning it or repeating it. Two working modes recorded on the page —
    a hushed near-whisper at a sickbed that still carries the force of a command ('Don't'), and a flat,
    unsoftened delivery of hard truths at a graveside — and both modes should sound like the same voice
    at different volumes, not different characters. Slight roughness in the grain (wind-chapped,
    frontier-worn) rather than smooth studio warmth; unhurried pace throughout, never rushed even when
    the news is urgent. Think: the on-call country doctor who has delivered the same instruction a
    thousand times and needs it heard as if for the first time.
  one_line: >-
    A low, warm, unpolished frontier physician's voice — firm and warm as one setting, not two — equally
    able to drop to a hushed bedside command or lay a hard truth flat on a grave path without a single
    wasted word.
  evidence:
    - source: "wiki/Volume I — Character Cards/Brida Ashwell — The Warm Diagnosis.md, section 'Her voice'"
      quote: >-
        Firm and warm simultaneously. The voice of a thousand delivered instructions, each one as though it
        were the first, because the recipient needs to hear it as the first. "The treatment is not
        negotiable."
    - source: "scenes/renard_the_left_of_the_door.md:121-123"
      quote: >-
        Behind him the altar-room door opened the width of a hand and Brida's face was in the gap, hair
        down, eyes going from him to the wall to the floor and back. "She's asleep," Brida said. Very quiet.
        "Don't."
    - source: "wiki/Volume I — Character Cards/Brida Ashwell — The Warm Diagnosis.md, section 'Description'"
      quote: >-
        Short and dense through the torso, built close to the ground in the specific way women are built
        when their mothers and grandmothers all worked standing up.
    - source: "scenes/10_wotr_what_the_ground_was_owed.md:221-223"
      quote: >-
        She stood beside him and did not say anything for a while and then said the true thing, which is
        what she does, which is why the Seat sends her to the ones who will not talk. "It must be hard to be
        the oldest," she said. "And be the only one alive."

Robin Ice:              # card: Robin Ice — The Bastard Runner; the prose always uses both names; 13 archive lines read
  gender: "male"
  age: >-
    29 (card-stated present age; the archive's only dialogue is a flashback to age 17, per the same
    voice-defining traits)
  body: >-
    Tall and narrow through the shoulders, built for distance rather than impact; nose broken at least
    twice, leftward deviation; a bastard runner who has been on the road since fourteen
  pitch: "medium"
  texture:
    - "nasal (career mouth-breather from sustained running)"
    - "breathy / winded, even at rest"
    - "flat, worn smooth of regional colour"
    - "clipped, procedural under duress"
    - "faint rasp under strain"
    - "unadorned and plain when something gets past his guard"
  pace: "quick"
  energy: >-
    restrained and instrumental most of the time — a report-voice that keeps its footing under atrocity
    and order alike — with brief, unplanned overflows into plain, undefended feeling when something
    slips past the discipline
  register: >-
    Functional and deferential in address ("My lord," "My Lord Palatine"), compressed into
    report-cadence fragments when winded or under pressure; drops into complete, plain-spoken sentences
    with no rhetorical shaping when he is moved, as if the discipline has briefly gone offline
  accent_hint: >-
    A flattened, placeless, well-traveled non-accent: a voice worn smooth by having passed through
    everywhere and belonged nowhere, no regional colour to grab onto.
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: 1, weight: 0.25, grit: 0.3, breath: 0.65, pace: 1.08}
  reference_direction: >-
    Male, medium pitch — not deep; the narrow, distance-built frame carries less chest resonance than a
    soldier's would. A flattened, placeless, well-traveled non-accent: a voice worn smooth by having
    passed through everywhere and belonged nowhere, no regional colour to grab onto. A persistent light
    nasal quality and audible breath-management — a career runner's mouth-breathing — sits under even
    his most composed lines, so he never sounds fully at rest. Delivery is clipped and procedural under
    duress: short declaratives, report-cadence, feeling flattened out of it even when the content is
    atrocious (he can say "Aye" to an order to kill hostages in the same flat register he uses to report
    a road closure). That same discipline drops away, briefly and without warning, into plain,
    undefended, complete-sentence disclosure when something personal gets past his guard. Comparable to
    a battlefield field-runner's radio-check flatness or a long-haul dispatcher's voice: economical,
    wind-worn, permanently a little out of breath, holding a story it isn't its job to editorialize
    about.
  one_line: >-
    A worn, placeless courier's voice — medium-pitched, nasal from a lifetime of mouth-breathing at a
    run, flat and clipped when reporting even the worst orders, and briefly, plainly undefended when
    something personal slips through.
  evidence:
    - source: "wiki card: Robin Ice — The Bastard Runner, Description section"
      quote: >-
        His voice is Concord-flat, the accent of a man who has been everywhere and belonged nowhere, with
        the slight nasal quality runners develop from years of mouth-breathing during sustained movement.
    - source: "wiki card: Robin Ice — The Bastard Runner, Description section"
      quote: >-
        Tall and narrow through the shoulders, built for distance rather than impact.
    - source: "scenes/04_sodoku_what_the_sky_does_not_ask.md:119"
      quote: >-
        "The southern reach is still standing. Bram had the breach at the ninth hour and was holding it and
        I saw him on foot. The Seat is closed and the inner court is manned. Lord Osric has the princess and
        the lady below the cistern and has ordered the gatehouse shut behind him." The boy got a breath in.
        "And Lord Lambert went out the postern before the gates opened. Six riders. No banner. He said five
        days."
    - source: "scenes/wotr_the_weight_of_a_courier.md:169"
      quote: >-
        "Her name is Ada Foss," he said. "I asked. I did not have to ask. I asked because I wanted to be
        able to say it somewhere that mattered and I did not think this would be the room."

Tabitha:                # card: Tabitha Hallenfeld — The Road Woman; one archive line; 1 archive line read
  gender: "female"
  age: >-
    42 — canon age, and the prose reads her at it: not old, not young, a woman in the durable middle of
    a working life, no age-related fragility anywhere in the description
  body: >-
    Broad through the shoulders and thick through the waist — built with the solidity of a body that has
    spent its life on roads, not a soldier's trained bulk but a haulier's accumulated one. Sun-darkened,
    wind-roughened face with crow's feet; hair brown streaked with grey, pulled back with two wooden
    pins; a heavy wool traveling coat belted with a knife and a rolled cylinder of route manifests. This
    is a big, weathered, outdoor body built for endurance, not for a delicate or reedy voice.
  pitch: "medium-low"
  texture:
    - "sun-and-wind weathered"
    - "plain, unpolished"
    - "light natural grit from exposure rather than growl"
    - "steady, not breathy"
    - "carries without needing to push"
  pace: "measured"
  energy: >-
    grounded and economical, the energy of someone who has spent a life reading how much weight a thing
    can carry before it fails — level under ordinary pressure, and capable of going flat and hard when
    she is done being deflected
  register: >-
    plainspoken working-officer's register, not courtly — a house that produces quartermasters and
    courier captains rather than orators; short, load-bearing sentences; she names the fact and stops
    rather than dressing it up
  accent_hint: >-
    No court polish at all — plain, unpretentious, working-register delivery, closer to a haulier or
    dispatcher's plain speech than to the nobility her house nominally sits among.
  engine: "turbo"
  exaggeration: 0.35
  design: {pitch_st: -2, weight: 0.6, grit: 0.3, breath: 0.12, pace: 0.97}
  reference_direction: >-
    A woman's voice, medium-low with real chest weight behind it — a big, solid frame speaking, not a
    slight one. Texture is road-weathered: years of sun and wind have put a light, dry grit on it, but
    it stays controlled and steady rather than rasped or growled. No court polish at all — plain,
    unpretentious, working-register delivery, closer to a haulier or dispatcher's plain speech than to
    the nobility her house nominally sits among. Pace is measured and unhurried, each fact set down the
    way she sets down a manifest, but she does not need volume to be heard and can go flat and final in
    an instant when she wants an answer and isn't getting one. Comparison: the voice of a lifelong
    logistics foreman or long-haul dispatcher — decades outdoors doing the unglamorous work that keeps
    everyone else moving, who reads a room the way she reads a road, for what it can carry and how long
    the carrying lasts.
  one_line: >-
    A big, sun-and-wind-weathered road officer of 42 — medium-low, steady, lightly gritted, plainspoken
    and unhurried until she needs to be flat and final; cast almost entirely from build and function,
    since the archive gives her only one spoken line.
  evidence:
    - source: "wiki/Volume I — Character Cards/Tabitha Hallenfeld — The Road Woman.md"
      quote: >-
        Broad through the shoulders and thick through the waist, built with the solidity of a body that has
        spent its life on roads. Sun-darkened face, wind-roughened, crow's feet around the eyes.
    - source: "wiki/Volume I — Character Cards/Tabitha Hallenfeld — The Road Woman.md"
      quote: >-
        She reminds Hild of her mother. Not physically — Fern was lean and angular. The reminding is in how
        Tabitha reads rooms: for what they can carry and what they cannot, and how long the carrying will
        last before the surface fails.
    - source: "scenes/10_wotr_what_the_ground_was_owed.md:39"
      quote: >-
        "Why did you buy the grain in the first week?"

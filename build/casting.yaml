        not shake. Whatever fear remained in him had already been spent on lesser things tonight.
    - source: "scenes/Rengai_Farewell_and_Dhaerin.md:53"
      quote: >-
        "Insufferable old man," he muttered, though there was no heat left in it, only the specific fondness
        reserved for people who were usually right and never let you forget it.


    total silence, then one utterance that is felt in the chest before it is heard.
  engine: "standard"
  exaggeration: 0.7
  design: {pitch_st: -6, weight: 0.95, grit: 0.35, breath: 0.35, pace: 0.85}
  reference_direction: >-

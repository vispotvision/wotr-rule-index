# build/casting.yaml — the casting brief, one entry per character.
#
# What this is: for every character with a spec in build/casting/*.json, the voice we are
# after — built from the character's card and from the lines they actually speak in the
# scene archive, with the quotes that argue for it. build/voice_refs.py reads this to pick a
# reference speaker (VCTK / LibriTTS-R, both CC BY 4.0) or to --design one from a clip to
# match; build/voices.yaml then points the render at the result.
#
# What is not allowed: a target that names a real person. "sounds like <actor>" is not a
# brief here and must not be added to one — reference clips come from readers who recorded
# for release under a licence that permits it, or are designed voices that are nobody's.
# Comparisons in these briefs are to roles and trades (a harbour magistrate, a quarry
# foreman, a field medic), never to a named human.
#
# Keys are the speaker tags the cast files use (scenes/cast/<scene>.cast.md) — the plain
# name the prose attributes dialogue to, the way voices.yaml already keys Verinus, Aurelian,
# Gimbzo, Kizami and Darius. Where the spec's name field carries the card title or an
# epithet, the card title sits in the comment above the entry. Two specs cast the same man
# (Darius.json and Ignatius_Sanctus_Sanctorum_Arsenal.json) and are one entry here, so the
# 42 files give 41 characters.
#
# Per entry: gender, age, body, pitch (very low / low / medium-low / medium / medium-high /
# high), texture, pace (slow / measured / moderate / quick), energy, register, accent_hint,
# engine (Chatterbox model: turbo or standard), exaggeration (Chatterbox), design (the
# --design knobs for voice_refs.py: pitch_st semitones, weight / grit / breath 0–1, pace
# stretch), reference_direction (the brief in prose), one_line, evidence (2–4 of the
# strongest quotes, source cited — verbatim from the card or the scene). accent_hint is
# the spec's own accent sentence where it had no separate field; null where the spec said
# nothing about accent. The comment above each entry records how many archive lines the
# spec read; "no archive dialogue" means the brief rests on the card alone.
#
# Field text is carried verbatim from the JSON specs; this file adds only the keys, the
# comments, the evidence selection, and the collision notes at the foot.

# ================================================================================================
# Concordia — Sanctum Lux, the Alabaster Court, the gate
# ================================================================================================

Verinus:                # card: Verinus VII · The Palatine (JSON name 'Verinus VII, the Palatine'); voices.yaml already keys him Verinus; 46 archive lines read
  gender: "male"
  age: >-
    71 (wiki card, Section I "Age: 71"). Reads as elderly rather than merely late-middle-aged:
    forty-five years of the Reading technique have left him, per the card, "the cardiovascular
    architecture of a career deep diver and the barotrauma to match," and Vitality is only S-Grade on "a
    seventy-one-year-old man with an excellent Crystal and an ordinary spine." He has held the same
    office, and worn the same restraint, for nineteen years straight — the age should sound settled and
    long-worn, not frail-doddering.
  body: >-
    Tall and narrow, not broad — Section XIII: "tall and has become narrow with it, the shoulders gone
    forward over a chest that carries the barrel-deepening of a man who has spent forty-five years
    breathing against pressure... thin arms, thin wrists, thin neck, and a ribcage that belongs on
    someone forty kilos heavier." No fighter's mass and no giant's frame: Dexterity is his worst stat by
    a wide margin and he "has never held a weapon and moves like what he is" (Section IV/V). Travel
    speed is nominally sub-relativistic but "in practice he walks" — staff "have never seen him move
    faster than a considered pace" (Section VI). The instrument of his voice is a thin-chested elderly
    man's, propped up by decades of controlled, pressure-trained breath rather than by physical bulk.
  pitch: "medium-low"
  texture:
    - "level and dry rather than deep or booming — thin frame, not a chest-voice giant"
    - "a faint, permanent edge of restriction at the margins, like a man who breathes carefully because breathing has cost him before"
    - "almost no grain in ordinary speech; the one time the archive records it breaking (the Judger's Flame rite) is treated as an anomaly, not the baseline"
    - "coastal fisherman's plainness surviving underneath forty-five years of formal court cadence — vowels softened, consonants exact"
  pace: "measured"
  energy: >-
    Low and deliberately flat, never raised — Section XIV: "He never raises his voice, because inside
    the Sounding volume does nothing, and this has spread outward until the entire capital speaks
    quietly and nobody there can explain why." Command comes from stillness and the weight of what is
    being said, not from force behind the saying. The one recorded exception
    (01_verinus_fire_of_the_undeserving.md:213) is explicitly a first-in-nineteen-years break from the
    level default, confirming what the default is.
  register: >-
    Concord Common with coastal cadence surviving under forty-five years of court register (Section XIV,
    "Voice / Dialect", verbatim). Near-zero contractions (voice_fingerprints: 0.1) and heavy
    first-person framing (0.51) — he speaks in accountable "I" statements, entering his own reasoning
    into the record as he goes. Sentences alternate short, flat declaratives ("Stand up." "Recorded.
    Go." "That sentence weighed nothing.") with long, clause-stacked explanatory builds (mean words
    29.7, but with very high variance, ±24.0) — he unpacks an argument in full rather than trimming it,
    then drops a short flat line at the end to close it. Occupational metaphor throughout is nautical
    and specifically about depth: soundings, drift, ballast, the lead line, what a thing draws.
  accent_hint: >-
    Accent is a fisherman's coastal plainness worn nearly smooth by forty-five years of formal
    ecclesiastical-court diction: the vowels remember the harbour, the sentence structure belongs to the
    bench.
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: -2, weight: 0.35, grit: 0.35, breath: 0.4, pace: 0.92}
  reference_direction: >-
    Male, elderly (71), medium-low pitch — not a deep bass; the frame under the voice is thin-chested
    and narrow, so the authority reads as dry and controlled rather than resonant or booming. Texture is
    level and mostly ungrained, with only a faint, permanent restriction at the edges — a man who
    breathes a little carefully, always, because breathing has cost him before, but who is not visibly
    frail or short of air in ordinary speech. Paced slow and unhurried, in short flat sentences that
    open out into long, fully-unpacked explanatory ones and then snap back short to close — never
    rushed, never raised, because in his own words volume does nothing where he lives and it has trained
    the rest of him to match. Accent is a fisherman's coastal plainness worn nearly smooth by forty-five
    years of formal ecclesiastical-court diction: the vowels remember the harbour, the sentence
    structure belongs to the bench. Comparable to a retired harbour magistrate — a man who spent his
    boyhood hauling nets and his old age handing down rulings in a nearly-silent courtroom, so that
    flatness itself has become the instrument of authority.
  one_line: >-
    Verinus VII, the Palatine, 71: a thin-framed, barotrauma-marked judge's voice — dry, medium-low,
    unhurried, and almost never raised, because for forty-five years volume has bought him nothing and
    stillness has bought him everything.
  evidence:
    - source: "wiki/Volume I — Character Cards/Verinus VII · The Palatine.md:197"
      quote: >-
        Concord Common, coastal cadence surviving under forty-five years of court register. Short sentences.
        Frequent questions that he does not then answer. He never raises his voice, because inside the
        Sounding volume does nothing, and this has spread outward until the entire capital speaks quietly
        and nobody there can explain why. Occupational metaphor is nautical and specifically about depth:
        soundings, drift, ballast, the lead line, what a thing draws.
    - source: "wiki/Volume I — Character Cards/Verinus VII · The Palatine.md:181"
      quote: >-
        He is tall and has become narrow with it, the shoulders gone forward over a chest that carries the
        barrel-deepening of a man who has spent forty-five years breathing against pressure. The frame reads
        wrong at first glance and correctly at second: thin arms, thin wrists, thin neck, and a ribcage that
        belongs on someone forty kilos heavier.
    - source: "scenes/01_verinus_fire_of_the_undeserving.md:213"
      quote: >-
        "Discedite," Verinus said, and for the first time in nineteen years his voice was not level, "omnes
        iniquitates tuae."
    - source: "wiki/Volume I — Character Cards/Verinus VII · The Palatine.md:115"
      quote: >-
        the physiological presentation is exact: elevated intrathoracic pressure, reduced venous return, the
        specific grey-lipped breathlessness of a diver at depth.

Aurelian:               # card: Aurelian Prudentius Custos Clausorum · The Primate; voices.yaml already keys him Aurelian; 34 archive lines read
  gender: "male"
  age: >-
    58 (card, Identity section) — but reads as a specific mismatch: a 58-year-old's cultivated formality
    now running through a body the prose describes as freshly, unnaturally young ("new skin," "no
    history in it," a hand with "no chalk on it and no ink and no callus anywhere"). Cast the age of the
    man, not the skin.
  body: >-
    Tall without using it; narrow through the shoulder, slightly forward at the neck; stands with weight
    settled back, as though yielding the room. No soldier anywhere in him — Dexterity is his worst stat
    and he has never held a weapon. Hands are the tell: long-fingered, dry, unmarked, and permanently
    ~1.8°C above ambient, so a handshake leaves people fractionally unsettled. Speaks slowly with pauses
    seated on the exhale — breath IS the mechanism (his signature technique triggers by him ceasing to
    breathe), so restraint reads as physical, not just temperamental.
  pitch: "medium-low"
  texture:
    - "dry"
    - "warm-toned"
    - "smooth"
    - "unhurried"
    - "faintly liturgical"
    - "controlled-under-pressure"
  pace: "slow"
  energy: >-
    Low and banked, never absent — a man who has decided in advance never to be the one who acts, and
    whose calm is a held breath rather than a resting state. Even 'pleasantly' delivered lines to an
    enemy carry no charge; even mid-torture the delivery does not speed up.
  register: >-
    Concordia formal register, deliberately acquired over a Sum-gol (foreign, informal) substrate —
    near-zero contractions, precise legalistic/clerical diction, complete sentences. Under strain the
    substrate surfaces: dropped copulas in short assertions, qualifiers moved to the end of the clause,
    and (per the card) sentences that resolve to a rising interval that never quite closes, so a
    finished statement sounds like the first half of something. In the post-torture/post-abduction
    scenes this shifts further into a flatter, affectless delivery with no rise and no drop at all — a
    second, colder register layered over the first.
  accent_hint: >-
    Accent flavour: a cultivated continental/ecclesiastical formality — the diction of a senior church
    jurist reading a verdict — with a foreign undertow that surfaces under strain as dropped little
    words and clauses that end on a note that never quite resolves, like a question that decided not to
    be one.
  engine: "turbo"
  exaggeration: 0.25
  design: {pitch_st: -2, weight: 0.35, grit: 0.15, breath: 0.4, pace: 0.9}
  reference_direction: >-
    Male, medium-low pitch, dry and warm-toned rather than gravelly — no growl, no rasp to speak of.
    Pace unhurried, sentences let out slowly on the exhale with real space between clauses; almost no
    contractions (0.09 on the numbers) and a nearly total absence of rhetorical questions or commands,
    so nothing in the delivery ever sounds like it's pushing on the listener. Accent flavour: a
    cultivated continental/ecclesiastical formality — the diction of a senior church jurist reading a
    verdict — with a foreign undertow that surfaces under strain as dropped little words and clauses
    that end on a note that never quite resolves, like a question that decided not to be one. Comparable
    to the voice of a hospice chaplain or a tribunal judge delivering a ruling nobody wants: gentle,
    unhurried, absolutely certain, and unsettling for how little it costs him to say it.
  one_line: >-
    A 58-year-old church judge's voice run through a body that no longer shows its age — warm, dry, and
    glacially unhurried, its careful formal cadence cracking into a foreign, unresolved lilt only when
    the thing he's holding threatens to finish.
  evidence:
    - source: "wiki/Volume I — Character Cards/Aurelian Prudentius Custos Clausorum · The Primate.md:195"
      quote: >-
        Concordia formal register, deliberately acquired, sitting over a Sum-gol substrate that surfaces
        under strain in two places: he drops the copula in short assertions, and his sentences resolve to a
        rising interval that never quite closes, so that a completed statement of his sounds to a Concordia
        ear like the first half of something. Under real pressure the register slips further and he begins
        using the valley's construction, which puts the qualifier last. He speaks slowly, with pauses seated
        on the exhale, and his pauses are the technique whether or not he is running it.
    - source: "wiki/Volume I — Character Cards/Aurelian Prudentius Custos Clausorum · The Primate.md:199"
      quote: >-
        He stops breathing. Not metaphorically and not as technique. The suspension seats on the interval
        and under genuine strain the interval opens on its own, and everyone senior in the Grand Church has
        learned to watch his chest rather than his face.
    - source: "scenes/06_aurelian_what_the_lamberts_are_for.md:79"
      quote: >-
        he said it anyway, in the flat plain voice he had begun using since the cellar, the one that had no
        drop in it at the end of a sentence
    - source: "scenes/19_aurelian_five_numbers.md:101-103"
      quote: >-
        Aurelian's voice had gone very quiet and the slowed air carried it anyway. "Deep Current Pull."

Darius:                 # card: Ignatius Sanctus Sanctorum Arsenal · The Archpaladin — the archive calls him Darius, and the cast files tag [Darius]; Ignatius_Sanctus_Sanctorum_Arsenal.json is the same man and is folded in here (identical design values; its extra evidence and accent_hint kept); 48 archive lines read (+53 in the Ignatius spec)
  gender: "male"
  age: >-
    56 in the present-day arc (seven_labors.md:197, ruling: "Darius is fifty-six. Derived from writing
    the modern apparatus between twenty-six and thirty-five and eleven years of refusal since.";
    confirmed again at 21_darius_the_fist_of_god.md:25, "A man of fifty-six with the sixth Fist in him
    reads a scene..."). Plays older than the number: an ascetic, institutional life (thirty-five years
    building Sanctum Lux's law, eleven more refusing its seat) sits on top of nine recent months of
    battlefield attrition.
  body: >-
    Ordinary human mass, not a giant's — explicitly unremarkable next to true giants in the archive
    (Gimbzo topped 'somewhere past eight feet', seven_labors.md:7; Darius is just 'a man of his mass',
    13_darius_the_holiest_of_holy.md:25). But it is worked, soldierly mass carried for decades:
    'unremarkable for a man who had carried mail and a longsword through two campaigns before his hair
    went white' (balance_lesson.md:25) - so white-haired well before the present day. By the present arc
    the body is broken and still standing: 'underneath it was a fifty-six-year-old man in a torn shirt
    with the shoulders and the back of a lifetime and a ruined lead leg going purple from hip to knee'
    (21_darius_the_fist_of_god.md:63); elsewhere a 'broken disc and a dead shoulder'
    (18_darius_the_hand_of_the_judger.md:99), a 'torn lung' (23_darius_the_fist_of_totality.md:147), and
    four fracture lines through his Soul Crystal, one more of which kills him (seven_labors.md:135-139).
    Archpaladin of Sanctum Lux; wears the Order's gold/plate and carries a smith's-hammer-sized artifact
    weapon.
  pitch: "medium-low"
  texture:
    - "dry, sanded rather than smooth - age plus a torn lung, not a heavy growl"
    - "flat and unornamented - deliberately without lift or flourish"
    - "a banked, controlled rasp that thickens under real strain rather than breaking into volume"
    - "liturgical evenness in the Latin invocations, like a man who has read the same office over a thousand coffins"
  pace: "measured"
  energy: >-
    Low and banked almost all the time - contained close to inert, described as 'flat and precise' even
    when 'frightened' because tribunals mistake it for composure (seven_labors.md:143). That containment
    is load-bearing, not natural calm, and it cracks rarely and dramatically: 'He had not raised it in
    front of another living soul since the year he was twenty-six' before he lets his voice go up in
    front of Aurelian (14_darius_two_men_who_would_not_take_the_seat.md:165).
  register: >-
    Formal, unornamented Concordia legal/liturgical register - the wiki names it directly: he wrote
    Sanctum Lux's founding law 'slowly, in the recalcitrant, unornamented Concordia register he speaks
    in' (Sanctum Lux.md:52), and under direct questioning from tribunals he 'answered a different
    question, accurately, at length, and without visible feeling' (Sanctum Lux.md:54). Near-zero
    contractions (voice_fingerprints: 0.09 contraction rate, far below the cast average), short
    declaratives and clipped one-to-three-word interrogatives ('Under what authority.' 'Then why.'
    'Fractures.' 'Which.' - seven_labors.md, balance_lesson.md), and a separate 'reading voice' for the
    Church Latin workings - flat, level, funeral-cadenced (07_charles_the_imperceptible_district.md:83,
    of the same office's ritual Latin: 'in the Church Latin he had used at eleven hundred offices of the
    dead, in the reading voice, because it was the only voice he had ever used for anything that
    mattered').
  accent_hint: >-
    None specified in the record. The formal, unornamented 'Concordia register' (Sanctum Lux.md:52)
    functions in place of any placeable regional accent — read neutral and institutional, not regional.
  engine: "turbo"
  exaggeration: 0.35
  design: {pitch_st: -3, weight: 0.55, grit: 0.4, breath: 0.3, pace: 0.92}
  reference_direction: >-
    Male, medium-low baritone - not a bass, and specifically not the giant register (that belongs to
    Gimbzo elsewhere in this cast); Darius is an ordinary-sized man carrying an extraordinary office.
    Dry, sanded texture rather than a wet growl - age, a torn lung, nine months in an ash pit - worn
    down, not thickened. Delivery is level and unhurried almost all the time, close to monotone, in
    short declaratives and one-to-three-word clipped questions with no contractions and no lift at
    sentence-end: a man reading a verdict, or reading last rites, for the thousandth time. Comparable to
    a battlefield chaplain-judge advocate: someone who has said exact, terrible things calmly for
    thirty-five years, so that calm itself is the discipline. That flatness is a held door, not an
    absence of feeling, so the read should carry a banked pressure underneath the level surface, and on
    the rare line where it breaks (voice rising, or the one warm aside 'What did I tell you, kid'
    bleeding through another man's mouth), it should land as a genuine crack in something that has not
    cracked in thirty years, not as ordinary emphasis. No regional color - placeless, institutional,
    liturgical Concordia formality throughout.
  one_line: >-
    Darius Ignatius Sanctus Sanctorum, 56, Archpaladin of Sanctum Lux: a dry, medium-low,
    almost-monotone baritone - a battlefield chaplain-judge reading verdicts and last rites so calmly
    for so long that the calm is the discipline, with a banked, rarely-breaking pressure underneath it.
  evidence:
    - source: "seven_labors.md:143"
      quote: >-
        Darius's voice had gone flat and precise, which was what it did when he was frightened, and three
        tribunals had mistaken it for composure.
    - source: "14_darius_two_men_who_would_not_take_the_seat.md:165"
      quote: >-
        His voice had gone up and he let it. He had not raised it in front of another living soul since the
        year he was twenty-six and had regarded that as a discipline, and he had spent nine months in an ash
        pit learning that some things are supposed to be said at volume by a man who means them.
    - source: "Factions, Bloodlines & Institutions/Sanctum Lux.md:52"
      quote: >-
        he wrote it slowly, in the recalcitrant, unornamented Concordia register he speaks in
    - source: "scenes/23_darius_the_fist_of_totality.md:77-79"
      quote: >-
        "POWER YOUR ENERGY INTO ME." He got it out at volume with the last of the breath he had been
        counting.

Charles Lambert:        # card: none (only his brother Edward has one); the prose attributes him as 'Charles' and, in his own scenes, as 'Lambert' — tag by the man, the surname is shared; 35 archive lines read
  gender: "male"
  age: >-
    Mid-40s to early 50s. The archive gives three different numbers across scenes that don't fully
    reconcile on a single timeline (41 in 05_aurelian_primate_under_the_wrong_stars.md:49, 47 in
    verinus_weight_of_an_infant.md:19, 53 in 08_charles_what_a_hand_is_for.md:69) but all agree on the
    same casting fact: a seasoned, middle-aged clergyman-administrator, not a young man and not elderly.
  body: >-
    No wiki card exists for Charles (checked Volumes I, III-VI of the Character Cards; only his brother
    Edward Lambert has one). Built from scene narration instead. At 41: 'A wide, plain, north-coast
    face... Big shoulders and a big chest and the beginnings of a stomach'
    (05_aurelian_primate_under_the_wrong_stars.md:49), heavyset enough that Aurelian notes 'A
    forty-one-year-old diocesan administrator in soaked wool with a stomach on him is not fast in any
    register that means anything' (06_aurelian_what_the_lamberts_are_for.md:39). At 47: 'Tall and gone
    narrow through the shoulder, stooped a few degrees at the neck' (verinus_weight_of_an_infant.md:19)
    -- leaner than the earlier scene, same long Lambert face and hard widow's peak as his brother. By
    his death two of his fingers won't close (07_charles_the_imperceptible_district.md:7) and he carries
    a permanently reopening scar through one eyebrow. Explicitly not a fighter: 'no output, no faculty,
    no working worth the name' (07:37) -- a clerk's body pressed into a battlefield, notable because he
    survives repeated hits by anticipation and footwork learned as a sailor's child rather than by any
    martial training (06:29-39).
  pitch: "medium-low"
  texture:
    - "warm baritone at rest"
    - "clause-stacked administrator cadence -- long, causal, subordinate-clause sentences"
    - "voice 'gone thin at the top' when frightened"
    - "drops flat and toneless under gravity -- the Lambert family trait, shared with his brother Edward"
    - "easy, low laugh that 'goes up into the vault and comes back thin'"
    - "audible labored breath and grinding-rib catches once injured"
    - "dry, understated wit rather than open humor"
  pace: "measured"
  energy: >-
    Controlled and watchful at baseline -- a man reading a room before he speaks. Warms easily into
    charm and a low laugh in safe company, but the warmth sits over something that snaps flat and hard
    the instant he has to deliver an unwelcome truth to a superior. Under real threat the control frays
    into audible effort (gasping breaths, a voice that thins) but he keeps talking anyway -- the office
    keeps functioning even when the body is failing.
  register: >-
    Formal Church-administrative register: honorifics ('my lord', 'holiness', 'Bishop'), long sentences
    built on 'because' and enumerated particulars ('nine years', 'eleven minutes', 'four things'),
    almost no contractions, almost no imperatives -- he requests and observes rather than commands, even
    when he is right and his interlocutor is wrong. Wit lands as dry understatement ('That is a heavy
    verb, my lord' / 'That is a very poor bargain, my lord') rather than as jokes. The
    voice_fingerprints tool confirms this from the numbers: 20 attributed lines, mean length 35.3 words
    (long for the cast), only 0.1 contraction rate, 0 imperatives, favourite words 'years, three,
    eleven, grain, four, because'.
  accent_hint: >-
    Rounded, well-schooled Church diction, no strong regional flavor, though a hint of clipped
    north-coast crispness under the polish would suit his roots.
  engine: "turbo"
  exaggeration: 0.35
  design: {pitch_st: -2, weight: 0.55, grit: 0.2, breath: 0.3, pace: 0.93}
  reference_direction: >-
    Adult male, medium-low pitch: a warm, resonant baritone, not a bass and not a tenor. Rounded,
    well-schooled Church diction, no strong regional flavor, though a hint of clipped north-coast
    crispness under the polish would suit his roots. The baseline is inviting and easy -- the voice of a
    man people tell things to without deciding to, with a genuine low laugh -- but two things happen
    under pressure and both are load-bearing: it thins toward reedy at the top when he is frightened,
    and it drops flat, even, and almost toneless when he has to say the hard thing to a superior (a
    trait he shares with his colder brother). Pace is measured and clause-stacked, like a career
    clergyman dictating a report or reading a parish return aloud, never rushed and rarely emphatic even
    under real physical damage, where the control audibly costs him breath rather than composure. Closer
    to a warm, dryly witty senior cleric or an unflappable civil servant than to an orator, a soldier,
    or a growler.
  one_line: >-
    A warm, clause-stacked archbishop's baritone -- easy laugh, dry wit, thins to reedy under fear,
    drops flat and toneless under gravity -- a career clerk's voice pressed, at the very end, into an
    unlikely hero's mouth.
  evidence:
    - source: "verinus_weight_of_an_infant.md:41"
      quote: >-
        Charles laughed. It was a good laugh, easy and low, and it went up into the vault and came back
        thin.
    - source: "05_aurelian_primate_under_the_wrong_stars.md:59"
      quote: >-
        Charles's voice had gone thin at the top. "We were worried for your health."
    - source: "verinus_sword_and_scale.md:91"
      quote: >-
        His voice went flat in the way the family's voice went flat.
    - source: "05_aurelian_primate_under_the_wrong_stars.md:49"
      quote: >-
        Forty-one, and looked older tonight. A wide, plain, north-coast face... Big shoulders and a big
        chest and the beginnings of a stomach

Gimbzo:                 # card: Gimbzo; voices.yaml already keys him Gimbzo; 30 archive lines read
  gender: "male"
  age: >-
    Ancient beyond count — First-Eon generation, a contemporary of Bara, predating the languages later
    peoples used to name his own techniques ('I was here before the mouth that made them'). Reads as a
    weathered elder in bearing and diction, not a young man, but with no decay in him: his cultivation
    was frozen at Zenith, so age shows as wear and patience, never frailty.
  body: >-
    8 feet and up in effect (card lists 7'4", but the prose revises a witness's estimate upward to 'past
    eight feet' once he stands). Barrel torso, slab pectorals, forearms thick as cooper's mallets, neck
    wider than his own jaw, deep umber-bronze sun-leathered skin, bare-chested above a wrapped hakama,
    twin great-axes with blades broad as church doors.
  pitch: "very low"
  texture:
    - "low chest/torso resonance — a body that size has to move air from somewhere deep"
    - "dry, weathered rasp: sun-leathered skin and an 'old lion's mane' beard, not a wet or screamed rasp"
    - "level and unhurried under almost all conditions — the text says outright he speaks 'without heat,' which is what makes the flat delivery land harder than shouting would"
    - "one percussive register break: the bark-laugh 'HOO,' described as going through gate-posts and coming back off a tree trunk — short, huge, then gone"

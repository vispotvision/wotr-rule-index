    it.
  body: >-
    5'5", slight and still, ceremonial rather than martial (card §XIII-XV) — a small, composed frame,
    not physically imposing; her authority reads through stillness and ritual bearing, not size or
    force.
  pitch: "medium-low"
  texture:
    - "smooth and even, almost no rasp"
    - "a faint blur/softening on sibilants (s, sh sounds), thickening when she is grieving"
    - "hushed, controlled breathiness rather than open breath"
    - "declarative and unhurried — feeling named before the fact that caused it"
    - "goes quieter under stress, never louder or sharper"
  pace: "measured"
  energy: >-
    low and level by default; grief flattens her further rather than spiking her, and pressure makes her
    recede into more quiet rather than raise volume or speed — the opposite of a shout-under-stress
    voice.
  register: >-
    ceremonial/liturgical and declarative — states facts about death and grief with the evenness other
    rulers reserve for weather. Loosens toward plainer, less formal speech only after she has gone a
    stretch without invoking the mask, then snaps back to full ceremonial cadence within a sentence of
    putting it on again.
  accent_hint: >-
    No regional real-world accent — placeless, formal, ceremonial cadence.
  engine: "turbo"
  exaggeration: 0.3
  design: {pitch_st: -2, weight: 0.5, grit: 0.1, breath: 0.4, pace: 0.88}
  reference_direction: >-
    Female, medium-low pitch — not a bright youthful timbre despite her young face, but a smoothed,
    composed register with real weight under it, closer to alto than soprano. A faint hushed blur on
    sibilant sounds (s/sh) that thickens slightly under grief. Pace is unhurried and evenly spaced, the
    felt word landing just before the noun that caused it, almost like a ritual invocation rather than
    ordinary conversation. No regional real-world accent — placeless, formal, ceremonial cadence. The
    one deliberate contradiction to preserve: pressure makes her recede rather than rise — quieter and
    stiller under stress, not louder or faster. Comparable to a funeral celebrant or temple oracle
    reciting rites from memory: evenness that comes from discipline and inherited grief, not from an
    absence of feeling underneath it.
  one_line: >-
    A young queen's face over an old, grief-worn voice — hushed, unhurried, and ceremonially even, with
    a soft sibilant blur that thickens with sorrow and a stillness that only ever gets quieter under
    pressure, never louder.
  evidence:
    - source: "wiki/Volume I — Character Cards/Onawa Ashkewe.md:131"
      quote: >-
        Unhurried, declarative, feeling stated before the noun that caused it. Two to three phonetic
        softenings on sibilants, more pronounced under grief than anger. Rarely raises her voice — states
        facts about death and grief with the same evenness other rulers reserve for weather
    - source: "wiki/Volume I — Character Cards/Onawa Ashkewe.md:134"
      quote: >-
        Goes quieter, not louder. The mask's fangs are the only thing that moves
    - source: "wiki/Volume I — Character Cards/Onawa Ashkewe.md:132"
      quote: >-
        Speaks more plainly and less ceremonially the longer she goes without invoking the mask — and the
        ceremonial register returns within a sentence of putting it back on
    - source: "wiki/Volume I — Character Cards/Onawa Ashkewe.md:23"
      quote: >-
        Appears late twenties. True age unrecorded — Tsohanto queens stop counting years at their coronation

# ================================================================================================
# collisions to separate
# ================================================================================================
#
# Rule: same gender + pitch band + texture family + pace, then checked against who shares a scene
# in scenes/CAST.md (which is noisy — its first-word fallback credits 'Black Agent', 'Lord Lucen
# Vale', 'Lord Maerion Lysandre', 'Commander Severin Bale' and the paladin 'Dabney' with scenes
# they are not in; those are called out below). The cast's house style — quiet, level, never
# raised — puts thirteen men within a semitone and 0.15 grit of one another at medium-low /
# measured, so the ref-clip pick (a different source speaker for each) has to do most of the
# separating; the design tweaks below widen the spread where two of them actually share a scene.
# Design vectors are written pitch_st / weight / grit / breath / pace. One tweak per pair, named
# for the character it moves; the entries above still carry the spec's numbers — apply a tweak by
# editing the entry, then re-run voice_refs.py --design for that one voice. The tweaks are chosen
# so that moving a voice does not land it on a third; the ladders at the end show the result.
#
# A. Same brief, and they share scenes — fix before rendering those scenes
#
#  1. Aurelian / Verinus — male, medium-low, dry, unhurried (spec pace slow vs measured, design
#     0.9 vs 0.92); -2/0.35/0.15/0.4/0.9 vs -2/0.35/0.35/0.4/0.92 — identical but for grit.
#     9 shared scenes, including 01_verinus_fire_of_the_undeserving (a two-hander, 30 and 21
#     mentions), 02, 03, 04_verinus, 06_aurelian, 19_aurelian. Two church jurists who never raise
#     the voice, near-zero contractions, formal Concordia register.
#     Tweak Verinus: pitch_st -2 -> -1, weight 0.35 -> 0.25, breath 0.4 -> 0.5 — the thin-chested
#     seventy-one-year-old with the barotrauma restriction, a step above and lighter than
#     Aurelian's warm-toned baritone; the coastal vowels are the other lever.
#
#  2. Darius / Verinus — male, medium-low, dry-flat-level, measured; -3/0.55/0.4/0.3/0.92 vs
#     -2/0.35/0.35/0.4/0.92. 7 shared scenes: 14_darius, 23_darius, 19_aurelian, 04_verinus,
#     verinus_sword_and_scale, verinus_what_a_thing_weighs, WOTR_Vaeloris_Sequence. Both read
#     verdicts in a flat Concordia register. The Verinus tweak in A.1 separates this pair too:
#     Verinus up and thin, Darius stays at -3 with the soldier's chest and the sanded 0.4 grit.
#
#  3. Bram / Wren — male, low, flat chest-voice with faint gravel, measured; -4/0.65/0.4/0.15/0.93
#     vs -4/0.7/0.3/0.15/0.9. 4 shared scenes: 01_wotr_muster_breach_road_north, 02_wren_bulwark,
#     03_wren_three_deliveries, 10_wotr_what_the_ground_was_owed — brothers across the field, both
#     plain Northern, both with one shout in reserve.
#     Tweak Wren: pitch_st -4 -> -3, grit 0.3 -> 0.2 — the elder, the one who smiles, a cleaner
#     and slightly higher instrument. Bram keeps the heavier gravel (three years on the ridge,
#     scars down jaw and neck); if the pair still blur, take Bram to -4.5 / grit 0.5.
#
#  4. Lorn / Renard — male, medium-low, plain flat soldier with faint gravel, measured;
#     -2/0.45/0.3/0.15/0.96 vs -3/0.6/0.35/0.15/0.93. Shared: 01_wotr_muster_breach_road_north.
#     Tweak Renard: pitch_st -3 -> -3.5, grit 0.35 -> 0.25, breath 0.15 -> 0.1 — the harder, more
#     angular face, cold-air clean. He is "by voice only" in that scene so the risk is small, but
#     this also keeps him off Lorn once Lorn gains chest in A.5.
#
#  5. Edward Lambert / Lorn — male, medium-low, dry flat, measured; -3/0.4/0.25/0.12/0.92 vs
#     -2/0.45/0.3/0.15/0.96. Shared: 01_wotr_muster_breach_road_north, 10_wotr_what_the_ground
#     _was_owed. Both never raise the voice; both report rather than persuade.
#     Tweak Lorn: weight 0.45 -> 0.6, grit 0.3 -> 0.4 — the broad heavy Stark frame and the
#     outdoor years, against Edward's papery, chestless mechanism (Edward can also drop weight
#     0.4 -> 0.3 to widen it).
#
#  6. Edward Lambert / Osric — male, medium-low, dry controlled administrator, measured;
#     -3/0.4/0.25/0.12/0.92 vs -2/0.35/0.08/0.1/0.9. Shared: 04_sodoku_what_the_sky_does_not_ask.
#     Osric's own card says he disagrees "in the specific private register that Lambert also uses".
#     Tweak Osric: pitch_st -2 -> 0, weight 0.35 -> 0.25 — taller and narrower than Lorn,
#     "pitched for a room, not projected across one": the light dry one. Also separates him from
#     Sodoku (A.7).
#
#  7. Sodoku / Osric — male, medium-low, smooth-controlled no-rasp, unhurried (slow vs measured,
#     design 0.88 vs 0.9); -2/0.45/0.1/0.15/0.88 vs -2/0.35/0.08/0.1/0.9 — near-identical.

Cozbi:                  # card: Cozbi Mahuo; 22 archive lines read
  gender: "male"
  age: >-
    Unclear by design (card, Identity) — no simple count fits decades of harvesting, but the prose plays
    him as functionally ancient: "I have not been afraid of anything in three hundred years"
    (Cozbi_Pneuma_Unravel_Strike.md:13). Sex is male "in his true self and most projections" (card,
    Identity, line 25), so cast the centuries, not any one vessel's apparent youth.
  body: >-
    No fixed physical size or shape — a projected vessel three planes removed from the seated 'true'
    Cozbi, and his vessels 'don't uniformly match each other' (card §XIII, line 139). Not a giant, not
    built for melee (personal unarmed output is his weakest register per the stat block); what's
    constant across every vessel is a 'quality more than a face': gentleness that needs no performance,
    a stillness the air itself seems to observe, dust and breath that stop moving on his say-so (card
    §XIII, line 140). Cast the stillness, not a body type.
  pitch: "medium-low"
  texture:
    - "smooth"
    - "warm-surfaced"
    - "cultured"
    - "unhurried"
    - "faintly amused"
    - "flattens to plain ownership when addressing something he doesn't consider a person"
    - "grit only surfaces through blood or real injury"
  pace: "measured"
  energy: >-
    Banked and inexhaustible rather than low — the calm of a man for whom time is not a resource he
    needs to conserve (card §XIII, Strength). Genuine delight surfaces as unhurried laughter that is
    allowed to run its full course rather than being clipped for effect; real menace never needs volume,
    only the withdrawal of warmth. The one measured exception is alarm, which is rare, brief, and the
    single documented place his cadence actually speeds up.
  register: >-
    A lecturer's register laid over a predator's patience — long, precisely joined clauses
    ('arithmetic', 'ledger', 'decoration men add so they can sleep afterward'), moderate contractions
    (0.5 on the numbers, so not stiffly formal), heavy first-person framing (0.58) and almost no
    questions (0.06) or imperatives (0.03): he explains and asserts, he does not interrogate or bark
    orders. Per the card, plural self-reference creeps in under strain 'per Mahuo pattern' (§XIII,
    Voice) — a house-brand tic worth landing on one or two lines under genuine pressure, not the whole
    read.
  accent_hint: >-
    No regional accent flavour is on record — the diction reads closer to a lecture hall than a
    battlefield, precise and unbothered.
  engine: "turbo"
  exaggeration: 0.35
  design: {pitch_st: -3, weight: 0.5, grit: 0.15, breath: 0.2, pace: 0.9}
  reference_direction: >-
    Male, medium-low pitch — a warm baritone, not a bass, and not a giant's rumble; nothing here is
    built for size. Texture is smooth and almost ungritty at baseline (the numbers carry no rasp cue),
    with real grit reserved for the one scene where he's coughing blood and holding his voice level
    anyway. Pace is unhurried and deliberate, sentences given room to finish, with the single documented
    exception of a genuine-alarm speed-up that should sound like the register itself catching him off
    guard rather than a shift to a different voice. No regional accent flavour is on record — the
    diction reads closer to a lecture hall than a battlefield, precise and unbothered. Closest
    comparison: the calm, avuncular voice of a museum docent narrating something horrifying as though it
    were simply interesting — warmth as the delivery mechanism for cruelty, never volume.
  one_line: >-
    A centuries-patient, warm-baritone lecturer's voice that explains atrocity like arithmetic — smooth
    and unhurried until the one moment something finally startles it into speed.
  evidence:
    - source: "wiki/Volume I — Character Cards/Cozbi Mahuo.md:149"
      quote: >-
        Unhurried, warm-sounding even describing atrocity, precise, with occasional plural self-reference
        under strain per Mahuo pattern. Explains everything, genuinely believing no one else would follow
        the arithmetic otherwise.
    - source: "wiki/Volume I — Character Cards/Cozbi Mahuo.md:150"
      quote: >-
        Speed. Everywhere else unhurried — alarm makes him talk faster than his usual cadence allows. Dova's
        read earned real, unpracticed alarm: his only documented cadence speed-up
    - source: "scenes/Cozbi_Rengai_Dhaerin_Confrontation.md:33"
      quote: >-
        "He'll never remember the needle." Cozbi's voice stayed light, almost gentle, which made it worse
        than shouting would have.
    - source: "scenes/Cozbi_Sealed_Retreat.md:17"
      quote: >-
        "It doesn't matter." Cozbi's voice stayed flat even through the blood, even through the effort it
        plainly cost him to keep it level.

Dhaerin:                # card: none found under this name; the spec is built from the scenes (JSON name 'Dhaerin Valorin'); 21 archive lines read
  gender: "male"
  age: >-
    Elderly. Called "insufferable old man" by Rengai, fondly (scenes/Rengai_Farewell_and_Dhaerin.md:53),
    and he is in the process of handing his life's work to his nephew Xhem, trusting him to "manage
    Vaeloris" in his absence because Xhem "has managed harder things with less warning"
    (scenes/Rengai_Farewell_and_Dhaerin.md:35) — the framing of a man near the end of a long career, not
    mid-career. His white hair confirms it directly: "His white hair had come loose from its tie"
    (scenes/Dhaerin_Final_Rite_Sacrament_Oblation_Rescind.md:9). Cast an old man's voice, not a
    seasoned-but-vigorous middle-aged one.
  body: >-
    Not built for melee. He fights from behind a grimoire and wand while Rengai does the physical work,
    and his body is the first thing to give out under strain: "His wand hand trembled faintly from the
    feedback that had buckled his knees, and he forced the tremor into stillness through sheer
    discipline rather than any recovery the moment had given him time for"
    (scenes/Cozbi_vs_Rengai_Dhaerin_Combat.md:43). He is Valorin bloodline — gold rune-script surfaces
    on his throat and temple when he casts, never on his fists: "the fine gold script along his throat
    beginning to surface and glow faintly in the gathering dark"
    (scenes/Cozbi_Rengai_Dhaerin_Confrontation.md:59); "the faint gold geometry at his temple catching
    what little remained of it" (scenes/Rengai_Farewell_and_Dhaerin.md:29). Cast a slight, scholarly
    frame running on discipline and borrowed time, not physical bulk — the opposite build from an
    eight-foot giant or a warrior like Rengai.
  pitch: "medium-low"
  texture:
    - "dry"
    - "papery"
    - "unhurried"
    - "precise diction"
    - "no theatrical chant-voice"
    - "faint rasp of age"
    - "cracks only from mortal injury, never from fear"
  pace: "measured"
  energy: >-
    Low and banked, never rising to match a threat. He corrects Cozbi's argument in the same tone a
    tutor uses on a student's proof (scenes/Cozbi_Rengai_Dhaerin_Confrontation.md:25), and even while
    laying the rite that he knows will kill him, "His voice did not shake. Whatever fear remained in him
    had already been spent on lesser things tonight"
    (scenes/Dhaerin_Final_Rite_Sacrament_Oblation_Rescind.md:15). The one texture change on record is
    involuntary and physical, never emotional: blood in his throat turns his laughter "wet, bubbling" at
    the edge of death (scenes/Dhaerin_Magnum_Opus_Recursive_Array.md:9). His composure is a discipline,
    not a temperament — the only thing that ever cracks it is his own body failing, never the enemy in
    front of him.
  register: >-
    A tutor's register carried all the way into a death rite: level, conversational, corrective — "You
    keep saying strong" ... "the word you actually want isn't strong. It's parasite"
    (scenes/Cozbi_Rengai_Dhaerin_Confrontation.md:25) — rather than declamatory. His incantations land
    the same way: "Dhaerin's voice carried none of the theater most casters gave a chant, only the flat
    cadence of a man reading a proof aloud" (scenes/Cozbi_vs_Rengai_Dhaerin_Combat.md:19), so his Latin
    ritual lines ("Hoc sacramentum meum ultimum est," "Rescindo") should read as recitation, not
    performance. The numbers back a controlled, literate speaker: mean utterance 24.3 words,
    contractions moderate at 0.56, first-person framing heavy at 0.56, zero questions and zero
    imperatives across his sample (build/book_tools.py voice_fingerprints) — he states and explains, he
    does not interrogate or bark orders.
  accent_hint: >-
    No regional accent flavour is on record — the diction reads closer to a lecture hall than a
    battlefield or a temple.
  engine: "turbo"
  exaggeration: 0.25
  design: {pitch_st: -2, weight: 0.3, grit: 0.25, breath: 0.3, pace: 0.88}
  reference_direction: >-
    Male, medium-low pitch — an old scholar's voice, dry and papery rather than warm or resonant,
    carrying a faint rasp of age but no habitual grit; not a giant's rumble and not a young man's
    clarity. Pace is unhurried and metronomic, sentences delivered the way a tutor reads a proof aloud,
    and it holds that level even while reciting Latin ritual lines or while dying. No regional accent
    flavour is on record — the diction reads closer to a lecture hall than a battlefield or a temple.
    Closest comparison: an elderly university don correcting a promising but wrong student, calm and
    exact, never needing volume to land the correction — and that same calm never leaves him, right up
    to the sentence that kills him.
  one_line: >-
    A dry, unhurried old scholar's voice — a rune-caster who corrects his own executioner's logic in the
    same flat, precise register he uses to recite the death-rite that kills him.
  evidence:
    - source: "scenes/Cozbi_Rengai_Dhaerin_Confrontation.md:25"
      quote: >-
        "You keep saying strong," Dhaerin said, his voice level, almost conversational, the specific tone of
        a scholar correcting an error in someone else's proof rather than a man addressing his own
        executioner. [...] "It's parasite. I only mention it because you seem like a man who prides himself
        on precision, and precision matters to me too."
    - source: "scenes/Cozbi_vs_Rengai_Dhaerin_Combat.md:19"
      quote: >-
        "Invoco caelum." Dhaerin's voice carried none of the theater most casters gave a chant, only the
        flat cadence of a man reading a proof aloud.
    - source: "scenes/Dhaerin_Final_Rite_Sacrament_Oblation_Rescind.md:15"
      quote: >-
        "Hoc sacramentum meum ultimum est." He spoke the frame first, since every Saishiki rite required

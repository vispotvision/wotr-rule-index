Tōga:                   # card: Tōga (冬牙) — Winter Fang; not a speaking voice — one non-verbal cry (Aurora Howl) and otherwise silence; no archive dialogue
  gender: >-
    Not applicable in the human sense — the prose never assigns a pronoun beyond 'it'/'the
    creature'/'the animal'/'the thing,' and the card explicitly notes Sodoku 'does not command Tōga
    through speech' at all. Cast as a genderless titan-beast register, not mapped onto a male or female
    human voice.
  age: >-
    Card: 'Centuries. The Glacier Eye read ten thousand years of Winter saturation in the resonance
    handshake. The creature was alive before the Moto migration. Before the kingdom. Before the name
    Kharven existed.' This is not human-decrepit age — it is the eldest-thing-on-the-ice register:
    absolute, patient, undiminished. Nothing in the confirmed-abilities list reads as slowed or weakened
    by age; the age shows as authority and stillness, the way Gimbzo's age shows as wear rather than
    frailty, but taken further because Tōga is not even nominally humanoid.
  body: >-
    Titan-class Droval. 22 feet at the shoulder on all fours, 38+ feet reared on hind legs; 28 feet
    nose-to-haunch; an estimated 14–16 tons. Owl-fused predator skull — hooked bone-hard ivory beak
    transitioning into rows of jagged teeth, forward-facing binocular pale-blue-luminescent eyes, short
    tufted ears, stiff frost-lined whiskers. Dense blue-white fur partially crystallized into
    frost-mineral armour at shoulders and spine. Drifting ice crystals orbit the body at all times,
    formed from ambient moisture warped by its own Aetheric mass. This is a chest/skull cavity an order
    of magnitude larger than any human or even giant (Gimbzo, elsewhere in this cast, tops out 'past
    eight feet') — and the resonating structure is a beaked, owl-fused skull, not a mammalian throat,
    which is why the card's own vocal description reaches for 'owl-like' rather than wolf, lion, or
    bear.
  pitch: "very low"
  texture:
    - "bass-frequency, owl-like cry — the card's own word for it (\"Aurora Howl\") — a hollow, resonant boom/hoot quality rather than a mammalian roar, growl, or shriek, consistent with the owl-fused beaked skull"
    - "physically felt rather than merely heard: card says the audible component 'travels through ice, through boots, through bones, felt in the teeth and the sternum' — an infrasound-adjacent, sub-bass presence under the tone"
    - "a second, sub-audible layer running underneath any audible sound — 'Harmonic resonance that suppresses ambient sound and replaces it with the stillness that the body processes as dread' — so any vocal performance should carry a felt undertow, not just a single clean pitch"
    - "silence is the baseline, not a texture gap to fill: Silent Tread is '14+ tons... quieter than a walking human,' and in the one extended scene with Sodoku (04:43-55) it communicates entirely through held stillness — 'the great head came round, the eye found him and held' — no vocalization at all"
    - "unhurried and settled even under threat — nothing in the record shows Tōga vocalizing out of urgency or fear; the recorded cry is a weapon deployed once, not a habitual sound"
  pace: "slow"
  energy: >-
    Near-total silence and stillness at rest — a titan whose default state produces no sound at all,
    described as quieter than a walking human — with all vocal output reserved for one confirmed event

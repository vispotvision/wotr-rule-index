    A hushed, unhurried sword-saint's voice — serenity worn as discipline rather than temperament, with
    a coiled stillness that breaks all at once, not by degrees, if the pressure ever exceeds what it can
    hold.
  evidence:
    - source: "wiki/Volume IV — Character Cards/Azure Serathiel · The Sky-Veiled Saint.md:46"

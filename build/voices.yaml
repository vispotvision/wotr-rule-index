# Who sounds like what, for build/audio_export.py and the narrate_scene MCP tool.
#
# An entry is either a voice spec string or a mapping.
#   spec string:  a built-in Kokoro voice (python build/audio_export.py --list-voices),
#                 a custom style file build/voices/<name>.npy, another entry's name,
#                 or a blend "a:0.6,b:0.4"
#   mapping:      voice: <spec>   speed: 0.93   gain: 1.0            (Kokoro)
#                 engine: chatterbox   ref: build/voices/x.wav   exaggeration: 0.6   cfg: 0.35
#                 (Chatterbox: expressive, slower, can design a voice from a reference clip;
#                  see build/chatterbox_backend.py)
#                 engine: supertonic   voice: M2   steps: 10   speed: 0.95
#                 (Supertonic 3: fast, stable, 44.1 kHz, CPU only; ten fixed presets M1–M5 / F1–F5
#                  or style: <voice-style .json>; performs [laugh] [sigh] [breath]; see build/supertonic_backend.py)
#                 engine: qwen   instruct: "<the voice brief>"   anchor: build/voices/anchors/X.wav   tries: 2
#                 speed / pitch_st / formant / range_factor (exact, applied after synthesis)
#                 (Qwen3-TTS VoiceDesign: THE character engine — a voice from words, no clip; batched per
#                  speaker, scored against the anchor; see build/qwen_backend.py. `instruct_from: casting`
#                  reads qwen_instruct from build/casting/<Name>.json instead.)
#
# Speakers are the [Name] tags in scenes/cast/<scene>.cast.md. "narrator" is every
# untagged line. A speaker with no entry gets a stable pick from _pool below, and the
# render prints who got what so you can pin them here.
#
# Built-in families: af_/am_ American, bf_/bm_ British, ef_/em_ Spanish, ff_ French,
# hf_/hm_ Hindi, if_/im_ Italian, jf_/jm_ Japanese, pf_/pm_ Portuguese, zf_/zm_ Mandarin.

narrator: af_heart
narrator-british: bm_george
narrator-low: "bm_george:0.6,am_onyx:0.4"

# registers (a voice for a kind of text, not a person)
Rubric:                # received liturgical text read out — level, unhurried
  voice: bm_daniel
  speed: 0.9

narrator-combat:       # the narrator performing a fight: same voice, Chatterbox Turbo delivering it
  engine: chatterbox
  model: turbo
  ref: build/voices/refs/narrator.wav
  speed: 1.05

# characters
Verinus:               # seventy-one in a twenty-six-year-old's body; dry, exact, never hurried
  voice: "bm_george:0.7,bm_lewis:0.3"
  speed: 0.95
Aurelian:
  voice: am_michael

# The Seven, and the Price of Each — the leads are DESIGNED voices: Qwen3-TTS VoiceDesign from a written brief
# (build/qwen_backend.py). `anchor` is the take Isaac approved on 12 Sep 2026; every batch is scored against it.
Gimbzo:                # eight feet of him; Yhwach register — very deep, dark, slow, every word weighted; the creak is the point
  engine: qwen         # 12-field brief (QWEN_DESIGN_GUIDE.md §3.1); "creaky, vocal fry, low rumble" measured closest to the
  instruct: >-         # approved deep line (0.43 mean / 0.69 best vs 0.25 for the guide's base texture); no "hoarse" — it raises pitch
    gender: Male. pitch: Very low male pitch, deep bass, generally stable with almost no rise.
    speed: Slow, deliberate pace, with long pauses between sentences. volume: Conversational and projected from the chest, never loud.
    age: Older adult. clarity: Clear, distinct pronunciation. fluency: Highly fluent, long unbroken sentences with no hesitations.
    accent: General American English. texture: Deep, resonant, creaky, with vocal fry and a low rumble, gravelly and rough.
    emotion: Calm and composed, without heat. tone: Flat, level, authoritative, matter-of-fact.
    personality: Blunt, patient, plainspoken, unhurried.
  anchor: build/voices/anchors/Gimbzo      # the three lines of the approved set; line3_deep is the register Isaac liked
  portray: {pitch_st: -4, formant: 0.88, speed: 0.9, range_factor: 0.75}   # single-narrator mode: how the narrator voices him
  fallback: Gimbzo-cb   # used while the engine is locked (--qwen unlocks it)
  tries: 4
  pitch_st: -1         # the deep register, held for every line
  range_factor: 0.9
  gain: 1.05
Darius:                # the Measurewright; Piccolo floor, Vegeta's edge when the door cracks
  engine: qwen         # the prose brief that made the anchor lands closest to it (56% of draws >= 0.5; the 12-field form 44%)
  instruct: >-
    A stern middle-aged man. Deep, dry, resonant baritone, gruff and gravelly, low in the chest, measured and unhurried,
    flat and precise with no lift at the ends of sentences, calm authority with contempt held under control. Speaks quietly;
    never raises his voice. Clear American English, no accent, serious, no warmth.
  anchor: build/voices/anchors/Darius
  portray: {pitch_st: -2, formant: 0.95, speed: 0.95, range_factor: 0.8}
  fallback: Darius-cb
  tries: 3
Kizami:                # the Notcher; a neck with too many joints; keeps the record
  portray: {pitch_st: 2.5, formant: 1.06, speed: 1.08, range_factor: 1.15}
  engine: chatterbox
  model: standard
  ref: build/voices/refs/kizami.wav
  exaggeration: 0.65
  cfg: 0.4
# the earlier Chatterbox casts, kept for A/B (VCTK speakers, CC BY 4.0; credits in build/voices/refs/CREDITS.md)
Gimbzo-cb:
  engine: chatterbox
  model: turbo
  ref: build/voices/refs/gimbzo.wav
  speed: 0.92
  gain: 1.1
Darius-cb:
  engine: chatterbox
  model: turbo
  ref: build/voices/refs/darius.wav

_pool: [am_michael, bf_emma, am_fenrir, af_sarah, bm_lewis, af_nicole, am_eric, bf_alice]

# narrators designed from LibriTTS-R audiobook readers (CC BY 4.0; credits in build/voices/refs/CREDITS.md)
narrator-m:            # reader 2803 — slightly low, level, very clean; --voice narrator-m for a Chatterbox-only render
  engine: chatterbox
  model: turbo
  ref: build/voices/refs/narrator-m.wav
narrator-f:            # reader 3576 — slightly low, a little expressive
  engine: chatterbox
  model: turbo
  ref: build/voices/refs/narrator-f.wav

# Supertonic 3 presets (audition: build/voices/bakeoff/supertonic3/) — the fast tier; --voice narrator-st for a whole scene on it
narrator-st:           # M2 — level, unhurried, reads back clean
  engine: supertonic
  voice: M2
  steps: 10
  speed: 0.95
narrator-st-f:         # F5 — the only preset that took the giant's laugh cleanly
  engine: supertonic
  voice: F5
  steps: 10
  speed: 0.95

# Qwen narrator — PROVISIONAL: N8, a light American tenor (122 Hz), chosen by measured distance from the leads
# (0.26 to Darius, 0.25 to Gimbzo; the low male candidates sat at 0.5). Alternative: N7 female alto (0.20 / 0.19).
narrator-q:
  engine: qwen
  instruct: >-
    gender: Male. pitch: Slightly high male pitch, a light tenor, generally stable with gentle variation.
    speed: Measured, unhurried narration pace with natural pauses. volume: Conversational, even. age: Young adult, around thirty.
    clarity: Very high clarity, crisp and distinct pronunciation. fluency: Highly fluent, long flowing sentences.
    accent: General American English. texture: Light, clean, smooth and clear, bright, no rasp, no gravel.
    emotion: Calm, composed, quietly attentive. tone: Level, literary, understated, precise.
    personality: Observant, intelligent, restrained.
  anchor: build/voices/anchors/narrator-q
  fallback: narrator-st
  tries: 3

# ONE narrator who reads everything and portrays the characters (Isaac, 13 Sep 2026: "one REALLY good voice").
# --single --voice narrator-tb: every span is read in this voice in scene order, minute-long takes, and each character's
# `portray:` shaping is applied to their lines. Brief in the register of a beloved audiobook narrator (words, no clip).
narrator-tb:
  engine: qwen
  instruct: >-
    gender: Male. pitch: Medium male pitch, generally stable, expressive but never dramatic.
    speed: Relaxed, conversational pace, unhurried, natural pauses. volume: Conversational, even, intimate.
    age: Adult, late thirties. clarity: Very high clarity, crisp yet relaxed pronunciation.
    fluency: Highly fluent, long flowing sentences. accent: General American English.
    texture: Warm and smooth with a gentle husky grain, rich and rounded, no harshness.
    emotion: Warm, calm, gently wry. tone: Engaging audiobook storytelling, easygoing, kind, with a sly humour;
    in dialogue he gives each character a distinct voice — a giant very deep and slow, a judge dry and clipped, a clerk quick and thin.
    personality: Likeable, wry, patient, self-assured; a versatile narrator who inhabits every character.
  anchor: build/voices/anchors/narrator-tb
  fallback: narrator-st
  tries: 3

# ElevenLabs (build/elevenlabs_backend.py), used only when a render asks for it:
#   python build/audio_export.py --engine elevenlabs --scene X    /   narrate_scene(scene, engine="elevenlabs")
# Every speaker goes through this map; a speaker without a line here gets _default. A name
# from the workspace works as well as an id (--list-eleven prints both). Costs characters
# on the plan; the local engines above stay the free default. The cloned "Aatrox" voice is
# a game actor's performance: personal listening only, never a render on the public route.
_elevenlabs:
  _model: eleven_multilingual_v2
  _default: George - Warm, Captivating Storyteller
  narrator: George - Warm, Captivating Storyteller

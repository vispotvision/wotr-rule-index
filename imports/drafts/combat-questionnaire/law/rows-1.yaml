    the working's mechanism has been ruled.
  verbatim: 'An Essence splint, priced. A practitioner may hold a broken structure shut with a working:
    Tempering for how long, a reserve cost per turn, ending at Starvation; the wound is worse afterward.
    Needs a ruled mechanism before first use.'

    crack after, the wound that opens once the swordsman has passed. Held to FOW''s speed rows for the
    Grade on the card); Felt time, by Reflex (A POV whose Reflex Grade outruns the threat gets stretched
    time on the page, held to FOW''s Reaction Speed row for that Grade; a slower POV gets only the gap.
    Sits beside R70-57''s one held instant); The gap in the frame (The body is simply elsewhere, nothing
    drawn between two poses; any after-image is disturbed snow, dust or frost, never a glowing double
    (R9-3 keeps ''it glowed'' banned)). Not taken: The witness who misses it.'

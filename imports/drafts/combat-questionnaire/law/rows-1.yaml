- id: R71-4-FAR_FROM_FLOOR
  pack: Combat Law 2026-10-04
  pack_number: null
  section: K4
  title: The combat floor rescaled and paid by grammar
  status: live
  kind: budget
  summary: Carry the full combat floor at first display and finisher, items 1 to 4 at every exchange that
    turns the fight and item 8 at a turn's close, each item stated where it happens, and let each grammar
    pay it its own way (Verdict the read before and the mechanics after, on the body; Blade pass by pass;
    Percussion and Expenditure the cost every exchange).
  verbatim: 'Floor by grammar. Rescaled as in A, and each grammar pays the floor its own way: Verdict
    states the read before and the mechanics after, on the body; Blade pass by pass; Percussion and Expenditure
    carry the cost every exchange. (Option A there reads: Rescale, same ratios. R13-4-DENSITY_BUDGET is
    rewritten for today''s lengths: full floor at first display and finisher, items 1 to 4 at every exchange
    that turns the fight, item 8 at a turn''s close. Every item stated where it happens.)'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: §4 (density of the combat floor)
    operation: replaces
  - guide: WOTR_Combat_Craft_Guide.md
    locus: The four grammars
    operation: extends
  supersedes:
  - R13-4-DENSITY_BUDGET
  applies_to:
  - combat
  - scene-structure
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K4, option B, which takes option A''s rescale whole. Supersedes R13-4-DENSITY_BUDGET in its
    own words (''R13-4-DENSITY_BUDGET is rewritten for today''s lengths''): the 2,500-word duel and the
    700 to 1,500 word turn give way to today''s lengths (turns about 3,500 words under R48-28-TURN_LENGTH,
    set pieces 5,000 and up under R48-46-WORD_FLOOR). Partly amends R13-4-COMBAT_FLOOR, whose eight items
    stand, by setting where each grammar pays them. Works with R70-102-STILLNESS_TRACED_PASSES_LONG (duel
    shape by grammar); R13-8-RECONSTRUCTIBLE_ADJUDICATION stands.'
- id: R71-5-ROLEPLAY_TURNS_AGAINST_WRITTEN
  pack: Combat Law 2026-10-04
  pack_number: null
  section: K5
  title: Standing orders in a roleplay fight
  status: live
  kind: procedure
  summary: In a roleplay fight Isaac may post conditions such as 'if he closes, I cut low', and Natalie
    runs them exchange by exchange until the first branch they do not cover, then stops the turn on that
    threat.
  verbatim: Standing orders honoured. You may post conditions ('if he closes, I cut low'). Natalie runs
    them exchange by exchange until the first branch they do not cover, then stops on that threat. Table
    Rule 1 gains this exception.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 1 (turn shape)
    operation: extends
  supersedes: []
  applies_to:

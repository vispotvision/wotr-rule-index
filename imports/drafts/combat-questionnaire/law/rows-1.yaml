    lines: null
  notes: 'CW6. Live as law, but ''Needs a ruled mechanism before first use'': no scene uses the splint
    until a ruling gives it a mechanism and its per-turn cost, under R12-5-NEVER_INVENT_NUMBER. Tempering
    is the duration stat of R14-3-STATS_DECIDE_TABLE; the per-turn cost runs on R60-03-HARD_RESERVE_CLOCK,

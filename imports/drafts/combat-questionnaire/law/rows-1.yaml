  kind: mandate
  summary: Render a practitioner's speed by its physics arriving first (the pressure front, the crack
    after, the wound that opens once he has passed), by stretched time for a POV whose Reflex Grade outruns
    the threat, and by the gap in the frame with nothing drawn between two poses, each held to FOW's rows
    for the Grade on the card.

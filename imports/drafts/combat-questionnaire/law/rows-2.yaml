- id: R71-27-SPOKEN_WORKING_EXCHANGE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC1
  title: A spoken working's chain is cut into the exchange
  status: live
  kind: mandate
  summary: When a practitioner speaks a working mid-fight, print its chain in pieces between the opponent's
    moves, so each clause costs a step the opponent takes and the reader can count the race's price.
  verbatim: Cut into the exchange. The chain is printed in pieces between the opponent's moves, so each
    clause costs a step he takes. The Combat Guide gains the rule; the reader watches the race and can
    count its price.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: A spoken working in the exchange
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - magic-mechanism
  - dialogue
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC1. ''The Combat Guide gains the rule'': owed to the Combat Craft Guide''s next edition (R71-102-WHERE_COMBAT_LAW_LANDS).
    The chain''s time is paid in the opponent''s steps, so the tempo reconstructs under R13-8-RECONSTRUCTIBLE_ADJUDICATION,
    inside R47-11-TIME_AND_ENERGY''s six-second turn. Works with R70-101-DECLARING_NAME_LINE_BEFORE (the
    world does not wait while the words run). R20C-42-LAW_V_STAGE_GATE_REFRACTION (a medium below Stage
    VII), R51-28-CHANT_PAGE and R50-26-CHANT_TONGUE (the chain in the speaker''s own language) and R13-4-COMBAT_FLOOR
    stand. No older rule is reached.'
- id: R71-28-DECIDES_CASTING_SPEED
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC2
  title: Alacrity decides a casting race; a filled Readiness figure overrides
  status: live
  kind: definition
  summary: Decide every race between workings, or between a working and a blade, from a new Alacrity row
    today, and where a technique card's Readiness figure has been filled, let that figure govern instead.
  verbatim: Row now, cards override. The Alacrity row decides every race today; where you fill a card's
    Readiness, that figure governs. Nothing waits on figures, and precision grows as cards are filled.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§7, the adjudication table: a casting-race row'
    operation: adds
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: a Readiness field'
    operation: adds
  supersedes: []
  applies_to:
  - adjudication
  - combat
  - stats
  - magic-mechanism
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: MC2. Ardency Alacrity is Fracture of Worlds' casting speed; the row needs no figure, so nothing
    waits on one. A Readiness figure is set on a card, the way the Summon Register already
    fills Readiness, and is never invented (R12-5-NEVER_INVENT_NUMBER); a card left blank falls back to
    the row. Every race traces to the row or the card (R14-3-TRACEABILITY, R13-8-RECONSTRUCTIBLE_ADJUDICATION).
    The Alacrity row joins the Combat Guide's §7 table; R14-3-STATS_DECIDE_TABLE and its rows stand. R47-11-TIME_AND_ENERGY's
    six-second turn stands. No older rule is reached.
- id: R71-29-OFTEN_ART_RELEASED
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC3
  title: An art may be released as often as the fight gives a beat
  status: live
  kind: budget
  summary: An art's release call may be spoken as often as the fighter can afford the beat it costs, each
    call buying its output, with no once-per-scene cap.
  verbatim: As often as beats allow. R50-09 governs and R8-26 is marked superseded. Every call costs its
    beat and buys its output, so a fighter may call his art again whenever he can afford the beat.
  amends:
  - guide: WOTR_Master_Style_Directive.md
    locus: Pack Eight's one release per scene
    operation: strikes
  - guide: WOTR_Character_Naming_Guide.md
    locus: 'the release: an art spoken once at release'
    operation: replaces
  supersedes:
  - R8-26-ONE_RELEASE_PER_SCENE
  applies_to:
  - combat
  - naming
  - dialogue
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC3; closes CONFLICTS C-159. ''R8-26 is marked superseded'': of the R8-26 rows only R8-26-ONE_RELEASE_PER_SCENE
    counts releases, so it alone is superseded; R8-26-NO_SELF_TRANSLATION and R8-26-GLOSS_DEPENDENCE_FAILS
    stand, and R8-26-NAME_NEVER_NARRATED and R8-26-GLOSS_NEVER_IN_PROSE were already superseded by R49-48-TECH_NAMES.
    ''R50-09 governs'': R50-09-ONE_RELEASE stands as the release law. Partly amends R8-23-NAME_HIERARCHY:
    ''An art is spoken once at release and thereafter assumed'' yields to a call repeated whenever the
    beat can be afforded; techniques are still spoken at each use. R8-24-RELEASE_MECHANIC stands and is
    the price (a beat for output). R20C-38-PACK_EIGHT_SECTION_TWO_ENTIRE was already superseded.'
- id: R71-30-HELD_BACK_REVEAL
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC4
  title: 'A held reveal: the rule acts unexplained first and is told at the reveal'
  status: live
  kind: mandate
  summary: A working's rule may act on the page before the fight without explanation, as evidence a reader
    could catch, and be told by a voice only at the reveal, with the author notes listing each planted
    sign.
  verbatim: 'Shown before, told at reveal. This reopens R70-71 for held reveals: the rule may act earlier,
    unexplained, as evidence a reader could catch, and a voice tells it at the reveal. The notes list
    each planted sign.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: 'Explaining a working mid-fight: the held reveal'
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - magic-mechanism
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC4. ''This reopens R70-71 for held reveals'': a partial amendment, not a supersession, since
    the words limit the reopening to held reveals; R70-71-EXPLAINING_WORKING_MID_FIGHT still plants a
    working''s rules beforehand everywhere else. The planted evidence is the foreshadowing R48-30-SURPRISES
    asks for, so that row stands and is met. R12-4-VOICE_MIXING_RULE''s two-voice cap binds the telling
    at the reveal; R12-3-NAMED_INVENTOR_RULE''s live read of a self-derived technique stands.'
- id: R71-31-COUNTERS_DUEL_SCALE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC5
  title: A soft Family counter chart above the card's hard Counter
  status: live
  kind: definition
  summary: A chart derived from Codex physics says which conditions and Wellspring Families make each
    Family's working cost more and deliver less, while each card's Counter field stays the hard answer;
    the chart binds once ratified.
  verbatim: Soft Family chart. A chart derived from Codex physics says which conditions and Families make
    each Family's working cost more and deliver less; the card's Counter field stays the hard answer.
    You ratify the chart.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: 'Counters at duel scale: the Family chart'
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - adjudication
  - magic-mechanism
  - codex
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC5. The chart is owed: derived from Codex physics and ratified before it binds; until then
    counters come from each card as now. The chart only raises a working''s price and lowers its delivery,
    so more power can still pay through it; outright failure stays the card Counter''s to state (the hard
    type-chart option was not taken). R17-3-COUNTER_MANDATORY stands as the hard answer, and the chart
    builds on R47-9-INHERITED_FAILURES (a working inherits its Wellsprings'' failures). Chart entries
    are written as facts (R47-3-COUNTERS_AS_FACTS). R12-3-NAMED_INVENTOR_RULE stands. No older rule is
    reached.'
- id: R71-32-VOWS_LIMITS
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC6
  title: A narrowing vow buys output through Attraction Force
  status: live
  kind: definition
  summary: A practitioner may bind a technique with a vow that narrows it, raising its output through
    Attraction Force by a figure set on that card; breaking the vow is a Shear Break, and the vow's terms
    are its findable counter.
  verbatim: Narrowing buys output. A vow that narrows a technique raises its output through Attraction
    Force, by a figure you set on that card; breaking it is a Shear Break. The vow's terms are its findable
    counter.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: Limit and Counter (the vow)'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - magic-mechanism
  - stats
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: MC6. The output figure is set card by card and never invented (R12-5-NEVER_INVENT_NUMBER); a
    vow whose card carries no figure buys nothing yet. Attraction Force gives the narrowing the mechanical
    source R17-3-LIMIT_MECHANICAL asks of a limit, so that row stands. Shear Break and Attraction Force
    are canon's terms (the Counterplay page and Fracture of Worlds). The terms are a counter written as
    fact (R47-3-COUNTERS_AS_FACTS). The disclosure option (telling the opponent as a binding) was not
    taken, so R8-26-NO_SELF_TRANSLATION and R12-4-VOICE_THREE_OPPONENT stand unchanged. No older rule
    is reached.
- id: R71-33-DRAIN_SHOWS
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC7
  title: The drain shows in the body, in the waste and in the opponent's read
  status: live
  kind: mandate
  summary: Between readout lines, show a falling reserve through a bank of body signs keyed by culture
    to the Ledger's thresholds, through waste heat that grows as eta falls, and through the opponent's
    read and his choice to make the spender spend.
  verbatim: 'Yes to: The body, by threshold (A bank of body signs keyed to the Ledger''s lines, committed
    spending and Starvation: cold hands, tin on the teeth, the slow grip. Logged by culture, so the nosebleed
    stops carrying everything); The waste grows (As η (eta, efficiency) falls, the same work sheds more
    heat, so the room shows the drain: the thawed ring widens, the air shakes harder. Canon''s own law,
    written as a rule of the page); The opponent reads it (The drain is shown through the other fighter''s
    read and his choice to make the spender spend. The Counterplay doctrine, on the page). Not taken:
    By Family.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§7.1, the reserve clock: what reaches the page'
    operation: extends
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: a bank of drain signs by culture
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - magic-mechanism
  - prose-law
  - stats
  - standing-inventory
  verification:
  - 'verify: stale-device watch'
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC7. The body bank is keyed to the Ledger''s lines (committed spending, Starvation below a tenth
    of reserve) and logged by culture in each Standing Inventory, so the overdraw nosebleed stops carrying
    every scene; R71-103-COMBAT_CHECKS_VERIFY_SCENE''s stale-device watch warns on it past one
    a scene. The waste option writes R47-8-WASTE_IS_HEAT and the Combat Guide''s §7.1 Starvation row (''brighter
    for the same work, sheds more, delivers less'') as a rule of the page. The opponent''s read is the
    Counterplay doctrine. R60-03-HARD_RESERVE_CLOCK, R70-88-NUMBERS_INSIDE_FIGHT (no running figures),
    R70-85-SCENE_MOMENTS_THAT_EARN, R70-89-BODY_FIRST_NUMBER_FIRST and R48-37-COST_SHOWN stand; these
    signs carry the clock between readout lines. ''Not taken: By Family'': no per-Family drain sign. No
    older rule is reached.'

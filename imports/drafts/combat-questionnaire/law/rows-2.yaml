    file: ''
    lines: null
  notes: 'MC24. Puts R13-C on the page (ruled 2026-09-12: the working, not the steel, stops shot against
    a worked cuirass); the marks are the four §4.6 inscriptions'' own (Mending Arrays, Weight Ablation
    Glyphs, Impact Damping Seals, Aether Plate), so nothing new is canon. The mark is a counter written

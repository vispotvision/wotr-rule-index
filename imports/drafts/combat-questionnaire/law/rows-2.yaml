    lines: null
  notes: 'MC15; closes CONFLICTS C-124. NATALIE''s Stage ladder (''One Stage up bends attention; two,
    sweat and nausea; three or more drops people'') stands between practitioners. Partly amends R53-14-FOLK_KNOWLEDGE:
    ''Pressure is felt as dread'' holds for the unwoken from F to D, and from C up the Aura table adds
    weight in the room and, from A, bending knees; the folk words and the rest of that row stand. R70-69-PRESSURE_AURA
    (the room first) and R70-79-CAN_READ_WHOM (commoners'' awe) stand. ''No new figures'': the Grade bands
    are Part Eleven''s own (R12-5-NEVER_INVENT_NUMBER); R14-3-STATS_DECIDE_TABLE stands.'

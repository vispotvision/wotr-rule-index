- id: R71-35-SECOND_WIND
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC9
  title: Crisis Recovery may decide a fight only if its trigger was planted
  status: live
  kind: mandate
  summary: Crisis Recovery, the Crystal's surge in a crisis, may land at the deciding exchange only when
    its trigger was planted earlier where a reader could catch it, its price goes on the Ledger, and it
    stays rare.
  verbatim: Decides, if planted. It may land at the deciding exchange only when its trigger was set up
    earlier on the page where a reader could catch it, and its price goes on the Ledger. Rare by rule.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§7.1, the reserve clock: Crisis Recovery'
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - adjudication
  - stats
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC9. The planted trigger is the foreshadowing R48-30-SURPRISES asks for and keeps the outcome
    reconstructible (R13-8-RECONSTRUCTIBLE_ADJUDICATION). The triggers stay canon''s: Fracture of Worlds
    has the surge come from a soul-cost event, a Threshold completion or a genuine emotional breakthrough
    during combat, and it cannot be manufactured. It may turn a fight without a Stage breakthrough (the
    breakthrough-only option was not taken); R70-91-BREAKTHROUGH_PAGE stands for breakthroughs. R60-03-HARD_RESERVE_CLOCK
    stands, with the surge''s price on the Ledger. R2-6-REPLENISHMENT_RULE is not named and stands: the
    surge is the Crystal''s own, and no consumable, technique or item refills a practitioner. The Combat
    Guide''s §7.1 reserve rows owe a line for it. No older rule is reached.'

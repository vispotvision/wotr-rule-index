    file: ''
    lines: null
  notes: 'FT1. Partly amends R1-4-PRECEDENCE_NOTE (the answer''s own ''Amends R1-4''): in a small action
    with no formation the Combat Guide''s floor now reaches only the POV''s own exchanges, and the Mass
    Combat Guide''s compression takes the fighting around her; the formation trigger and the suspension
    of duel instruments in mass combat stand. R13-4-COMBAT_FLOOR governs her exchanges, at the density
    K4 (R71-4-FAR_FROM_FLOOR) sets. ''Never as figures'' sits with R70-88-NUMBERS_INSIDE_FIGHT (no running

- id: R71-66-FIGHT_THAT_MOSTLY_READ
  pack: Combat Law 2026-10-04
  pack_number: null
  section: FT16
  title: 'A long read and one cut: the floor paid before and after the cut'
  status: live
  kind: procedure
  summary: When a fight is a long read and one cut, the read pays the floor's first four items (measure,
    tempo, read, fault) before the cut, the body pays the last four (the hit, the injury, the Essence,
    what he cannot do) after it, and the cut itself is one line between.
  verbatim: Read before, body after. The read pays the first four items (measure, tempo, read, fault)
    before the cut; the body pays the last four (the hit, the injury, the Essence, what he cannot do)
    after it. The cut is one line between.

- id: R71-67-CLEAR_WARNING_BEFORE_LOSS
  pack: Combat Law 2026-10-04
  pack_number: null
  section: FT17
  title: 'Before a killing exchange: a plain sign and a shown exit'
  status: live
  kind: mandate
  summary: Before any exchange may kill a losing POV, at least one plain sign the fight is lost (a gap
    read, a wound, a second's shout, a readout) lands an exchange or more earlier and a way out (ground,
    a door, a yield, a price) is shown; a death means the exit was missed or refused, the notes cite both
    sign and exit, and ambushes follow R48-30.
  verbatim: 'A sign and an exit. As B, plus a way out shown before the killing exchange (ground, a door,
    a yield, a price). A death means the exit was missed or refused, and the notes cite both sign and
    exit. (Option B there reads: One plain sign first. At least one plain sign the fight is lost (a gap
    read, a wound, a second''s shout, a readout) lands an exchange or more before the killing one, and
    the notes cite it. Ambushes follow R48-30.)'

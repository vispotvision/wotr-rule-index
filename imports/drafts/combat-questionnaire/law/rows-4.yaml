    what a Draft cost when he spends it, in his own money, the sum taken from the table or the Index.
    Money before magic, in the hand); The mark checked (Every lawful vessel carries its maker''s registered
    mark, and anyone handling one looks at it the way a soldier reads a proof-dent (R11-3). The mark becomes
    standing texture and a trail); Provenance as plot (Lots can be forged, adulterated, stale or unentered,
    and a scene may turn on a bad lot; the forgery is always findable by mark, assay or the Index''s own
    failure. A fair counter and a plot engine).'

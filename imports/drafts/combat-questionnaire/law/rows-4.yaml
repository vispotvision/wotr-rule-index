  title: 'The alchemists'' voice menu: the body read first, the price and the vessel, bench words'
  status: live
  kind: definition
  summary: Put three habits on the alchemists' trade menu (reading mouths, hands, sclera and tremor before
    faces, with a 'reads first' line in the card's voice block; weighing a thing by price, vessel, seal
    and ledger; and the bench operations as all-purpose idiom, a few logged per card), and leave quiet
    at the work off it.

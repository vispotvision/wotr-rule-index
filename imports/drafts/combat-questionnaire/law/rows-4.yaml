- id: R71-82-CORRUPTION_SHOWN_BODY
  pack: Combat Law 2026-10-04
  pack_number: null
  section: AL13
  title: A corrupt Great Work shows in body, work and technique, then breaks on the page
  status: live
  kind: mandate
  summary: Show a corrupt alchemist's signs as standing tells in his body (planted before any reveal),
    in his bench work and in his technique, at most one sign a scene across the three, and write the Shear
    Break as its own event, the fall shown whole in body and work.
  verbatim: 'Yes to: Signs in the body (The Heresiology''s bodily signs become standing tells, planted
    before any reveal, so a reader can catch a corrupt master before the plot names him. One sign a scene
    at most, across A to C); Signs in the work (The bench betrays him first: vessels crack under his hands
    alone, inscriptions darken on their own, residue gathers in shapes. The workshop shows the corruption
    before the man does); Signs in technique (A corrupted practitioner''s workings run their corrupted
    versions (the Open Crucible''s model, where Honest Fire strips structure it finds inconvenient), so
    the tell lives in how he works and fights); The break as an event (When the vow finally fails, the
    Shear Break is written as its own event, the fall shown whole in the body and the work, so the slow
    signs pay off on the page).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'WOTR metaphysics on the page: corruption'
    operation: adds
  supersedes: []
  applies_to:
  - magic-mechanism

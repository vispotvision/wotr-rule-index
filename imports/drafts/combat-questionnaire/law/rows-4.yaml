  - combat
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: AL19. The explosives are the question's fulminate caps, guncotton, dynamite and phosphorus fire.
    They sit inside R53-01-IMPERIAL_AGE_SPAN and R53-03-FIREARM_CEILING, which stand; option C (rare and
    state-held, like early machine guns) was not taken. The Thundercrack equivalence is the ruling's own

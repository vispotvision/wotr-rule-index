    and R69-4-TRIA_PRIMA_FOR_THE_DEAD (Stillgate Ash, moving the body, diffusion at the end of the nine
    days); both stand.
- id: R71-87-IMPRESSION_BODY_VOICE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: AL18
  title: The impression-body, seamless to the mourner, with one seam the reader catches
  status: live
  kind: mandate
  summary: Write an impression-body exactly as the living man through the mourner's eyes, with only the
    room hinting, and let one planted habit of its maker leak through the likeness, findable by an attentive
    reader before any trained reader names it.
  verbatim: 'A seam the reader catches. As A, plus one planted habit of the maker leaks through the likeness,
    findable by an attentive reader before any trained reader names it: the maker''s Core as identity,
    made visible. (Option A there reads: Seamless to the mourner. The likeness is written exactly as the
    living man, through the mourner''s eyes; only the room (the dim lamp, the ink) hints. The horror is
    what the reader knows and she does not.)'

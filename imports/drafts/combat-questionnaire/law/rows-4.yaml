    faces, and reads a dose, a career or a lie in them. A card that takes it gains a ''reads first'' line
    in its voice block); Price, vessel, seal, ledger (On the menu: weighs a thing by its cost, its vessel,
    whose mark closes it and where it is entered, pricing before praising. Extends R61-91 from the two
    texts to any alchemist who takes it); Bench words for everything (On the menu: the operations as all-purpose
    idiom (a plan still in the Rot, a recruit fed too fast), the Fleshshaper model (R24-1) applied to
    the trade, a few logged per card). Not taken: Quiet at the work.'

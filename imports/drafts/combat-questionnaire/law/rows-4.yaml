    Alchemy''s reading of Alchemetrica''s line that the fume kills in the order men stood nearest. Strongwater
    is nitric acid, and the lungs fill after a free interval of three to thirty hours. A surgeon''s wound
    line may name it (R70-85-SCENE_MOMENTS_THAT_EARN); the rest order is a counter written as fact (R47-3-COUNTERS_AS_FACTS).
    R18-5-ALCHEMY_SOURCE_ORDER, R49-46-CHEMISTRY and R12-6-RITUAL_SPECIFICATION stand.'

    lines: null
  notes: AL3, multi-select (A, B, C taken; D not taken). The question frames this as a menu from which
    each alchemist's card takes one or two habits so no two sound alike, the menu model of R15-4-TWELVE_VOICE_DISCIPLINE_SOFTENED
    and R12-4-VOICE_DISCIPLINE, which stand. B extends R61-91-MUJIN_AND_MALPHAS_DRAFTCRAFT in its own

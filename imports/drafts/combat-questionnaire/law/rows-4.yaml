  - scene-structure
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: AL13, multi-select (A, B, C, D all taken). The bodily and workshop signs are the Heresiology's
    (metallic sweat, ash under the nails, vessels cracking under one operator, sigils darkening); technique
    runs its corrupted version on the Open Crucible's model. Puts R61-85-BROKEN_VOW_SIGNS_CORRUPTION's
    corruptions on the page (note filed there); corruptions are named, never numbered (R61-83-CORRUPTIONS_BY_NAME_NOT_NUMBER).
    Foreshadowed per R48-30-SURPRISES, which stands.

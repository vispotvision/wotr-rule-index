  notes: AL15, multi-select (A, B, C all taken). A carries R70-48-MONEY_PRICE_PROVENANCE from purchase
    to use in its own words (note filed there), the sum from R53-07-PRICE_TABLE or the Standing Index.
    B makes the registered mark standing texture on the model of R11-3-PROOF_MARKS_CANON, which stands;
    Draycott's mark (R65-3-DRAYCOTT_REGISTERED_MARK) is one such mark. C's unentered lot is the breach
    R61-111-PARACELSUS_SOLD_UNENTERED_FORMULA puts on the seller; that row stands.
- id: R71-85-DRAFT_AGAINST_WORKING
  pack: Combat Law 2026-10-04
  pack_number: null
  section: AL16
  title: A Draft meets a practitioner in two parts, its physics and its working
  status: live
  kind: definition
  summary: 'Split a thrown Draft in two: its plain physics (blast, heat, acid, smoke) meets Durability
    like any force, while its worked part answers its maker''s ceiling and fails against anyone above
    it, and both stay traceable.'
  verbatim: 'Two parts, two answers. A Draft splits: its plain physics (blast, heat, acid, smoke) meets
    Durability like any force, while its worked part answers its maker''s ceiling and fails against anyone
    above it. Both stay traceable (R13-8).'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: Drafts against ranked practitioners
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - adjudication
  - magic-mechanism
  - items
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'AL16. Fits R45-3-ENHANCEMENT_CEILING to Drafts: the maker''s ceiling binds only the worked part
    (note filed there). Durability is Part Eleven''s (body, Aether Shell, Domain). R55-7-HARMONIC_IMMUNITY_BY_STAGE
    stays with its four workings (option B, the whole Draft capped at its maker, was not taken); R61-102-BENCH_TIERS_CAP_ALCHEMISTS
    and R13-8-RECONSTRUCTIBLE_ADJUDICATION stand. A pure alchemist''s cap (C-142) stays on the docket.'
- id: R71-86-REVENANT_FIGHT
  pack: Combat Law 2026-10-04
  pack_number: null
  section: AL17
  title: A revenant is stopped by anatomy and ended only by ash, removal or the ninth day
  status: live
  kind: definition
  summary: 'Fight a revenant as a body on habit: anatomy stops the motion (a cut hamstring drops it) while
    the habit keeps trying, only ash, removal or the ninth day ends it, and the combat floor applies by
    structure with no blood-loss class.'
  verbatim: 'Levers still rule. A body on habit: anatomy stops the motion (a cut hamstring drops it) while
    the habit keeps trying; only ash, removal or the ninth day ends it. The floor applies by structure,
    with no blood-loss class.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§4 combat floor: revenants'
    operation: extends
  supersedes: []
  applies_to:

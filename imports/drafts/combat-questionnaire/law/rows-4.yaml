    lines: null
  notes: AL18. Option A (seamless to the mourner, folded in by 'As A') is quoted in the answer. The leaking
    habit makes visible the maker's Core as identity of R61-75-IMPRESSION_BODY_GREATER_SUMMONS, which
    stands. Adds a page tell beside the trained reader's tell and the Stillgate Ash counter of R61-110-IMPRESSION_BODY_TELLS_COUNTERS
    (note filed there). Foreshadowed per R48-30-SURPRISES.
- id: R71-88-EXPLOSIVES_BESIDE_INDEX
  pack: Combat Law 2026-10-04
  pack_number: null
  section: AL19
  title: Explosives are plain chemistry under powder law
  status: live
  kind: definition
  summary: The span's real explosives and incendiaries exist as plain chemistry with no Essence and no
    rank gate, licensed under ordinary powder law; the coil reads nothing in them, and a quarryman's stick
    of dynamite holds about what a Thundercrack does.
  verbatim: Plain chemistry, powder law. They exist as plain chemistry with no Essence and no rank gate,
    licensed under ordinary powder law. The coil reads nothing in them, and a quarryman's stick of dynamite
    holds about what a Thundercrack does.

- id: R71-89-ITEM_CARD_FIGHT
  pack: Combat Law 2026-10-04
  pack_number: null
  section: WT1
  title: Mid-fight appraisal names the Tier; the item card waits
  status: live
  kind: mandate
  summary: When a weapon or round is first appraised while a fight runs, a trained eye names its Tier
    inline by name alone, the full item card waits for the counter or the aftermath, and no set-off block
    sits between exchanges (verify_scene warns on one).
  verbatim: Tier named, card after. Mid-fight a trained eye names the Tier inline, by name alone (R70-82).
    The full card waits for the counter or the aftermath. No set-off block between exchanges; verify_scene
    warns on one.
  amends:
  - guide: WOTR_Item_and_Equipment_Writing_Guide.md
    locus: 'item card (R70-95): appraisal during a fight'
    operation: extends
  - guide: WOTR_Combat_Craft_Guide.md
    locus: appraisal inside a fight
    operation: adds
  - guide: Manual Verification Guide
    locus: 'verify --combat: set-off block between exchanges'
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - items
  - prose-law
  - verification
  verification:
  - --combat
  - 'verify: set-off block between exchanges'
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'WT1. Partly amends R70-95-ITEM_CARDS: an appraisal made while a fight runs no longer sets the
    card off there; it prints at the counter or in the aftermath, still once per item. Partly amends R70-48-MONEY_PRICE_PROVENANCE''s
    ''Tier and price stay off unless asked'' inside a fight: that row did not take ''Appraisal by a trained
    eye'', and this answer gives a trained eye the Tier''s name mid-fight; the rest of the card, price
    included, waits. The Tier prints by name alone under R70-82-NUMERALS_LADDER_RUNGS. The answer was
    asked of the item card; whether its ''No set-off block between exchanges'' also reaches R70-80-READOUT_SITS_PAGE''s
    breakthrough block, should a breakthrough (R70-91-BREAKTHROUGH_PAGE, ''never mid-exchange'') complete
    before a fight ends, it does not say. Flagged for the conflict log, not resolved here. Option B (a
    card at the read, counted against R70-86-MANY_READOUTS_SCENE_CARRIES'' cap) was not taken. The WARN
    is this answer''s own; the checks are built before the test fight (R71-105-PROOF_ORDER_WORK).'

  section: WT7
  title: A Well fight is written to its density rung, with the unawakened in it
  status: live
  kind: mandate
  summary: Before contact in a Well fight a gauge or a practitioner's feel names the density rung (Ambient
    Saturation through Core) and every reach is written to it, and porters, lamp-men and timber crews
    are in the fight as people who can win it, with no Shell to fire and no reserve to drain, each given
    a want and a line.
  verbatim: 'Yes to: Reach written to rung (Before contact a gauge or a practitioner''s feel names the
    density rung (Ambient Saturation through Core), and every reach in the fight is written to it. Adds
    reach beside §7''s draw-cost row); The unawakened in it (Porters, lamp-men and timber crews are in
    every Well fight as people who can win it: no Shell (the layer a working fires through) to fire, no
    reserve to drain. Each gets a want and a line). Not taken: The register stays tidy.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§7, the stat table: reach beside the draw-cost row'
    operation: adds
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: 'Well fights: the unawakened, each with a want and a line'
    operation: extends
  supersedes: []

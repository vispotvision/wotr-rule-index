    file: ''
    lines: null
  notes: 'WT2. Partly amends R50-13-ITEM_NAMES inside a fight: the names it lists side by side wait for
    a card or the aftermath, and the narration carries the POV''s one name. R70-128-PLACES_INNS_SHIPS_GEAR''s
    true name and folk name both stand; this answer only picks which one a fight''s narration uses. Keyed
    to the POV like R70-100-MARTIAL_VOCABULARY_NAMES_MOVES; where the POV''s name is a folk joke, only
    the close POV may notice it (R70-129-NOTICES_JOKE). Options B (true name, then folk) and C (plain
    kind in narration) were not taken.'
- id: R71-91-ARMOUR_SUMS_PAGE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: WT3
  title: A trained read names both Tiers; the steel shows the sum
  status: live
  kind: mandate
  summary: A trained POV names both Tiers in her read before an exchange against armour and the steel
    then shows the sum, an untrained POV falls back to option A (the steel tells it), and a reader can
    check every penetration against R46-3.
  verbatim: The read names the sum. A trained POV names both Tiers in her read before the exchange (R70-88),
    then the steel shows the sum. Untrained POVs fall back to A. The reader checks every penetration against
    R46-3.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: the read
    operation: extends
  - guide: WOTR_Item_and_Equipment_Writing_Guide.md
    locus: armour and proof
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - adjudication
  - items
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'WT3. Option A there reads: The steel tells it. No Tier words at the hit: the steel holds, breaks
    or passes, and one causal sentence states which working gave (R53-05). Tier names stay on cards and
    in the notes. Extends R70-88-NUMBERS_INSIDE_FIGHT, which it cites: a trained POV''s read before the
    exchange names both Tiers beside the Grades and gaps that row allows; its ''no running figures'' stands.
    Partly amends R70-48-MONEY_PRICE_PROVENANCE''s ''Tier and price stay off unless asked'' for a trained
    POV''s read against armour. The sum is R46-3-ARMOUR_TIER_IS_ITS_PROOF''s, as R71-92-ARMOUR_KIND_AGAINST
    (kind if plain, Tier if worked) and R71-93-PROOFED_SHOT_AGAINST_PROOFED (proofed shot counts one Tier
    higher) apply it, in aid of R13-8-RECONSTRUCTIBLE_ADJUDICATION. R53-05-PROOF_PLATE''s causal sentence
    carries the untrained fallback; R11-3-PROOF_MARKS_CANON is unchanged. Option C (the mark, read before)
    was not taken.'
- id: R71-92-ARMOUR_KIND_AGAINST
  pack: Combat Law 2026-10-04
  pack_number: null
  section: WT13
  title: Plain armour fights by its kind, worked armour by its Tier
  status: live
  kind: definition
  summary: Unworked armour meets a strike by its physics (mail turns the cut, not the thrust), and once
    armour carries a working R46-3's Tier decides and the kind is only the shape the working wears, as
    R13-C has it for shot.
  verbatim: Kind if plain, Tier if worked. Unworked armour fights by its physics (mail turns the cut,
    not the thrust); once armour carries a working, R46-3's Tier decides and the kind is only the shape
    the working wears, as R13-C has it for shot.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§4, armour: physics by kind'
    operation: extends
  - guide: WOTR_Item_and_Equipment_Writing_Guide.md
    locus: 'armour: kind against Tier (''no rule chooses'')'
    operation: replaces
  supersedes: []
  applies_to:
  - combat
  - items
  - adjudication
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'WT13. Partly amends R46-3-ARMOUR_TIER_IS_ITS_PROOF: its Tier sum governs armour that carries
    a working, and plain armour fights by the physics the Combat Craft Guide''s §4 gives its kind. Carries
    R13-C''s 2026-09-12 ruling (the working, not the steel, stops shot on a worked cuirass) from shot
    to every strike on worked armour. Settles the pair the Item and Equipment Writing Guide flags with
    ''no rule chooses''. R46-1-ITEM_TIER_LOWER_OF_TWO still rates the item (its summary already has a
    plain item, with no Tier, perform as its physics); neither its lower-of-two logic applied to strikes
    (option C) nor Tier alone (option B) was taken. R53-05-PROOF_PLATE still lets narration state a penetration''s
    cause.'
- id: R71-93-PROOFED_SHOT_AGAINST_PROOFED
  pack: Combat Law 2026-10-04
  pack_number: null
  section: WT4
  title: Proofed shot strikes one Tier higher against worked armour
  status: live
  kind: definition
  summary: Against worked armour a proofed round strikes as one Tier higher on R46-3's one ladder, so
    proofed shot breaks proofed plate, a round two over passes and the named round is simply two over,
    with R13-C's ruling kept.
  verbatim: 'Out-coupling counts one Tier. Against worked armour a proofed round strikes as one Tier higher:
    proofed shot breaks proofed plate, a round two over passes, and the named round is simply two over.
    One ladder, R13-C kept.'
  amends:
  - guide: WOTR_Item_and_Equipment_Writing_Guide.md
    locus: 'ammunition tiers: proofed shot and the named round'
    operation: extends
  - guide: WOTR_Combat_Craft_Guide.md
    locus: §4, shot against armour
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - items
  - adjudication
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'WT4. Rules CONFLICTS C-001 (the RULINGS entry''s preamble: ''WT4 rules CONFLICTS C-001''). Supersedes
    no row: the verbatim carries no words of replacement, and it keeps what R11-3-AMMO_TIERS says (Pack
    Eleven: proofed shot ''Defeats proofed plate''), now worked as one Tier higher on R46-3-ARMOUR_TIER_IS_ITS_PROOF''s
    ladder; the question''s ''This reopens R11-3-AMMO_TIERS'' was answered for that row''s claim, not
    against it. Notes go on R11-3-AMMO_TIERS (the named round is simply two over), R46-3-ARMOUR_TIER_IS_ITS_PROOF
    (a proofed round counts one Tier higher against worked armour) and R13-C (''R13-C kept'': the out-coupling
    its ruling note names is that one Tier). R20C-22-AMMUNITION_TIERS_RATIFIED''s ratification is unchanged,
    and R20C-26-STEEL_STOPS_THE_SHOT was already superseded by R13-C. R53-07-PRICE_TABLE is not amended
    (option A, which amended the price table''s note, was not taken). The explanation ban C-001 first
    concerned, R11-3-FIREARM_PROSE_LAW, was superseded by R53-05-PROOF_PLATE; R71-102-WHERE_COMBAT_LAW_LANDS
    has NATALIE.md''s stale combat lines rewritten, the C-001 line among them.'

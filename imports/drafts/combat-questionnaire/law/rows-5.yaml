- id: R71-101-LAW_TURNS
  pack: Combat Law 2026-10-04
  pack_number: null
  section: WT12
  title: 'After a killing: proof, a court fight and a declaration by dawn'
  status: live
  kind: mandate
  summary: When a fight ends in a death, law moves only on a witness or a reading inside the residue clocks
    (an unread killing sits on the Ledger as a risk), every practitioner's killing opens a jurisdiction
    contest between crown, company and guild as a Front, and a killer who does not declare before witnesses
    by the next dawn is a murderer in every culture that keeps witnesses, the declaration being its own
    short scene.
  verbatim: 'Yes to: Proof decides (Law moves only on a witness or a reading inside the residue clocks
    (R61-7); R60-11''s trace proof reaches blade killings too. An unread killing sits on the Ledger as
    a risk); Courts fight over it (Every practitioner''s killing opens a jurisdiction contest between
    crown, company and guild (R60-19) as a Front, and the killer''s fate turns on which layer wins it);
    Declare it, or murder (A killer who does not declare before witnesses by the next dawn is a murderer
    in every culture that keeps witnesses, Kharven and Korvaeth first. The declaration is its own short
    scene). Not taken: Standing buys terms.'
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: Law and punishment (R70-45)
    operation: extends
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rules 4 and 7: Fronts, the ledger'
    operation: extends

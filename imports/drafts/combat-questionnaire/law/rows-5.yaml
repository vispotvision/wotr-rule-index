  - combat
  - magic-mechanism
  - adjudication
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'WT7. §7 is the Combat Craft Guide''s table of which stat decides which question; its draw row
    (''What the draw costs in this room'') is decided by Harmonics against local Aetheric Density. The
    rungs are R11-4-MAGNITUDE_AXIS''s attested ones (Ambient Saturation, Active Concentration, Veil-Thin,
    Core), and that row''s ''Never invent one'' governs any rung between. The answer glosses Shell as
    the layer a working fires through. Not taken: option C, the register stays tidy (the fight ending
    at the clearance register, with who was paid quietly). Extends R14-3-STATS_DECIDE_TABLE, whose table
    the guide''s §7 carries (R14-8-COMBAT_GUIDE_ADJUDICATION): reach joins the draw-cost row. Read with
    R11-4-DESCENT_PROSE_LAW and R53-06-WELL_SPAWN, neither changed.'
- id: R71-97-CONTRACT_FIGHTS
  pack: Combat Law 2026-10-04
  pack_number: null
  section: WT8
  title: 'A contract fight: the posting, a binding clause, the counter'
  status: live
  kind: mandate
  summary: A Guild or Crown contract fight sets its posting on the page at the hook in the Guild's house
    style (terms, pay, register, penalty), carries at least one clause limiting how it may be won with
    a penalty, and closes at the clerk's counter with the proof asked, the clerk's dispute and the pay
    from the price table, a failed proof becoming a Ledger debt.
  verbatim: 'Yes to: The posting as document (The posting is set on the page at the hook in the Guild''s
    house style (terms, pay, register, penalty), a document voice that plants the rules before the fight
    (R70-71)); A clause binds the fight (Every contract carries at least one clause limiting how it may
    be won (alive, intact, unwitnessed, before the thaw), with a penalty. The cheapest counter often breaks
    the clause); Proof at the counter (The job closes at the clerk''s counter: the proof the contract
    asks for, the clerk''s dispute, the pay named from the price table. A failed proof is a Ledger debt).'
  amends:
  - guide: The Guild Accord
    locus: 'contracts: the posting, the clause and the counter'
    operation: extends
  - guide: NATALIE.md and the wotr-write skill
    locus: 'The Running Pieces: Scene Menu'
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - documents
  - worldbuilding
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'WT8. Extends R70-97-QUESTS_CONTRACTS: its posted terms gain a binding clause and a close at
    the counter. The posting is a document voice (R12-4-VOICE_FOUR_DOCUMENT) planting the rules before
    the fight, as R70-71-EXPLAINING_WORKING_MID_FIGHT asks; the answer''s own examples of a clause are
    alive, intact, unwitnessed and before the thaw, and the cheapest counter often breaks it. Pay is named
    from the approved table (R70-48-MONEY_PRICE_PROVENANCE, R53-07-PRICE_TABLE). A Well posting in the
    Guild''s style reads with R20C-21-WELL_NAMES_CLASS_MARKED''s Guild register. No older rule is superseded.'

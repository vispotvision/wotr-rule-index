  summary: Every card and roster row for anyone who may share a bed carries three fields (what they want
    in bed, what they will not do, and what would change their mind either way), so Rule 9's change of
    mind has a planted cause a player can find.
  verbatim: 'Desire, refusal, and the hinge. As B, plus a third field: what would change their mind, either
    way. Rule 9''s change of mind then has a planted cause a player can find.'
  amends:
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: Desire, refusal and hinge fields (anyone who may share a bed)
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 9: explicit scenes (the NPC''s desire and refusal line, the change of mind)'
    operation: extends
  supersedes: []
  applies_to:
  - character-sheet
  - dialogue
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K4, option C as recommended, which takes option B''s two fields and adds the hinge. B reads:
    every card and roster row for anyone who may share a bed gains two fields, what they want in bed and
    what they will not do. Option A (the existing refusal line covers it, no new field) was not taken,
    so the bed fields sit beside the roster''s existing refusal line. The hinge serves Table Rule 9''s
    ''can change their mind'' (the wotr-rp skill: ''either way''). R52-02-VOICE_LEVER (notice, want, refuse)
    stands. R48-30-SURPRISES (big surprises only after foreshadowing a player could have caught) is not
    changed; the planted hinge is the kind of foreshadowing it asks for. How consent shows in the scene

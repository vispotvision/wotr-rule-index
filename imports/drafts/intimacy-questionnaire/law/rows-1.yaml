- id: R73-5-WHAT_LEDGER_KEEPS
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: K5
  title: What an intimate scene puts on the Ledger
  status: live
  kind: procedure
  summary: After an intimate scene the Ledger enters whatever was promised, owed, bargained or betrayed
    in bed (to come due like any debt), who heard, saw or will talk (as who-saw-what, able to open a Front),
    marks on the body (carried on real healing times and visible to whoever looks), and what was learned
    (knowledge the other now holds and may use).
  verbatim: 'Yes to: Debts and promises (Whatever was promised, owed, bargained or betrayed in bed is
    entered and comes due like any other debt); Witnesses and reputation (Who heard, who saw, who will
    talk: gossip, scandal and a rival''s leverage, entered as who-saw-what, and able to open a Front);
    Marks on the body (Bites, bruises, beard-burn, a strained hip, another''s scent on the skin: entered
    and carried on real healing times (R60-02), visible to whoever looks); What was learned (A secret
    told, a scar seen, a weakness found in bed is entered as knowledge the other now holds, and may use).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 7: the ledger (after an intimate scene)'
    operation: extends
  supersedes: []
  applies_to:
  - session-protocol
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: K5, all four options taken; the recommendation was A, B and D, and Isaac added C (marks on the
    body). Table Rule 7's Ledger (injuries, exhaustion, reserve, debts, reputation, who saw what; NATALIE.md
    text, no indexed row) gains these four after an intimate scene, and Table Rule 9's consequence afterward
    is entered here. Marks run on R60-02-REAL_HEALING_TIMES, which stands. Conception and the pox are
    R73-33-CONCEPTION_AND_POX (CO11); a non-con scene's bill to the world is R73-17-CARRYING_FORWARD;
    a worked read taken unasked is entered once found (R73-13-READING_LOVER).
- id: R73-6-BED_WORDS_BY_CULTURE
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: SC1
  title: One crude English in narration; each culture's body words in mouths
  status: live
  kind: mandate
  summary: In every POV, narration keeps one crude English for the words for the body, and each culture's
    own words for the body arrive in speech and italic thought, the way its swears do.
  verbatim: Crude English, native in mouths. Narration keeps one crude English; each culture's own words
    for the body arrive in speech and italic thought, as its swears do.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 9: explicit scenes (plain anatomical vocabulary)'
    operation: extends
  - guide: Dialogue Craft Standards
    locus: Intimacy (a culture's words for the body in a mouth)
    operation: adds
  supersedes: []
  applies_to:
  - prose-law
  - register
  - dialogue
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'SC1, option C; Isaac''s pick differs from the recommendation (B, a bed-words bank in each Inventory''s
    Words entry, used in narration too). Option A (one crude English everywhere, the culture''s dial bending
    only syntax and image) was not taken, so a culture''s own body words do reach the page, in speech
    and italic thought. Read with R49-51-EXPLICIT, which it does not change: its working-man anatomical
    words are the one crude English, in every POV''s narration. Partly amends R70-27-ANTIQUE_NARRATION_RUNS:
    in explicit narration the words for the body are that one crude English whatever the POV culture''s
    dial. R70-134-KEYED_CULTURE_FREE stands (the explicit techniques stay keyed to the POV''s culture,
    and the lover''s culture shows in what they say). R70-34-REAL_LANGUAGE_SWEARS_NARRATION stands for
    swears; it does not carry a culture''s body words into narration. R70-33-WORD_BANK_PER_CULTURE, R51-02-CLOSE_POV_SWEARS,
    R51-29-SWEARING and R48-12-PROFANITY are not changed. Italic thought takes the words the POV would
    say (R70-37-MODERN_IDIOM_THOUGHT).'

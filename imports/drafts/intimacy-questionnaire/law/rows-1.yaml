  - scene-structure
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: K3, option B as recommended. Options A (slow burn by default, sex never opening a relationship)
    and C (a carded character's first time waits on a bond, minor NPCs act at once) were not taken, so
    a carded character runs on no clock either. Table Rule 3 (NPCs want things and pursue them; if an

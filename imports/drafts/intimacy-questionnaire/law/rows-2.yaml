    ink with what stays in her name written in, so that courtship is the negotiation and love shows in
    the clauses, and a broken engagement may be sued at the Assize, where the letters are read aloud in
    open court and the Bench prices the jilt.
  verbatim: 'Yes to: Terms under seal (A match is a settlement drawn by an advocate, pledged ''Ita spondeo''
    and entered in ink, with what stays in her name written in. Courtship is the negotiation, and love
    shows in the clauses); Breach of promise sued (A broken engagement is actionable at the Assize: the
    letters are read aloud in open court and the Bench prices the jilt. Every love letter in the Accord
    is also evidence).'

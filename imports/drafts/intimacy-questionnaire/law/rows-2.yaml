- id: R73-28-DAWI_COURTSHIP
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: CO7
  title: 'Dawi marriage: entered in the Tally, courted by Kurlo'
  status: live
  kind: definition
  summary: A Dawi match is made backward, with no betrothal, by entering in the Tally in metre the acts
    the pair have already done for each other, the entry being the marriage, and courtship is 'Kurlo'
    said alone between two people with the 'Ei kurme' that would end a bargain left off, a thing unbegun
    and not refused.
  verbatim: 'Yes to: Entered, never promised (A Dawi match is made backward: the acts already done for
    each other are entered in the Tally in metre, and the entry is the marriage. There is no betrothal);
    Kurlo, the refusal unsaid (Courtship is ''Kurlo'' said alone between two people, with the ''Ei kurme''
    that would end a bargain left off: a thing unbegun and not refused, the nearest the tongue comes to
    hope).'
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: 'Dawi: Courtship and Marriage'
    operation: adds
  supersedes: []
  applies_to:

    file: ''
    lines: null
  notes: 'CO7, A and C taken, as recommended; B (the Cask-Oath sworn over a cask laid down together, a
    broken marriage put on the Oath-Breakers'' wall) was not taken. Both answers fall out of the Dawi
    tongue''s lack of a future tense: a Dawi cannot say ''I will'', so he swears (''Kurme'') or calls
    a thing ''Kurlo'', unbegun, and ''Kurlo. Ei kurme.'' ends a bargain; nothing exists until entered
    in the Tally. C is ''the nearest the tongue comes to hope''. Entered in the Dawi Inventory''s Courtship
    and Marriage field (R73-22-WHERE_COURTSHIP_CUSTOM_LIVES). The Tally''s one marriage entry is R73-29-CONSORTS_CONCUBINES_WIDOWS.

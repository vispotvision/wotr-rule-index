- id: R73-29-CONSORTS_CONCUBINES_WIDOWS
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: CO8
  title: 'Beyond one spouse: lower entries, kept partners, the brother''s widow, the Tally''s one entry'
  status: live
  kind: definition
  summary: The lineage halls and the Moto enter a secondary wife or consort below the wife with her children's
    standing written there, the Accord allows one spouse and keeps a kept woman or man on an allowance
    quoted from the price table with children sine sigillo, a Kharven widow and her stack may pass to
    her dead man's brother if she takes the skin from him (refusing being her right and her hunger), and
    the Dawi Tally holds one marriage entry, a second partner being 'kurnur', unentered.
  verbatim: 'Yes to: Entered lower, in book (The lineage halls and the Moto enter a secondary wife or
    consort below the wife in the book or register; her children''s standing is written there, and an
    unentered child is ''written in the wrong hand''); Accord: off the books (One spouse in Accord law.
    A kept woman or kept man lives on an allowance quoted from the price table, a scandal with a sum on
    it, and their children are sine sigillo); Kharven: the brother''s widow (A Kharven widow and her stack
    may pass to her dead man''s brother, wife or no wife, if she takes the skin from him, so no hearth
    goes cold; refusing is her right, and her hunger); Dawi: one entry only (The Tally holds one marriage
    entry. A second partner is an act nobody will stand behind, ''kurnur'', unentered, and carries that
    swear in the hold).'
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: 'Courtship and Marriage; law and punishment; succession: consorts, kept partners, widows'
    operation: adds
  supersedes: []
  applies_to:
  - standing-inventory
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CO8, all four options taken as a digest (the recommendation accepted). Each answer fills the
    law and succession fields of R70-45-NEW_STANDING_INVENTORY_FIELDS for its culture; R53-11-JUSTICE
    and R60-21-SUCCESSION_BY_CULTURE stand. The bastardy words are canon: the Moto ''Written in the wrong
    hand'' and the Accord''s ''Sine sigillo'' (without seal). The allowance is quoted from the approved
    price table (R53-07-PRICE_TABLE, R70-48-MONEY_PRICE_PROVENANCE): ''a scandal with a sum on it''. The
    Kharven widow passes ''wife or no wife'', so no hearth goes cold. ''Kurnur'' is an act nobody will
    stand behind, and the second partner carries that swear in the hold. The Eressean court''s consort
    (Sandalphon) is canon this answer does not reach.'

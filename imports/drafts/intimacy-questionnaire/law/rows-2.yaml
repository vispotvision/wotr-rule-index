    the gift or price, the vow, who may refuse, how a match ends, widowhood), entered on Isaac's word,
    and, beside R70-45's law field, a Mores field holding what the culture holds shameful and boasts of,
    nakedness and bathing, its pleasure trade, and what its law does to adultery and to rape.
  verbatim: 'Courtship field, plus mores. A, plus a Mores field: what the culture holds shameful and what

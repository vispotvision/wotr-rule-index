    under which a read by a Moto''s eyes is a worked read that needs leave: here the suitor offers it.
    Entered in the Moto Inventory''s Courtship and Marriage field (R73-22-WHERE_COURTSHIP_CUSTOM_LIVES).
    The register''s lower entries are R73-29-CONSORTS_CONCUBINES_WIDOWS. R70-118-HONORIFICS_NARRATION
    and R23-2-JAPONIC_STRATUM stand.'
- id: R73-25-ACCORD_COURTSHIP
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: CO4
  title: 'Accord courtship: a settlement under seal, and the jilt priced at the Assize'

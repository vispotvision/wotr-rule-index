    lines: null
  notes: 'CO4, A and C taken, as recommended; B (calls, cards and a chaperone) was not taken. The question''s
    context names the real analogues (R53-11-JUSTICE): Victorian England''s marriage settlement and its
    breach-of-promise suit. The Accord is R59-07-VICTORIAN_EDWARDIAN_CITY; ''Ita spondeo'' (thus I pledge)

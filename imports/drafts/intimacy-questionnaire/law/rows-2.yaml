    lines: null
  notes: 'CO1, taken as a digest (the recommendation accepted). Option A there reads: One courtship field.
    Every Inventory gains a Courtship and Marriage field: the approach, the go-between, the gift or price,
    the vow, who may refuse, how a match ends, and widowhood. Entered on your word, culture by culture.
    Option C (custom inside the owed fields, no new field) was not taken. Extends R70-45-NEW_STANDING_INVENTORY_FIELDS:
    two fields join its list, the Mores field written beside its law and punishment field; its own fields
    stand, as do R53-11-JUSTICE and R60-21-SUCCESSION_BY_CULTURE. The pleasure trade is R73-30-PLEASURE_TRADE
    (CO18). The culture entries are R73-23-KHARVEN_COURTSHIP to R73-29-CONSORTS_CONCUBINES_WIDOWS (CO2
    to CO8); R73-40-WHERE_INTIMACY_LAW_LANDS drafts both fields for six cultures and enters them on Isaac''s
    word. The fields feed R70-134-KEYED_CULTURE_FREE, under which the lover''s culture shows in what they
    do and say.'
- id: R73-23-KHARVEN_COURTSHIP
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: CO2
  title: 'Kharven courtship: the stack, the skin, and the ride on the nameless day'
  status: live
  kind: definition
  summary: A Kharven suitor proves himself by splitting unasked for her household's woodpile and asks
    when the stack is full and her kin say so, her household answers at the hearth when she drinks from
    the sealskin and passes it across the fire for him to drink after her before everyone (a withheld
    skin being the no), and on the nameless day a man may ride off with a woman, her kin naming a price
    on the first named morning and whether she went willing being hers to tell.
  verbatim: 'Yes to: The stack proves him (A suitor splits for her household''s woodpile unasked, labour-debt
    run in reverse; the asking comes when the stack is full and her kin say so. Entered in the Kharven
    field); The skin answers (Her household answers at the hearth: she drinks from the sealskin and passes
    it across the fire, and he drinks after her before everyone. A withheld skin is the no, said without
    a word); Ridden off, priced after (On the nameless day a man may ride off with a woman, and her kin
    name a price on the first named morning. Whether she went willing is hers to tell; the custom never
    asks).'
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: 'Kharven: Courtship and Marriage'
    operation: adds
  supersedes: []
  applies_to:
  - standing-inventory
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: CO2, all three options taken, as recommended. Entered in the Kharven Inventory's Courtship and
    Marriage field (R73-22-WHERE_COURTSHIP_CUSTOM_LIVES); the Kharven Inventory is the one NATALIE.md
    carries inline. A runs canon's labour-debt (R53-11-JUSTICE) in reverse; B uses the skin, whose refusal
    already insults a host; C is built on canon's nameless day, when 'nothing binds' (a Kharven folk belief,
    R53-15-FOLK_BELIEFS). The price her kin name is a sum or a payment in kind named exactly (R70-48-MONEY_PRICE_PROVENANCE).
    'The custom never asks' whether she went willing; on the page, R73-12-CONSENT_ON_PAGE (SC7) still
    reads consent in words and body. R70-134-KEYED_CULTURE_FREE stands.
- id: R73-24-MOTO_COURTSHIP
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: CO3
  title: 'Moto courtship: asked in form and entered, or the eyes offered'
  status: live
  kind: definition
  summary: A Moto match is asked in form at the hinge of the day and is real only when the register holds
    it in the house's own hand (an unentered lover being nobody to the house), and a suitor from outside
    the line courts by lifting his eyes to a Moto and leaving them there to be read, whether she reads
    him, and how far, being her answer.
  verbatim: 'Yes to: Asked in form, entered (A match is asked in form at the hinge of the day and is real
    only when the register holds it in the house''s own hand; an unentered lover is nobody to the house);
    The eyes offered (A suitor outside the line courts by lifting his eyes to a Moto and leaving them
    there, offering himself to be read; whether she reads him, and how far, is her answer).'
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: 'Moto: Courtship and Marriage'
    operation: adds
  supersedes: []
  applies_to:

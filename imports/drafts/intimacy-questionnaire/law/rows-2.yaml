  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CO3, A and C taken, as recommended; B (three-line letters graded by the speed of the answer,
    as at the Heian court) was not taken, so the poem after the night stays R70-133-EASTERN_TECHNIQUES_BESIDE_CLINICAL''s
    and court verse R70-110-VERSE_EXCHANGED_TALK''s. Canon ground: a thing that matters is ''asked in
    form, in the old register'' and ''entered'' in the family''s own hand, and Muken signed the approval
    for a match. C rests on the Kharven folk belief ''Never meet a Moto''s eye'' (the Moto read through

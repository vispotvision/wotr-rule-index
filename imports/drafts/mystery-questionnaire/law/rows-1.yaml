  title: A case solves at a hearing, by a procedure, or in a document
  status: live
  kind: definition
  summary: 'A case''s solution scene may take three forms: a hearing (court, inquest or Register) turned
    where a statement meets the exhibit that breaks it, each culture keeping its own justice; a procedure,
    a test or instrument proving it on the page as action with the result as the verdict; or a document,
    a filing, docket or set-off notice whose last line is the verdict.'
  verbatim: 'Yes to: The hearing (A court, inquest or Register hearing, turned where a statement meets
    the exhibit that breaks it; each culture keeps its own justice (R53-11)); The procedure (A test or
    instrument proves it on the page as action (R71-81), and the result is the verdict); The document
    (The case closes as a filing, a docket or a set-off notice (R70-67, R70-17), its last line the verdict).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Mysteries: the solution scene'

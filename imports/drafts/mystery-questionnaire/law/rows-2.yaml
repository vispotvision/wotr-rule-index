    file: ''
    lines: null
  notes: 'IN8 (digest). Option A there reads: A habit carries over. The two faces share one tell (a hand,
    a habit, a smell, a turn of phrase), shown in each face before the unmasking, on R71-23''s twice-shown
    rhythm. Option B there reads: The paper links them. The link lives in the record (a hand, a seal,

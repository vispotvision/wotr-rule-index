- id: R74-38-LEVERAGE_BLACKMAIL
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: IN4
  title: A held secret bends while unspoken and marks its holder
  status: live
  kind: mandate
  summary: 'A secret works as leverage while it stays unspoken and breaks when spoken openly, opening
    the victim''s Front against whoever spoke it, and every held secret is also a Ledger risk against
    its holder: someone wants the secret, or the man who holds it, gone.'
  verbatim: 'Held, it marks the holder. As B, and every held secret is also a Ledger risk against its
    holder, on the same line as K4''s B: someone wants the secret, or the man who holds it, gone.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rules 4 and 7: Fronts, the ledger (leverage)'
    operation: extends
  supersedes: []
  applies_to:
  - session-protocol
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'IN4 (digest). Option B there reads: Held, it bends. A secret works while it stays unspoken;
    spoken openly it breaks, and the victim''s Front opens against whoever spoke it. K4''s B, carried
    inside R74-4-WHAT_KNOWING_COSTS ("B, plus"), reads: Being known to know. The danger is who notices:
    the Gate punishes unlicensed knowledge, The Mother reads the Watch''s inserts, a witness becomes a
    target. Every secret learned opens a Ledger line on who knows he knows. The holder''s risk is a line
    of that kind. R70-112-FACE_FACE_SLAP and R71-101-LAW_TURNS (an unread killing sits on the Ledger as
    a risk) stand; R48-36-NPC_WITS stands. Option A (spent when used) was not taken.'
- id: R74-39-SPIES_INFORMATION_TRADE
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: IN5
  title: 'The information trade: the press both ways, letters as exhibits, tradecraft words per service'
  status: live
  kind: mandate
  summary: 'The table runs the information trade three ways: inserts, bulletins and the penny press carry
    public intelligence both ways; intercepted letters, wires and dockets appear in full as documents
    with seal, hand and paper described as clues; and each service gets working words for agents, drops
    and watchers in its Inventory''s Words entry.'
  verbatim: 'Yes to: The press as intelligence (Inserts, bulletins and the penny press carry public intelligence
    both ways: whoever reads them learns something, and is learned about by whoever filed them); Letters
    as exhibits (Intercepted letters, wires and dockets appear in full as documents Isaac can read (R70-67),
    with seal, hand and paper described as clues); Tradecraft per service (Each service (the Watch, the
    Mother''s cultures, the Moto court, the Mahuo houses) gets working words for agents, drops and watchers
    in its Inventory''s Words entry (R70-33)).'
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: 'Words entry (R70-33): tradecraft per service'
    operation: extends
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Vocabulary and diction: in-world documents (letters as exhibits)'
    operation: extends
  supersedes: []
  applies_to:
  - worldbuilding
  - documents
  - standing-inventory
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'IN5, three of four options (B, C, D; digest). Option A (an informant per thread) was not taken.
    The press both ways builds on the Night Watch''s bulletin office (R60-26-NIGHT_WATCH_SOCIETY), which
    stands. Letters as exhibits use the documents of R70-67-FORMS_WORLD_DOCUMENTS, which stands. Partly
    amends R70-33-WORD_BANK_PER_CULTURE: a service''s Inventory''s Words entry gains its tradecraft words;
    note filed there. Logged as ambiguous, not resolved here: the Watch, the Mother''s cultures and the
    Mahuo houses have no Standing Inventory file of their own in desktop/inventories/, so which Inventory
    carries their words is left to the guide edition. Words are coined and logged under R48-26-INVENTION. Read with R72-15-CARRIES_RUMOR_MILL''s
    print and notice (table law 2026-10-04), the same press seen as news.'

- id: R74-26-DREAD_PACING
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: HO1
  title: A horror scene builds long and spends one hard shock
  status: live
  kind: budget
  summary: A horror scene keeps a long build and spends at most one hard shock, a single sudden sight
    set as a cluster of one-line paragraphs, after which the scene moves on.
  verbatim: Long build, one hard shock. The build stays long; the swift beat is one sudden sight set as
    a cluster of one-line paragraphs (R70-20), then the scene moves. One shock per horror scene at most.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Openings, endings, shape: horror pacing'
    operation: adds
  - guide: WOTR_Scene_Writing_Process_Guide.md
    locus: 'Sec. 2 (scene shape): horror'
    operation: adds
  supersedes: []
  applies_to:
  - prose-law
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'HO1. The shock uses R70-20-PARAGRAPH_SHAPE''s cluster of one-line paragraphs, which adds a horror
    scene''s one shock to the peaks that row names (reveals, verdicts, notices, a fight''s last beats);
    note filed there. R70-15-TEMPO_STILLNESS (jo-ha-kyu) stands and is read with it. "Then the scene moves":
    the shock need not close the scene, and R70-17-CLOSING_MODES stands. R11-4-DESCENT_PROSE_LAW (a descent''s
    sensory opening) stands. Options not taken: A (long build, small turn), C (shock first, dread after).'
- id: R74-27-THING_SEEN
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: HO2
  title: A horror is half-seen first and gets its full inventory when understood
  status: live
  kind: mandate
  summary: A horror first reaches the page as effects and outline, through the room and then the bodies,
    and its full inventory waits until the thing is understood, appraised or fought.
  verbatim: 'Half-seen, then full. R9-3 extends to horrors: effects and outline first, through the room
    and the bodies (R70-69''s order); the full inventory lands when the thing is understood, appraised
    or fought.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table Rule 11 (first introductions): horrors'
    operation: extends
  - guide: WOTR_Visual_Aesthetic_Guide.md
    locus: 'Section 3 (the silhouette tool): horrors'
    operation: extends
  supersedes: []
  applies_to:
  - prose-law
  - scene-structure
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'HO2. "R9-3 extends to horrors": R9-3-SILHOUETTE_ENTRANCE (shape before detail, licensed for
    a practitioner''s arrival) reaches horrors too; note filed there. Partly amends R70-54-GETS_FULL_INVENTORY,
    which gives creatures the full inventory, and R70-55-ORDER_FIRST_INVENTORY''s one passage at first
    sight: for a horror the inventory lands when the thing is understood, appraised or fought; notes filed
    on both, and on R49-28-INTROS, whose "all at first sight" R70-54 carried to creatures. The order of what shows first is R70-69-PRESSURE_AURA''s (the room, then the bodies), which
    stands. An appraisal is one of the moments the inventory may land; R71-57-APPRAISING_BEAST stands.
    Options not taken: A (full sight at once), C (never wholly seen).'
- id: R74-28-FEAR_IN_PC
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: HO3
  title: At a horror, caused signs on Isaac's PC are world facts and his read is his
  status: live
  kind: mandate
  summary: Where a field, Pressure, a working, the cold or a sudden shock acts on Isaac's PC, its signs
    in his body are written as world facts, and what he feels about them and does stays his.
  verbatim: Caused signs, his read. Where a field, Pressure, a working, the cold or a sudden shock acts
    on his body (the Pike's weight, the Lamp-drinker's chill, a startle), its signs are world facts; what
    he feels about them and does stays his.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'POV and interiority: Isaac''s PC at a horror'
    operation: adds
  supersedes: []
  applies_to:
  - pov
  - prose-law
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: HO3. Carries R71-6-PLAYER_FIGHTER_PAGE's world facts ("how he bears it stays yours") from a fight's
    wounds to the signs a cause leaves in his body at a horror, an extension that leaves R71-6 standing
    (note filed there, as R72-6 did); partly amends R49-01-WHOSE_HEAD at a horror, since what he feels
    stays his (note filed there). The answer's examples are the Pike's weight, the Lamp-drinker's chill and a startle.
    Option C (fear's own signs, such as cold sweat or hair rising, written into his body as a world fact)
    was not taken, nor option A (the room, never him). R71-17-FEAR_BODY (fear in a fight) and R71-41-PRESSURE_UNWOKEN
    (Pressure on the unwoken by Grade) stand. Read with R72-6-WORLD_WRITES_HIM (table law 2026-10-04),
    whose reflexes as world facts cover the same ground outside horror. What a horror leaves afterward
    is R74-29-WHAT_HORROR_LEAVES.
- id: R74-29-WHAT_HORROR_LEAVES
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: HO4
  title: A seen horror leaves a Ledger mark, and a mark struck again compounds
  status: live
  kind: mandate
  summary: A seen horror may leave one Ledger mark with a due condition that fades on its clock, and a
    mark struck again before it fades deepens to a standing condition with a named counter (rest, a person,
    a rite), fraying by stages with no meter and no number.
  verbatim: 'Marks that compound. B, and a mark struck again before it fades deepens to a standing condition
    with a named counter (rest, a person, a rite): fraying by stages, still no meter and no number.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table Rule 7 (the ledger): what a horror leaves'
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  - adjudication
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'HO4 (depends on HO3). Option B there reads: Sight leaves a mark. A seen horror may leave one
    Ledger mark with a due condition (a flinch, a refusal, lost sleep) that fades on its clock. No meter,
    no number; on Isaac''s PC only as HO3 allows. So on his PC a mark shows only as R74-28-FEAR_IN_PC
    allows. New ground: canon had priced contact, never sight (option A, not taken). "No number" holds
    under R12-5-NEVER_INVENT_NUMBER. R71-17-FEAR_BODY, R71-6-PLAYER_FIGHTER_PAGE and R57-10-NEVER_RIGGED
    stand.'
- id: R74-30-DEAD_FOLK_BELIEF
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: HO5
  title: Events may show a folk belief about the dead half true, by canon mechanism
  status: live
  kind: mandate
  summary: When a folk belief about the dead meets the dead, events may show where it holds and where
    it fails, each traced in the notes to canon mechanism, while the people keep their reading and the
    narration corrects nothing.
  verbatim: Half true, by mechanism. Events show where a belief holds and where it fails, both traced
    in the notes to canon mechanism; the people keep their reading, and the narration still corrects nothing.
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: 'World texture: folk beliefs'
    operation: extends
  supersedes: []
  applies_to:
  - worldbuilding
  - standing-inventory
  - magic-mechanism
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'HO5. Extends R53-15-FOLK_BELIEFS, which stands: events, never the narration, may now show where
    a belief holds and where it fails, a question that row left open; "the narration still corrects nothing"
    keeps its ban; note filed there. The mechanism is canon''s, such as R61-77-REVENANT_IS_STALLED_CROSSING (a revenant is a Crossing
    that stalls on sealed ground or saturated battlefields), which stands; the question''s example is
    the Kharven belief that the cold keeps the dead quiet. R70-44-CULTURE_KEYED_NOTICING (the viewer''s
    culture judges, misreadings included) and R70-67-FORMS_WORLD_DOCUMENTS''s records of the strange stand.
    Options not taken: A (never settled), C (the world may break it).'
- id: R74-31-VEIL_AND_PC_GRIEF
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: HO6
  title: At a Veil-thin place his own grief may take shape, from canon only
  status: live
  kind: mandate
  summary: At a Veil-thin place, grief or rage that Isaac's PC carried in may condense too, shaped only
    from what his archived scenes and card already show, with no mind to voice, and his response stays
    his.
  verbatim: His, from canon only. What he carried may condense too, shaped only from grief or rage his
    archived scenes and card already show; the beast has no mind to voice, and his response stays his.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'WOTR metaphysics on the page: the Veil and Isaac''s PC'
    operation: adds
  supersedes: []
  applies_to:
  - magic-mechanism
  - pov
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'HO6. The beast is canon''s Echo Beast ("Unprocessed grief, rage and trauma given temporary autonomous
    form", On Walking Into the Current; "keeping the character of what formed it and none of its mind",
    The Veil); canon did not say whose grief, and this answers it for his PC. Drawn only from what his
    archived scenes and card already show, so nothing new is written into his inside: R71-6-PLAYER_FIGHTER_PAGE
    and R49-01-WHOSE_HEAD stand, and R57-10-NEVER_RIGGED holds both ways. The Veil is R12-2-MYSTIC_REGISTER_DEF''s
    ground, which stands. Options not taken: A (others'' grief only), C (his, only if Isaac names it on
    entering).'

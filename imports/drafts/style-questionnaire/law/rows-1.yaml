  title: Cadence set by the POV's culture
  status: live
  kind: mandate
  summary: Let the POV's culture set the narration cadence, stated in each narration register, so a Hallenfeld
    man keeps his own rhythm in a Moto house and the gap between the two is texture.
  verbatim: POV's culture sets it. The POV's culture sets cadence, and each narration register states
    it. A Hallenfeld man stays Hallenfeld in a Moto house, and the gap between his rhythm and the house's
    is the texture.

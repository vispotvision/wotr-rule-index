  status: live
  kind: mandate
  summary: Beside the senses and motion, a scene may open far to near (a long view closing plane by plane
    on the person), on one culture's season word that fixes time and mood, or on a register entry, readout
    or document that the scene then tests.
  verbatim: 'Yes to: Far to near (Arrivals may open on a long view that moves in, plane by plane, to the
    person, as Chinese landscape painting does. Feeds the archive''s thin landscape); Season word (An
    opening may fix time and mood with one culture''s season word (Ward-Lighting, the Thin Weeks, Ice-out)
    instead of a mood statement; each Inventory''s Time field becomes a season list); A reading or document
    (A scene may open on a register entry, readout or document that the scene then tests (R12-4''s threshold
    voice), as Lord of the Mysteries and LitRPG chapters do). Not taken: Image linked by mood.'

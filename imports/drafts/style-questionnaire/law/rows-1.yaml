    document in its institution's house style that the chapter then tests, or by a short verse in a culture's
    own form, which verify reads as verse outside the rhythm statistics.
  verbatim: 'Yes to: Couplet title (A book chapter may be headed by a matched couplet naming its two main
    events; the table of contents reads as a poem and a promise); In-world epigraph (A chapter may open
    on a short in-world document (case-book, register, proverb, letter) in its institution''s house style
    (R51-33), which the chapter then tests (R12-4)); Verse header (A chapter may open on a short verse
    in a culture''s own form (a Kharven riding-song, a Korean sijo), and verify checks it as verse, outside
    the rhythm statistics).'

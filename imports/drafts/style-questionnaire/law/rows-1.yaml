  section: SP4
  title: Three new closing modes
  status: live
  kind: mandate
  summary: Beside an action, an image or a line, a chapter or scene may stop mid-crisis on a reveal or
    threat, close on a set-off notice or readout of what the scene cost or earned (figures traced to the
    sheet), or break off a breath before its emotional payoff, which the next scene then owes.
  verbatim: 'Yes to: Mid-crisis cliffhanger (Chapters, and turns at the next decision, may stop mid-crisis
    on a reveal or a threat, web-serial style; R49-26 gains the hook R5-F already wants); A notice or
    readout (A scene may close on a notice or readout set off from the prose: what the scene cost or earned,
    in figures traced to the sheet (R12-5)); Break off before payoff (A scene may stop a breath before
    its emotional point and leave the payoff to the reader or the next scene, as Kawabata does; the next
    scene owes what was withheld). Not taken: Storyteller''s next chapter.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Openings, endings, shape
    operation: extends
  supersedes: []
  applies_to:
  - prose-law
  - scene-structure
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'SP4. Extends R49-26-ENDINGS and gives R5-F-LIGHT_NOVEL_KEPT''s hook at close a legal ending;
    R12-5-NEVER_INVENT_NUMBER binds readout closes. A turn still stops at Isaac''s next decision. Not
    taken: the storyteller''s next chapter. R70-64 adds a closing poem.'
- id: R70-18-ARC_SHAPES
  pack: Style Law 2026-10-03
  pack_number: null
  section: SP5
  title: Licensed arc shapes
  status: live
  kind: mandate
  summary: A thread or book may run the tournament or examination arc, the Well delve (deeper ground and
    worse Well-spawn each stage, each closed on its cost), the training montage (weeks of drill compressed
    into one passage ending on a reading), and episodic self-contained jobs inside the longer arc.
  verbatim: 'Yes to: Tournament and examination (Tournaments and examinations become a licensed arc: rounds,
    brackets, scouts'' odds, a ranking at the close. The Aetherion Academy arc already runs this way;
    ticking it names the shape); The Well delve (A Well may be worked as an arc, deeper ground and worse
    spawn at each stage, each stage closed on its cost; Well-spawn (R53-06) supply the threat); The training
    montage (Weeks of drill may pass in one compressed passage that ends on a reading of what changed;
    R48-29''s skip gains a form for growth); Episodic jobs (A chapter or session may be one self-contained
    job, opened and closed in itself, inside the longer arc, as light novels and The Wandering Inn run).'
  amends:
  - guide: WOTR_Scene_Writing_Process_Guide.md
    locus: arc shapes
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: Roleplay partnership
    operation: extends
  supersedes: []
  applies_to:
  - prose-law
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: SP5. Gives R48-29-PACING's skip a form for growth (the montage); the delve draws on R53-06-WELL_SPAWN.
    The tournament and delve arcs run escalation as plot architecture, which R5-B-MANHWA_DIRECTIVE_REPEALED
    already left legal; escalation inside a duel is R70-102's re-ruling under R70-7.

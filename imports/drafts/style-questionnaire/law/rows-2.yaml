    and each book carries a glossary at the back while the wiki keeps a terms page.
  verbatim: 'Context plus a glossary. Prose as in A, plus a glossary at the back of each book and a terms
    page on the wiki. The page stays clean, and LitRPG readers get the reference they expect. (Option
    A there reads: Plain, context only. Current law. No italics and no explaining phrase; the scene carries
    the meaning. Immersive and quick, and now and then a reader guesses wrong for a page.)'

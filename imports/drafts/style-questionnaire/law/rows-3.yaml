- id: R70-67-FORMS_WORLD_DOCUMENTS
  pack: Style Law 2026-10-03
  pack_number: null
  section: DT9
  title: Four new forms for in-world documents
  status: live
  kind: definition
  summary: An in-world document may be a list or loose notebook, a record of the strange closed on the
    recorder's comment, a court annal or memorial, or a Guild reference entry (bestiary, registry sheet,
    item ledger) with every figure traced to canon.
  verbatim: 'Yes to: Lists and loose notebooks (A document may be a list or loose notebook in the Pillow
    Book manner, a culture''s eye compressed into entries; it moves no plot and packs world-only detail.
    Suits the Moto and Eresse courts); Records of the strange (A document may set down a strange event
    as plain witness and close on the recorder''s own comment, the zhiguai form; folk belief stays uncorrected
    (R53-15). Suits Guild archives, Well reports and the lineage halls); Court annals and memorials (A
    day-record by a court recorder the ruler may not read, as Joseon Korea kept its annals, or a memorial
    (a set-form petition to the throne). Suits the Mahuo houses and the Moto court); Game-reference entries
    (Bestiary entries, registry sheets and item ledgers in a Guild hand, LitRPG''s reference pages made
    institutional, each figure traced to canon (R12-5, R57-07). Suits the Guild, the wardens and the proof-houses).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Vocabulary and diction: in-world document house styles'
    operation: extends
  supersedes: []
  applies_to:
  - documents
  - register
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: Extends R51-33-DOC_REGISTER's house styles with forms. Records of the strange leave folk belief
    uncorrected (R53-15-FOLK_BELIEFS); reference entries trace figures under R12-5-NEVER_INVENT_NUMBER
    and R57-07-DOCUMENTS_FULLY_METAPHYSICAL. R12-4-VOICE_FOUR_DOCUMENT and R20C-37-DOCUMENTS_OWE_NOTHING

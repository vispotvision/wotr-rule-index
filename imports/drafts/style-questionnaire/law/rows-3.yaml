- id: R70-41-LAND_LIVES_IT
  pack: Style Law 2026-10-03
  pack_number: null
  section: DS2
  title: 'Rotation groups: land, sky, seasons, living things'
  status: live
  kind: definition
  summary: Land, water and sky (the night sky included), seasons and weather, and plants and animals (Well-spawn
    looked at as creatures) are rotation groups the range rule draws on; history in layers is not one.
  verbatim: 'Yes to: Land, water and sky (Terrain and ground underfoot, rivers, sea and shore, the long
    view, and the night sky (Shiro, the five wanderers, the Nail, the aurora) join the rotation); Seasons
    and weather (Thaw, rain, heat, fog and each culture''s signs of the turning year join the rotation,
    beyond R53-09''s actual weather in every outdoor scene); Plants and animals (Trees, crops, herbs,
    blossom, birds, insects, working beasts, and Well-spawn looked at as creatures join the rotation).
    Not taken: History in layers.'

    lines: null
  notes: Works with R70-40 (lead plus two) and R70-49 (one wide view outdoors); R53-09-WEATHER's actual
    weather in every outdoor scene stands beneath it. Inventory supply for these groups is R70-45.
- id: R70-42-PUBLIC_WORLD
  pack: Style Law 2026-10-03
  pack_number: null
  section: DS3
  title: 'Rotation groups: architecture, dress, streets, power on show'
  status: live
  kind: definition
  summary: Architecture as style, dress and adornment past the first-sight inventory, streets, markets
    and crowds, and power on show (processions, precedence, courts and punishments, Guild halls, ranking
    boards) are rotation groups the range rule draws on.
  verbatim: 'Yes to: Architecture as style (Buildings are described for style and ornament as well as
    use and wear; the Moto ''one thing made that serves no function'' finally gets looked at); Dress and
    adornment (Cloth, cut, colour by rank, wear and repair, jewellery, cosmetics and worn scent join the
    rotation, past the first-sight inventory); Streets, markets, crowds (Squares, alleys, hawkers, stalls
    and haggling, arcades and branded goods (R60-07), and the crowd as one body join the rotation); Power
    on show (Processions and entrances, seating by precedence, courts and punishments (R53-11), Guild
    halls and academy grounds as displays of standing, and ranking boards join the rotation).'
  amends:
  - guide: NATALIE.md and the wotr-write skill

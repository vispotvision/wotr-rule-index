- id: R70-99-NUMBER_NOT_YET_CANON
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR21
  title: Uncanonical figures print as hedged estimates
  status: live
  kind: procedure
  summary: When a readout needs a figure canon does not give, it prints an estimate with the instrument's
    own hedge, such as a range or a stated uncertainty, and the author notes log it as an estimate.
  verbatim: Print the estimate, marked. The readout prints the figure with the instrument's own hedge
    (a range, 'uncertain past the third place'), and the notes log it as estimate.

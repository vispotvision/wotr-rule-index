    of exact-number speech; commoners still round, guess or do not count. Carries Isaac''s 2026-09-12
    Unbound ruling on R14-B. Read with R70-79-CAN_READ_WHOM: exact figures of another come from an instrument
    or a report, not from feel. R13-6-SCALING_VOCAB_RESTRICTED (powerscaling terms in the notes only)
    is not reached by build talk in FOW''s own terms.'

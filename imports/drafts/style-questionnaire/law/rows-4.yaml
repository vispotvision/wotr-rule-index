- id: R70-77-INSTRUMENT_CAN_SHOW
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR1
  title: Assay instruments print their readings
  status: live
  kind: definition
  summary: Assay coils may stamp their figures on a paper tape or punch them on a card, like a ticker or
    tabulator, and any set-off readout block on the page is written as that tape in the instrument's own
    type.
  verbatim: Printing instruments. Assay coils stamp a paper tape or punch a card, as a ticker or tabulator
    does, so a set-off block on the page is that tape, in the instrument's own type.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'The Magic Frame: Pack Eleven, the Draw Age'
    operation: adds
  - guide: WOTR_Item_and_Equipment_Writing_Guide.md
    locus: instruments and gauges
    operation: adds
  supersedes: []
  applies_to:
  - worldbuilding
  - documents
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Works with R70-80-READOUT_SITS_PAGE (when a block may appear) and R70-78-WHERE_SCREEN_COMES_FROM
    (instruments read everyone; the bearer reads only his own sheet). Stays inside R53-01-IMPERIAL_AGE_SPAN:
    the ticker tape and the tabulator card are the models. No older rule is reached.'
- id: R70-78-WHERE_SCREEN_COMES_FROM
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR22
  title: The bearer reads his own Crystal
  status: live
  kind: definition
  summary: A practitioner sees his own figures as plain, voiceless lines read in his Soul Crystal at thresholds,
    exact and limited to his own sheet, never showing wounds or anyone else, while instruments read everyone
    else.
  verbatim: 'Read in the Crystal. The bearer reads his own Soul Crystal as plain, voiceless lines at thresholds:
    his own sheet only, exact, and blind to wounds and to others. Small new canon; instruments still read
    everyone else.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'The Magic Frame: the stats decide'
    operation: adds
  - guide: The Magic System
    locus: The Magic System
    operation: adds
  supersedes: []
  applies_to:
  - stats
  - magic-mechanism
  - pov
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Small new canon: the in-world source R70-2-LITRPG_WOTR_BECOMES left to this question. Adds one
    source to R49-52-MEASURES and R52-05-COUNTING, the bearer''s own Crystal for his own sheet; R12-5-NEVER_INVENT_NUMBER
    still binds every line. The Crystal is blind to wounds, so a wound''s readout is a surgeon''s line
    (R70-85-SCENE_MOMENTS_THAT_EARN).
    The lines are ''exact'', while R70-99-NUMBER_NOT_YET_CANON has a readout hedge an uncanonical figure
    ''with the instrument''s own hedge''; how a Crystal line, which is no instrument, shows an estimate
    is not stated and is flagged for the conflict log, not settled here.'
- id: R70-79-CAN_READ_WHOM
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR2
  title: Practitioners feel rank
  status: live
  kind: definition
  summary: Every practitioner feels his own Grades and Stage and senses another's Band and rough Stage
    as closely as his Gnosis allows, but another's exact figures need an instrument, and commoners keep
    their folk words and their awe.
  verbatim: Practitioners feel rank. Any practitioner feels his own Grades and Stage, and another's Band
    and rough Stage, with Gnosis setting how close. Another's exact figures need an instrument; commoners
    keep their folk words and their awe.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'The Magic Frame: Pressure'
    operation: adds
  - guide: The Magic System
    locus: The Magic System
    operation: adds
  supersedes: []
  applies_to:
  - stats
  - pov
  - worldbuilding
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Confirms R53-14-FOLK_KNOWLEDGE for commoners and keeps R52-05-COUNTING''s point that a stranger''s
    exact figures come from an instrument. Gnosis is the read stat of R14-3-STATS_DECIDE_TABLE. Read with
    R70-93-BUILD_TALK_DIALOGUE, which lets a ranked practitioner talk others'' numbers exactly: by this
    row his own sense gives him only Band and rough Stage, so exact figures he speaks of another come
    from an instrument or what he was told (R70-83-FIGURES_PLAIN_NARRATION).'
- id: R70-80-READOUT_SITS_PAGE
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR3
  title: Inline figures, set-off blocks at milestones
  status: live
  kind: mandate
  summary: Figures sit inline in ordinary sentences by default, and a set-off readout block appears only
    at a re-assay that changes something, a breakthrough or the end of an arc.
  verbatim: Inline, blocks at milestones. Figures inline by default; a set-off block only at a re-assay
    that moves something, a breakthrough or an arc's end. Blocks become events, rare enough to land.
  amends:
  - guide: WOTR_Master_Style_Directive.md
    locus: §4.6, the status-screen ban
    operation: replaces
  - guide: NATALIE.md and the wotr-write skill
    locus: Prose standards
    operation: adds
  - guide: Dialogue Craft Standards
    locus: §3.H, system text 'not as interruption blocks'
    operation: extends
  supersedes: []
  applies_to:
  - prose-law
  - documents
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Rules in words what R5-F-LIGHT_NOVEL_NOT_KEPT had banned (''Status screens, panels, HUD-style
    rendering'') and R51-16-OLD_BANS_FALL, which spoke only of vocabulary, left silent. Keeps R48-07-WHITE_SPACE:
    blocks are rare events. The block is the instrument''s tape (R70-77-INSTRUMENT_CAN_SHOW). Other answers
    in the same ruling name further set-off occasions: a scene closing on a notice or readout (R70-17-CLOSING_MODES),
    the item card at purchase or appraisal (R70-95-ITEM_CARDS) and the chapter-end changes block (R70-98-SHEETS_CHAPTER_ARC_ENDS).
    Whether those sit inside this row''s ''only'' is not settled here and is flagged for the conflict
    log.'
- id: R70-81-VOICE_READOUT
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR4
  title: Readouts clinical, wit in the margin
  status: live
  kind: mandate
  summary: Readout text stays clinical and carries no humour; any wit belongs to the clerk's or Measurewright's
    note beside it.
  verbatim: Clinical, wit in margins. The instrument stays clinical, and any wit lives in the clerk's
    or Measurewright's note beside it. Humour stays in a person, never in the readout, and R5-D stands.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Documents
    operation: adds
  supersedes: []
  applies_to:
  - documents
  - register
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Extends R51-33-DOC_REGISTER''s institutional house style to instruments. ''R5-D stands'': R5-D-HUMOUR_PERMITTED
    and R5-D-HUMOUR_BARRED stay live; R5-D-FUNERAL_TEST and R5-D-HUMOUR_CASTING were already superseded
    and are not revived. Full comic beats for named comic voices are R70-113-DOUBLE_ACT_COMIC_BEAT''s
    ruling; this row keeps only the readout itself humourless.'
- id: R70-82-NUMERALS_LADDER_RUNGS
  pack: Style Law 2026-10-03
  pack_number: null

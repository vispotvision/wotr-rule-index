  status: live
  kind: mandate
  summary: Stages and Bands may carry their Roman numeral beside the name, as Fracture of Worlds writes
    them ('Stage V, Splintering'), while Tiers of Standing and item Tiers are still written by name alone.
  verbatim: Numeral beside name. 'Stage V, Splintering' and 'Band II, Awakened', as FOW writes them. Tiers
    of Standing and item Tiers keep their names alone. R47-7 is amended.

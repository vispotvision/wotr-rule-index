  - documents
  - items
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: '''R47-7 is amended'': R47-7-NAMES_NOT_NUMBERS stays live for Tiers of Standing and item Tiers
    and loses its hold on Stages and Bands; a bare numeral without the name is not licensed (the ''Numerals
    free'' option was not taken). Level and other system figures take digits under R70-30-NUMBERS_WORDS_DIGITS.
    An item card prints the item Tier by name (R70-95-ITEM_CARDS).'
- id: R70-83-FIGURES_PLAIN_NARRATION
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR6
  title: Narration states the figures the POV holds
  status: live
  kind: mandate
  summary: Narration may state on its own authority only the figures the POV actually holds, such as his
    own last reading, a card he has seen or what he was told.
  verbatim: 'What the POV knows. Narration states the figures the POV holds: his own last reading, the
    card he has seen, what he was told. R49-52 governs R49-47; R14-4-SUBSTAT retires; NATALIE.md is rewritten.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 5 and The Magic Frame ('names only in a mouth, an instrument, a document, or a private
      count')
    operation: replaces

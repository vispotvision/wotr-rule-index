- id: R70-84-GROWTH_MOMENTS_THAT_EARN
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR7
  title: Growth moments that earn a readout
  status: live
  kind: mandate
  summary: A readout may mark a Level gained with the stat points it brought, a Stage breakthrough naming
    the new Stage and its Tier of Standing, a new Trait as it registers, and first contact with or harmonisation
    to a Wellspring current.
  verbatim: 'Yes to: Level gained (A short readout when a Level lands, with the stat points it brought.
    The genre''s heartbeat, and the most frequent of the four); Stage breakthrough (A readout naming the
    new Stage and its Tier of Standing when the Catalyst completes. The cultivation novel''s big moment);
    New Trait (A readout naming the Trait when it registers. Rare, and each one changes what a character
    can do); Wellspring contact (A readout at first contact with a new Wellspring current (FOW''s Resonant
    Surge) and at a harmonisation. Growth tied to a place).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Prose standards: readouts'
    operation: adds
  supersedes: []
  applies_to:
  - stats
  - prose-law
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: Works with R70-89-BODY_FIRST_NUMBER_FIRST (body first, line after), R70-91-BREAKTHROUGH_PAGE
    (when the breakthrough line lands), R70-80-READOUT_SITS_PAGE (a breakthrough earns a set-off block),
    R70-86-MANY_READOUTS_SCENE_CARRIES (the per-scene cap) and R70-90-FAST_NUMBERS_CLIMB (each gain needs
    a shown cause). Every figure traces to the sheet (R12-5-NEVER_INVENT_NUMBER). No older rule is reached.
- id: R70-85-SCENE_MOMENTS_THAT_EARN
  pack: Style Law 2026-10-03
  pack_number: null
  section: LR8
  title: 'In-scene readouts: appraisal, wound, Essence spent'
  status: live
  kind: mandate
  summary: Inside a scene a readout may come from an appraisal of a person, beast or item, a surgeon's
    diagnostic line on a wound, or a reserve line after a working, but never from Pressure.
  verbatim: 'Yes to: Appraisal (Reading a person, beast or item: the Measurewright at the rail, the coil
    at the counter, a faculty. The genre''s appraisal in WOTR''s hands); A wound (A diagnostic line in
    a surgeon''s terms: the structure struck, the ATLS class, the minutes left. Brida''s ''third bowl''
    as a readout); Essence spent (A reserve line after a working: what was drawn and what is left. R60-03''s
    hard reserve clock made visible). Not taken: Pressure.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Prose standards: readouts'
    operation: adds
  supersedes: []
  applies_to:
  - stats
  - prose-law
  - combat
  - documents
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: Pressure was not taken, so R53-14-FOLK_KNOWLEDGE's 'Pressure is felt as dread' stays how Pressure
    reaches the page. The reserve line makes R60-03-HARD_RESERVE_CLOCK visible without changing it. Gives
    R48-16-REAL_FIGURES a set form at these three moments; R70-86-MANY_READOUTS_SCENE_CARRIES caps them.
    The wound line is a surgeon's, not the Crystal's, which is blind to wounds (R70-78-WHERE_SCREEN_COMES_FROM).
    An appraisal by 'a faculty' sits beside R70-79-CAN_READ_WHOM ('Another's exact figures need an instrument';
    LR2's faculty option was not taken); whether a faculty appraisal may print exact figures is not settled
    here and is flagged for the conflict log.

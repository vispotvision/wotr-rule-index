  source:
    file: ''
    lines: null
  notes: 'R12-5-NEVER_INVENT_NUMBER stands: the hedge on the page is its ''flagged as estimate'' made
    visible. R14-6-NUMBERS_GREP still decides what is an estimate, and R14-2-ESTIMATE_MARKING''s documented
    range for the Stage and Band still bounds it. The hedge is an instrument''s; R70-78-WHERE_SCREEN_COMES_FROM

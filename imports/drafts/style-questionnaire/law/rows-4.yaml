    file: ''
    lines: null
  notes: '''R49-52 governs R49-47'': R49-47-STAT_WORDS stays live for stat names, Grades and Stages in
    narration, but a figure narration states on its own authority must be one the POV holds under R49-52-MEASURES,
    read with the Crystal source of R70-78-WHERE_SCREEN_COMES_FROM. ''R14-4-SUBSTAT retires'': R14-4-SUBSTAT_DIAGNOSTIC_ONLY,
    the only R14-4 row on Sub-Stats, is superseded. ''NATALIE.md is rewritten'': Table Rule 5''s ''in

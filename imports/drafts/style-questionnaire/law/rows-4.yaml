    locus: §1, §4.6 and §6.1, stat words in narration
    operation: replaces
  supersedes:
  - R14-4-SUBSTAT_DIAGNOSTIC_ONLY
  applies_to:
  - prose-law
  - stats
  - pov
  - register
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'

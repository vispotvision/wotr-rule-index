  source:
    file: ''
    lines: null
  notes: R51-28-CHANT_PAGE stands for chants. verify leaves a marked verse block out of its rhythm statistics
    (R70-136-NEW_CHECKS_VERIFY_SCENE), so the checker does not count traded verse toward R4-14-RUN_RULE's
    runs. Works with R70-64-VERSE_INSIDE_PROSE, which sets where verse reaches the page.

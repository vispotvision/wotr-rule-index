    file: ''
    lines: null
  notes: 'Partly amends R52-30-PROVERBS: its ''one'' becomes ''several'', keyed to age and standing; the
    sayings still come from the Standing Inventory. Works with R70-65-SET_IDIOMS_NARRATION.'
- id: R70-110-VERSE_EXCHANGED_TALK
  pack: Style Law 2026-10-03
  pack_number: null
  section: DL4
  title: Verse traded as talk, each culture in its own form
  status: live
  kind: mandate
  summary: At rites and in court the Moto court, Eresse, the Mahuo houses and the lineage halls may offer
    and answer verse, a weak or plain answer costing face; Northern English and Norse-register speakers
    may trade alliterative insult verse (flyting); each culture's verse form is entered in its Inventory.
  verbatim: 'Each culture its own contest. B, plus the north''s own form: Northern English and Norse-register
    speakers may answer in alliterative insult verse (flyting). Each culture''s verse form is entered
    in its Inventory. (Option B there reads: Courtly cultures trade verse. The Moto court, Eresse, the
    Mahuo houses and the lineage halls may offer and answer verse at rites and in court; a weak answer,
    or a plain one, costs face.)'
  amends:
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: Verse form per culture
    operation: adds
  - guide: Dialogue Craft Standards
    locus: Verse in talk
    operation: adds
  supersedes: []
  applies_to:
  - dialogue
  - standing-inventory
  - register
  verification:
  - 'verify: verse marker'

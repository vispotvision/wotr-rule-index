    lines: null
  notes: R1-3-NAME_THREE_RULE stands across both vantage points. The guide's 'pass through Line' rule
    has no row of its own in the index; the marked breaks replace it in the Mass Combat Craft Guide. Works
    with R70-11-WIDE_VIEW, whose marked roll call is exempt from the three heads.
- id: R70-107-SPEECH_LEVELS_ADDRESS_KOREAN
  pack: Style Law 2026-10-03
  pack_number: null
  section: DL1
  title: Korean and Chinese address words, and level shifts as events
  status: live
  kind: mandate
  summary: Korean speakers use their own address words (-ssi, -nim, sunbae) and Chinese speakers theirs
    (shifu, shixiong, qianbei), romanised and never italic, and any shift in speech level is written as
    an event the room hears.
  verbatim: 'Native words and level shifts. Native address words as in B, and level shifts written as
    events as in C. R23-10-CHINESE_PHONOTACTICS still bars stacked honorifics inside names. (Option B
    there reads: Native address words. R51-21 extends: Korean speakers use their own address words (-ssi,
    polite; -nim, honoured; sunbae), Chinese theirs (shifu, shixiong, qianbei, an elder of another school),
    romanised and never italic.) (Option C there reads: Levels carried in English. No foreign address
    words beyond the Japonic houses; speech levels live in English grammar (bare orders against full courteous
    forms), and a shift of level is written as an event the room hears.)'
  amends:
  - guide: Dialogue Craft Standards
    locus: Address and rank
    operation: extends
  supersedes: []
  applies_to:
  - dialogue
  - register
  - naming
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: Extends R51-21-MOTO_WORDS to the Korean and Chinese strata in speech; R20-5-FORMAL_ADDRESS stands.
    R23-10-CHINESE_PHONOTACTICS still bars stacked honorifics inside names (R70-117-SOBRIQUETS_HALL_TITLES
    lifts its bans for titles only). Address forms enter each Inventory's Words entry (R70-33-WORD_BANK_PER_CULTURE).
    ME2 did not take an address check.

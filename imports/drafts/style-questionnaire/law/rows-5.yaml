    in sayings; the young speak plain, and a youth who quotes above his years is put down for it. (Option
    B there reads: Proverb duels. NPCs carry several fixed sayings and may argue in them at bargain, quarrel
    and council, a saying answered by a saying. R52-30''s ''one'' becomes ''several''.)'

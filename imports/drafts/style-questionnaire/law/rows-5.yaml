- id: R70-112-FACE_FACE_SLAP
  pack: Style Law 2026-10-03
  pack_number: null
  section: DL6
  title: The face-slap, with a bill
  status: live
  kind: mandate
  summary: An arrogant scion may underestimate and be reversed in public while the room reassesses, but
    every such reversal opens a Front or a Ledger debt (a vengeful house, a witness, a feud), and the
    humbled man stays veteran-clever afterward.
  verbatim: 'The face-slap, with a bill. C, with a bill: every public reversal opens a Front or a Ledger
    debt (a vengeful house, a witness, a feud), and the humbled man stays veteran-clever afterward. (Option
    C there reads: The face-slap licensed. The face-slap becomes a legal payoff: an arrogant scion underestimates,
    the reversal is public, the room reassesses. R5-C1-WELL_REASONED_WRONG_CONCLUSION and R48-36 relax
    for the arrogant, who may misjudge badly.)'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rules 3, 4 and 7: NPC agency, Fronts, the ledger'
    operation: extends
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: NPC wits
    operation: extends
  supersedes: []
  applies_to:
  - dialogue
  - adjudication
  - session-protocol
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: Relaxes R48-36-NPC_WITS and R5-C1-WELL_REASONED_WRONG_CONCLUSION for the arrogant before the
    reversal only; R12-4-VOICE_THREE_OPPONENT stands. Names no R5-B or R5-G tell; the room's reassessment
    is where it meets the reaction-shot tell, which R70-72-WATCHING_CROWD_POWER_REVEAL strikes for crowds.
    Where Isaac's PC reverses or is reversed, his play decides (R49-01-WHOSE_HEAD).

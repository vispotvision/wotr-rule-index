  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: Rides R23-2-NORTHERN_STRATUM's byname 'available to anyone', R20-4-PRONUNCIATION_ADAPTATION and
    R50-33-MISPRONOUNCE (a real mishearing every time), R20-1-GOBLINOID_ANCHOR for sound comedy, and R23-5-OUTLIER_DEFINED's
    name given 'as an insult or a shield'. All stand.

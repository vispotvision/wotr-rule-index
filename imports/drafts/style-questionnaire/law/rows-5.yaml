- id: R70-100-MARTIAL_VOCABULARY_NAMES_MOVES
  pack: Style Law 2026-10-03
  pack_number: null
  section: CB1
  title: Duel moves named in the POV's own school
  status: live
  kind: mandate
  summary: Narration names every move of a duel in the fencing vocabulary the POV himself trained in (kesa-giri
    for a Moto POV, Zornhau for a Greymane POV), and a foreign school's term reaches the page only in
    a character's mouth.
  verbatim: By the POV's own school. Narration names every move in the POV's own training (a Moto POV
    calls a diagonal cut kesa-giri, a Greymane POV a Zornhau); a foreign school's word arrives in a mouth.
    verify takes per-school lists.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: HEMA vocabulary and choreography
    operation: extends
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Set pieces: ''HEMA vocabulary as choreography skeleton'''
    operation: replaces
  - guide: Manual Verification Guide
    locus: verify --combat word lists
    operation: extends
  supersedes: []
  applies_to:
  - prose-law
  - combat
  - pov
  - register
  verification:
  - --combat
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: Partly amends R48-33-CHOREOGRAPHY ('the move by its fencing name' now means the name in the POV's
    own school) and R13-6-HEMA_VOCAB (HEMA stays the vocabulary for Western-trained POVs). R13-4-COMBAT_FLOOR
    and R1-1-BLADE_GRAMMAR stand; the moves they trace are named in the POV's school. Works with R70-74-TECHNIQUE_NAME_LOOKS
    and R70-136-NEW_CHECKS_VERIFY_SCENE (verify --combat by school).
- id: R70-101-DECLARING_NAME_LINE_BEFORE
  pack: Style Law 2026-10-03
  pack_number: null
  section: CB2
  title: A full pre-duel declaration counts as the scene's speech and costs time
  status: live
  kind: budget
  summary: A fighter may declare his full name and line before a duel, but the recital spends the scene's
    one crafted speech under R48-43, and the opponent may close measure or shoot while it runs.
  verbatim: 'Full declaration, with a price. Full declarations are legal but count as the scene''s crafted
    speech under R48-43, and the world does not wait: an opponent may close measure, or shoot, while the
    recital runs.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: Opening a duel
    operation: adds
  - guide: Dialogue Craft Standards
    locus: Set speeches
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - dialogue
  - adjudication
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: R48-43-SPEECHES stands; the declaration counts as its one crafted speech. Read with R60-01-BRUTAL_LETHALITY
    (most fights end in the first seconds), since the opponent may close or shoot while the recital runs.
    Works with R70-5-EASTERN_MODELS (the war tales' name-declaration) and R70-111-LONG_FORMAL_SPEECH_CLIPPED.
- id: R70-102-STILLNESS_TRACED_PASSES_LONG
  pack: Style Law 2026-10-03
  pack_number: null
  section: CB3
  title: Duel shape follows the combat grammar
  status: live
  kind: mandate
  summary: Write a Verdict duel as stillness then one cut, a Blade duel as traced passes and a Percussion
    or Expenditure duel as attrition, let practitioners escalate only while their reserve lasts, and keep
    unranked fighters under R60-01's fast, brutal lethality.
  verbatim: 'Shape follows the grammar. A rule ties duel shape to the four combat grammars: Verdict still
    then one cut, Blade traced passes, Percussion and Expenditure by attrition; practitioners escalate
    while reserve lasts. R60-01 holds for the unranked.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: 'The four grammars: duel shape'
    operation: adds
  - guide: WOTR_Scene_Writing_Process_Guide.md
    locus: 'Sec. 2: escalation'
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - adjudication
  - scene-structure
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Partly amends R48-33-CHOREOGRAPHY: ''every exchange traced'' now runs inside the shape each
    grammar sets (R1-1-VERDICT_GRAMMAR still then one cut). Re-rules one R5-B-MANHWA_DIRECTIVE_REPEALED
    tell for practitioners only: escalation inside a duel is legal while reserve lasts, and R60-03-HARD_RESERVE_CLOCK
    ends it. R60-01-BRUTAL_LETHALITY holds for the unranked; R13-4-DENSITY_BUDGET stands. Works with R70-57-DESCRIPTION_INSIDE_FIGHT
    and R70-15-TEMPO_STILLNESS.'
- id: R70-103-MEMORY_INSIDE_FIGHT
  pack: Style Law 2026-10-03
  pack_number: null
  section: CB4
  title: One full flashback per fight, the POV's own
  status: live
  kind: budget
  summary: Once per fight the POV may freeze one turning exchange for a full flashback of his own, a page
    or more, and the opponent's past reaches the page only through what the POV knows.
  verbatim: Full flashback, POV only. The POV may take a full flashback, a page or more, frozen inside
    one turning exchange, once per fight. The POV lock holds; the opponent's past reaches the page only
    through what the POV knows.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: Interiority inside a fight
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - pov
  - prose-law
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Places R49-06-MEMORIES inside a fight: once per fight, at one turning exchange. R48-40-NPC_THOUGHTS
    and the POV lock stand, so no flashback runs inside the opponent. Never chosen for Isaac''s PC unless
    his play takes it there (R49-01-WHOSE_HEAD).'
- id: R70-104-RIVAL_BOND
  pack: Style Law 2026-10-03
  pack_number: null
  section: CB5
  title: A rival recurs only by a mercy paid for on the Ledger
  status: live
  kind: mandate
  summary: A rival may come back fight after fight, but every survival must be a choice someone made and
    paid for on the Ledger with a debt, a scar or a witness to the mercy.
  verbatim: 'Rivals who chose to spare. A rival may recur, but each survival is a choice someone made
    and paid for on the Ledger: a debt, a scar, a witness to the mercy. R48-31 stands.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 7: the ledger'
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - adjudication
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'R48-31-STAKES stands: death stays possible in every fight. When Isaac''s PC is the one sparing
    or spared, the choice is his (R49-01-WHOSE_HEAD).'
- id: R70-105-JOINS_WOUND_WHEN_FIGHT
  pack: Style Law 2026-10-03
  pack_number: null
  section: CB6
  title: Killing rites and the elegiac image, by culture
  status: live
  kind: mandate
  summary: After a death by the blade, add the killing rites when the killer is Japonic, Korean or Chinese
    and an elegiac image when the POV's culture mourns that way, on top of the full clinical floor.
  verbatim: 'Rites and image, by culture. Both, keyed to culture: Japonic, Korean and Chinese killers

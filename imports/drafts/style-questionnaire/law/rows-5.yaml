    floor holds everywhere.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: Aftermath of a kill
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - prose-law
  - standing-inventory
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: R48-34-WOUNDS and R48-38-AFTERMATH stand ('The clinical floor holds everywhere'). R5-C2-ELEGY_CONCRETE_THING
    still applies to the elegiac image. The rites follow the killer's culture; the image follows the POV's.
- id: R70-106-BATTLE_TOLD
  pack: Style Law 2026-10-03
  pack_number: null

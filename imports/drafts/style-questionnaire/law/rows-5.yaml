- id: R70-117-SOBRIQUETS_HALL_TITLES
  pack: Style Law 2026-10-03
  pack_number: null
  section: NE1
  title: Sobriquets by use, and hall title ladders
  status: live
  kind: mandate
  summary: Criers, crowds, ballads and enemies may hang lesser names on any notable fighter, most fading
    and the one that sticks becoming the Third Name, and the lineage halls may stack titles (Hall Master,
    Elder, Senior Brother, first disciple) in formal address.
  verbatim: 'Sobriquets and title ladders. B and C together: sobriquets spread by use, and the halls stack
    their titles in formal address. R23-10 holds for given names only. (Option B there reads: Sobriquets
    in common use. Criers, crowds, ballads and enemies may hang lesser names on any notable fighter; most
    fade, and the one that sticks becomes the Third Name. Your characters'' names still stick only if
    you keep them.) (Option C there reads: Hall title ladders. The lineage halls run a full title ladder
    (Hall Master, Elder, Senior Brother, first disciple) that may stack in formal address; R23-10''s bans
    lift for titles and hold for given names.)'

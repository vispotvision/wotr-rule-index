  title: Season image, held detail, morning poem and mimetic words in explicit scenes
  status: live
  kind: mandate
  summary: An explicit scene may set a season or nature image beside the anatomy, hold one physical detail
    at chosen moments such as the peak, close its aftermath on a written or spoken exchange such as a
    morning poem, and use mimetic words for texture and state, romanised and never italic, all without
    displacing the plain anatomical words.
  verbatim: 'Yes to: Season and nature imagery (An explicit scene may set a season or nature image beside
    the anatomy (frost, snow, blossom, the brazier), carrying mood without replacing the plain words);
    Held detail at the peak (At chosen moments, usually the peak, one held physical detail may carry the
    beat; plain specificity governs the rest, and the aftermath is still written); The poem after (An
    explicit scene may close on a written or spoken exchange (a morning poem, a note, a line answered)
    as part of its aftermath beat); Mimetic words (Mimetic words for texture and state (the Japanese gitaigo
    habit, and each culture''s own) join table rule 9''s onomatopoeia, romanised and never italic).'

- id: R72-24-NEW_LINES_LEDGER
  pack: Table Law 2026-10-04
  pack_number: null
  section: WD5
  title: The Ledger keeps bonds by name and a heat line per thread
  status: live
  kind: mandate
  summary: Each thread's warm bonds go on the Ledger by name with what has fed and what has strained them,
    so a loss lands on a named line, and each thread keeps a standing heat line for the attention crown,
    company and Guild are paying him, raised by public acts and unread killings and cooled only by the
    right office, paid.
  verbatim: 'Yes to: Bonds, by name (Each thread''s warm bonds go on the Ledger by name, with what has
    fed them and what has strained them, so a loss lands on a named line); Heat per thread (A standing
    heat line per thread: the attention crown, company and Guild are paying him. Public acts and unread
    killings raise it; only the right office, paid, cools it).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table Rule 7 (the ledger): kinds of line'
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: WD5 (digest), A and B. Table Rule 7's list (injuries, exhaustion, reserve, debts, reputation,
    who saw what) gains bonds and heat. The bonds are the standing warm bonds of R70-114-GRIMDARK_WARMTH,
    now kept by name; that row is not changed, and a bond involving his PC stays his to play (R49-01-WHOSE_HEAD).
    An unread killing already sits on the Ledger as a risk under R71-101-LAW_TURNS, which stands; heat
    gives the crown, company and guild layers a running line. Cooling heat and keeping a bond are downtime
    activities under R72-28-TIME_OFF. Option C (his word given) was not taken.

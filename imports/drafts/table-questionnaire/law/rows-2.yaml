- id: R72-22-WHEN_BILL_COMES
  pack: Table Law 2026-10-04
  pack_number: null
  section: WD3
  title: A Ledger line comes due on a story date or a named trigger
  status: live
  kind: procedure
  summary: Every Ledger line carries a thread and either a story date off the State of Play calendar or
    a named trigger (he returns to the Seat, the thaw comes), the close marks which lines have fired,
    and due() returns only those.
  verbatim: A date or a trigger. Each line gains a thread and either a story date off the State of Play
    calendar or a named trigger (he returns to the Seat, the thaw comes). The close marks what fired;
    due() returns only those.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 7 (the ledger) and session start step 2 (what comes due)
    operation: extends
  supersedes: []
  applies_to:
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: WD3 (digest). The calendar is the State of Play's date under R53-09-WEATHER, which stands. The
    due field's session count or condition in words, as the tools keep it now, gives way to the date or
    trigger; the field and due()'s filter land in the tools (R72-41-WHERE_TABLE_LAW_LANDS), and every
    open line on file gets a thread and a date or trigger in the reconciliation pass (R72-42-DATA_ALREADY_FILE).
    How a fired line reaches the page is R72-23-BILL_PAGE; a scene set before its thread's live date writes
    only what still binds (R72-34-SCENES_SET_PAST). No indexed rule is changed. Options A (as built) and
    C (Natalie's judgement) were not taken.

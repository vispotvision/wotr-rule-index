- id: R72-27-SWAYS_NPC
  pack: Table Law 2026-10-04
  pack_number: null
  section: WD13
  title: Rank, his name and evidence weigh on an NPC's answer
  status: live
  kind: mandate
  summary: A Stage gap felt as Pressure and a commoner's awe of a ranked practitioner can make an NPC
    yield what its want alone would refuse, a ranked NPC weighing them less; the Ledger's reputation and
    who-saw-what lines reach the NPC, so it answers what his PC did in public and the notes name the line
    that weighed; and an NPC catches his PC's lie only on a tell in his body, a fact it holds or a read
    its Gnosis earns, the lie holding otherwise.

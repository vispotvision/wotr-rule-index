- id: R72-20-MOVES_FRONT
  pack: Table Law 2026-10-04
  pack_number: null
  section: WD1
  title: Fronts tick on a pace in story days
  status: live
  kind: procedure
  summary: Every Front gets a pace in story days, and whenever in-world time passes each Front whose days
    are spent ticks offscreen, played or not, while his acts can speed, slow or stop it.
  verbatim: By the calendar. Each Front gets a pace in story days. When in-world time passes, every Front
    whose days are spent ticks offscreen, played or not; his acts can speed, slow or stop it. Rule 4 is
    rewritten to this.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 4 (the world moves)
    operation: replaces
  supersedes: []
  applies_to:
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'WD1. ''Rule 4 is rewritten to this'': Table Rule 4 (''Between turns and sessions, Fronts advance'')
    lives only in NATALIE.md and has no indexed row, so nothing is marked superseded; the rewrite is owed
    to NATALIE.md (R72-41-WHERE_TABLE_LAW_LANDS). The calendar is the State of Play''s date and season
    under R53-09-WEATHER, which stands. Session start step 3 (''Advance one Front'') and advance_front''s
    one-a-session floor are not named; the pace lands on Fronts in the tools (R72-41-WHERE_TABLE_LAW_LANDS)
    and every Front on file gets one in the reconciliation pass (R72-42-DATA_ALREADY_FILE). Partly amends
    R58-07-WREN_GRIEF_FRONT, whose ticks were ''driven by who blames whom'': that Front gets a pace in
    story days like every other, and the answer does not say how blame bears on the pace. R48-29-PACING
    (''the world keeps moving''), R49-09-CUTAWAYS and R71-101-LAW_TURNS (a jurisdiction contest run as
    a Front) are not changed by this answer. What a tick shows is R72-21-FRONT_SIGNS_SEEN; a journey''s
    clock runs on the same calendar (R72-29-ROAD_AT_STAKE). Options A (one a session, chosen), C (by his
    acts only) and D (a faction turn at close) were not taken.'

    it answers what your PC did in public, for good or ill, and the notes name the line that weighed);
    His lies caught on evidence (An NPC catches your PC''s lie only on what it can check: a tell in his
    body, a fact it holds, or a read its Gnosis earns (R14-3''s read row). Otherwise the lie holds).'
  amends:

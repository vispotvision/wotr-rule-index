  - stats
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: K6. Carries R70-90-FAST_NUMBERS_CLIMB's shown cause from numbers to techniques; that row stands
    unchanged. The cause on the page keeps R12-3-NAMED_INVENTOR_RULE's trail (derived by somebody, in
    a place, for a problem), which stands. The FOW line is R14-8-ABILITY_GUIDE_FOW_LINE's, standing. R70-18-ARC_SHAPES's

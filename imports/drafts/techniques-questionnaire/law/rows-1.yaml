  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: Limit and Counter (the vow)'
    operation: extends
  - guide: character sheet template
    locus: 'Techniques section: a vow between two'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - magic-mechanism
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE6, options B and C, both recommended; A, a vow for one fight, was not taken. Partly amends
    R71-32-VOWS_LIMITS, where breaking a vow is a Shear Break: a staked vow also pays its stake when broken,
    and a vow may now bind two people. The stake is paid permanently under R55-1-SUBSTANCE_COSTS_PERMANENT,
    which stands. ''Under TE5''s B, only a staked vow reaches a full Grade'' (R75-12-WHAT_VOW_WORTH).
    A carded Synergia carries no vow (R75-20-CARDING_SYNERGIA), so a vow between two is a binding of its
    own. R17-3-LIMIT_MECHANICAL stands.'
- id: R75-14-HOW_VOW_SWORN
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE7
  title: A vow binds when spoken aloud before any living witness
  status: live
  kind: definition
  summary: A vow binds once it is spoken aloud before any living witness, the opponent included, earns
    oath experience only when sworn at a stone, and since somebody always heard it, its counter can be
    found by asking.
  verbatim: Aloud, any witness. A vow binds when spoken before any living witness, the opponent included;
    it earns oath experience only at a stone. Somebody always heard, so the counter can be found by asking.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: Limit and Counter (the vow)'
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - magic-design
  - dialogue
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE7. Partly amends R71-32-VOWS_LIMITS, which set no condition for a vow to bind: it now binds
    when spoken aloud before a living witness, and its terms stay its findable counter. Swearing before
    the opponent binds the vow; telling an opponent how a technique works still buys nothing, since R71-32
    did not take disclosure as a binding, and R8-26-NO_SELF_TRANSLATION stands. The stone is canon''s
    Witness Stone: Fracture of Worlds pays oath experience only for swearing before a Witness Stone or
    a Continuum-recognised binding. The counter is a fact found by asking (R47-3-COUNTERS_AS_FACTS and
    R12-3-NAMED_INVENTOR_RULE, both standing).'
- id: R75-15-WHEN_TRAIT_FORMS
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE8
  title: A new Trait forms only at one of canon's four events, on the page
  status: live
  kind: mandate
  summary: A new Trait forms only at one of canon's four Resonance Events, written as its own scene, with
    no count cap, the scale of the event being the only limit.
  verbatim: Canon's four, on the page. A new Trait forms only at one of the four events, written as its
    own scene; no count cap, the scale of the event is the limit.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: §5, Traits
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: The Magic Frame
    operation: adds
  supersedes: []
  applies_to:
  - stats
  - magic-design
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE8. Canon''s four Resonance Events are trauma survived, Wellspring convergence, Temperance
    Insight (an inner conflict resolved so completely it becomes law), and rite or lineage invocation.
    No Threshold is required and no rate is set: the per-Stage cap and the Threshold-only options were
    not taken. The new Trait earns R70-84-GROWTH_MOMENTS_THAT_EARN''s readout when it registers and needs
    R70-90-FAST_NUMBERS_CLIMB''s shown cause, which its scene supplies; both stand. R71-37-TRAITS_THEY_FIRE
    (named at first fire) and R17-5-TRAIT_SCOPE stand. Who writes the Trait is R75-16-WHO_WRITES_PC_TRAIT;
    what its entry carries is R75-17-TRAIT_ENTRY_CARRIES. No older rule is reached.'
- id: R75-16-WHO_WRITES_PC_TRAIT
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE9
  title: Natalie writes a Trait in Isaac's character; it sticks when he keeps it
  status: live
  kind: procedure
  summary: When a Trait forms in Isaac's own character, Natalie writes its name, Reflection and Lattice
    property at the event, and it sticks only when Isaac keeps it, as a Third Name does.
  verbatim: Natalie writes, you keep. At the event Natalie writes name, Reflection (its kind) and Lattice
    property; it sticks only when you keep it, as a Third Name does.
  amends:
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: Isaac's own characters
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - naming
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: TE9. Follows R50-21-THIRD_NAMES's keep-or-strike, which stands. The belief a Trait states stays
    Isaac's to play (R49-01-WHOSE_HEAD, standing); as the question set it, an NPC's Traits are Natalie's
    to write either way. The restricted characters stay their creators' (R1-1-RESTRICTED_CHARACTERS_EXCLUDED,
    standing). The Lattice property is R17-5-TRAIT_SCOPE's, standing; the further lines every Trait entry
    carries are R75-17-TRAIT_ENTRY_CARRIES's, whose founding sentence Isaac writes for his own characters.
    No older rule is reached.
- id: R75-17-TRAIT_ENTRY_CARRIES
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE10
  title: A Trait entry carries a founding sentence, a rigidity line and its offices
  status: live
  kind: mandate
  summary: Beside its Lattice property, every Trait entry carries its founding sentence in the bearer's
    words, a rigidity line stating as fact what the bearer cannot safely contradict, and the offices it
    holds, its Permission line listing the signatures it allows.
  verbatim: 'Yes to: Founding sentence (The statement the Continuum accepted, in the bearer''s words,
    yours to write for your characters as in TE11. Denying it is the Shear Break, so every Trait carries
    a findable counter); Rigidity line (What the bearer cannot safely contradict, as a fact. NPCs play
    it on the page; for your characters it stays a fact for you to play); Offices held (Which of Bias,
    Permission, Nucleation and Ceiling it serves; a Permission line lists the signatures it allows).'
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: §5, Traits
    operation: extends
  - guide: character sheet template
    locus: Traits
    operation: extends
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE10, options A, B and C, all recommended; D, the bodily mark and the condition that shows it,
    was not taken, so the entry gains no mark line and R10-3-TRAITUS_SHAPE stands. Partly amends R17-5-TRAIT_SCOPE:
    a Trait entry still names the Lattice property altered, and now also carries these three lines. Denying
    the founding sentence is the Shear Break, so every Trait carries a findable counter, written as a
    fact (R47-3-COUNTERS_AS_FACTS, standing); Isaac writes it for his own characters ''as in TE11'' (R75-18-HOW_TRAIT_EVOLVES).
    The rigidity line is played on the page for NPCs and stays a fact Isaac plays for his own characters
    (R49-01-WHOSE_HEAD, standing). The four offices are canon''s: Bias, Permission, Nucleation and Ceiling.
    The Permission line ties signatures (R75-1-WHERE_TECHNIQUE_WRITTEN, R75-5-TECHNIQUES_ON_CRYSTAL) to
    their Trait.'
- id: R75-18-HOW_TRAIT_EVOLVES
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE11
  title: An evolving Trait takes the shape of the bearer's sentence
  status: live
  kind: definition
  summary: When a Trait evolves, the new law takes the shape of the sentence the bearer holds in the crisis,
    Isaac writes that sentence for his own characters, and the Crystal prints the result.
  verbatim: The bearer's sentence. The evolved law takes the shape of the sentence the bearer holds in
    the crisis; for your characters you write that sentence, and the Crystal prints the result.
  amends:

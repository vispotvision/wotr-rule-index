- id: R75-1-WHERE_TECHNIQUE_WRITTEN
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K1
  title: Signatures on their own pages, school arts on the school page
  status: live
  kind: mandate
  summary: Give each signature, and any art one person derived alone, its own page priced at its owner's
    exact reserve, keep each school art once on its school's page priced by Stage band, and link the card's
    technique rows to either page.
  verbatim: Signatures own, arts shared. A signature, or any art one person derived alone, gets its own
    page priced at its owner's exact reserve; a school art lives once on its school's page, priced by
    Stage band. The card's rows link to either.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique pages: signature pages and school pages'
    operation: adds
  - guide: character sheet template
    locus: Techniques section
    operation: extends
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K1. Partly amends R47-4-LEDGER_COSTS: a school art is still priced off the Essence Ledger''s
    band for its Stage, while a signature, or any art one person derived alone, is priced at its owner''s
    exact reserve. R47-2-FIELD_FORMAT stands: both kinds of page use the field format, and the card carries
    rows that link to them. The split follows R12-3-NAMED_INVENTOR_RULE, which stands: an art on its school''s
    page is documented and counterable by study, and a self-derived art is read live. R18-3-ENTRY_AS_CANDIDATE_ROW
    stands for every page. The answer does not say whether a card row repeats the FOW line R14-8-CHARACTER_SHEET_FOW_LINE
    puts in the sheet''s Techniques section; that row stands. Read with R75-23-WHAT_SCHOOL_KEEPS_BACK
    (in the world a school writes only its lower forms), R75-17-TRAIT_ENTRY_CARRIES (a Trait''s Permission
    line lists the signatures it allows) and R75-25-ONE_CARD_SHAPE (the card''s head names techniques
    with tell and counter).'
- id: R75-2-DESIGNED_OR_FOUND
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K2
  title: A technique's core is carded before it first fires
  status: live
  kind: mandate
  summary: Before a technique first fires its card holds its mechanism, cost, limit, tell and counter,
    and its name, forms, Readiness, evolutions and What nobody knows line are filled in afterward from
    what play showed.
  verbatim: Core first, rest found. Before first fire the card holds mechanism, cost, limit, tell and
    counter. Name, forms, Readiness (its casting-time figure), evolutions and What nobody knows fill in
    from what play showed.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: what the card holds before first fire'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K2. A floor before a technique''s debut, not a new format: R47-2-FIELD_FORMAT stands and the
    entry grows into it. The tell and counter are real before the fight, so R12-3-NAMED_INVENTOR_RULE''s
    live read and R71-30-HELD_BACK_REVEAL''s planted evidence rest on a true mechanism; both stand. R17-3-COUNTER_MANDATORY
    and R12-3-COUNTER_MANDATORY stand. Readiness filling in from play matches R71-28-DECIDES_CASTING_SPEED
    (''precision grows as cards are filled''), which stands: until the card''s figure is set the Alacrity
    row decides. The What nobody knows line keeps R17-3-WHAT_NOBODY_KNOWS_SCOPE''s scope. Figures filled
    in from play are never invented (R12-5-NEVER_INVENT_NUMBER). A sketch Isaac gives for his own character
    comes back whole at once (R75-3-SKETCH_TO_CARD), and every Counter passes R75-6-COUNTER_FAIRNESS_TEST.
    No older rule is reached.'
- id: R75-3-SKETCH_TO_CARD
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K3
  title: Isaac's sketch comes back as a whole card he keeps or strikes
  status: live
  kind: procedure
  summary: When Isaac sketches an ability for his own character, Natalie returns the full R47-2 entry
    at once with a proposed true name in that character's tongue, and each choice on it (name, call, vow)
    sticks only when Isaac keeps it.
  verbatim: Whole card, yours to keep. Natalie returns the full R47-2 entry at once, a proposed true name
    in your character's tongue included; every choice on it (name, call, vow) sticks only when you keep
    it.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Who Natalie is: supplying how an ability works the moment Isaac sketches one'
    operation: extends
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - naming
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: K3. Follows the keep-or-strike pattern of R50-21-THIRD_NAMES, which stands. The entry says what
    the ability is, never how to use it (R47-1-NO_APPLICATIONS, standing), and its uses in a fight stay
    Isaac's (R48-35-USES, standing); his character's choices stay his (R49-01-WHOSE_HEAD, standing). The
    whole entry comes back at once, above R75-2-DESIGNED_OR_FOUND's floor for a first fire. The proposed
    true name follows R8-21-NAME_IN_OWN_LANGUAGE and R8-22-LITERAL_GLOSS, both standing. A price Isaac
    names in the sketch is R75-4-YOUR_PRICE_AGAINST_LAW's. No older rule is reached.
- id: R75-4-YOUR_PRICE_AGAINST_LAW
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K7
  title: Isaac's named price stands and the mechanism is reworked to yield it
  status: live
  kind: procedure
  summary: When Isaac's sketch names its own cost and limit, those stand and Natalie reworks the mechanism
    until they fall out of it, and if no lawful mechanism yields them she says so in one line and offers
    the nearest.
  verbatim: Your price, new mechanism. The cost and limit you named stand; Natalie reworks the mechanism
    until they fall out of it, so R17-4 holds. If no lawful mechanism yields them, she says so in one
    line and offers the nearest.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'design order: a cost and limit named in the sketch'
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: Research-grounded techniques
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K7. ''so R17-4 holds'': R17-4-OUTPUTS_NOT_INPUTS and R17-4-READ_OFF_MECHANISM stand, since the
    cost and limit are read off the reworked mechanism, and R17-3-COST_DERIVED and R17-3-LIMIT_MECHANICAL
    stand on the same footing. The one line is R48-50-PUSHBACK''s plain line, which stands. The sketch
    is the one R75-3-SKETCH_TO_CARD answers. No older rule is reached.'
- id: R75-5-TECHNIQUES_ON_CRYSTAL
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K4

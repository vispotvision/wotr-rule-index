  notes: TE2. Both figures are set on the card and never invented (R12-5-NEVER_INVENT_NUMBER). The Readiness
    bought is the card figure R71-28-DECIDES_CASTING_SPEED reads, which stands. A clipped chant is still
    voice, so R20C-42-LAW_V_STAGE_GATE_REFRACTION's medium below Refraction stands, and R71-27-SPOKEN_WORKING_EXCHANGE
    still cuts the chant into the exchange. The release call (R8-24-RELEASE_MECHANIC) stays a separate
    lever on output. The chant stays in the caster's own tongue on the page (R50-26-CHANT_TONGUE, R51-28-CHANT_PAGE).
    No older rule is reached.

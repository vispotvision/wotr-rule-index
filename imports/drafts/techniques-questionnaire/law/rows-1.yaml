  - stats
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE11. Canon names three evolutions: Fusion (two Traits merge into one law) and Ascension (a
    Trait becomes Domain Law) take this shape, and Overgrowth stays a failure. The crisis is the breakthrough''s
    (R70-91-BREAKTHROUGH_PAGE, standing); the Crystal''s print is a readout, and R70-84-GROWTH_MOMENTS_THAT_EARN
    and R70-86-MANY_READOUTS_SCENE_CARRIES stand. For Isaac''s characters the sentence is his (R49-01-WHOSE_HEAD,
    standing), and R75-17-TRAIT_ENTRY_CARRIES has him write the founding sentence ''as in TE11''. R17-5-TRAIT_SCOPE
    stands for the evolved Trait''s entry. No older rule is reached.'

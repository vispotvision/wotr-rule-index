- id: R75-30-FOUR_CARDS_PAST_GATE
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: CH6
  title: Four Kharven cards past their gate stand as outliers with Strain
  status: live
  kind: mandate
  summary: The four Kharven cast cards standing past a Band gate their Stage has not opened (Lorn Stark,
    Edward Lambert, Bram Greymane, Heisuke) each keep their Level with standing Residual Strain, priced
    by Fracture of Worlds Part Ten at XP five percent lower and Overchannel and Backlash risk two percent
    higher per fifty Levels past, and Lorn and Heisuke owe one step now.
  verbatim: 'Outliers with Strain. R56-4 extended: each keeps his Level with standing Residual Strain,
    priced by Part Ten (XP five percent lower, Overchannel and Backlash risk two percent higher, per fifty
    Levels past). Lorn and Heisuke owe one step now.'
  amends:
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: 'Lorn Stark, Edward Lambert, Bram Greymane and Heisuke: Residual Strain past the gate'
    operation: adds
  supersedes: []
  applies_to:
  - stats
  - character-sheet
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CH6. ''R56-4 extended'': R56-4-PAST_THE_GATE_WITH_STRAIN, which kept Sodoku''s and Krothar''s
    Levels as in-world outliers with standing Residual Strain, now reaches these four cards and gains
    Part Ten''s price; an extension, not a supersession. The four, from the question: Lorn Stark Level
    168 at Stage III and Edward Lambert 142 at III (Level 100 asks Stage IV), Bram Greymane 224 at IV
    and Heisuke 278 at V (Level 200 asks VII). Read against those figures, Lorn stands 68 Levels past
    his gate and Heisuke 78, one full step of fifty each, which is the ''one step now'' they owe; Lambert
    (42 past) and Bram (24 past) owe none yet. Part Ten states the price for every fifty Levels held above
    a Band ceiling; the answer applies it to these four and does not restate it for Sodoku and Krothar.
    Options B (raise the Stage) and C (lower the Level, the reserve following the Level law down) were
    not taken. Every figure in the price is Part Ten''s, so R12-5-NEVER_INVENT_NUMBER is met; Stage names
    follow R20C-30-STAGE_NAMES_FROM_FOW.'

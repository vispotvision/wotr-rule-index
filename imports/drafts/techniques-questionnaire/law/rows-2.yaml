  - character-sheet
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CH4. Options A (all sixty-four on every card) and C (totals and peaks everywhere, an unset Sub-Stat
    set only when a scene needs it) were not taken. ''Your characters'' as CH5 decides'' resolves to R75-29-WHO_SPENDS_LEVEL_POINTS:
    Isaac spends his own characters'' points. R39-1-CANON_STAT_MODEL stands and is the model being filled
    (points buy Sub-Stats; a Primary is the sum of its eight; its Grade the mean). Extends R38-2-ORIGINATED_SHEETS_RECOST_TO_CURRENT_ALLOTMENT:
    on a full card the re-cost now also spends the unset Sub-Stats inside the re-costed totals along the
    Path, logged, where build/recost.py today keeps Primaries and listed peaks only (the question''s context);
    the allotment and the trim stand. R12-5-NEVER_INVENT_NUMBER stands; the answer keeps the spend inside
    the re-costed totals and has it logged. R39-3-STAGE_ONE_THRESHOLD_COUNTS, R70-83-FIGURES_PLAIN_NARRATION
    and R70-93-BUILD_TALK_DIALOGUE stand; exact readouts and build talk read the full card''s figures.'

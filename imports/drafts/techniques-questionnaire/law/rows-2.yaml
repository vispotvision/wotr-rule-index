  source:
    file: ''
    lines: null
  notes: 'CH7. Options B (a Derived figures footer), C (the instrument''s hedge on the card) and D (estimates
    kept off the card) were not taken. The six styles run from ''~850'' to ''Incomplete in the Record''
    (the question''s context); the sweep applies the one mark to every card (R75-44-WHAT_JOINS_CARD_SWEEP).
    Partly amends R14-2-ESTIMATE_MARKING: a figure no sheet supplies may print on the card, marked ''(est.)'';

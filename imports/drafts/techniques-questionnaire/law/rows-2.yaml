- id: R75-37-RIVAL_BETWEEN_MEETINGS
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: CH12
  title: A rival grows on his own Front between meetings
  status: live
  kind: procedure
  summary: A rival's growth between meetings runs on a Front, a world clock that ticks between sessions,

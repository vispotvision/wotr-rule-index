    left for the conflict log, is not answered here. The tool texts that write ''pending Isaac'' or ''marked
    pending'' into a card (convert_character, create_character) are owed the rewrite (R75-43-WHERE_TECHNIQUE_LAW_LANDS).'
- id: R75-32-NEW_VOICE_BLOCK_SLOTS
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: CH8
  title: The voice block gains speaker type, chant tongue and lying tell
  status: live
  kind: mandate
  summary: 'The card''s voice block gains three slots: the speaker type (the researched real-world model,
    moved from the notes onto the card), the chant tongue his chants and release calls run in (his own
    under R50-26 or a learned one under R70-26), and the lying tell (what his body does when he lies or
    withholds).'
  verbatim: 'Yes to: Speaker type (The researched real-world model (a customs clerk, a field surgeon,
    a drover) moves from the notes onto the card, so every return starts from the same voice); Chant tongue
    (The tongue his chants and release calls run in (his own under R50-26, or a learned one under R70-26,
    as Kwon''s Accord Latin), so Borin''s Latin forge-liturgy is caught and fixed); Lying tell (What his
    body does when he lies or withholds, the body kind of R49-36''s three tells, so the frequent lies
    of R48-42 can be caught by a player who reads bodies).'

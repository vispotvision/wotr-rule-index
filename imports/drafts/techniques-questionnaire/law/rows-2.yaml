- id: R75-25-ONE_CARD_SHAPE
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: CH1
  title: Every full card opens on a one-screen table head
  status: live
  kind: mandate
  summary: Every full character card opens with a one-screen head above its seventeen sections, carrying
    the header, the stat line, the combat grammar (Verdict, Blade, Percussion or Expenditure), the Traits
    and techniques by name each with its tell and counter, and the voice sample line, and Natalie fights
    from that head.
  verbatim: 'A table head, then sections. A one-screen head above the seventeen: header, stat line, combat
    grammar (Verdict, Blade, Percussion or Expenditure), Traits and techniques by name with tell and counter,
    the voice sample line. Natalie fights from the head.'
  amends:
  - guide: character sheet template
    locus: 'Card head: a one-screen table above the seventeen sections'
    operation: adds
  supersedes: []
  applies_to:
  - character-sheet
  - stats
  - combat
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CH1. Options A (the seventeen sections alone, updated) and C (Cozbi Mahuo''s merged layout)
    were not taken, so the converter''s fourteen-heading skeleton, which names Cozbi''s layout as its
    format reference, is the one rebuilt to this shape (R75-43-WHERE_TECHNIQUE_LAW_LANDS, R75-47-PROOF_AND_ORDER).
    The seventeen sections (NATALIE.md: Identity through Fracture Log) stay whole beneath the head. Partly
    amends R14-8-CHARACTER_SHEET_FOW_LINE (''Unchanged in sections''): the template gains the head above
    its sections; each technique keeps its FOW line. The head''s combat grammar is the one R71-69-GRAMMAR_GUN_BENCH_FIELD
    has each card name; its sample line is R52-03-VOICE_BLOCK''s ''one sample line'' slot; tells and counters
    are written as facts (R47-3-COUNTERS_AS_FACTS); the techniques named there link to the pages R75-1-WHERE_TECHNIQUE_WRITTEN
    sets. Table Rule 5 settles a fight from the rows R14-3-STATS_DECIDE_TABLE names, which the head puts
    on one screen. R58-12-AS_OF_LINE_ON_EVERY_CARD and R54-11-CARD_HEADER_AT_A_MOMENT stand for the header.
    A short card carries its own shorter list (R75-26-RUNGS_OF_PERSON).'
- id: R75-26-RUNGS_OF_PERSON
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: CH2
  title: 'Three rungs: roster entry, short card, full card'
  status: live
  kind: definition
  summary: A person climbs three rungs, a roster entry, then a short card (header, FOW line, Traits by
    name, one signature technique with tell and counter, voice block and Lore), then a full card, and
    today's compact cards become short cards.
  verbatim: Three rungs. Roster entry; a short card (header, FOW line, Traits by name, one signature technique
    with tell and counter, voice block, Lore); a full card. Today's compact cards become short cards.
  amends:
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: 'The rungs of a person: roster entry, short card, full card'
    operation: adds
  - guide: character sheet template
    locus: Short card
    operation: adds
  supersedes: []
  applies_to:
  - character-sheet
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CH2. Options A (two rungs, compact cards filled out to full) and C (shape by role) were not
    taken. Below the first rung R50-27-NEW_NPC_NAME stands: a new person is a role until they speak twice
    or matter. The roster entry is the record the wotr-npc skill builds (want, refusal, knows, lie, voice,
    body, stat line, per the question''s context), as R61-16-FURVEUS_IS_A_ROSTER_NPC and R61-23-CASSIAN_AULT_ROSTER_NPC
    rule for two people, and R61-17-GILLUS_GETS_FULL_CARD is a full card; those case rulings stand and
    now sit on named rungs. The archive''s hundred-odd compact cards become short cards; the Kharven header
    cards, which the question sets beside them, are not named by the answer and are rebuilt to a rung
    in R75-45-WHICH_CARDS_FIRST''s order. A short card''s voice block is the R52-03-VOICE_BLOCK block,
    which that row requires on every major card. What lifts a person a rung is R75-27-WHAT_LIFTS_RUNG;
    how much of the stat sheet each rung carries is R75-28-HOW_MUCH_SHEET; the full card''s shape is R75-25-ONE_CARD_SHAPE.'
- id: R75-27-WHAT_LIFTS_RUNG
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: CH3
  title: A deciding fight, a returning rival or a POV lifts a person
  status: live
  kind: mandate
  summary: A person gets at least a short card before the first scene whose outcome his stats must decide,
    a spared rival who returns under R70-104 gets a full card, and anyone whose head a scene sits in gets
    a full card before that scene.
  verbatim: 'Yes to: Stats decide a scene (The first time his stats must decide an outcome on the page,
    he gets at least a short card before that scene is written); Becomes a rival (A rival under R70-104,
    spared and returning, gets a full card, since his growth and his debts must be traced); Holds a POV
    (Anyone whose head a scene sits in gets a full card first, since his readouts come from his own sheet).'
  amends:
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: Lifting a person a rung
    operation: adds
  supersedes: []
  applies_to:
  - character-sheet
  - stats
  - adjudication
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CH3, multi-select (A, C, D taken; B, a third scene on the page, not taken, so a scene count
    lifts nobody). The question''s context keeps Isaac''s word able to lift anyone at any time, whatever
    the triggers. A stats-decided scene reads the rows R14-3-STATS_DECIDE_TABLE names; a POV''s readouts
    come from his own sheet (R70-78-WHERE_SCREEN_COMES_FROM); a rival''s growth and debts are traced on
    his card, read with R75-37-RIVAL_BETWEEN_MEETINGS. R70-104-RIVAL_BOND stands: the rival still recurs
    only by a mercy paid for on the Ledger, and the full card follows that return. R42-7-FOUR_PATHS stands.
    The rungs are R75-26-RUNGS_OF_PERSON''s.'

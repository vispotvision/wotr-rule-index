  - naming
  - register
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'CH8, multi-select (A, B, C taken; D, a named swap partner, not taken, so R52-07-SWAP_CHECK runs
    by ear against everyone in the scene as before). Partly amends R52-03-VOICE_BLOCK: its ten fixed slots
    become thirteen. Partly amends R52-29-NPC_RECIPE: the researched speaker type, ''credited in the notes''
    there, now sits on the card. The chant tongue slot reads R50-26-CHANT_TONGUE (his own language) and
    R70-26-LEARNED_TONGUES_BESIDE_LATIN (a learned tongue, as Kwon''s Accord Latin), both standing; the
    answer names Borin''s Latin forge-liturgy as the leftover the slot catches. The lying tell is the
    body kind of R49-36-LIE_TELLS'' three, so the frequent lies of R48-42-LIES can be caught by a player
    who reads bodies; read with R72-25-HOW_MANY_LIES (table law 2026-10-04), which logs each roster lie
    with its tell. R20C-49-GLOSS_RIGHTS_CARD_FIELD stays a separate card field, and R71-72-ALCHEMIST_VOICE''s
    ''reads first'' line stays an alchemist''s optional addition.'

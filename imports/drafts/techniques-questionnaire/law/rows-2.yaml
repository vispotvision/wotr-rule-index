    R20C-34-ESTIMATES_CANON_ON_USE stands: the estimate is canon on use and a source value beats it on
    contact, so a source figure replaces the mark when it arrives. R12-5-NEVER_INVENT_NUMBER and R56-8-LEVEL_LAW_SETS_RESERVE_BAND

    The cap is NATALIE.md''s (''seventeen sections, Identity through Fracture Log, under 16,348 characters''),
    the Trello card limit by the wotr-write skill''s note; no indexed rule row carries it, so nothing
    is superseded, and the answer is what that sentence already says. By its words the cap binds Identity

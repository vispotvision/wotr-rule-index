- id: R47-3-COUNTERS_AS_FACTS
  pack: Ability Law 2026-09-26
  pack_number: null
  section: C
  title: Counters and tells are stated as facts, not instructions
  status: live
  kind: mandate
  summary: Tells and counters stay mandatory but are written as facts about what the ability
    cannot survive and what gives it away, never as instructions to an opponent.
  verbatim: 'Tells and counters stay, written as facts only: what the ability cannot survive
    and what gives it away, never an instruction to an opponent. Players work out the tactic.'

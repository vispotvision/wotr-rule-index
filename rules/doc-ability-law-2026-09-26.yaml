rules:
- id: R47-1-NO_APPLICATIONS
  pack: Ability Law 2026-09-26
  pack_number: null
  section: A
  title: 'What an ability entry describes: what it is, never how to use it'
  status: live
  kind: mandate
  summary: An ability entry states the mechanism, what it can act on, its costs, limits, tell
    and counters, and never how it is used in a fight.
  verbatim: 'An ability entry describes what the ability is, never how to use it: the mechanism,
    what it can act on, its costs, its limits, its tell and its counters. No tactics, combos,
    worked fights or lines telling the reader how to use it; the owner invents the applications.'
  amends:
  - guide: Ability and Technique Design Guide
    locus: Ability and Technique Design Guide
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - items
  - documents
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (ability-rules questionnaire)'
  source:
    file: ''
    lines: null
  notes: Recorded in RULINGS.md under 2026-09-26 — Ability Law (R47).
- id: R47-2-FIELD_FORMAT
  pack: Ability Law 2026-09-26
  pack_number: null
  section: B
  title: The field format replaces the Design Chain and the six-line card
  status: live
  kind: mandate
  summary: New ability pages use the card top (Summary card, Codex line, FOW line, Origin) plus
    the Physics, Metaphysics, Mechanism, Essence and Counterplay field blocks; the Design Chain
    and six-line card are retired.
  verbatim: 'New abilities use the field format: the card top (Summary card, Codex line, FOW
    line, Origin) followed by the Physics, Metaphysics, Mechanism, Essence and Counterplay blocks,
    each a set of one-line **Field** · value entries. The Design Chain and the six-line card
    are retired as page formats.'
  amends:
  - guide: Ability and Technique Design Guide
    locus: Ability and Technique Design Guide
    operation: replaces
  supersedes:

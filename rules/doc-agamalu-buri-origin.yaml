# Canon Amendment: The Agamalu Homeland, The Büri Origin, The Striking of
# Sātūlagi, Name Corrections. Standalone doc, no pack number; R21 in the
# four-document Büri/Moto naming cluster (R20 oldest, R23 newest). Written
# before the Büri-to-Moto reversion (Moto Reversion Ledger, R22), so all
# character/house names here are "Büri" -- superseded by R22's mapping
# where a specific character or house is named, even though the
# underlying canon facts (locations, rulings) carry forward under the new
# names. "All content in this amendment is proposed canon pending Isaac's
# ratification, excepting the four rulings in Section I, which are
# Isaac's own direction" (closing lines) -- Section I is status:live,
# everything else status:proposed unless separately marked pending.
# Mostly worldbuilding/lore content is not extracted row-by-row per
# BRIEF's exclusion of rationale and scene-setting description; this file
# keeps the rulings, the name correction, and the open items.

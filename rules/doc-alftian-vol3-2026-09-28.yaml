- id: R68-2-LEGION_NIGHT_AT_THE_SEAT
  pack: Alftian Codex Volume III Ratification 2026-09-28
  pack_number: null
  section: vol3 2
  title: The Legion night at the Carver's Seat, where Frithia watched
  status: live
  kind: definition
  summary: The Legion night at the Carver's Seat, where Frithia watched.
  verbatim: 'The Legion night: the Carver''s Seat was testing a Legion-class working for the kingdom''s standard
    when the summoner''s hold broke; Mu-jin, there to deliver a correction to the entering grammar, laid a chalk
    circle and called as what he was, and the hosts stood down one at a time. Frithia watched from the hall door,
    thirty-four, come south to teach the Seat''s wardens.'
  amends:

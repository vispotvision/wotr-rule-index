  section: vol3 9
  title: The Genesio Trace completed into Mu-jin; the hall fell back to Riptide
  status: live
  kind: definition
  summary: The Genesio Trace completed into Mu-jin; the hall fell back to Riptide.
  verbatim: 'At Genesio the Trace in the first coffin, laid by an Elfin astronomer two hundred and sixty years dead
    and aimed at Mu-jin''s signature, completed into him through Anamnesis. He reads it as a correction: correspondence
    is a law of response. The hall fell from Whirlpool back to Riptide, the lamps pulse again, and nothing left
    in the stone can be woken.'

- id: R57-11-MECHANISM_IS_EFFECT
  pack: Rulings Backfill 2026-09-26
  pack_number: null
  section: 2026-09-24 — new (Mechanism and Effect)
  title: Mechanism and Effect are one thing
  status: live
  kind: mandate
  summary: A working's Effect is written as its mechanism playing out; no Effect line that another mechanism
    could produce, no Mechanism line that leaves the Effect separate.
  verbatim: 'Mechanism and Effect are one thing. The Effect of a working is its mechanism playing out:
    what happens is written as how it happens (the glyph moves a boundary, the law does what it does,
    and that is what the target sees and feels). No Effect line that could be true of a different mechanism,
    and no Mechanism line that leaves the Effect to be described separately.'
  amends: []
  supersedes: []
  applies_to:
  - magic-design
  - magic-mechanism
  - character-sheet
  - documents
  verification: []
  ratified: Isaac, 2026-09-24, ruled directly (RULINGS.md entry '## 2026-09-24 — new')

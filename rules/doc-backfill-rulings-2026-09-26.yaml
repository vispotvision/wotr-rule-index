- id: R57-19-RESERVE_SCALING_ONE_FACTOR
  pack: Rulings Backfill 2026-09-26
  pack_number: null
  section: 2026-09-25 — C-059 (WAR-127; amends WAR-70)
  title: An out-of-band reserve scales the whole card by one factor
  status: live
  kind: procedure
  summary: An out-of-band EU reserve is moved to the band's geometric-mean set point and every other EU
    figure on the card takes the same factor; Flux Density, AU/s and eta stand; no stated reserve, no
    scaling.
  verbatim: 'Each card whose reserve R44-1 puts outside its Stage''s band is scaled by one factor: factor
    = (band midpoint in decades, the geometric mean of floor and ceiling joules / 1 MJ) / (the card''s
    stated reserve). Every other EU figure on that card (technique, Form and working costs, per-use figures)
    is multiplied by the same factor, so each cost keeps its stated share of the reserve and distinct
    figures stay distinct. Flux Density, AU/s and eta stand as written. A card with no stated reserve
    is not scaled by this ruling and is logged.'
  amends: []
  supersedes: []
  applies_to:
  - stats
  - character-sheet
  verification: []
  ratified: Isaac, 2026-09-25, ruled directly (RULINGS.md entry '## 2026-09-25 — C-059 (WAR-127; amends
    WAR-70)')
  source:
    file: ''
    lines: null
  notes: Replaces WAR-70's per-figure set point (never a rule row). Extended by R56-7-SCALING_PER_ENTITY
    and re-run on the Level-law bands by R56-9-SCALING_ON_LEVEL_BANDS, both of which cite this method.

  pack: Combat Law 2026-10-04
  pack_number: null
  section: K3
  title: 'Western combat models: Sharpe, Sanderson, the HEMA novelists'
  status: live
  kind: definition
  summary: Name Cornwell's Sharpe (volley, smoke, the stormed breach, tactics read in the action), Sanderson's
    hard magic (rules planted before, costs and counters findable) and the HEMA novelists Christian Cameron

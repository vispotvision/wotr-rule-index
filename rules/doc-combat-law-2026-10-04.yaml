- id: R71-33-DRAIN_SHOWS
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC7
  title: The drain shows in the body, in the waste and in the opponent's read
  status: live
  kind: mandate
  summary: Between readout lines, show a falling reserve through a bank of body signs keyed by culture
    to the Ledger's thresholds, through waste heat that grows as eta falls, and through the opponent's
    read and his choice to make the spender spend.
  verbatim: 'Yes to: The body, by threshold (A bank of body signs keyed to the Ledger''s lines, committed
    spending and Starvation: cold hands, tin on the teeth, the slow grip. Logged by culture, so the nosebleed
    stops carrying everything); The waste grows (As η (eta, efficiency) falls, the same work sheds more
    heat, so the room shows the drain: the thawed ring widens, the air shakes harder. Canon''s own law,
    written as a rule of the page); The opponent reads it (The drain is shown through the other fighter''s
    read and his choice to make the spender spend. The Counterplay doctrine, on the page). Not taken:
    By Family.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§7.1, the reserve clock: what reaches the page'
    operation: extends
  - guide: Standing Inventories, NATALIE.md and the wotr-write skill
    locus: a bank of drain signs by culture
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - magic-mechanism
  - prose-law
  - stats
  - standing-inventory
  verification:
  - 'verify: stale-device watch'
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC7. The body bank is keyed to the Ledger''s lines (committed spending, Starvation below a tenth
    of reserve) and logged by culture in each Standing Inventory, so the overdraw nosebleed stops carrying
    every scene; R71-103-COMBAT_CHECKS_VERIFY_SCENE''s stale-device watch warns on it past one a scene.
    The waste option writes R47-8-WASTE_IS_HEAT and the Combat Guide''s §7.1 Starvation row (''brighter
    for the same work, sheds more, delivers less'') as a rule of the page. The opponent''s read is the
    Counterplay doctrine. R60-03-HARD_RESERVE_CLOCK, R70-88-NUMBERS_INSIDE_FIGHT (no running figures),
    R70-85-SCENE_MOMENTS_THAT_EARN, R70-89-BODY_FIRST_NUMBER_FIRST and R48-37-COST_SHOWN stand; these
    signs carry the clock between readout lines. ''Not taken: By Family'': no per-Family drain sign. No
    older rule is reached.'

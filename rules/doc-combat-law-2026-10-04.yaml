- id: R71-4-FAR_FROM_FLOOR
  pack: Combat Law 2026-10-04
  pack_number: null
  section: K4
  title: The combat floor rescaled and paid by grammar
  status: live
  kind: budget
  summary: Carry the full combat floor at first display and finisher, items 1 to 4 at every exchange that
    turns the fight and item 8 at a turn's close, each item stated where it happens, and let each grammar
    pay it its own way (Verdict the read before and the mechanics after, on the body; Blade pass by pass;
    Percussion and Expenditure the cost every exchange).
  verbatim: 'Floor by grammar. Rescaled as in A, and each grammar pays the floor its own way: Verdict
    states the read before and the mechanics after, on the body; Blade pass by pass; Percussion and Expenditure
    carry the cost every exchange. (Option A there reads: Rescale, same ratios. R13-4-DENSITY_BUDGET is
    rewritten for today''s lengths: full floor at first display and finisher, items 1 to 4 at every exchange
    that turns the fight, item 8 at a turn''s close. Every item stated where it happens.)'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: §4 (density of the combat floor)
    operation: replaces
  - guide: WOTR_Combat_Craft_Guide.md
    locus: The four grammars
    operation: extends
  supersedes:
  - R13-4-DENSITY_BUDGET
  applies_to:
  - combat
  - scene-structure
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K4, option B, which takes option A''s rescale whole. Supersedes R13-4-DENSITY_BUDGET in its
    own words (''R13-4-DENSITY_BUDGET is rewritten for today''s lengths''): the 2,500-word duel and the
    700 to 1,500 word turn give way to today''s lengths (turns about 3,500 words under R48-28-TURN_LENGTH,
    set pieces 5,000 and up under R48-46-WORD_FLOOR). Partly amends R13-4-COMBAT_FLOOR, whose eight items
    stand, by setting where each grammar pays them. Works with R70-102-STILLNESS_TRACED_PASSES_LONG (duel
    shape by grammar); R13-8-RECONSTRUCTIBLE_ADJUDICATION stands.'
- id: R71-5-ROLEPLAY_TURNS_AGAINST_WRITTEN
  pack: Combat Law 2026-10-04
  pack_number: null
  section: K5
  title: Standing orders in a roleplay fight
  status: live
  kind: procedure
  summary: In a roleplay fight Isaac may post conditions such as 'if he closes, I cut low', and Natalie
    runs them exchange by exchange until the first branch they do not cover, then stops the turn on that
    threat.
  verbatim: Standing orders honoured. You may post conditions ('if he closes, I cut low'). Natalie runs
    them exchange by exchange until the first branch they do not cover, then stops on that threat. Table
    Rule 1 gains this exception.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 1 (turn shape)
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K5. Table Rule 1 (stop at his next decision, never resolve a multi-decision action in one go)
    has no indexed row; this is the exception it gains, and the NATALIE.md line is owed the rewrite. Read
    with R49-29-TURN_FILL: in a fight run on standing orders, the stop at the next decision falls on the
    threat at the first branch the orders do not cover. R48-35-USES stands: the conditions are Isaac''s
    own uses, the NPC''s answers Natalie''s. R47-11-TIME_AND_ENERGY (the six-second turn) and R48-28-TURN_LENGTH
    are unchanged. What the run may write of his fighter is R71-6-PLAYER_FIGHTER_PAGE. Extended by R72-5-STANDING_ORDERS_OUTSIDE_FIGHTS
    (table law 2026-10-04): standing orders now run in every scene type, talk, travel and investigation
    included; Natalie runs them to the first branch they miss, and any line the PC speaks is only Isaac''s
    posted words. Partly amended by R72-36-WHO_POSTS_WHEN (table law 2026-10-04): at the Discord table,
    in fights and contests run in a fixed round order, a player who misses the reply window the Judger
    sets has their posted standing orders play for them and the round moves on; free posting holds in
    talk and travel.'
- id: R71-6-PLAYER_FIGHTER_PAGE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: K9
  title: What Natalie writes of a player's fighter
  status: live
  kind: mandate
  summary: For a fighter who belongs to a player, Natalie writes the resolved hit, the wound by structure,
    its ATLS class and what the hand can no longer do as world facts, places the tell but never draws
    the deduction, shows him from an NPC's POV only as that NPC registers him, and shows his working's
    cost only where others could see it, keeping the spend in the Stat Ledger.
  verbatim: 'Yes to: Wounds as world facts (Once your stated move resolves, the hit, the wound by structure,
    its ATLS class (the trauma surgeons'' blood-loss scale) and what the hand can no longer do are written
    as world facts; how he bears it stays yours); The tell placed, the read his (Natalie puts the evidence
    in the room (the heel, the smell, the needle) and never draws the conclusion; the deduction, floor
    item 3, is your post, as CW14''s D already leaves the reading to you); Felt from across the room (From
    an NPC''s POV a player''s fighter is only what that NPC''s eyes, body and room register, the Geturo
    model; his reasons and his Crystal stay dark. It covers guest players at the Discord table too); Outward
    cost only (Natalie shows what his working costs where others could see it (heat off the skin, thaw
    at his boots, R48-37) and keeps the spend in the Stat Ledger (the running figures in the notes); the
    inside is yours).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Combat and consequence
    operation: adds
  - guide: WOTR_Combat_Craft_Guide.md
    locus: §4 (the floor for a player's fighter)
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - pov
  - adjudication
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K9, all four options (digest). Partly amends R49-01-WHOSE_HEAD in a fight (the read''s conclusion,
    how he bears a wound and the inside of his cost are the player''s), R13-4-COMBAT_FLOOR for a player''s
    fighter (item 3''s deduction is his post; item 7 shows only outwardly, the figures going to R14-7-STAT_LEDGER_CONTENTS''s
    Stat Ledger) and R48-37-COST_SHOWN (only the cost others could see reaches the page). From an NPC''s
    POV his reasons and his Crystal stay dark, the Geturo model; this covers guest players at the Discord
    table. R1-1-RESTRICTED_CHARACTERS_EXCLUDED stands. The reading half matches R71-23-TELL_READ (CW14''s
    D); how far a turn runs is R71-5-ROLEPLAY_TURNS_AGAINST_WRITTEN. Extended by R72-6-WORLD_WRITES_HIM
    (table law 2026-10-04): carried outside fights, his involuntary responses land on his body as facts,
    as wounds do under this row, and in talk and investigation Natalie lays the tells and never draws
    his conclusion, the deduction being his post.'

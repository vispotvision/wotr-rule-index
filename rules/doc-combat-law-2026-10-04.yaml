    file: ''
    lines: null
  notes: 'K3; O''Brian''s Aubrey-Maturin was not taken. Sharpe is the only model for the gunpowder battle
    the archive has never written (see R71-60-VOLLEY_SMOKE_DRILLED_LINE). Sanderson sits beside R70-71-EXPLAINING_WORKING_MID_FIGHT
    (rules shown beforehand). The HEMA novelists are the Western school''s model and sit with R70-100-MARTIAL_VOCABULARY_NAMES_MOVES

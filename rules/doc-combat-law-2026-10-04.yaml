    written); Sanderson, hard magic (Rules planted before, physics as choreography, costs and counters
    findable, so the reader does the sum. Already close to R70-71''s rules shown beforehand); HEMA novelists
    (Christian Cameron and Sebastien de Castell: armoured fights from inside the steel, the phrase (one
    unbroken attack and answer), joints, the visor slot, the ground. The Western school''s model). Not
    taken: O''Brian, Aubrey-Maturin.'

- id: R71-1-WHERE_LINE_FALLS_FIGHT
  pack: Combat Law 2026-10-04
  pack_number: null
  section: K1
  title: Western body, Eastern read inside a fight
  status: live
  kind: mandate
  summary: Inside a fight, write the exchange, the wound and the cost the Western way, clinical, and run
    the read, the stillness before the cut and a rule's reveal the Eastern way, long and deductive, as
    Naruto and Bleach do.
  verbatim: Western body, Eastern read. The exchange, the wound and the cost stay Western and clinical;
    the read, the stillness before the cut and a rule's reveal run Eastern, long and deductive, the Naruto
    and Bleach way. The next Combat Guide writes it in.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: Where the line falls in a fight (the strands inside one fight)
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - prose-law
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K1. Partly amends R70-3-STRAND_LEADS_LAYER, which gave combat to the Western strand whole: inside
    one fight the read, the stillness before the cut and a rule''s reveal now run Eastern, while the exchange,
    the wound and the cost stay Western. R12-8-COMBAT_GUIDE_READ_LENGTH (the read at length, now timed
    by R71-23-TELL_READ) and R70-15-TEMPO_STILLNESS (jo-ha-kyu) are read with it; R70-9-TECHNICAL_MYSTIC_REGISTERS
    is not named and stands. Works with R71-23-TELL_READ (how a tell is shown and read) and R71-4-FAR_FROM_FLOOR
    (Verdict states the read before the cut).'
- id: R71-2-EASTERN_COMBAT_MODELS
  pack: Combat Law 2026-10-04
  pack_number: null
  section: K2
  title: 'Eastern combat models: Togashi, Gu Long, Musashi, Jujutsu Kaisen'
  status: live
  kind: definition
  summary: Name Togashi's Hunter x Hunter (fights as logic), Gu Long's one cut (the named model for Verdict
    grammar), Inoue's Vagabond with Yoshikawa's Musashi (the fight decided inside the fighter, a model
    for Japonic POVs) and Akutami's Jujutsu Kaisen (Domain clashes decided in a stated order) as the Combat
    Craft Guide's Eastern combat models beside Kishimoto and Kubo.
  verbatim: 'Yes to: Togashi, Hunter x Hunter (Fights as logic: the opponent''s rules inferred from evidence,
    tested and exploited, and the winner is whoever knows his own limits best. Its vows that trade a limit
    for power wait for MC6); Gu Long, the one cut (The duel is the wait: the long read and a single exchange,
    the floor paid on the body. Becomes the named model for Verdict grammar (read, rank, commit); FT16
    asks whether the cut itself is seen); Inoue and Yoshikawa, Musashi (Inoue''s manga Vagabond and Yoshikawa''s
    novel Musashi: the deciding event happens inside the fighter (fear, the fixed mind, no-mind), with
    pages of breath and footing. A model for Japonic POVs); Akutami, Jujutsu Kaisen (Domain clashes decided
    in a stated order, with the burnout after a Domain as the counter-window. FOW Part Twenty-Two already
    sets the order; burnout and the sure-hit (a Domain that cannot miss) would be new canon).'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: Combat models (Eastern)
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - prose-law
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K2, all four options taken (three were recommended). Gu Long becomes the named model for R1-1-VERDICT_GRAMMAR
    (read, rank, commit), whose skeleton stands; whether the one cut itself is seen is R71-66-FIGHT_THAT_MOSTLY_READ
    (FT16). Hunter x Hunter''s vows that trade a limit for power are ruled by R71-32-VOWS_LIMITS (MC6).
    Jujutsu Kaisen comes in as a model: the clash order stays FOW Part Twenty-Two''s, and the burnout
    after a Domain (the counter-window) and the sure-hit (a Domain that cannot miss) come in as new canon
    with this yes, any figure for either taken from a card or a ruling, never invented (R12-5-NEVER_INVENT_NUMBER);
    R71-45-RAISING_DOMAIN_DUEL and R71-46-DOMAIN_CLASH_PAGE set how a Domain rises and how a clash shows.
    Combat models only: the style models of R70-4-WESTERN_MODELS and R70-5-EASTERN_MODELS are untouched.'

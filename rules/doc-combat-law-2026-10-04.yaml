- id: R71-20-FIGHTS_END
  pack: Combat Law 2026-10-04
  pack_number: null
  section: CW11
  title: Yield, flight, a code's stop and the killing's law
  status: live
  kind: mandate
  summary: Let a fight end by a yield that binds under the culture's custom with its terms on the Ledger,
    by flight, its pursuit decided on Dexterity (Celerity), the reserve and the ground, leaving a witness
    and a debt, or by a formal duel code's stated stop that binds both men, and give every killing its
    culture's legal aftermath on the page as a Front or a Ledger line.
  verbatim: 'Yes to: Yield on terms (Surrender is legal and binds by the culture''s custom (a Kharven
    word before witnesses, an Accord form under seal); the terms go on the Ledger as R70-104''s debt);
    Flight, adjudicated (Breaking off and running is always a choice; pursuit is decided on Dexterity
    (Celerity), the reserve and the ground (FT12 shapes the chase), and a fled fight leaves a witness
    and a debt); A code ends it (Formal duels run under the culture''s code, with seconds and a stated
    end (first blood, a disarm, a yield); the code''s stop binds both men, and breaking it is a Ledger
    debt); The killing''s own law (Every killing carries its culture''s legal aftermath (a declaration,
    a blood-price or labour-debt, outlawry) on the page, opened as a Front or a Ledger line).'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: How fights end
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 7: the ledger'
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - adjudication
  - session-protocol
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: CW11, all four options (digest). Yield terms go on the Ledger as R70-104-RIVAL_BOND's debt; breaking
    a duel code is a Ledger debt. The chase is shaped by R71-62-CHASES_PURSUITS (FT12). The killing's
    law takes each culture's analogue under R53-11-JUSTICE (a declaration, a blood-price or labour-debt,
    outlawry). R48-31-STAKES stands, so death stays possible; R48-30-SURPRISES and R60-01-BRUTAL_LETHALITY
    are unchanged.

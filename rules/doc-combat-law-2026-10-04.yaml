    counted toward its effect, the dying long. Its time-stopping sense would need a ruled mechanism and
    stays out); SenescentSoul, Delve (Drain-rate tension: the reserve clock worked out so the reader knows
    when a fighter will cross into Starvation (below a tenth of his reserve). The figures stay between
    exchanges and in the notes, under R70-88''s no running figures).'

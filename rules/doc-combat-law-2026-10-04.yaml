- id: R71-43-SUPPRESSION_PAGE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC17
  title: Suppression costs the body, leaks into the room and shows on instruments
  status: live
  kind: mandate
  summary: A practitioner holding his Pressure in pays in named places of his body (jaw, collar, temper)
    at a cost that grows with the approach, leaks faintly into the room for a sharp eye or good Gnosis
    to catch, and leaves a sag on a gauge or coil.
  verbatim: 'Yes to: The cost in his body (Holding it in tires him in named places, jaw, collar, temper,
    and the cost grows with the approach. The Combat Guide gains a bank of signs by culture); Small leaks
    in the room (R70-69 at its faintest: the draw-hum dips and a dog lies down as he passes. A sharp-eyed
    reader, or a POV with good Gnosis, can catch a suppressed man); Instruments catch it (A gauge or coil
    reads what eyes miss; the Board''s clerks and the Measurewrights can find a suppressed man by the
    sag he leaves on a needle).'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§6.2 Pressure: suppression, with a bank of signs by culture'
    operation: adds
  supersedes: []
  applies_to:
  - magic-mechanism
  - combat
  - pov
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: MC17. The room's leak is R70-69-PRESSURE_AURA at its faintest (the draw-hum dips, a dog lies
    down); R70-69 stands. A POV with good Gnosis catching a suppressed man is R70-79-CAN_READ_WHOM's sense
    of rank, and the needle's sag is that row's instrument; it stands. R70-70-INTENT_FELT_BODY's 'answered
    by suppression' now has its cost. R9-3-EYES_AS_TELL stands for the moment suppression drops. Canon's
    'suppression is a skill and it is tiring' (the Counterplay page) and NATALIE's 'Suppression is a tiring
    skill' are the ground. No older rule is reached.
- id: R71-44-FACULTY_READ_MAN
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC18
  title: A faculty prints exact figures unless the target's Ward outranks it
  status: live
  kind: definition
  summary: A practitioner's faculty prints an opponent's exact figures when his Gnosis Perception outranks
    the target's Resilience Ward by Grade, and only a hedged range when it does not, Ward being the counter.
  verbatim: Exact unless warded. A faculty prints exact figures where the reader's Gnosis Perception outranks
    the target's Resilience Ward by Grade, and a hedged range where it does not. §7 gains the row; Ward
    is the counter.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§7: the faculty-read row; §6.1 ''Whose figures a fighter can see'''
    operation: adds
  supersedes: []
  applies_to:
  - stats
  - adjudication
  - combat
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC18. Settles what R70-85-SCENE_MOMENTS_THAT_EARN left flagged (whether a faculty appraisal
    may print exact figures). Partly amends R70-79-CAN_READ_WHOM: ''Another''s exact figures need an instrument''
    now admits a faculty whose Gnosis Perception outranks the target''s Resilience Ward by Grade; the
    rest of R70-79 stands. R70-78-WHERE_SCREEN_COMES_FROM stands: the bearer''s own Crystal stays blind
    to others, and the faculty is a Gnosis sense, not that line. The hedged range is R70-99-NUMBER_NOT_YET_CANON''s
    hedge. The line is a readout at R70-85''s appraisal moment, so R70-88-NUMBERS_INSIDE_FIGHT (no running
    figures) and R70-89-BODY_FIRST_NUMBER_FIRST still govern where it sits.'
- id: R71-45-RAISING_DOMAIN_DUEL
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC19
  title: A Domain rises by attention, and from Stage XI is held in and let go
  status: live
  kind: definition
  summary: In a duel a Domain below Stage XI rises over turns by the holder's attention, unnamed, at a
    cost the notes track, as his display beat; from Stage XI, where canon has it leak, suppression holds
    it in and the holder lets it go in a beat.
  verbatim: 'Attention, then held in. Below Stage XI it rises by attention as in A. From Stage XI, where
    canon has it leak, suppression holds it in and the holder lets it go in a beat. Originated; you rule
    it. (Option A there reads: Raised by attention. Part Twenty-Two read plainly: the holder concentrates
    and the Domain comes up over turns, unnamed, at a cost the notes track. Its rising joins R9-3-SCOPE''s
    triggers as his display beat.)'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§6.2, the display beat: a Domain in a duel'
    operation: adds
  - guide: WOTR_Visual_Aesthetic_Guide.md
    locus: 'Section 4a: the display triggers'
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - magic-mechanism
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC19. ''Originated; you rule it'': the Stage XI half is new canon, ratified by this answer.
    ''As in A'' adopts Option A below Stage XI, quoted in the verbatim, including ''Its rising joins R9-3-SCOPE''s
    triggers as his display beat''; this index reads the let-go from Stage XI as that same rising, so
    it is his display beat too. Partly amends R9-3-SCOPE: a Domain''s rising joins its list of triggers.
    R70-73-MANY_DISPLAY_BEATS_PER stands: the rising is the holder''s one display beat. Fracture of Worlds
    Part Twenty-Two stands (''Domains are not techniques''; held at continuous cost from Stage VIII; leaking
    from Stage XI), and the named-and-cast option was not taken. The holding is suppression, as in R71-43-SUPPRESSION_PAGE.
    R2-6-DOMAINS_BREAK_NOT_KILL (formations), R70-69-PRESSURE_AURA and R13-6-ANIME_GRAMMAR_TRANSLATION_AID
    stand.'
- id: R71-46-DOMAIN_CLASH_PAGE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC20
  title: A Domain clash shows as a moving border, its deciding step named once
  status: live
  kind: mandate
  summary: When two Domains meet in a duel, show the seam between the two laws in the room and let it
    move, have one voice name the deciding step once, and pace the clash like an exchange so it reconstructs.
  verbatim: The moving border. The seam between two laws shows in the room and moves; one voice names
    the deciding step once. Reconstructible, and paced like an exchange.
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: '§6.2: a Domain clash'
    operation: adds
  supersedes: []
  applies_to:
  - combat
  - magic-mechanism
  - adjudication
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: MC20. The deciding step is one of Fracture of Worlds Part Twenty-Two's ordered steps (the Stage
    gap; Dominion Sovereignty and Gravity; Wellspring compatibility; Tempering Coherence and Maturity
    as the tiebreak), named once by one voice inside R12-4-VOICE_MIXING_RULE's cap, and the notes still
    cite it (R14-3-TRACEABILITY). Reconstructible under R13-8-RECONSTRUCTIBLE_ADJUDICATION. R70-57-DESCRIPTION_INSIDE_FIGHT's
    held instant still comes at the deciding moment. R71-24-ROWS_COME_OUT_LEVEL names the step that breaks
    a level exchange the same way. No older rule is reached.
- id: R71-47-SHOWING_SCALE
  pack: Combat Law 2026-10-04
  pack_number: null
  section: MC21
  title: 'Scale in a city fight: a street dip, the aftermath walk and the claims'
  status: live
  kind: mandate
  summary: When top-ladder practitioners fight in a city, carry the scale by one marked dip into a commoner's
    head in the street before the lock resumes, by walking the ruined ground afterward, and by entering
    lives and property on the Ledger as claims settled in a later scene at the Accord's schedule.
  verbatim: 'Yes to: One street beat (At a marked break, one commoner in the street gets a short dip inside
    her head, then the lock resumes. Scale seen from the ditch, by R70-11''s device); The aftermath walk
    (The scale is shown after, walking the ground (R57-24). The fight stays tight; the ruin tells the
    size); The claims come in (Lives and property go on the Ledger as claims, settled in a later scene
    at the Accord''s schedule, as R54-15 lets a later scene pay an aftermath. WT10 asks the fighter''s
    own bill). Not taken: A report sizes it.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: Scale in a city fight
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: POV and interiority
    operation: extends
  supersedes: []
  applies_to:
  - combat
  - pov
  - scene-structure
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the combat questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'MC21. The street dip borrows R70-11-WIDE_VIEW''s marked device for a fight that is not a battle,
    so it partly amends R70-11-WIDE_VIEW and, through it, R39-7-NO_NPC_THOUGHT_UNDER_POV_LOCK and R48-40-NPC_THOUGHTS,
    which gain this as a second exception to the lock: one commoner, one short dip, at a marked break.
    The aftermath walk is R57-24-AFTERMATH_IS_THE_TELL. The claims follow R54-15-AFTERMATH_PAID_LATER''s
    precedent of a later scene paying an aftermath; R54-15 stands. The fighter''s own bill is R71-99-BILL_AFTER_FIGHT
    (WT10). ''Not taken: A report sizes it'': the report device was not chosen; R13-6-SCALING_VOCAB_RESTRICTED
    stands, and R13-A (ruled 2026-09-12) is not reached. R70-69-PRESSURE_AURA stands.'

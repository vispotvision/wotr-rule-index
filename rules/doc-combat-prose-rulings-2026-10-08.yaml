  id: R77-2-COMBAT_ROLEPLAY_TELLS
  section: R13-4-COMBAT_FLOOR
  title: Combat roleplay shows tells and keeps mechanism in notes
  kind: mandate
  summary: Only in combat roleplay, show effects, readable tells, visible body cost, read and fault as
    behaviour; mechanism, system figures and the explanation stay in author notes, the card and Stat Ledger.
    Written set pieces and books keep the full floor.
  verbatim: 'Isaac''s direction (2026-10-08): combat roleplay never hands the opponent the how. In any
    roleplay fight (Desktop turn, Discord post, and above all an improvement of Isaac''s combat post)
    the page shows what the move does and the tells a sharp opponent could read (sound, light, frost,
    smell, breath, stance, what repeats, what it costs the body), never the full mechanism, the figures
    or why it works; those stay in the author notes, the card and the Stat Ledger. In roleplay the floor
    (R13-4, R71-4, R12-2, R12-3, and R70-76''s "full mechanism") is paid on the body and in the notes,
    the read and the fault shown as behaviour; a voice explains only what it has earned by reading the
    tells (R71-23). Applies to his PC and NPCs alike. Written set pieces and books keep the full floor.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Combat roleplay floor; R13-4, R71-4, R12-2, R12-3 and R70-76
    operation: extends
  applies_to:
  - prose-law
  - combat
  - magic-mechanism
  - stats
  - verification
  - session-protocol
  verification:
  - --combat
  - --turn
  notes: 'Exact RULINGS.md paragraph under 2026-10-08 — R13-4-COMBAT_FLOOR. Its context labels the restriction
    to roleplay, rather than written set pieces, as Claude''s reading of Isaac''s direction; that recorded
    scope is preserved. Applies to PCs and NPCs. A voice explains only what it earned by reading the tells
    (R71-23). No old floor is superseded wholesale; mechanism and accounting remain required in notes.
    The verifier checks visible system figures mechanically; whether an explanation is earned or a mechanism
    is leaked remains a manual read. Superseded 2026-10-17 by R79-6-FIGHTS_ON_THE_PAGE: a roleplay fight
    shows the full mechanism on the page, like a written set piece.'

  id: R77-1-EUROPEAN_FENCING_ACTIONS
  section: R70-100-MARTIAL_VOCABULARY_NAMES_MOVES
  title: European fencing actions in plain body language
  kind: ban
  summary: In all WOTR prose, including dialogue, replace HEMA and European fencing-manual jargon with
    body, blade, timing and distance; check 22 warns on the jargon instead of rewarding it. Eastern terminology
    remains an open question.
  verbatim: 'Isaac, 2026-10-08: no HEMA or European fencing-manual terms in WOTR prose, for every character,
    post, scene and book (Vor, Nach, Indes, Zufechten, Krieg, Vom Tag, Ochs, Pflug, Alber, Zornhau, Winden,
    Absetzen, Durchwechseln and the like). Every guard, cut, tempo and measure is described as the body
    doing it: where the weight sits, where the blade is held, who moves first, how far apart they stand.
    This supersedes R70-100''s requirement to name moves in the POV''s school vocabulary for European
    schools. It also amends the rows that require or reward that vocabulary: R13-6-HEMA_VOCAB, R13-4-COMBAT_FLOOR
    (tempo is still stated, but in plain words, not Vor/Nach/Indes), R13-9-VERIFY_CHECKS_22_26 (check
    22, HEMA density, should stop counting these terms as a virtue and should instead WARN when they appear),
    and the term lists in R1-1-BLADE_GRAMMAR and R1-1-YOKO_ASSIGNED. The mechanics of those grammars (the
    bind, the read, the measure) still apply; only the jargon goes.'
  amends:
  - guide: WOTR_Combat_Craft_Guide.md
    locus: European school vocabulary and combat floor
    operation: replaces
  - guide: NATALIE.md and the wotr-write skill
    locus: European school vocabulary
    operation: replaces
  applies_to:
  - prose-law
  - combat
  - register
  - verification
  verification:
  - check-22
  notes: 'Exact RULINGS.md paragraph under 2026-10-08 — R70-100-MARTIAL_VOCABULARY_NAMES_MOVES. This replaces
    only the European-school naming requirement of R70-100, not the whole row; no full supersedes link
    is set. The context explicitly leaves Eastern school terms such as kesa-giri unanswered. Bind, read,
    measure and the other mechanics still apply. Amended 2026-10-17 by R79-6-FIGHTS_ON_THE_PAGE: the open
    question is answered: Eastern school terms are free and never required; the European jargon ban stands.'
- pack: Combat Prose Rulings 2026-10-08

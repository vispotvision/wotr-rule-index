- id: R60-01-BRUTAL_LETHALITY
  pack: Combat, Society and Politics Law 2026-09-26
  pack_number: null
  section: Combat, society and politics
  title: Brutal Lethality
  status: live
  kind: mandate
  summary: 'Lethality among ordinary fighters is brutally real: one good cut or a ball in the gut can
    kill, often days later from infection; most fights end in the first seconds; a wounded man is out
    of the fight.'
  verbatim: 'Lethality among ordinary fighters is brutally real: one good cut or a ball in the gut can
    kill, often days later from infection; most fights end in the first seconds; a wounded man is out
    of the fight.'
  amends: []
  supersedes: []
  applies_to:
  - combat
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (combat, society and politics questionnaire)'

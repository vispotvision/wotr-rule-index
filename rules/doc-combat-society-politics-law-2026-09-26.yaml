- id: R60-26-NIGHT_WATCH_SOCIETY
  pack: Combat, Society and Politics Law 2026-09-26
  pack_number: null
  section: Factions
  title: Night Watch Society
  status: live
  kind: definition
  summary: 'The Night Watch Society is one body with the Night Watch: a crown-chartered society. It holds
    a crown charter and warrant, is organised as chapters (the Timberline among them) with walkers on
    fixed walks and a bulletin office, answers to...'
  verbatim: 'The Night Watch Society is one body with the Night Watch: a crown-chartered society. It holds
    a crown charter and warrant, is organised as chapters (the Timberline among them) with walkers on
    fixed walks and a bulletin office, answers to the crown, and keeps the Night Register, which takes
    up what the Lattice Classification Bureau (a separate office) closes. ''The Society''s warrant, not
    the Bureau''s'' is the crown''s warrant as the Society holds it.'
  amends: []
  supersedes: []
  applies_to:
  - worldbuilding
  verification: []

  id: R78-1-VOCABULARY_PUSHED_HIGH
  section: R51-13-WORD_STOCK
  title: Vocabulary pushed high
  kind: mandate
  summary: Narration and italic thought reach for the most exact, most resonant word, leaning hard to
    the rare, Latinate, archaic and technical, several to a page and more in a set piece, from the elevated
    bank widened by ear; each POV keeps its reach and speech follows the card.
  verbatim: 'Isaac''s direction 2026-10-11: vocabulary is pushed high. Narration and italic thought reach
    for the most exact and most resonant word, leaning hard toward the sophisticated: rare, Latinate,
    archaic and technical words a reader has to stop and weigh, several to every page and more in a set
    piece; the elevated bank (C-091) is used freely and widened by ear. The chosen word must carry more
    than its common substitute in meaning, sound or implication. Each POV keeps its reach (Verinus, Lambert,
    Cozbi highest; Sodoku spare but exact; Hild a child''s grasp). Speech follows each card''s voice.
    Unchanged: slop bans (R51-10, R70-35), working-man anatomy in explicit scenes, plain words in technique
    entries (R76-1), body-and-blade words over fencing jargon (R77-1). Written into desktop/NATALIE.md
    Prose Standards.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Vocabulary and diction
    operation: replaces
  applies_to:
  - prose-law
  - register
  verification: []
  notes: 'Exact RULINGS.md paragraph under 2026-10-11 — R51-13-WORD_STOCK, applied to the index 2026-10-13
    (it had stayed out of rules/, so load_rules kept serving R51-13''s ''by ear: whatever the sentence needs'').
    Supersedes R51-13. Revives the elevated bank that R57-31 had superseded whole: R51-12''s list less numinous
    (R57-31, WOTR sense only) and eldritch (cosmic stock, R74-45). The widened bank is desktop/style-bank/elevated-words.md.
    R51-11 collisions and the hard-ban lists stand. Amended 2026-10-14 by R78-3-PHYSICAL_AND_SATURATED:
    density saturated, stacking allowed, English of every root, POV reach picks which words.
    Amended 2026-10-16 by R78-11-WORDS_FROM_THE_THING: the bank is retired; words come from what is described.'

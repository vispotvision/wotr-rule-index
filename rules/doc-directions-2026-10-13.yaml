  id: R78-2-MODERN_SCIENCE_IDEAS
  section: C-158
  title: Modern scientific ideas in battle and magic
  kind: mandate
  summary: Modern science, to the present day, may explain workings and fights and drive magical research;
    it is known through the Aether by high-Stage practitioners, Measurewrights and scholars, never by
    commoners; built hardware keeps the R53-01 span and the R53-03 firearm ceiling.
  verbatim: 'Isaac''s direction 2026-10-13: the 1900 limit on scientific ideas is retracted. Ideas from
    modern science (physics, chemistry, biology and the rest, up to the present day) may be used in battle
    and in magical advancement: to explain how a working or a fight operates, to drive a practitioner''s
    or a school''s magical research, and to found new techniques. Who knows them is earned by magic: high-Stage
    practitioners, Measurewrights and scholars reach them through the Aether before any instrument could,
    so they speak in diagnostic voices and the author notes, while commoners keep their own words for
    the same thing. Manufactured technology is unchanged: the Imperial Age span (R53-01, the 1800s into
    the middle of the 1900s) and the firearm ceiling at 1900 hardware (R53-03) still govern what is built
    and carried. This closes C-158: R11-C''s "nothing post-1900" no longer limits ideas, and R53-01 governs
    hardware.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: The Magic Frame, Pack Eleven paragraph
    operation: replaces
  - guide: Ability Technique Design Guide
    locus: Research and mechanism
    operation: extends
  applies_to:
  - magic-mechanism
  - magic-design
  - combat
  - worldbuilding
  verification: []
  notes: 'Closes C-158. Lifts R11-C''s 2026-09-12 ''nothing post-1900'' for ideas only; R53-01 (technology
    span) and R53-03 (firearms) still govern hardware, and R49-45 already exempts science words from timeless
    narration. Medicine practised on the page stays era-appropriate by place (its own row); the notes may
    use modern clinical science as they already do. Amended 2026-10-14 by R78-3-PHYSICAL_AND_SATURATED:
    modern science words are legal in narration as elevated vocabulary.'

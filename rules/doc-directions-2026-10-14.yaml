  id: R78-6-POWER_ANIME_ON_PAGE
  section: page-craft-questionnaire
  title: 'Power on the page: coloured auras, transformations, open sensing, vows, releases'
  kind: mandate
  summary: 'Qi cultivation with Hunter x Hunter, Dragon Ball, Bleach and Naruto ideas: a personal coloured
    aura, full transformation power-ups, Stage-scaled damage shown, a signature sound per technique with
    anime flair, open sensing and talk of strength, vows central, held power revealed on planted hints,
    upsets across one Stage with a read, named staged release forms, and fewer readouts.'
  verbatim: 'Isaac''s direction 2026-10-14, by questionnaire (imports/drafts/page-craft-questionnaire/,
    round 1 batch 4, round 2 batch 5, round 3 batches 2 and 3): power on the page. WOTR''s system is a
    mixture of qi cultivation and the ideas of Hunter x Hunter, Dragon Ball, Bleach and Naruto, and that
    shows in how power reads. Each practitioner''s power has a visible aura in their own colour and feel,
    brighter as they push. A power-up or breakthrough is full transformation spectacle: the body and the
    world change visibly. Damage to the surroundings scales with Stage and is shown. Every technique has
    its own signature sound, with anime flair. Practitioners sense each other''s strength and talk about
    it openly, Bleach and Dragon Ball style. Self-imposed vows and conditions that buy power are common
    and central, and reading an enemy''s condition is half the fight. Strong fighters hold power back
    for a reason and reveal it at the right moment, with planted hints. A lower-Stage fighter can beat
    a higher one across one Stage with a read; two or more takes something extraordinary, a vow or a breakthrough.
    Many practitioners have named, staged release forms tied to the system, each with a name, a look and
    a cost. Status screens and readouts become fewer, Bleach style: numbers live in the notes and diagnostic
    talk.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is; the magic frame; prose standards
    operation: replaces
  applies_to:
  - magic-mechanism
  - magic-design
  - combat
  - stats
  - prose-law
  verification: []
  notes: 'Supersedes R9-3 (aura as fracture, ''it glowed'' banned): a person''s aura is their own colour
    and may glow; shard-edged geometry survives as one person''s look where a card gives it. Amends R70-69
    (the aura shows on the person with the room), R70-2, R70-84, R70-85, R70-86 (readouts only at a breakthrough,
    a re-assay that moves something or an arc''s end, never in a fight; the verify_scene cap is unchanged
    until build/verify.py is free of another session''s open edit), R75-12 (vows central). Owed: the release-form
    system (names, looks, costs, Stage and Trait gates), drafted by ChatGPT under the standing split and
    checked here; until it lands, no release form is invented on the page except inside its card.'

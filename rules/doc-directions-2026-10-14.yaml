  id: R78-7-CULTIVATION_AND_STORY
  section: page-craft-questionnaire
  title: 'Cultivation and story: three roads to breakthrough, sects, Aizen-shaped arcs, crews'
  kind: mandate
  summary: Breakthroughs by crisis, seclusion or tribulation; resources drive plot; xianxia ranks in WOTR
    institutions; real young masters; tournament, training, rescue and war arcs under one main villain
    revealed in stages with ranked lieutenants; understandable villains; rival to ally; mentors may die;
    bonds mostly hold; a core crew; the dead stay dead save rare costly returns; romance central; time
    skips; cliffhanger endings; Hollow-style Well-spawn; POV-eye fanservice.
  verbatim: 'Isaac''s direction 2026-10-14, by questionnaire (imports/drafts/page-craft-questionnaire/,
    round 2 batches 2, 3, 6 and 8, round 3 batches 2 and 3): cultivation and story. Stage breakthroughs
    come by crisis, seclusion or tribulation, a mixture of all three. Cultivation resources (Drafts, Cores,
    treasures) are a real driver of plot. Sects, schools and academies run on xianxia ranks (outer and
    inner disciples, elders, ranking contests) inside WOTR''s own institutions. The arrogant young master
    and his humbling are used, written as real people with real wants. WOTR runs tournament, training,
    rescue and invasion, and war arcs, under a Bleach or Dragon Ball shape: one main villain with many
    people working for him, Aizen or Yhwach, felt early and revealed in stages, over an elite ranked circle
    of lieutenants each with a power, a look, a philosophy and a fight that matters. Villains are understandable,
    some arguably right. The rival goes from rival to reluctant ally. Mentors: some die, some do not.
    Bonds mostly hold and are tested hard. The protagonist runs with a core crew, each with a role. The
    dead stay dead, with rare costly exceptions. Romance short of the explicit is central to many threads.
    Time skips run between big arcs. Chapters and arcs end on hooks and cliffhangers. Well-spawn are Hollow-style,
    shaped by the Well that made them. Fanservice outside explicit scenes comes only from what the POV
    notices.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is; the magic frame; prose standards
    operation: replaces
  applies_to:
  - scene-structure
  - worldbuilding
  - magic-design
  - stats
  - prose-law
  verification: []
  notes: 'Amends R70-91 (crisis is one road; seclusion and tribulation are others, and a breakthrough
    in crisis still lands as R70-91 says), R70-17 (hook and cliffhanger now the default close), R53-06
    (Well-spawn take a Hollow-style design from their Well), R70-114. Agent call under R72-2, Isaac may
    overturn: a rare return from death never runs by full resurrection on paper (R61-56 stands); it is
    costly and Codex-backed, a revenant or a stalled Crossing.'

  id: R78-8-VOICE_DIALOGUE_HUMOUR
  section: page-craft-questionnaire
  title: 'Voice, dialogue and humour: big emotion, phonetic accents, anime gags from the right mouths'
  kind: mandate
  summary: Thought woven through action; emotions anime-big; full phonetic accents; soldiers' swearing;
    plentiful mixed banter; action-beat tags; each culture's address; earned explanations and big lines;
    anyone funny in their own way, anime gags from the characters who do that; named people react to power;
    one italic thought per NPC a scene.
  verbatim: 'Isaac''s direction 2026-10-14, by questionnaire (imports/drafts/page-craft-questionnaire/,
    round 1 batches 5 to 7, round 2 batch 7, round 3 batch 1): voice, dialogue and humour. Thought, memory
    and feeling are woven steadily through the action. Emotions play anime-big throughout. Accents are
    written in full phonetic spelling. People swear like real soldiers and thugs, in English and their
    culture''s oaths; nobles and priests barely. Banter is plentiful, a mixture of anime style with ribbing
    and jokes, because WOTR is its own thing. Dialogue tags are action beats, with said when needed. People
    address each other in their culture''s own forms. A character explains a power aloud only from what
    they could know. Declarations, battle cries and villain speeches land at the moments that carry them,
    in each speaker''s voice; catchphrases only where a card gives one. Anyone may be funny in their own
    way, and anime gags come from the characters who actually do that sort of thing, Borin and his kind.
    Banter and ribbing, anime reactions, dry and gallows wit, and crude and bawdy humour all fit. Big
    power draws reactions from specific named people in the crowd. NPCs keep one italic thought each per
    scene.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is; the magic frame; prose standards
    operation: replaces
  applies_to:
  - dialogue
  - register
  - prose-law
  - pov
  verification: []
  notes: 'Supersedes R70-113 and R5-D-HUMOUR_BARRED (the setup, deadpan and reaction rhythm is legal for
    the characters who play that way; R5-D-HUMOUR_PERMITTED stands). Amends R70-72 and R74-34 (a power
    reveal''s reaction is given to named people with their own words and body; the horror-witness allowance
    stands), R48-11. Restates R49-37 and R51-27 (full phonetic accents). Agent call under R72-2, Isaac
    may overturn: ''anime-big'' emotion still never writes Isaac''s PC''s feeling (R72-6).'

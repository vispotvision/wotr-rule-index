  id: R78-4-WOTR_IDENTITY_TONE
  section: page-craft-questionnaire
  title: 'What WOTR is: dark shonen cultivation, magitech, its own beauty'
  kind: mandate
  summary: 'WOTR is a dark shonen cultivation fantasy in a magitech world: dark stakes, shonen heart,
    frequent wins at a price, cruelty only when earned; Arcane/FMA, Bleach and Naruto settings, Final
    Fantasy and LotM looks; magitech everywhere in cities; a beautiful, fantastical land; not muted, not
    driven home as grimdark.'
  verbatim: 'Isaac''s direction 2026-10-14, by questionnaire (imports/drafts/page-craft-questionnaire/,
    round 2 batches 1 and 4): what WOTR is. WOTR is a dark shonen fantasy with cultivation at its core,
    in a magitech, magipunk world where things run off magic; it is its own thing and is not driven home
    as grimdark. Dark stakes, shonen heart: the world is brutal and costs are real, and people fight back
    with will, bonds and growth and can win. The protagonists win often, each win at a visible price,
    and some arcs end in loss. Cruelty comes when the story earns it, at turning points, written in full;
    the world is dangerous, never grinding every page. The look draws on Arcane and Fullmetal Alchemist,
    the settings of Bleach and Naruto, Final Fantasy, and Lord of the Mysteries together. The land is
    wildly fantastical and earthlike at once, beautiful throughout, and its own. Magitech is everywhere
    in the cities (lights, heat, water, transport) and thins in the towns and the wilds. Cities are grand
    and lived-in: breathtaking skylines and craft over real streets, smells and poor quarters. The palette
    is not muted or grey; WOTR has its own beautiful design.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is; the magic frame; prose standards
    operation: replaces
  applies_to:
  - prose-law
  - worldbuilding
  - scene-structure
  - register
  verification: []
  notes: 'Amends R53-28 (visual reference widened to four touchstones), R59-07 (cities grand and lived-in,
    beyond Victorian-Edwardian), R70-1 (the anime and cultivation models join the blend), R70-114 (the
    warm-bond floor stands; its ''grimdark'' frame does not). Agent call under R72-2, Isaac may overturn:
    the 2026-09-12 Draw Age ruling ''draw is guild-licence only (commoners burn oil)'' narrows to private
    drawing; a city''s public magitech runs on licensed district mains that commoners live by, and the
    towns and wilds burn oil.'

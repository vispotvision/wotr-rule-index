  id: R78-5-FIGHTS_ANIME_ON_PAGE
  section: page-craft-questionnaire
  title: 'Fights on the page: shouted English names, afterimages, geysers, free flashbacks'
  kind: mandate
  summary: Eastern school terms free in narration; techniques shouted in English; afterimages for speed;
    battles as bodies, fog of war, spectacle strikes, joined vignettes; full plain-word anatomy, anime
    blood, wounds shrugged off then felt, small hits add up; Hunter x Hunter reasoning; free flashbacks;
    talk at the pauses; one POV per stretch; will counts through vow, Resonance or breakthrough.
  verbatim: 'Isaac''s direction 2026-10-14, by questionnaire (imports/drafts/page-craft-questionnaire/,
    round 1 batches 1 to 3, round 2 batch 3, round 3 batches 1 and 2): fights on the page. Eastern school
    terms (kamae, maai, chudan, qinggong, dantian) are free in narration as anime flavour. A technique''s
    name is shouted as it fires, anime style, and the name is in English. A move too fast for the eye
    shows as afterimages. Formations are written as bodies only, the POV knows only what they can see,
    a high-Stage strike on massed troops is anime spectacle with the bodies in it, and a battle runs as
    close vignettes joined by the battle''s turn. An open wound shows its anatomy in plain words; blood
    sprays in anime geysers; a fighter shrugs a wound off in the moment and the pain arrives after; every
    small hit is noted and they add up. A fighter thinks the fight through at length, Hunter x Hunter
    style. Flashbacks run freely mid-fight, Naruto style, the opponent''s included. Fighters talk at the
    pauses between exchanges, taunts and declarations, and go quiet while the blades move. A fight stays
    in one head and switches POV only at a marked break. Will changes outcomes through the system: a vow,
    a Resonance or a breakthrough turns resolve into power the stats can feel, never a free win.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is; the magic frame; prose standards
    operation: replaces
  applies_to:
  - prose-law
  - combat
  - mass-combat
  - pov
  - naming
  verification: []
  notes: 'Supersedes R70-103 (one flashback per fight, the POV''s own). Amends R70-100 (its open question
    answered: Eastern terms are free, unlike the English abstractions R78-3 bans), R8-21 and R50-08 (the
    name on the page and in the shout is English), R8-24 and R50-09 (the release call is the shouted name,
    every firing). Agent calls under R72-2, Isaac may overturn: a card may keep a culture-tongue true
    name beside its English one, in the card and notes; the shrug-off never writes Isaac''s PC''s pain
    or reaction, which stay his (R71-6, R72-6, R73-19); in Isaac''s PC''s fights the Hunter x Hunter reasoning
    is the NPC''s, built only from tells shown, and never hands the PC''s mechanism (R77-2, R71-23 stand).'

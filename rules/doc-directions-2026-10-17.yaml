  id: R79-6-FIGHTS_ON_THE_PAGE
  section: prose-rp-questionnaire
  title: Fights and workings on the page
  kind: mandate
  summary: RP fights show full mechanism; blows as body, path, target, result and cost; no readouts in fights;
    auras glow; plain anime wounds; one causal line at first display; narration may explain, no voice cap;
    only fairness counts bind; battle formulas optional; figures in mouths; names in English or own tongue;
    world magic as law; jargon free; misses summed, hits noted.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/prose-rp-questionnaire/): fights
    and workings on the page. A roleplay fight shows the full mechanism on the page, like a written set piece.
    Every blow is body, path, target, result and what it cost; what a fighter read and the opening he found
    are shown as behaviour. No readout inside a fight; readouts only at a breakthrough, a re-assay or an arc''s
    end. Auras glow and afterimages may be light. Wounds are written plain and anime on the page, full gore
    and geysers, shrugged off then felt; clinical names and haemorrhage class live in the notes and a medic''s
    mouth. A working''s first display carries one clear causal line, in a mouth or in narration; the full three-strata
    account lives on the card and in the notes. Narration may explain what the trained POV understands, and
    any voice that has earned it may explain; the two-voice cap and the one-read cap retire. Only fairness
    binds as a count: every fight Natalie stages has a findable way out, and a death gets a sign and an exit
    first; every other per-fight count is guidance and the display-beat caps retire. The battle formulas retire
    as rules: the lead keeps POV in battle and may break through or vow mid-fight; the Single Act, name-three
    and the aftermath stages are optional tools. In a fight, figures live in mouths, never narration. A technique
    or release is called in English or the speaker''s own tongue, as the character would. The world''s own
    magic is stated as law with its reasons kept. Fight jargon is free and never required. Exchanges where
    nothing lands may be summed in a sentence; every hit that lands gets its own clause and they add up.'
  amends:
  - guide: NATALIE.md and the wotr-write, wotr-rp and wotr-ledger skills
    locus: Fights and workings on the page
    operation: replaces
  applies_to:
  - combat
  - adjudication
  - magic-mechanism
  - prose-law

  id: R79-2-LEAN_TABLE
  section: prose-rp-questionnaire
  title: The table runs lean
  kind: mandate
  summary: No close (archive only), nothing printed under turns, straight into play from a beat, Scene Menu
    only without one; one verify_scene a turn; once-per-scene kits, context, research; brief rulebook once;
    docket decided at the table; lies only where wanted; no notice quota; abilities explained unprompted.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/prose-rp-questionnaire/): the
    table runs lean. There is no scene close: when a scene ends it is archived with archive_scene and nothing
    else is written (no State of Play rewrite, Ledger, Front, roster or Inventory update) unless he asks. Nothing
    is printed under a turn: no OOC foot, no rule ids, no notes block; full author notes only when a scene
    is archived. Session start: given a beat, Natalie opens on the place-and-hour header and writes; the Scene
    Menu only when he gives no beat, three hooks from anywhere with no source rule and no reward or penalty
    lines; the Rumor Mill, pass_time at start, the printed recap and the limits statement retire (limits only
    at the start of a brand-new chat). Per turn: one verify_scene, every FAIL fixed, WARNs read but not looped;
    once per scene: kits and FOW lines, scene_context, and research only of what is new, reused after; scene_brief
    and the full pipeline for set pieces only. The live rulebook is loaded in brief once a session, a domain
    in full text on first use, and never re-read after compaction. An open docket item is decided at the table
    and the writing goes on. NPCs lie where their want makes them, with no required lie per NPC. No unexplained-notice
    quota anywhere. When he sketches an ability out of character, Natalie supplies how it works without being
    asked.'
  amends:
  - guide: NATALIE.md and the wotr-write, wotr-rp and wotr-ledger skills
    locus: The table runs lean
    operation: replaces
  applies_to:
  - session-protocol
  - verification

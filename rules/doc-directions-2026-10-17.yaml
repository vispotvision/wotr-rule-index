  id: R79-12-MACHINE_AROUND_WRITING
  section: coverage-questionnaire
  title: The machine around the writing
  kind: mandate
  summary: Nightly slimmed; book timer off, quotas stripped; idle services stopped, read-only MCP fixed; Paperclip
    text gone; sessions read by task; repo is the only skill source, skills consolidated; orphaned tools deleted;
    core MCP surface with an ops flag; sync tidied.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/coverage-questionnaire/): the
    machine around the writing. The nightly job keeps validate, sync, backup and push health and new archives,
    and drops the recurrence report, the prose pass, the Büri sweep and the nightly ChatGPT review; its findings
    baseline resets after this apply. The book timer is disabled and chapters run when he asks; the book pipeline
    loses its lie and misreading quotas and rhythm FAILs, and BOOK_PIPELINE.md becomes a short spec of the
    workflow. n8n, the jobs server and the loopback MCP are stopped and disabled; the read-only MCP''s token
    is fixed. The Paperclip leftovers go and CLAUDE.md says Natalie rules openly through log_ruling; writing
    and roleplay sessions read NATALIE and the brief rulebook, while CONTINUE, SHARED_MEMORY and the phase
    stops apply to rules and code work, and CONTINUE keeps recent blocks with its history moved to a file.
    The repo is the only source of the WOTR skills: the claude.ai-synced copies go, wotr-rp folds into wotr-write
    as its turn section, wotr-rules into a wotr-write reference, and the judger retires. recurrence_report,
    voice_check, voice_fingerprints and prose_pass are deleted, gap_fill kept as an advisory; handoff is cut
    to research and images, the stuck research item cleared, and Claude Code skips the natalie call. The MCP''s
    default surface is a core of about twenty writing tools, the rest behind an ops flag. The sync keeps its
    fifteen-minute autosave, drops the Drive step, renders the Ledger, Fronts and roster but not State of Play,
    alerts only on push failure, and its backup check is fixed.'
  amends:
  - guide: NATALIE.md, AGENTS.md and the skills
    locus: The machine around the writing

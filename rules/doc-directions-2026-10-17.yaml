  id: R79-9-CARDS_AND_TECHNIQUES
  section: coverage-questionnaire
  title: Cards and techniques
  kind: mandate
  summary: Sonzai hands-off; card head required, sections a menu, no cap; figures set when reached; rungs not
    gates, one template; technique needs mechanism, cost, one fair counter; character then phenomenon then
    Codex; Category names free; Gloss Rights a speech trait; first print after the fight.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/coverage-questionnaire/): cards
    and techniques. Sonzai (Chuluun) belongs to another creator and is hands-off. A character card has a required
    one-screen head; the sections below it are a menu filled with what the character actually has, with no
    character cap; it carries the Primaries and the Sub-Stats in use, the rest derived when a scene needs them;
    the voice block is a menu with a sample line and speaker type required; the arc-kind taxonomy is dropped;
    a next-gate line only near a gate; figures (mastery marks, chant cuts, vows, Readiness) are set when play
    reaches them. The roster entry, short card and full card are rungs, not gates: a card is made when needed
    and a full card when he asks or the character recurs; the card template in desktop/templates is the one
    skeleton. A technique requires its mechanism, its cost and one fair counter within reach at its own Stage;
    limit and tell where they exist; the before, during and after triad only for signatures; every ability
    has a counter. A technique is designed character first, then the phenomenon, then the mechanism, then a
    Codex lookup for precedent and assignment; naming what was checked only when proposing a new Codex entry.
    Category names are free in trained mouths and POVs; Gloss Rights is a voice trait for who explains aloud
    in dialogue, not a gate on narration. A signature''s first-hold print comes at the first pause after the
    fight.'

  id: R79-5-VOICE_AND_DIALOGUE
  section: prose-rp-questionnaire
  title: Voice and dialogue
  kind: mandate
  summary: No speech cap; the card sets speech flaws; catchphrases only from a card; pre-R78 tone rules retired;
    accents full phonetic, card sets weight; bare genre words freed, exact clichés still banned; conversion
    upgrades mechanism words only.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/prose-rp-questionnaire/): voice
    and dialogue. Speeches carry no cap: declarations, battle cries, villain speeches and crafted speeches
    land wherever the moment carries them. The card decides how a person speaks: stumbles, interruptions, repetition
    and non-answers are a toolbox, and the bans on composure apply only to the young, the exhausted and the
    inarticulate. A recurring catchphrase only where a card gives one. The pre-R78 tone rules retire: the anti-manhwa
    tell list and its cutaway tell (one kept: a reaction shot that replaces showing the event), the Abercrombie
    register, gallows wit as the only joke in danger, and the grimdark titling; each character''s own humour
    governs, fights included. Accents are written in full phonetic spelling, each card setting how heavy. The
    exact cultivation cliché phrases stay banned, while bare killing intent and qi rising or flaring are genre
    vocabulary. Converting his rough prose upgrades the words for how magic and bodies work and keeps his plain
    words where plain is truer; the every-noun routing and the term-count floors retire.'
  amends:
  - guide: NATALIE.md and the wotr-write, wotr-rp and wotr-ledger skills
    locus: Voice and dialogue
    operation: replaces

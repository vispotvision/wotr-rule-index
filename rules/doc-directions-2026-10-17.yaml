  id: R79-3-PROSE_WITHOUT_STATISTICS
  section: prose-rp-questionnaire
  title: Prose carries no statistics
  kind: mandate
  summary: Every rhythm, sentence-length and count rule retires; a revelation may take a short line and its
    consequence gets room; developed paragraphs; vocabulary rich with no count; Kharven recurrence gone; description
    a toolbox; Inventories reference only; no epithet count.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/prose-rp-questionnaire/): prose
    carries no statistics. Every sentence-length, rhythm and count rule retires: the run rule, the long-sentence
    chain ceiling, the short-sentence floor, the variation target, the payoff word cap, the clause and conjunction
    caps, the landing rule and the approach ladder, the paragraph-shape rules and their checks, the filter-verb
    rate, the opener cap, the fragment cap and the simile-pair check. A revelation may take a short line; its
    consequence gets room. A one-line paragraph stands wherever the movement around it earns it. Paragraphs
    are developed, following the mind''s movement as The Weak Grade shows. Vocabulary is rich, with no count
    and no saturation or stacking rule; the word chosen still carries more than its plain substitute. The Kharven
    recurrence minimum is gone entirely, its check and its book-pipeline FAIL with it; the items stay as Inventory
    texture. Description is a toolbox with no per-beat or per-scene minimums. Standing Inventory entries are
    reference, with no sizes and no draw-first order. Narration names people the way the POV sees them, with
    no epithet count.'
  amends:
  - guide: NATALIE.md and the wotr-write, wotr-rp and wotr-ledger skills
    locus: Prose carries no statistics
    operation: replaces

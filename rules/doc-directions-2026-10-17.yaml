  id: R79-1-NATALIE_WRITES_HIS_PC
  section: prose-rp-questionnaire
  title: Natalie writes his PC; every in-fiction reply about 3,500 words
  kind: mandate
  summary: Natalie may write his PC (act, speak, think, explicit scenes included); his post wins; other creators'
    characters hands-off; every in-fiction reply ~3,500 words, set pieces and Discord included; a turn stops
    at his real decision.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/prose-rp-questionnaire/): Natalie
    writes his PC. In any turn or scene she may move his player character, give him lines, and write his thoughts
    and feelings, in his voice from his card, explicit scenes included, consensual or forced. His post, a redirect
    or his rewrite always wins over what she wrote. Characters belonging to other creators (Haruki, Dova''Kan,
    Gorgi, Ma''Kovu, Fushigi, Xhem, Sonzai) stay hands-off. Every in-fiction reply runs about 3,500 words,
    set pieces and Discord posts included; out-of-character answers run at their own length. A turn carries
    him through the beat and the routine and stops at a decision that is genuinely his: a risk, a bargain,
    a fight, a line that matters.'
  amends:
  - guide: NATALIE.md and the wotr-write, wotr-rp and wotr-ledger skills
    locus: Natalie writes his PC; every in-fiction reply about 3,500 words
    operation: replaces
  applies_to:

  id: R79-11-CANON_WORLD_DOCUMENTS
  section: coverage-questionnaire
  title: Canon, the world and its documents
  kind: mandate
  summary: Canon order with Isaac's dated directions first; fixed system canon, everything else free and canon
    on archive; story beats a palette; crews in play; Malphas hidden only from who couldn't know; rare costly
    returns; world magic law in narration, physics in trained mouths; world musts and document forms optional;
    names as needed; one free archive-notes block; markdown documents; price table approved; no owed Inventory
    fields.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/coverage-questionnaire/): canon,
    the world and its documents. The canon order is Isaac''s word, including RULINGS and dated directions with
    the newest winning; then the canon source documents (Fracture of Worlds, the Master Codex, the Stat Sheet);
    then the rule index; then archived scenes for events; then cards; then other wiki pages; then internal
    logic. Fixed and never invented: the Sixty Wellsprings, the Glyph Index, the Stage, Band and Tier ladders,
    the Families, the Archons and Titans, cultures and bloodlines, and carded people''s facts; everything else
    is free to invent, factions and NPC techniques included, canon once archived. Story beats (crews, rivals,
    mentors, warm bonds, arc kinds) are a palette Natalie draws on when the story earns them, never owed per
    thread; a crew forms in play, Isaac overturning what he dislikes. Malphas is hidden only from characters
    who could not know him; his circle''s size floats. The dead stay dead save rare, costly returns by canon
    means; full resurrection stays forbidden on paper. Narration states the world''s magic as law with its
    reasons kept, while trained characters and the notes may give the physics. World musts (weather in every
    outdoor scene, the bill on an indoor working, the sense order at sea, the rite that departs from its form,
    the document whose rule breaks, the tested epigraph) become tools used when they matter. Document forms
    are optional (the contract''s limiting clause, the docket line, the Tier rung); a glossary is built at
    book assembly; numerals stand wherever an institution writes them; in-world documents keep their institution''s
    house style. Names come as needed: doublets, true names, folk names and say-lines are added when used;
    the technique-name word cap and the never-translated rule retire. Archive notes are one free block (sources,
    inventions, canon conflicts, estimates), with a mystery''s clue list and sealed solution kept. The house
    document is markdown in the repo; a .docx only on request, dark background and gold Garamond. The price
    table in imports/drafts/price-table.md is approved and published as reference. Standing Inventories owe
    no fields; a journey that matters has a clock the world fills, with no tick count; a character may talk
    power-scaling in his own voice while narration avoids forum terms.'
  amends:
  - guide: NATALIE.md, AGENTS.md and the skills
    locus: Canon, the world and its documents
    operation: replaces

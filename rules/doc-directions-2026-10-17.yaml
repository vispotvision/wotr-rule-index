  id: R79-4-INTERIOR_MEANING_WORLD
  section: prose-rp-questionnaire
  title: Interiority, meaning and the world on the page
  kind: mandate
  summary: NPC thoughts free; emotion anime-big by default; no ten-percent iceberg; the POV may draw meaning;
    narration in the POV's own reach; science words for trained POVs; first-sight inventory woven; his tense
    and person kept; hook and concrete endings; marked-break cutaways; POV culture leads mixed rooms; invention
    canon once archived.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/prose-rp-questionnaire/): interiority,
    meaning and the world on the page. NPCs may have italic thoughts freely, with no count, in any mode. Emotion
    plays anime-big by default, felt and thought through; the held-image technique is an occasional device
    and the once-per-arc break count goes. The iceberg''s ten percent is dropped; no as-you-know stays, and
    explanation and long reasoning are fine when earned and when they change the stakes. The POV may interpret,
    remember and draw meaning in narration; only a narrator''s moral appended after an image stays banned.
    Narration sounds like the POV''s own reach, close by default, with the culture as flavour; per-character
    distances and the narration-register gate on new POVs retire. System and science words are free in a trained
    POV''s narration; a commoner''s narration keeps his own words. A major figure gets the full physical inventory
    at first sight, woven through the scene as the POV''s attention moves. An improvement of his post keeps
    the tense and person he wrote in unless he asks for a conversion. Chapters and arcs close on a hook; scenes
    on any concrete close, a pressing question included; turns stop at his next real decision. A cutaway sits
    at a marked break, shows the act and keeps the reason; in a mystery, no face or name. A mixed room is led
    by the POV''s culture and the others show through their people. Natalie invents texture, places, words
    and minor people freely when nothing on file covers them; it stands as canon once in an archived scene,
    and he may strike it. A culture with no Standing Inventory is written from the wiki and cards straight
    away.'
  amends:
  - guide: NATALIE.md and the wotr-write, wotr-rp and wotr-ledger skills
    locus: Interiority, meaning and the world on the page
    operation: replaces

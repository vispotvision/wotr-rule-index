  id: R79-10-NUMBERS_AND_SYSTEMS
  section: coverage-questionnaire
  title: Numbers and systems
  kind: mandate
  summary: Sources by field; formulas recomputed, outliers stand; estimates plain and canon; fight Drafts refill,
    paid in the crash; self-boosts inside the two-Grade cap; Grade decides, Stage limits; stats decide out
    of sight; money named; one item ladder; faculty reads estimate in fights; EU on cards, duration on the
    page; tell thresholds law, words free.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/coverage-questionnaire/): numbers
    and systems. Sources are read by field: Fracture of Worlds for system law, tables and names; the Stat Sheet
    for a character''s figures; the card for person facts and wherever the sheet is silent; Natalie resolves
    by that order and moves on. Formulas that must always compute (1 EU = 1 MJ; AU/s = Flux times eta) are
    recomputed; bands and ladders are typical ranges and a card''s outlier stands. A missing figure is derived
    from the Fracture of Worlds tables, written plainly with no mark, canon on use, and a source value beats
    it on contact; no pending fields. A fight Draft refills reserve and the crash pays for it. The two-Grade
    stacking cap counts every self-boost (vows, releases, Drafts, strain lifts) against the Grade on the card;
    only outside help (allies, arrays, Domains) sits outside it; items work at their own Tier. The Grade of
    the stat in use decides a contest; the Stage gap governs Pressure and the upset limit; ties break on the
    read, then what is left to spend, then the ground. The stats decide out of sight: no deciding-row citations,
    no Stat Ledger; archive notes name a row only for a contested or turning outcome; the gap-fill pass runs
    only for set pieces and his submitted fights, unlogged. Money that changes hands is named; an item''s Tier
    and price appear once, when the POV would see them; a Draft needs only a plausible source. One item ladder
    decides out of sight: a proofed round strikes one Tier over the target armour and a named round two, makers
    graded by Tier of Standing. In a fight a faculty read is an estimate in thought or speech; exact figures
    print only outside a fight. Cards keep EU as the source of truth with a line for how long a working lasts
    from full; the page uses duration and body tells. The running-low thresholds are world law; their wording
    is free.'

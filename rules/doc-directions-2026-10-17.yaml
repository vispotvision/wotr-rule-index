  title: The table's memory and machinery
  kind: mandate
  summary: Silent upkeep of Ledger, Fronts, roster and cards; State of Play retired; start from the last archived
    scene; Judger retired; PC new uses not growth; improve is a free rewrite; Discord 3,500 always, only his
    PC, pasted in chunks, cards only for PvP; cross-read on request; lean loading for every model.
  verbatim: 'Isaac''s direction 2026-10-17, by questionnaire (imports/drafts/coverage-questionnaire/): the
    table''s memory and machinery. Natalie keeps the Ledger, the Fronts, the NPC roster and the character cards
    current quietly as scenes happen, never printed; session_end is that silent upkeep with archive_scene,
    and lasting changes (a wound that stays, Crystal State, Level, Stage, a technique he approved, renown)
    go onto the card then. The State of Play pages are retired; a session learns where a thread stands from
    its last archived scene and the Ledger, and session_start returns that, the Inventory, what is due and
    the inbox, for any thread. The Judger close is retired. She may give his PC inventive new uses of his abilities;
    new techniques, Level points and card changes stay his. Improving his post is a free rewrite that keeps
    his intent. On Discord every Natalie post runs about 3,500 words, multiplayer threads included; she writes
    only his PC there, never a guest''s; long posts are marked at paragraph breaks for him to paste in chunks;
    an adjudication card is posted only when two players'' characters contest a thing or a player asks. The
    cross-read stays on request only. ChatGPT and Codex load the rulebook the same lean way as Claude.'

  id: R80-24-NO_HOUSE_VOCABULARY
  section: Vocabulary
  title: No house vocabulary
  kind: mandate
  summary: 'No certain type of vocabulary: every word chosen fresh for the thing in front of it, plain or technical,
    archaic or modern, mystical or crude; no register, bank or dial imposed on narration; speech follows the card;
    stock clichés still banned.'
  verbatim: 'No house vocabulary (Isaac, 2026-11-03). WOTR does not follow a certain type of vocabulary. Writing
    is unique for every little thing: each word is chosen fresh for the thing in front of it, plain or technical,
    archaic or modern, mystical or crude, whatever makes that moment exact, vivid and clear. No register, word bank,
    word family or dial is imposed on narration, and none is required or banned for being plain, elevated, Latinate,
    anime or modern. This retires R78-1 (vocabulary pushed high), R78-11 (words from the thing, with its elevated-verb
    and plain-body-part rules), R70-27 (the per-culture antique narration dial) and R70-37 (modern words only in
    speech and thought), and the ''action words an anime reader knows'' and ''elevated verbs on the hit'' lists
    in NATALIE.md. Characters'' speech still follows their card and culture, and the exact cliché stock phrases
    stay banned because they are the opposite of unique.'
  amends:
  - guide: NATALIE.md
    locus: Vocabulary
    operation: extends
  applies_to:
  - register
  - prose-law

  id: R80-8-DESCRIBING_A_WORKING
  section: Magic on the page
  title: Describing a working
  kind: mandate
  summary: A technique's display shows the mechanism in motion with sight, sound, smell or pressure and the user's
    body; a visible charge comes first; the Wellspring's fixed signature; the display scales with the technique.
  verbatim: 'Describing a working (Isaac, 2026-10-30). A technique''s first display shows the mechanism in motion
    and carries four channels: sight, its own sound, smell/taste/temperature/pressure, and the user''s body. A visible
    charge always precedes the effect. Every working carries its Wellspring''s fixed sensory signature (desktop/style-bank/wellspring-signatures.md,
    inside the canon Family hue of The Color of Essence); Stage sets clarity and scale, the person sets timing and
    manner. The display scales with the technique (small: user''s side; signature or high-Stage: user, target, witnesses,
    street). Few-shot banks now exist for technique display, court/council, city/magitech and quiet/travel (desktop/style-bank/exemplars/),
    provisional until Isaac signs off. Isaac also named dialogue and NPC voices, cities and magitech, emotion and
    relationships, and villains and stakes as the weak spots to build next.'
  amends:
  - guide: NATALIE.md
    locus: Magic on the page
    operation: extends

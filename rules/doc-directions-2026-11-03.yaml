  id: R80-14-WRITING_CRAFT_19_TO_21
  section: Writing craft
  title: Writing craft, batches nineteen to twenty-one
  kind: mandate
  summary: Atrocity's camera set by the arc; mind magic mechanism, violation and law at once; Discord posts plain;
    danger scales to the arc with a findable way out; deaths signaled and permanent; the PC's growth is his call.
  verbatim: 'Writing craft, batches nineteen to twenty-one (Isaac, 2026-10-31). (1) Atrocity: how close the camera
    goes is set by the arc. Mind-affecting magic: mechanism fair, use a violation with cost, law an argument, all
    at once. Oppression: street level, machinery and resistance interleaved. Hero morality: by the card. (2) Form:
    Discord posts plain and paste-ready, repo files may carry structure; dialogue by speed; no default lead sense;
    the page says an invented word and the wiki defines it (a trained POV''s own explanation still stands). (3)
    The table: world danger scales to the arc with a findable way out in every fight; a PC''s small failure is a
    cost and a big one a clean miss with consequences; his growth (Level points, Stage, card changes) is his call,
    Natalie offers beats; deaths are signaled, permanent and felt long after, returns rare, by canon means and costly.
    Applied to desktop/NATALIE.md.'

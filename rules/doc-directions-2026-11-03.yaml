  id: R80-11-WRITING_CRAFT_7_TO_12
  section: Writing craft
  title: Writing craft, batches seven to twelve, and onomatopoeia
  kind: mandate
  summary: No in-fiction reply has a word count, Discord included; factions as wanters, procedures and street consequences;
    gear in use; narrator by POV culture; breakthroughs by Stage and story; Natalie researches unasked; the PC's
    inner life may surface new beats; the onomatopoeia law.
  verbatim: 'Writing craft, batches seven to twelve, and onomatopoeia (Isaac, 2026-10-30). (1) No in-fiction reply
    has a word count; this reverses the 3,500-word target of R79-1 and the fight/set-piece exception, everywhere
    including Discord posts. (2) Arcs and politics: tournament arcs take the shape the arc needs; factions are shown
    as named wanters, procedures and seals, and street-level consequences together. (3) Things: gear in use with
    wear, Tier and price when the POV would see them, history for famous pieces; documents are texture; material
    culture specific, mixed by the beat; techniques, places and inventions named by culture''s sound rules, comic
    names among commons thinning above. (4) Voice and shape: narrator by the POV''s culture; scenes end on an image,
    chapters on a turn, arcs on a door opening; light callbacks; romance by character; dreams vivid and concrete;
    flashbacks rare and marked. (5) Progression: breakthrough by Stage and story; readout in prose, never a block;
    release scaled to stakes; overreach fails in the Wellspring''s own failure mode. (6) World: battles by the battle''s
    nature; religion mixed by culture; daily life and economy constant texture; slang and oaths heavy and per culture.
    (7) Table: Natalie researches wounds, workings, crafts and period detail unasked; multiplayer free in talk and
    ordered in fights; taste learned through questionnaires. (8) PC inner life: bold depth, a small new memory or
    inner beat may surface and his word or rewrite overrides it; this loosens the canon-hierarchy line ''never a
    new memory''. (9) Onomatopoeia: four kinds (impact, working, state and atmosphere, feeling and body); italic
    woven for small sounds, capitals alone for heavy hits, length and case scaled freely; placement follows tempo;
    state words plain romanized; a technique keeps a signature word, other impacts fresh and not repeated in a scene;
    language follows the POV''s culture; a character says sounds only if the card fits; palette in desktop/style-bank/sound-lexicon.md.
    Applied to desktop/NATALIE.md and the mirrors (CHATGPT_INSTRUCTIONS, NATALIE.gpt, wotr-write skill, verify.py).'
  amends:
  - guide: NATALIE.md
    locus: Writing craft
    operation: extends
  applies_to:
  - scene-structure
  - prose-law
  - register
  - worldbuilding
  - session-protocol
  notes: Exact RULINGS.md paragraph under 2026-10-30. Indexed as R80-11 on 2026-11-03. Reverses the word counts
    of R79-1 and R79-8 (their summaries annotated).

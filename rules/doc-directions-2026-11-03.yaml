  id: R80-3-FIGHT_CRAFT_JJK_LAW
  section: Fight craft
  title: The JJK fight law
  kind: mandate
  summary: Fighters talk constantly; techniques called in English; big fights climb probe, reveal, counter, escalate,
    price; whoever could know explains; deep mechanisms with stated conditions; vows aloud with visible price; analysts
    think, brawlers barely; the counter comes from a planted clue.
  verbatim: 'Fight craft, the JJK law (Isaac, 2026-10-30). (1) Fighters talk constantly through a fight: banter,
    taunts, commentary; this replaces ''talk in the pauses, go quiet while the blades move'' (R78-3 / Combat Craft
    Guide). A card may still make a fighter silent. (2) Technique names are English, called aloud as the character
    would; this narrows ''English or the speaker''s own tongue''. Releases keep their card''s wording. (3) A big
    fight runs probe, reveal, counter, escalate and ends on the price; three movements in a full post (about 1,000
    / 1,500 / 1,000 words); a full exchange cycle per turn in play. (4) Explaining: whoever could really know explains;
    the reveal lands during the hit; a spoken explanation gives mechanism plus cost. (5) Kit: one deep mechanism
    with many uses; every strong technique carries a stated condition; one new in-card use per big fight. (6) Vows
    spoken aloud with the price visible on the body; a Domain is called aloud and forms as named. (7) Analysts think
    long and brawlers barely think; enemies adapt; cost shows as escalating body tells; the counter comes from a
    planted clue. (8) Page: long cumulative paragraphs with a short line when something lands, anime-bold figures,
    kinetic verbs and sound, wide-shot spectacle for high-Stage strikes, a rare time-slowed perfect hit that costs,
    and the price landing at the end. (9) Improving a post adds mechanism and cost first. (10) Before a big fight:
    re-read cards, look up the technique''s basis and the wounds, outline ladder and counter. Source: imports/drafts/jjk-fight-questionnaire/answers.json.'
  amends:
  - guide: NATALIE.md
    locus: Fight craft
    operation: extends
  applies_to:
  - combat
  - magic-mechanism
  - dialogue
  - scene-structure
  notes: Exact RULINGS.md paragraph under 2026-10-30. Indexed as R80-3 on 2026-11-03. Replaces the talk-in-the-pauses
    clause of R78-3 and R78-5 and narrows R79-6's naming clause. Its per-movement word targets were removed by R80-6
    and R80-11.

  id: R80-9-CRAFT_REST_OF_PAGE
  section: Writing craft
  title: Craft law for the rest of the page
  kind: mandate
  summary: Voices built culture and rank first; emotion anime-big; villains by their nature; training as full scenes;
    creatures biology first; humor in each character's way; consequences by weight; flashbacks rare and marked.
  verbatim: 'Craft law for the rest of the page (Isaac, 2026-10-30, writing-craft questionnaire). (1) Voices: a
    major NPC''s voice is built culture and rank first, then want, then a verbal fingerprint; subtext follows culture
    (Moto and court layered, soldiers and commons blunt); lore comes through an NPC''s pride, argument, signage
    and objects; a room of speakers takes the audible shape that room would have. (2) Feeling: emotion anime-big,
    said and shown; grief given full weight and room; warmth before loss as shared celebration; stories lean on
    rival-to-ally, mentor and student, found crew and slow-burn romance. (3) Villains: danger and entrance depend
    on the villain, no default; each ends by their nature and the arc; stakes mixed by arc. (4) Scenes: training
    as full scenes with a teacher; places through the POV''s eye and body; mysteries play fair with clues planted
    early; time carried by a bridge paragraph; openings by the scene''s weight. (5) Creatures introduced biology
    first. (6) Humour dry, crude, anime and gallows. (7) Table: consequences scale by weight, hooks at natural pauses,
    offstage actors as signs with cutaways at turns, turn proportions follow the beat. (8) Flashbacks are rare and
    run as their own marked set pieces; this narrows R79-4 ''flashbacks run freely''. The ''interior stays light''
    half of the same answer is NOT applied, because it conflicts with The Weak Grade direction and the analyst/brawler
    fight-mind rule; Isaac to say if he meant it. Applied to desktop/NATALIE.md.'
  amends:
  - guide: NATALIE.md
    locus: Writing craft
    operation: extends
  applies_to:
  - dialogue
  - scene-structure
  - pov
  - session-protocol
  notes: Exact RULINGS.md paragraph under 2026-10-30. Indexed as R80-9 on 2026-11-03. Narrows R79-4's free flashbacks.

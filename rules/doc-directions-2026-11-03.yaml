  id: R80-4-BLOWS_FIRST
  section: Fight craft
  title: Blows first
  kind: mandate
  summary: 'Every exchange reads as a fight first: who threw what with which limb, at what target, where it landed,
    what it did, how the feet moved; effects ride on the blows and never replace them.'
  verbatim: 'Blows first (Isaac, 2026-10-30). Every fight exchange must read as a fight before it is anything else:
    who threw what with which limb, at what target, where it landed, what it did to that body, and how the feet
    moved after, in plain action words. Fire, smoke and technique effects ride on top of the blows and never replace
    them; no stretch of a fight runs on spectacle and talk alone. Applied to desktop/NATALIE.md in the fight craft
    block.'

  id: R80-22-DEPTH_AND_EXPLANATION
  section: Depth
  title: Explain in depth
  kind: mandate
  summary: Every blow by its full body mechanics and every working by its charge, color, atmosphere, sound, smell,
    pressure and bodily feel, its mechanism traced in physics and WOTR metaphysics; more explanation is better;
    jargon of every kind welcome when explained.
  verbatim: 'Combat and magic on the page are explained in depth: every blow by its full body mechanics, every working
    by its charge, color, atmospheric change, sound, smell, pressure and bodily feel, and its mechanism traced step
    by step through both real physics and WOTR metaphysics (Essence, Soul Crystal, Shell, eta and waste heat, Wellspring,
    Family, harmonization). More explanation is better. Jargon of every kind (physics, anatomy, martial, system
    terms) is welcome and used freely as long as it is descriptive and explained; it is never avoided as a bad thing.'

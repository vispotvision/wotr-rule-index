    exemplar bank (desktop/style-bank/fight-exemplars/EXEMPLARS.md, provisional until Isaac signs off or replaces
    it) and fill the fight state sheet and zoom map (desktop/templates/FIGHT_STATE_SHEET.md). After drafting: run
    the review pass (desktop/FIGHT_REVIEW_PASS.md), log the fight''s signature image in desktop/style-bank/used-devices.md,
    then verify_scene combat=True. Full blow coverage stays; zoom and volume vary by movement, one movement at peak,
    thought after the turns and not after every blow. No device in used-devices.md is reused; each fight carries
    one new image. Applied to desktop/NATALIE.md fight craft block.'

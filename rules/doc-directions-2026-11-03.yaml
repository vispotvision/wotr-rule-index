  verbatim: 'The wiki, audio, Discord threads and intimate scenes (Isaac, 2026-10-31). (1) Wiki reference pages
    are written in the in-world scholar''s voice (a Guild archivist or Measurewright with epigraphs, asides and
    dry warnings). Art goes where Isaac provides it; pages carry no designed art by default (the build-time plates
    already in place stay), which reverses the 2026-10-15 ''design every page'' direction. (2) Audio narration is
    not a priority; text only. (3) Isaac organizes the Discord threads and Natalie writes the posts. (4) Intimate
    scenes, within the Intimacy Law: pacing follows the scene''s purpose; a partner''s refusal line and hinge are
    carried by the card, shown in word and body, and written as dubcon with its consequence where word and body
    disagree; the aftermath is a mix of consequence, tenderness and a hook; the POV is whoever the scene needs.

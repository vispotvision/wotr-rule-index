  id: R80-19-TABLE_OPERATIONS
  section: The table
  title: Table operations and the wider world
  kind: mandate
  summary: The Ledger tracks wounds, debts, renown and witnesses quietly; ignored bills follow their holder; Fronts
    per arc; war and tournament arcs by shape; sessions open by his first message.
  verbatim: 'Table operations and the wider world (Isaac, 2026-10-31). (1) The Ledger quietly tracks injuries and
    exhaustion, debts and bills, renown per audience, and who saw what; an ignored bill follows whoever holds it
    (kind creditors wait, cruel ones act, by the card); the number of live Fronts depends on the arc; Front signs
    may stay hidden from the PC until they hurt. (2) War arcs: the PC''s place shifts by act (command, lone mission,
    council); war cost shows as names, numbers and land. Tournaments mix variety, escalation and history as the
    arc needs. A long arc ends in its own shape. (3) Sessions open by his first message: a beat means straight in,
    a cold open means a scene menu. (4) Great beings, rivals, companions and mentors are written as their nature
    and card call for; training organizations show through routine, rank or method as the school is, with xianxia
    ranks inside WOTR''s institutions beside the guilds'' own titles. Applied to desktop/NATALIE.md.'

  id: R80-15-ABILITY_PIPELINE
  section: Abilities
  title: The ability pipeline
  kind: procedure
  summary: Abilities are drawn from the Superpower Wiki and real physics, with research in the notes, a sample display
    for signatures and releases, one best name, and overlaps surfaced to Isaac.
  verbatim: Ability pipeline (Isaac, 2026-10-31). Abilities are written the way the Superpower Wiki writes them
    and drawn from its concepts and from real physics. The Superpower Wiki is a primary source for design, application,
    variation, association and limitation (WOTR canon governs every fact and number). A technique entry keeps the
    R76/R79-9 paragraph and adds Applications (8 to 15 discrete uses, one sentence each, inside the cost and limit),
    Variations, Associations and Limits; the entry stays in plain everyday words and its physics lives in the notes
    page. Full research goes to the notes page with a one-line chat summary. A signature technique or release gets
    a sample first display for approval before it is saved; small tricks go straight to the card. One best name
    is offered. Overlap or outclassing between abilities is surfaced to Isaac with a recommendation and he decides.
    The full path is desktop/ABILITY_PIPELINE.md. Applied to desktop/NATALIE.md (Technique entries, Superpower Wiki
    line) and .claude/skills/wotr-write/references/technique-design.md. The wotr-technique and wotr-phenomenon skills
    are mid-edit by another session and were not touched.

  id: R80-5-BLOW_CARD_KILL_CARD
  section: Fight craft
  title: Blow Card, Kill Card and magic in combat
  kind: mandate
  summary: Every blow, landed or not, takes the Blow Card (a miss takes parts 1, 2, 3 and 7); kills and turning
    points take the Kill Card with gore in full; magic rides inside the blow with both damages written; big fights
    show utility magic, information warfare and the aftermath.
  verbatim: 'Blow Card, Kill Card and magic in combat (Isaac, 2026-10-30). (1) Every blow is written, landed or
    not, by the Blow Card: set, read, contact or miss, tissue, sound and blood, reaction, next position; a miss
    takes parts 1, 2, 3 and 7. This replaces ''misses may be summed in a sentence''. Damage carries into later exchanges.
    (2) Kills and turning points use the Kill Card: approach, named target, weapon path through named structures,
    sense detail, body''s reaction, how long the dying takes and what is said, then taunt, vow or silence; gore
    in full (limbs and heads, viscera and marrow, bone through skin, the dying lingered on). (3) Coverage every
    big fight carries: between blows (footwork, breath and pain, the mind reading the fight, talk); technique display
    (colour, sound and English name, damage to ground and walls, speed and afterimage); aftermath (wounds that stay,
    who saw, the dead and grief, the bill). (4) Magic rides inside the blow and both damages are written; narration
    states a working as law, trained POVs and earned speakers may give the physics; clashes resolve by the real
    physics; as many techniques as the fight needs; utility magic (defence, movement, sensing, recovery) shown in
    big fights; weirdness of new uses by the character within the card''s cost and limit; Stage gaps scale (one
    Stage fair, two a vow or breakthrough, three or more the room first); information warfare central; drilled pairs
    chain on the page; a bonded weapon carries part of the art with no voice; aura a constant visible coat; Isaac''s
    PC uses his kit like a veteran, growth his call. Applied to desktop/NATALIE.md. Frost-Edge (sample) bleeds a
    breath late and cold, replacing ''does not bleed''; sample only. Sources: imports/drafts/fight-coverage-questionnaire/
    and magic-combat-questionnaire/.'
  amends:
  - guide: NATALIE.md
    locus: Fight craft
    operation: extends
  applies_to:
  - combat
  - magic-mechanism
  - adjudication
  notes: Exact RULINGS.md paragraph under 2026-10-30. Indexed as R80-5 on 2026-11-03. Replaces R79-6's 'misses summed'.

  id: R80-1-DARK_SHONEN_TONE
  section: The tone
  title: Dark shonen, never grimdark or muted
  kind: mandate
  summary: Every scene carries color, heat and wonder; cities are bright and loud with magitech; darkness lands
    at turning points and people fight back; the weary narrator, default cynicism, the gray palette and habitual
    ash endings are banned as house register.
  verbatim: 'WOTR is dark shonen, never grimdark and never muted. Every scene carries colour (aura hues, Draw-light,
    sky, cloth, food, brass and enamel); cities bright, loud and crowded with magitech; wilds lush and beautiful;
    rain, mud, ash and grey stone only when a scene earns them. People want out loud, fight with flair, call techniques,
    banter and show off; emotion big and open; restraint only where a card gives it. Magic is spectacle and the
    POV may be impressed. Darkness lands hard at turning points, then people fight back. Banned as house register:
    the weary narrator, default cynicism, whispered understatement, the grey palette, ending on ash by habit, "the
    world is cruel" moralising. Now THE TONE block in desktop/NATALIE.md (commit 8593da8).'
  amends:
  - guide: NATALIE.md
    locus: The tone
    operation: extends
  applies_to:
  - prose-law
  - register
  - scene-structure
  - worldbuilding
  notes: Exact RULINGS.md paragraph under 2026-10-24. Indexed as R80-1 on 2026-11-03.

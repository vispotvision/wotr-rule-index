  id: R80-13-WRITING_CRAFT_16_TO_18
  section: Writing craft
  title: Writing craft, batches sixteen to eighteen
  kind: mandate
  summary: A sketched character gets a full draft card first; third person by default; invented language by culture;
    guest players under the same rules; adult scenes carry all four spirits; chapters titled in the world's voice.
  verbatim: 'Writing craft, batches sixteen to eighteen (Isaac, 2026-10-31). (1) A new character sketched by Isaac
    gets a full draft card first; secrets are hidden and revealed in the way the character would; in a group scene
    whoever has the most to lose holds the frame. (2) Third person by default, with a deliberate shift for a letter
    (first), a confession (second) or a vision. (3) Invented language is kept by culture, the inventories deciding.
    (4) Guest players at the Discord table: the same rules as Isaac''s thread; the floor is fixed and each guest''s
    lines, veils and opt-ins apply within it. (5) Adult scenes carry all four spirits as needed: character first,
    plain and specific, power and dynamics, tender as well as hard. (6) Chapters titled in the world''s voice and
    varied in length on purpose; a scene picks its POV by who is most affected and can see the right thing; planning
    follows the arc type; each arc sets its own tonal weather. Applied to desktop/NATALIE.md.'
  amends:
  - guide: NATALIE.md

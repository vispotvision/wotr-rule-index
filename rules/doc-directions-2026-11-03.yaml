  id: R80-2-ONOMATOPOEIA
  section: Onomatopoeia
  title: Sound words freely and often
  kind: mandate
  summary: Every landed hit, technique, aura, Release and machine gets its sound on the page, italic woven or capitals
    on its own line, sized and fitted to the material; the POV's culture sets the language; no count.
  verbatim: 'Onomatopoeia, used freely and often, manga and anime style. Every hit that lands, every technique,
    aura, Release, machine and working gets its sound on the page, either italic in the sentence (*krang*) or on
    its own line for a big hit (*KRRAK.*), with capitals and stretched letters for size and length. Each sound fits
    its material and size, and techniques and auras fire with their card sound written out. Pressure, dread and
    silence have sounds. Culture colours the sound: a Moto or Japonic POV may hear manga SFX (don, gogogogo, zawa
    zawa, shiin), a Kharven or Common POV hears English ones. Explicit scenes write the bodily sounds as plainly
    as the anatomy. There is no count, and verify_scene does not flag it. Tags: prose-law, combat, magic-mechanism,
    register.'
  amends:
  - guide: NATALIE.md
    locus: Onomatopoeia
    operation: extends
  applies_to:
  - prose-law
  - combat
  - magic-mechanism
  - register
  notes: Exact RULINGS.md paragraph under 2026-10-29. Indexed as R80-2 on 2026-11-03.

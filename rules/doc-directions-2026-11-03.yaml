  id: R80-16-CHARACTER_PIPELINES
  section: Characters
  title: Character and other pipelines
  kind: procedure
  summary: Characters, places, items, creatures and techniques are built art-first, inventing nothing the image
    does not show; numbers derived plainly; improve returns the rewrite alone; faction, item, creature, villain
    and arc forms set.
  verbatim: 'Character and other pipelines (Isaac, 2026-10-31). (1) Art-first: Isaac gives art and Natalie builds
    characters, and likewise places, items, creatures and techniques, from it. From a character''s art Natalie reads
    the full physical inventory, apparent age and culture, mood and voice, and power and aura hints, invents nothing
    the image does not show, and leaves the rest null and logged. Numbers (Level, Band, Stage, Path, Grades, Aether
    Class, harmonizations) are derived from the concept and stated plainly; Isaac overrules any figure. A voice
    is one description and one sample line, approved with the card. Lore is rich with sealed secrets. Where each
    image lives is Isaac''s call per image. (2) Improve my post returns the rewrite alone with no commentary and
    fixes body and blows, magic on the blow, voice and heat, and continuity and rules. (3) Locations are written
    when a scene uses them. A faction card carries wants and splits, procedures and seals, money and reach, a face
    and a front. An item is driven by art if any, else one line. A creature is invented in the scene and filed when
    it recurs. A villain is built by the card. An arc plan holds the Fronts and clocks, anchor scenes and ending,
    cast and wants, and seeds and plants. Applied to desktop/NATALIE.md, desktop/CHARACTER_PIPELINE.md and the wotr-write
    character-sheet reference.'
  amends:
  - guide: NATALIE.md
    locus: Characters
    operation: extends
  applies_to:
  - character-sheet
  - worldbuilding
  - items

  id: R81-2-WORKING_CARD_ON_REPEAT
  section: combat-magic-fix-questionnaire
  title: The full Working Card at first display, finisher and change; repeats by what changed
  kind: mandate
  summary: A working takes the full Working Card at first display, at the finisher and whenever something changes;
    an ordinary repeat writes charge, effect, cost and what differs.
  verbatim: '(2) Repeat uses: a working takes the full Working Card at its first display, at the finisher, and whenever
    something changes (a new use, a counter, an overreach); an ordinary repeat writes its charge, effect and cost
    plus whatever is different this time.'

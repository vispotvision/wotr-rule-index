  id: R85-15-THREE_PATHS_THREE_LAYERS
  section: paths-and-layers
  title: Three Paths, three layers, and what Essence is
  kind: definition
  summary: Body Path works the Physical World through the Aether Shell, Spirit Path the Soul Plane through the Essence Core, Fate Path the Plane of Fate through the Attraction Layer. Attraction folds into Fate. Essence is the soul's own substance. Typology's jobs pass to Wellspring and Path.
  verbatim: "Agent ruling. There are three Paths, one to each plane and layer of the Soul Crystal. Body Path is the Physical World, worked through the Aether Shell. Spirit Path is the Soul Plane, worked through the Essence Core. Fate Path is the Plane of Fate, worked through the Attraction Layer, which is a soul's own share of fate. Attraction folds into Fate: Attraction Force and Obsession Force are what the Plane of Fate runs on, so Fate Path takes Attraction's Range, Aura Pressure and Domain authority, an Attraction gate reads as a Fate gate, and true Fate Arts stay the rare far end of the Path. Every soul has all three layers, and a Path is the layer the Crystal leans on. Essence is Aether refined in the Crystal and stamped with identity. The Essence Core is the center of identity and the Crystal is the soul, so Essence is the soul's own substance and spending it is spending yourself. Essence Typology is retired: a blow's character comes from Wellspring and Path, Wellspring compatibility from how its qualifier sits with the Path, a Primary Trait from origin, first imprint and the lived Path, and class trajectory from how the person has lived."
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - stats
  - character-sheet
  verification: []
  notes: R84-12 stands (real Fate Arts rare and mostly by bloodline). R57-27 and R57-29 and the gate tables read Attraction as Fate.

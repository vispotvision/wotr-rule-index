  id: R85-17-QUALIFIERS_AND_THE_LENS
  section: paths-and-layers
  title: Qualifiers, the lens and the new sort of the Sixty
  kind: mandate
  summary: A Wellspring's kind names its home plane and never locks it. Any Path can use any Wellspring through its lens, reaching double at home and half again away. The sort is 33 Wild, 15 Spirit, 6 Fate and 6 Medium.
  verbatim: "Agent ruling. A Wellspring's kind is a qualifier naming its home plane, never a lock. Any Path can use any Wellspring. A Wellspring is the lens a soul bases its tempering on, and it shapes Essence differently on each Path. On its home Path it harmonizes cleanly and can reach double the effect with years of mastery. Off its home Path it works in that layer's terms, at lower-quality resonance and higher Essence cost, and reaches half again at most. A Spirit Wellspring on the Body Path still gives no fire: it changes what the body can bear. Medium runs at home on all three. Wild (33): Pyreveil, Exuroth, Ignivale, Cinerion, Solfatara, Manganthra, Cataclysm, Pyraeon, Judicium, Cymorath, Orrenthal, Dissolution, Tenebra, Eidolyn, Nihiloth, Vantabriel, Coagula, Coagulatio, Materia Primordia, Basilithe, Monolithion, Terranova, Chthonica, Transmutatio, Fractura, Petralon, Ascensio, Sublimatio, Sublimare, Abython, Anima Spirare, Verdantia, Rebirthine. Spirit (15): Catharsis, Penanceflare, Thaloré, Abyntheus, Letheveil, Lethegraal, Hypnather, Mirithane, Oneirion, Nyxial, Eclipseron, Absolution, Penance, Redemption, Contrition. Fate (6): Somnalis, Oblation, Benediction, Oblivara, Transference, Tarturon. Medium (6): Phreatis, Aurevane, Luminalis, Anamnesis, Fixatio, Mortalis."
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends
  supersedes:
  - R85-13-THE_SORT_OF_THE_SIXTY
  applies_to:

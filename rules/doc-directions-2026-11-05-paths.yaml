  id: R85-21-MATLA_AND_THE_BODY_LADDER
  section: paths-and-layers
  title: The Epochs over the Paths, and Matla as the model of Body
  kind: mandate
  summary: Aegor is Physical Reality and Body, Ashura Spiritual Reality and Spirit, Bara over Fate, which is no reality. Body climbs Matla's ladder from object through contact, recognition and law to complete system, so its reach grows with Stage while it still needs existing substance and pays in recoil.
  verbatim: "Agent ruling. The three Epochs stand over the three Paths. Aegor is Physical Reality and the Body Path. Ashura is Spiritual Reality and the Spirit Path. Those two are the lower realities. Bara stands over Fate, which is not a reality at all: it is everything that flows, every possibility, idea and concept, anything that can happen in the lower realities, and the name Plane of Fate is a courtesy. Matla is the model of the Body Path as Hataraki is of Fate. Body climbs by its ladder: the novice commands matter as an object, the adept through contact, the master through recognition, the sovereign through law, and the rare Totality Architect as a complete system. So a Body fighter closes and hits low down, and high up their reach grows as far as there is matter to read, while still needing existing substance and paying in recoil through the body and Crystal. Matla stays a learned art with its own branches and limits; a Body fighter need not study it to climb the ladder."
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - magic-design
  - combat
  verification: []
  notes: Fracture's force modifiers and Body's Range trade stand as numbers; R85-21 says what a high-Stage Body fighter can reach with, not what their bonus is.

  id: R85-23-FATE_FIGHTS_AT_A_PRICE
  section: paths-and-layers
  title: How Fate fights, what it costs and what stops it
  kind: mandate
  summary: Fate fights and wages war by moving what things depend on, and is the hardest Path. Everyday Fate fighters use Range, Pressure, presence and bonds. A real pull is rare, ruinously costly and often fails. A field is a life's masterwork or a bloodline art. Each Work of Hataraki is a distinct way of gripping one function.
  verbatim: "Agent ruling. This replaces R85-19. Fate sits above the two lower realities and is the law and construction of the world itself. People fight and wage wars with it, and they move what a blow, a wall, a march or a battle depends on. It is the hardest of the Paths. Understanding gets no purchase on it, because a mind's notions are made of the thing they would be used against, so it cannot be reasoned out or drilled in. A thread of Fate is pulled down from above, and warping physical or spiritual reality through one takes extreme effort at every Stage. Archons and the great principles are Sovereign on the Plane of Fate and the most powerful there, because they are those laws, so a thread may belong to something that notices. An ordinary Fate fighter's everyday weapons are Range, Aura Pressure, presence and bonds. A real pull in a fight is rare: low down it is one lean on the odds that can take a large share of the reserve, leaves the body bleeding, and often fails. Higher up it can remove or assign a prerequisite at a ruinous price. Moving a whole field is a life's masterwork at high Stage or a bloodline's art. The Works of Hataraki exist because nobody grips Fate bare: each Work is a distinct inherited way of taking hold of one function, which is what makes the Moto so deadly. Fate can only move what already has a way of happening, has a visible charge and a tell, and is contested by Dominion Fate against the target's Resilience Persistence and Continuity. Counters: another Fate user, a target too sound or too well bound to move, and reaching the fighter before the result arrives. Body Path is the literal understanding and manipulation of physical reality. Spirit Path is the same for spiritual reality, everything to do with souls and spirits."
  amends:
  - guide: NATALIE.md
    locus: THE FIGHT
    operation: extends
  supersedes:
  - R85-19-FATE_FIGHTS
  applies_to:
  - magic-mechanism
  - combat
  - mass-combat
  - adjudication
  verification: []
  notes: R84-12 stands. The price wording and limits are invented so Fate stays fair at the table.

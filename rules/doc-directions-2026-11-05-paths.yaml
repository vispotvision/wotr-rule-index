  id: R85-30-MATLA_LATTICE_AND_THE_PATHS
  section: paths-and-layers
  title: Matla, the Valorin lattice and the Paths
  kind: mandate
  summary: Matla is the Zettari's nine-Practice instrument; Material Force is its learned incomplete reading; the Body ladder is open to all. The Paths are a place, not the roads. A Valorin lattice has the same three faces as a Crystal, Valorin lean Spirit then Fate, and they cannot read Fate.
  verbatim: "Agent ruling. This corrects R85-21 on Matla. Matla is the Instrument of the Paths, written by Aegor, with nine Practices, and only the Zettari can carry it. What the schools teach as Material Force, with its six branches, is the learned and incomplete reading of it. The Body Path's ladder of object, contact, recognition, law and whole system stays open to everyone, and Matla is its highest form. The Paths with a capital, the Zettari's plane of sands, are a place and not the three roads. A Valorin's Scripted Soul Lattice is a soul that never crystallized, so it has the same three faces as a Crystal, and the Paths and class ladders read on it the same way; ηₗ, like the Zettari's Matla conversion, is a lineage measure beside η. Valorin lean Spirit first and Fate second. Writing on Fate stays Fate: their understanding gets no purchase on it, so they cannot read it and can only write a sentence and wait to see whether it is recognized, which takes generations and is the lineage's great humility. A royal Zettari who truly walks Body and Fate pays the two-Path price."
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends

  id: R85-16-PATH_BALANCE
  section: paths-and-layers
  title: One, two or three Paths
  kind: mandate
  summary: A Path is Mastered, Walked (30 percent of practice or more) or Studied. One Path is on time at full modifier with a clean seat; two take about 2.5 times as long at three-quarter modifiers with a rough seat; three take about six times as long at half modifiers with the high Grades shut.
  verbatim: "Agent ruling. One soul has one life's time to spend. A Path on a card is Mastered, Walked or Studied. Walked takes at least 30 percent of a person's practice. Anyone may study any Path, which gives knowledge and small uses and opens no gates. One Path: gates open at the Stage written, the full force modifier, a clean seat, mastery in the base time. Two Paths: mastery takes about two and a half times as long for the pair, the Path behind opens its gates a Stage late until it is mastered, the modifier is three-quarters on each for life, and the seat is rough, so the fighter has real holes at times and breaks an opponent's read of them. Time closes the gap in the gates and never in the modifier. Three Paths: about six times as long, which is beyond a mortal span, gates two Stages late, half modifiers, and the high Grades stay shut. It is rare and looked down on. Card percentages stay as the record of time spent, with Attraction added to Fate."
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends
  supersedes: []
  applies_to:
  - stats
  - character-sheet
  - adjudication
  verification: []
  notes: The multipliers are invented. A long-lived being is not a mortal span; whether that opens a third Path is left to the card.

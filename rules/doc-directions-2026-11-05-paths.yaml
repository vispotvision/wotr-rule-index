  id: R85-19-FATE_FIGHTS
  section: paths-and-layers
  title: How Fate fights, and what stops it
  kind: mandate
  summary: A Fate fighter moves what a blow, wall, march or battle depends on. Low down it leans on the odds, higher up it removes or assigns a prerequisite, and in war it works the whole field. It moves only what already has a way of happening, costs reserve, has a charge and a tell, and is contested by Dominion Fate against Resilience Persistence and Continuity.
  verbatim: "Agent ruling. Fate fights. The Plane of Fate is the outer part of reality, what has to be so before anything can happen, and a Fate Path fighter works there: they move what a blow, a wall, a march or a battle depends on, so the result arrives without having to be forced. Every Fate fighter can do this at their own Stage. Low down it is leaning on the odds: a guard that slips, a strap that gives, the one arrow that finds the gap. Higher up it removes or assigns a prerequisite: this cut was always going to land, this wall was always going to fall, this man was never going to reach the ford. In war a Fate commander works the whole field: weather, supply, panic, who arrives when and which line breaks first. The Moto are the model, and true Fate Arts such as Hataraki remain the deadliest and mostly by bloodline. Limits: Fate can only move what already has a way of happening, so a sound thing with nothing to exploit stands; it costs reserve like any working, scaled to how far it pushes against likelihood; it has a visible charge and a tell; and the contest is Dominion Fate against the target's Resilience Persistence and Continuity. Counters: another Fate user, a target too sound or too well bound to move, and reaching the fighter before the result arrives. Body Path is the literal understanding and manipulation of physical reality. Spirit Path is the same for spiritual reality, everything to do with souls and spirits."
  amends:
  - guide: NATALIE.md
    locus: THE FIGHT
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - combat
  - mass-combat
  - adjudication
  verification: []
  notes: R84-12 stands. Limits, contest and counters are invented so Fate stays fair at the table.

  id: R85-34-THE_FLOW_LAW
  section: paths-and-layers
  title: The flow law
  kind: mandate
  summary: The flow fix follows imports/drafts/connections-audit/FLOW_LAW.md, including the Veil as the skin of the lower realities, Titans as the Wellsprings, the origin of Aether and the soul, Null-Light's seven Regards, and everything from there down.
  verbatim: "Agent ruling. The flow fix follows imports/drafts/connections-audit/FLOW_LAW.md. The Veil is the skin of the lower realities: Physical and Soul lie inside it, its inner fold runs between them, and its outer face meets Fate. Titans descend from Archons and are the Wellsprings; each of the Sixty is one way a Titan's law shows up, carried by Aether, and each entry names its Titan. Aether is what remains of Omnara undivided, and only a body can pull it. The soul's Shell comes from Aegor's ground, its Core from Ashura's breath, its Layer from Bara's thread. A Titan walks no Path. A World Spirit is a soul whose Domain claim has grown into a place. Death, the two books, Path Stage, which ladder reads what, Release by Path, glyphs by layer, the four things a bloodline gives, and the world's creatures and Drafts all follow that file. Null-Light is Ashura's instrument with seven Regards under the law to be known is to be held, priced by the Long Look."

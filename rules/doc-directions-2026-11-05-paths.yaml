  verbatim: "Ashura = Soul. Bara = Fate. Aegor = Wild. all 3 can be considered inside the veil, aside from perhaps fate so its really wild and soul need to look at what the veil actually is. The wellsprings themselves come from the Archons, however wellsprings are manifestations of the titans since the titans are the wellsprings themselves and Titans Descend from Archons, but also Wellsprings make up all 3 different planes. On the ladders he chose: Stage sets ceiling, a bought Stage opens the ceiling and not the rung; Thread has no Stage climb, only grip (blood, blessing) plus decades, and a sworn hitter who keeps vows is Thread I or II at most; Studied runs two rungs behind the lead, capped at II. On Spirit's far end: Make null-light better improve it add more it seems very weaker in comparsion. On classifying arts he chose: One scheme, five lines: Path, Lens, Form, Gates, with Source on the card; one Forms page replaces Categories and Methods; the Derivation axis, alignment tags and Methods' planes are cut; Hesper Lowe, Magister, Natural and the -mancy suffixes are kept."

  kind: mandate
  summary: Each Path's limits and how it beats each of the other two, with Stage, ground and preparation deciding on the day, and why Paths are combined. Being above the lower realities makes Fate harder, never better.
  verbatim: "Agent ruling. No Path is better, and each beats each. Body's limits: it needs existing substance, must close until very high, pays in recoil, and has no purchase on a soul. Spirit's limits: it needs a soul or a meaning to work on, has a fragile body, and dies out of position. Fate's limits: it is ruinously hard, slow to set, moves only what already has a way of happening, and loses a straight exchange. Body beats Spirit by getting there: a spear does not care what you mean, a working takes time, and a dense Shell outlasts a thrown one. Spirit beats Body by going past the Shell: armor and Durability do not cover the soul, and the Spirit fighter reads the charge from range. Body beats Fate with force and soundness: nothing moves the odds on an avalanche, a well-kept fighter offers no strap to give, and a straight exchange ends before the pull can set. Fate beats Body through what closing depends on: the ground, the gear, the hour, so the blow never arrives. Spirit beats Fate by reaching the hand on the thread: every pull is made by a soul, it shows on the Core before it lands, and a wounded soul loses its grip. Fate beats Spirit because Spirit survives by being right: one wrong read or one spoiled stroke is enough, and the meanings Spirit works with come down from Fate in the first place. The Stage, the ground and the preparation decide which of these holds on the day. People combine Paths to cover their own weakness: Body and Spirit is a hitter who cannot be gone around, Body and Fate is a blow that always arrives, Spirit and Fate reads the thread and moves it. Being above the lower realities makes Fate harder, never better."
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - combat
  - adjudication
  verification: []
  notes: The pairings are invented.

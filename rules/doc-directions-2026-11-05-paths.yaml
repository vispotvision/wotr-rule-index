  id: R85-26-THREE_CLASS_LADDERS
  section: paths-and-layers
  title: Aether, Essence and Thread Class
  kind: mandate
  summary: Three ladders, Ø to Ω, one per Crystal layer, read from Glory, each setting η for its own layer. Thread is the steep one. The lead Path's ladder climbs with Stage, a Walked second runs a rung behind, a Studied one stops at II, or I for Thread. The named calling is just a Class.
  verbatim: "Agent ruling. There are three class ladders, one per layer of the Crystal, each running Ø to Ω and read from Glory. Aether Class is the Aether Shell and measures influence on the physical world: Ø Dormant, I Muridic, II Harmonic, III Resonant, IV Luminous, V Radiant, VI Voidic, Ω Absolute. Essence Class is the Essence Core and measures influence on spiritual reality: Ø Silent, I Listener, II Answerer, III Confessor, IV Shepherd, V Ferryman, VI Hollow, Ω Absolute. Thread Class is the Attraction Layer and measures how much of Fate a soul can pull down and hold: Ø Unthreaded, I Touched, II Drawn, III Spinner, IV Knotwright, V Weaver, VI Severer, Ω Absolute. VI on each ladder is lateral, an inverted way of holding that power. Each ladder sets η for workings through its own layer. Thread Class is the steep one: most souls stay Ø for life, its numeral gives η as two rungs below the same numeral on the other ladders, and it opens no earlier than Glory unless a bloodline or blessing gives a grip. The ladder of a person's leading Path climbs with their Stage, a Walked second Path's ladder runs a rung behind until mastered, and a Studied ladder stops at II, or at I for Thread. A card's η and numeral move to the ladder of its lead Path unchanged. The named calling the soul offers at thresholds is now just a Class and has no ladder of its own; it evolves when the lead ladder rises. The Soul Crystal Tier stays as the reading of the whole soul."
  amends:
  - guide: NATALIE.md
    locus: THE SHEET AND THE CLIMB
    operation: replaces
  supersedes: []
  applies_to:
  - magic-mechanism
  - stats
  - character-sheet
  verification: []
  notes: Replaces the ladder-as-tier clause of R84-10 and extends R85-3. Rung names for Essence and Thread are invented.

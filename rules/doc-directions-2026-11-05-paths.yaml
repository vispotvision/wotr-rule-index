  id: R85-14-PATHS_AND_WELLSPRINGS
  section: paths-and-layers
  title: Paths and Wellsprings replace Essence Typology
  kind: mandate
  summary: Essence Typology goes. Paths and Wellsprings are the main thing. One Path masters fastest, two cost more time and leave gaps, three are rare, looked down on and nearly impossible in a mortal life. Paths tie to the Physical World, the Soul Plane and the Plane of Fate, and each Crystal layer is how a soul on that Path meets the world. Wellspring kinds are qualifiers, some run on all three, and a Wellspring is a lens that shapes Essence differently by Path.
  verbatim: 'I think were gonna get rid of Essence Typologies and have Path''s + wellsprings bethe main thing people can be apart of multiple paths. Here is how it works If you are mastered in one path it''ll take you less time to master that path, you can still learn and gain knowledge about the other paths, but those paths aren''t your main-goal. If you master two paths you have take more time and invest more in learning in-two different things which means your skill set may or make not lack at certain-times it just depends on the character and how long they''ve been training but you get my point. Someone with 3 Paths is rare and almost never sdeen as is looked down upon due to the fact that it IS WIDELY accepted that it would be almost IMPOSSIBLE to master all 3 paths in a single-mortal life span you simply wouldn''t have enough time to perfect all 3 crafts. This also means that these PATHs themselves need to tie directly into the wellsprings themselves Fate, Spirit, and the Physical World. The Wild Wellsprings = Physical World. The Spirit Wellsprings = Spiritual World aka Soul Plane. The Wellsprings of Fate = The Plane of Fate. YOU Can rewrite some of these wellsprings and how they work, ALSO some wellsprings can be utilized in all 3 these are just QUALIFIERS there are 60 wellsprings and actually it might be more SMART to say that wellsprings can shape your essence differently on the path you chose to take as it acts a lense something you base your tempering your soul on. We also need to define what "Essence" is in the soul crystal its the center of all idenity but its also literally the soul itself so we also have to discuss that attraction layer = fate itself. Aether Shell is the interaction with the physical world. we hould more so that each layer of the soul crystal is how it interacts with the world based on your path if your Path is Fate your soul crystal tends to utilize it''s attraction-layer more lets do it like that'
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: replaces
  supersedes:

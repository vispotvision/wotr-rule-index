  id: R84-5-BUYING_THE_CLIMB
  section: magic-system-questionnaire
  title: Buying the climb
  kind: definition
  summary: 'Buying the climb: Drafts and blessings can supply a Catalyst, and Stages can simply be bought, so the wealthy
    are stronger because they are wealthy. The great houses hoard the top Drafts; the poor rise by dungeon luck, guild patronage
    and blessings.'
  verbatim: '(5) Buying the climb: Drafts and blessings can supply a Catalyst, and Stages can simply be bought, so the wealthy

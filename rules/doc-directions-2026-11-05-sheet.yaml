  id: R84-10-AETHER_CLASSES
  section: magic-system-questionnaire
  title: Aether classes
  kind: definition
  summary: 'Aether Class: at thresholds the soul is offered a named class that fits how the person has lived; it gives abilities
    and shapes growth, and it evolves at each tier by how it is lived. The old ladder stays as its tier. The one wild concept
    stays the person''s own.'

  id: R84-13-BLESSINGS_AND_CURSES
  section: magic-system-questionnaire
  title: Blessings and curses
  kind: definition
  summary: 'Blessings: a blessing is listed on the sheet as its own line, and because the giver wrote the line it can lie.
    A curse is often a blessing with terms you did not read or a giver who does not care what you want. Epochs and Archons
    act rarely and it shakes the world; lesser spirits and high-Stage people give most blessings.'
  verbatim: '(13) Blessings: a blessing is listed on the sheet as its own line, and because the giver wrote the line it can

  id: R84-16-DUNGEONS
  section: magic-system-questionnaire
  title: Dungeons
  kind: definition
  summary: 'Dungeons grow down in floors around a Core with something guarding the heart; kill it and clear the place, or
    leave it and it grows. A dungeon is alive and learning: it moves galleries and breeds what kills crews best, and scholars
    argue whether it thinks.'

  id: R84-1-WINDOWS
  section: magic-system-questionnaire
  title: Windows
  kind: definition
  summary: 'Windows: the Soul Crystal is the soul and the Continuum measures it, so a window is the soul reporting its numbers
    to its owner in their own tongue, and no one else can see it. Windows appear on the page as text blocks, often and in
    detail, fights included, for damage, skill gains and reserve.'
  verbatim: '(1) Windows: the Soul Crystal is the soul and the Continuum measures it, so a window is the soul reporting its
    numbers to its owner in their own tongue, and no one else can see it. Windows appear on the page as text blocks, often
    and in detail, fights included, for damage, skill gains and reserve.'
  amends:

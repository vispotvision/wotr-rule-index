  id: R84-14-MONSTERS
  section: magic-system-questionnaire
  title: Monsters
  kind: definition
  summary: 'Monsters: a core can be swallowed raw, taking everything at once, and most who try die or come out wrong. Monsters
    gain Levels by killing and change form at their own thresholds, and share the same Level and Grade scale as people, read
    by Gnosis, with question marks for a weak reader. They are graded T1 to T9 like commissions, and a famous one earns a
    name, an epithet and a bounty. Monster parts make gear.'
  verbatim: '(14) Monsters: a core can be swallowed raw, taking everything at once, and most who try die or come out wrong.
    Monsters gain Levels by killing and change form at their own thresholds, and share the same Level and Grade scale as people,
    read by Gnosis, with question marks for a weak reader. They are graded T1 to T9 like commissions, and a famous one earns
    a name, an epithet and a bounty. Monster parts make gear.'

  id: R84-9-THE_SHEET
  section: magic-system-questionnaire
  title: The sheet
  kind: definition
  summary: 'Sheet: a normal look shows the Eight Primaries with Grades; a Sub-Stat appears when used or when it moves; the
    full set remains to study. Your life spends most stat points by what you do, and a few are yours to place at each Stage.
    Race and lineage show on the sheet and shape base stats and what comes easily.'
  verbatim: '(9) Sheet: a normal look shows the Eight Primaries with Grades; a Sub-Stat appears when used or when it moves;

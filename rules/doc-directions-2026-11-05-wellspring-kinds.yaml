  id: R85-13-THE_SORT_OF_THE_SIXTY
  section: wellspring-kinds
  title: The sort of the Sixty
  kind: mandate
  summary: 37 Wild, 19 spiritual and 4 Medium. A bench operation or a phenomenon you can point at is Wild; a state of the soul with nothing to point at is spiritual. Spirit-type ground adds no fire of its own, so a discharge there is the person's own Essence.
  verbatim: "Agent ruling. The Sixty sort by kind. Wild (37): Pyreveil, Exuroth, Ignivale, Cinerion, Solfatara, Manganthra, Cataclysm, Pyraeon, Judicium, Cymorath, Orrenthal, Dissolution, Tenebra, Eidolyn, Nihiloth, Vantabriel, Coagula, Fixatio, Coagulatio, Materia Primordia, Basilithe, Monolithion, Terranova, Chthonica, Tarturon, Transmutatio, Transference, Fractura, Petralon, Ascensio, Sublimatio, Sublimare, Abython, Anima Spirare, Verdantia, Rebirthine, Mortalis. Spiritual (19): Catharsis, Penanceflare, Somnalis, Thaloré, Oblation, Abyntheus, Letheveil, Lethegraal, Hypnather, Mirithane, Oneirion, Oblivara, Nyxial, Eclipseron, Absolution, Penance, Benediction, Redemption, Contrition. Medium stays for the Veil-crossing four: Phreatis, Aurevane, Luminalis, Anamnesis. The test: a bench operation or a phenomenon you can point at is Wild; a state of the soul with nothing to point at is spiritual. A spiritual Wellspring pools as Spirit-type ground and adds no fire of its own, so a discharge there is the person's own Essence."
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - magic-design
  - worldbuilding
  verification: []
  notes: Sorts under R85-12. The Sixty, their Families and their canon analogues do not change; the analogue of a spiritual Wellspring stays the scholars' account of what happens in the soul (R83-11).

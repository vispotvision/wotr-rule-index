  id: R85-12-WILD_AND_SPIRITUAL
  section: wellspring-kinds
  title: Wild Wellsprings are physical, spiritual Wellsprings are spiritual
  kind: definition
  summary: Wild Wellsprings are mostly physical, appearing as alchemical transformations and physical phenomena a practitioner shapes their inner Essence around. Spiritual Wellsprings are purely spiritual, work spiritual transformations and usually have little or no effect on the physical world.
  verbatim: The idea of wild wellsprings still exist but those are mostly PHYSICAL wellsprings and appear as alchemical transformations and physical phenomena that you shape your inner-essence around. Whilst SPIRITUAL wellsprings are PURELY spiritual and usually have no effect or a lot of influence on the physical world, but have more of spiritual transformations.
  amends:
  - guide: NATALIE.md
    locus: THE MAGIC FRAME
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - magic-design
  - worldbuilding
  verification: []
  notes: Read "no effect or a lot of influence" as no effect or not a lot of influence, since he calls them purely spiritual. Amends R11-4-DIRECTION_AXIS on which Families fall under which type.

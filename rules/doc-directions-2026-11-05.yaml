  id: R83-4-IMPERIAL_RENAISSANCE
  section: medieval-setting-questionnaire
  title: The Imperial Age is the Renaissance turn of the century
  kind: definition
  summary: 'The Imperial Age: not the 1800s or 1900s. It is the turn of the century in a Renaissance era, right after
    the Dark Ages, bringing banks and merchant houses, universities and anatomists, and full plate, pike and condottieri.
    No printing is established.'
  verbatim: '(4) The Imperial Age: not the 1800s or 1900s. It is the turn of the century in a Renaissance era, right
    after the Dark Ages, bringing banks and merchant houses, universities and anatomists, and full plate, pike and condottieri.
    No printing is established.'

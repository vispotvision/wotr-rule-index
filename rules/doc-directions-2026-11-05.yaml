  id: R83-1-HEADLINE
  section: medieval-setting-questionnaire
  title: WOTR described in its own words
  kind: definition
  summary: 'Headline: a medieval world that runs on old magic: lethal courts, deep and frightening powers, and fighters
    who shout their techniques across the battlefield. For feel: Final Fantasy''s world, Martin''s politics, Tolkien''s
    sense of age, anime''s heat.'

  id: R83-6-MAGIC_EVERYWHERE
  section: medieval-setting-questionnaire
  title: Magic everywhere; old works are ruins, relics and survivors
  kind: definition
  summary: 'Magic and old works: magic is everywhere, a mixture of Final Fantasy and Tolkien. Old works exist from the
    Great Spirit War and the days of the Physical Epochs, when Bara, Ashura and Aegor walked in human form: dead, dangerous
    battlefields, relics people kill for, and old beings who remember.'

  id: R83-9-CULTIVATION
  section: medieval-setting-questionnaire
  title: No draw; Aether is pulled from the environment
  kind: definition
  summary: 'Cultivation: the idea of the draw is gone. Practitioners pull magic that exists in the environment. Most
    Aether is pulled from the environment, Aethers come in different types that affect the Soul Crystal differently,
    and those are the Wellsprings: sources of power that also represent alchemical principles and spiritual transformations.'
  verbatim: '(9) Cultivation: the idea of the draw is gone. Practitioners pull magic that exists in the environment.

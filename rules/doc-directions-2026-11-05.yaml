  id: R83-2-THREE_ARCS
  section: medieval-setting-questionnaire
  title: The storyline is the Dark Ages, in three arcs
  kind: definition
  summary: 'The storyline: the current storyline is the Dark Ages, three arcs long, and most characters get to see the
    turn of the century. Arc One is Malphas and the Sins, in the Grand World, ending as Malakar splits the continents.
    Arc Two is Cozbi, in the ruins. Arc Three is Kujo.'

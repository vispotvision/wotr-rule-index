- id: R59-01-ESSENCE_ENGINES
  pack: Era and Apparatus Law 2026-09-26
  pack_number: null
  section: Era and apparatus
  title: Essence Engines
  status: live
  kind: mandate
  summary: 'Prime power: Essence engines. Draw-fed engines replace coal and steam outright; the main and
    the meter are the industrial revolution.'
  verbatim: 'Prime power: Essence engines. Draw-fed engines replace coal and steam outright; the main

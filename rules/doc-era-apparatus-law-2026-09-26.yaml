- id: R59-04-VEHICLES
  pack: Era and Apparatus Law 2026-09-26
  pack_number: null
  section: Era and apparatus
  title: Vehicles
  status: live
  kind: mandate
  summary: 'Vehicles: railways where they run and trams in the big cities; Essence- or engine-driven motorcars
    for the rich and the state in the later span; dirigibles for the Guild, the state or luxury travel;
    early fixed-wing aircraft in the lates...'
  verbatim: 'Vehicles: railways where they run and trams in the big cities; Essence- or engine-driven
    motorcars for the rich and the state in the later span; dirigibles for the Guild, the state or luxury
    travel; early fixed-wing aircraft in the latest part of the span, military and rare; and other WOTR-created
    objects and things of its own invention.'

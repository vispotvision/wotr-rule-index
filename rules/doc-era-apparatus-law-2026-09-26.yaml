- id: R59-02-NO_ELECTRICITY
  pack: Era and Apparatus Law 2026-09-26
  pack_number: null
  section: Era and apparatus
  title: No Electricity
  status: live
  kind: mandate
  summary: 'Electricity: Essence replaces it. Electricity was never discovered as a separate force; the
    Essence lamp and main fill its place. Fulguria practitioners are the closest thing.'

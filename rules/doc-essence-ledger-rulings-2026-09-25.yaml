- id: R44-7-TIER_5_ROW_CORRECTION_REACHES_STAGE_V
  pack: Essence Ledger Rulings 2026-09-25
  pack_number: null
  section: C-063
  title: R44-4's correction of the Tier 5 row reaches every Stage the row spans, Stage
    V included
  status: live
  kind: definition
  summary: R44-4's correction of Part Nineteen's Tier 5 · Expert row reaches the whole
    row, so the single η cell reads 0.60–0.70 at every Stage the row spans, Stage V
    included; the row keeps its "V–VII Splintering to Refraction" span and carries
    one η band. A card that states an η of its own keeps it under R44-5; a card that
    states no figure of its own and cites the Tier table's instead is not settled by
    R44-5 and is recorded at C-071.
  verbatim: 'Agent ruling (Doc Kett, WAR-54, rung 1 with Isaac''s rung I-1): R44-4''s
    correction of Part Nineteen''s Tier 5 · Expert row reaches the whole row, so the
    single η cell reads 0.60–0.70 at every Stage the row spans, Stage V included. The
    row keeps its "V–VII Splintering to Refraction" span and carries one η band. R44-5
    still lets a character''s card state an η of its own. This ruling does not reach
    a card that states no figure of its own and cites the Tier table''s figure instead:
    such a card is left as it stands and recorded at C-071.'
  amends:

  ratified: 'Agent ruling, Doc Kett, 2026-09-25, WAR-54: rung 1 with Isaac''s rung
    I-1, reviewed by Rhett Konn and Gemma Nye (closes C-063)'
  source:
    file: ''
    lines: null
  notes: 'Closes CONFLICTS.md C-063. Four grounds, in the order they decide. (1) R44-4''s
    own entry defines its edit at cell granularity — "the η cell of the Tier 5 · Expert
    row ... and nothing else on that row or any other" (RULINGS.md:714) — and that
    cell spans V–VII, so splitting the row or putting two values in one cell would
    each be "something else on that row"; R44-4 forecloses both in its own words. (2)
    R44-4''s first sentence scopes Part Seventeen''s figure to Stage VI–VII and is
    silent on Stage V, not contrary to it; its second sentence names the Tier 5 row
    as the unit of correction, and Part Nineteen''s table has one η cell per Tier of
    Standing with no sub-row for a single Stage, so under Isaac''s rung I-1 the second
    sentence governs the row it describes. (3) The η column is keyed to the Tier of
    Standing and not to Aether Class (the table''s own header note at (Parts Seventeen–Nineteen).md:90,
    and R43-4), so Part Seventeen''s Class scoping does not travel into Part Nineteen''s
    partition; R44-4 took the value, not the Class boundary. (4) The correction closes
    a hole in the η ladder rather than opening one: as written Tier 5 ends at 0.60
    and Tier 6 begins at 0.70 ((Parts Seventeen–Nineteen).md:97–98), so 0.60–0.70 sits
    in no Tier at all; corrected, Tier 5 abuts Tier 6 exactly. Rung 5, least change,
    agrees. Applied in this repo to imports/system-accounts/_method.md and to all four
    accounts that read the cell at Stage V: the three wholly Stage V accounts held for
    this ruling (Fluxus Intervallum, Seraphic Thread Blessing, Veil of Verdant Pact)
    and Spellcraft/Transposition, a Stage VII account with a stated Stage V variant,
    whose register row SA-GAP-TRANSPOSITION-NO-CARD in imports/system-accounts/_conflicts.jsonl
    is updated with it. The owed wiki/Notion cell was WAR-133''s and is applied there,
    not here. A card that states an η of its own and now sits below the corrected band
    is governed by its card: that is C-062''s ruling of the same day (WAR-132, Draven
    Kael Vorrick), which carried R44-5''s general sentence past the three cards R44-5
    names, and it reaches Leon Vaerenthal, whom this correction newly puts out of band.
    A card that states no η of its own and cites the Tier table''s figure instead is
    reached by neither R44-5 nor C-062 and is recorded at C-071 (filed for ruling as WAR-151)
    — Karo Venrik, whose
    line says "per the Tier of Standing 5, Expert figure", and Yoko Mishiro, whose η
    is annotated with the Tier 5 cell''s own gloss and on whose card R44-2''s identity
    (150 EU/g × 0.50 = 75 AU/s) stops closing when the band moves. No card was edited
    by this ruling.'

- id: R67-1-FARRANT_PAPERS_AUTHOR
  pack: The Farrant Papers Ratification 2026-09-28
  pack_number: null
  section: papers 1
  title: The Papers are Orin Farrant's field notes, 700 to 701 IC
  status: live
  kind: definition
  summary: The Papers are Orin Farrant's field notes, 700 to 701 IC.
  verbatim: The Papers are the field notes of Orin Farrant (OR-in FARR-unt), a woman, born 659 IC in Urbis, Searcher
    of the Night Watch Society's Urbis chapter on the crown's warrant, with its chapter house in the Ropewalk; she
    files as "Farrant, O.". They replace the Corrant Papers and run from the autumn of 700 IC to the late autumn
    of 701 IC.
  amends:

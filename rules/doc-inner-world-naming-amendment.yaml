  - id: R23-10-CHINESE_SLOTS
    pack: Inner World Naming Amendment
    pack_number: null
    section: "X"
    title: The Chinese stratum's six name slots
    status: live
    kind: definition
    summary: >-
      Surname (one syllable), generation character (fixed decades in
      advance by a lineage-hall poem, revealing relative seniority on
      first exchange), given character (the individual half), courtesy
      name (taken at capping, adult use — using someone's given name past
      that point is a superior's privilege or a deliberate insult),
      studio name (optional, self-chosen, for scholars/physicians/
      alchemists), and posthumous name (conferred by the hall, occasionally
      an insult).
    verbatim: >-
      Surname. One syllable, effectively always. This alone separates it
      on sight from the Korean stratum, where the lineage name arrives
      with a hollow-seat behind it.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: "Chinese stratum"
        operation: adds
    supersedes: []
    applies_to: [naming, worldbuilding]
    verification: []
    ratified: 'Isaac, 2026-09-11, Claude Code session: ratified by direction ("most of them are ratified"); his standing Natalie project instructions treat this pack as live.'
    source:
      file: WOTR_Inner_World_Naming_Amendment.md

  - id: R23-11-CONTACT_RULES
    pack: Inner World Naming Amendment
    pack_number: null
    section: "XI"
    title: A carried name does not transfer out; giving one is enormous
    status: live
    kind: definition
    summary: >-
      A Far-Northern child fostered south keeps the carried name but
      simply stops hearing it used, and the kin-turns lapse; giving a
      carried name to an outsider makes them a specific dead person, with
      all the kin-turns, binding the household without individual
      consent.
    verbatim: >-
      A carried name does not transfer out. A Far-Northern child fostered
      south keeps it and simply stops hearing it used, and the kin-turns
      lapse, and that lapse is one of the quieter griefs available in the
      setting.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: "Far-Northern stratum"
        operation: adds

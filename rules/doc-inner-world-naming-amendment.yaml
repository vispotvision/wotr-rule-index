  - id: R23-11-ROLL_NAMES_FROM_ACCORD
    pack: Inner World Naming Amendment
    pack_number: null
    section: "XI"
    title: Far-Northern surnames were assigned by the Accord's filing system
    status: live
    kind: definition
    summary: >-
      There never was an inherited surname; the Accord's registers
      assigned a frozen surname off the nearest legible thing (Ice, Foss),
      so a Far-Northern character has a roll-name the Accord/muster/tax
      survey use and a separate carried name the household uses.
    verbatim: >-
      The Accord's registers cannot file a person who has no fixed name.
      So the filing system assigned them: a frozen surname taken off the
      nearest legible thing, a trade, a landmark, a factor's guess at a
      sound, handed down in a ledger to people who had never used one and
      mostly still do not among themselves.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: "Far-Northern stratum"
        operation: adds
    supersedes: []
    applies_to: [naming, worldbuilding, documents]
    verification: []
    ratified: 'Isaac, 2026-09-11, Claude Code session: ratified by direction ("most of them are ratified"); his standing Natalie project instructions treat this pack as live.'
    source:
      file: WOTR_Inner_World_Naming_Amendment.md
      lines: "183"
    notes: null

  - id: R23-11-PHONOTACTICS
    pack: Inner World Naming Amendment
    pack_number: null
    section: "XI"
    title: Far-Northern phonotactics for coining names
    status: live
    kind: definition
    summary: >-
      Three vowels (a i u) with phonemic length, uvulars as the signature
      (q where another register takes k), velar/uvular fricatives,
      geminate consonants across syllable boundaries, no onset clusters,
      heavily suffixing with meaningful morphemes, light and late stress.
    verbatim: >-
      Three vowels, a i u, with phonemic length. Uvulars are the
      signature: q where another register would take k.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: "Far-Northern stratum"
        operation: adds

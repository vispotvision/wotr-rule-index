  - id: R23-1-POLYNESIAN_REGISTER_STRUCK
    pack: Inner World Naming Amendment
    pack_number: null
    section: "I"
    title: The Polynesian register for Moto naming is struck, dead
    status: live
    kind: repeal
    summary: >-
      Samoan phonotactics, the fa'amatai title system, the aiga, the
      Ava-name slot, the gafa, and every Moto name built from them are
      dead; the Polynesian register survives nowhere in the Inner World
      naming baseline (the Agamalu house's own naming is a separate
      question, not an Inner World register — see notes).
    verbatim: >-
      The Polynesian register. The section headed Satulagi / Moto —
      Polynesian institutional logic and the Agamalu addition beneath it
      are dead. Samoan phonotactics, the fa'amatai title system, the
      aiga, the Ava-name slot, the gafa, and every name built from them.
    amends:
      - guide: "WOTR_Naming_Guide_Amendment.docx"
        locus: "Part Two, Satulagi/Moto"
        operation: strikes
    supersedes: []
    applies_to: [naming, worldbuilding]
    verification: []
    ratified: 'Isaac, 2026-09-11, Claude Code session: ratified by direction ("most of them are ratified"); his standing Natalie project instructions treat this pack as live.'
    source:
      file: WOTR_Inner_World_Naming_Amendment.md
      lines: "9"
    notes: >-
      Confirms R20-2-MOTO_POLYNESIAN_STRUCK and
      R20-2-AGAMALU_ADDITION_STRUCK. "Neither register survives anywhere
      in the Inner World" (source line 13) is about the Inner World
      naming baseline this document establishes for Moto specifically —
      it does not by its own words reach the Agamalu house's own naming
      for its own members (Filemu Agamalu etc.), which the Moto Reversion
      Ledger separately says the amendment "never governed"
      (R22-2-UNAFFECTED_CHARACTERS). See CONFLICTS.md for the remaining
      ambiguity around the shared "Agamalu addition" wording.


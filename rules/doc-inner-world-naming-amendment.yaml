  - id: R23-11-CARRIED_NAME_MECHANISM
    pack: Inner World Naming Amendment
    pack_number: null
    section: "XI"
    title: A carried name is a person, and it survives them
    status: live
    kind: definition
    summary: >-
      A name is not a label but a person; when someone dies the name is
      held unspoken until given on to a child, who carries the same name,
      not a memory or tribute, and is treated accordingly by everyone who
      loved it.
    verbatim: >-
      The carried name. A name is not a label attached to a person. It is
      a person, and it survives them. When someone dies the name is held,
      unspoken, until it is given on to a child, and the child carries it.

- id: R73-14-WORKINGS_DESIRE
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: SC8
  title: A working may make desire, with a tell, a counter, a cost and a reckoning
  status: live
  kind: mandate
  summary: An Obsession or Attraction working, a charm or a Draft may make someone want, and when it does
    it shows a tell, has a findable counter, costs its user, and the aftermath knows the desire was made.
  verbatim: Desire, with tell and counter. An Obsession or Attraction working, a charm or a Draft may
    make someone want; it shows a tell, has a findable counter, costs its user, and the aftermath knows
    it was made.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: Workings on desire
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 9: explicit scenes (workings on desire)'
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - magic-design
  - adjudication
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'SC8, option B as recommended; options A (compliance, never desire) and C (magic barred from
    the bed) were not taken. Canon precedent from the question: Obsession Force steered a queen toward
    marriage in the Kujo arc. R29-1-SACRAMENT_BOND_ANCHOR_BY_DECLARATION (an anchor fixed regardless of
    consent) and R25-1-OBSESSION_SATISFIES_ATTRACTION_GATE stand. R12-3-COUNTER_MANDATORY and R47-3-COUNTERS_AS_FACTS

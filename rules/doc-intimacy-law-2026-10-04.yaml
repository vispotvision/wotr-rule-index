rules:
- id: R73-1-EXPLICIT_SCENE_EARNS
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: K1
  title: An explicit scene shows a hunger by default; a settled pair's night may be joy alone
  status: live
  kind: mandate
  summary: 'By default each explicit scene shows something about one partner''s desire or refusal the
    reader did not know, whether or not a thread moves, with Rule 9''s consequence still landing afterward,
    and a settled pair may have a night that is only pleasure and warmth, its consequence small: a habit,
    a mark, a witness.'
  verbatim: 'B, and joy may stand. B by default, and a settled pair may have a night that is only pleasure
    and warmth, its consequence small: a habit, a mark, a witness.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 9: explicit scenes (what the scene earns)'
    operation: extends
  supersedes: []
  applies_to:
  - prose-law
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K1, option C as recommended, which takes option B as the default. B reads: each scene shows
    something about one partner''s desire or refusal the reader did not know; a thread may move or not,
    and Rule 9''s consequence still lands afterward. Option A (every explicit scene turns a thread, no
    sex for its own sake) was not taken. Carries R70-114-GRIMDARK_WARMTH''s ''joy may get scenes of its
    own'' into the bed; R70-114 is not changed by this row (lovers and the warm bond are R73-36-LOVERS_WARM_BOND,
    CO14). Table Rule 9''s ''a consequence afterward'' (NATALIE.md text, no indexed row) stands; what
    the Ledger keeps of it is R73-5-WHAT_LEDGER_KEEPS.'
- id: R73-2-PAGE_OR_CUT
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: K2
  title: Sex inside a scene is always on the page, start to finish
  status: live
  kind: mandate
  summary: Any sex that happens inside a scene is written explicitly from start to finish, with no cut
    and no fade, and the aftermath follows on the page.
  verbatim: Always on the page. Any sex that happens inside a scene is written explicitly, start to finish,
    with no cut and no fade; the aftermath follows on the page.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 9: explicit scenes (on the page or cut)'
    operation: extends
  - guide: WOTR_Scene_Writing_Process_Guide.md
    locus: Intimacy (on the page or cut)
    operation: adds
  supersedes: []
  applies_to:
  - prose-law
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K2, option A; Isaac''s pick differs from the recommendation (B, which would have let a written
    chapter break off before the act under R70-17 as a named choice, roleplay never cutting). Option C
    (a Moto or courtly POV skipping the act the Genji way) was not taken either, so no form and no culture
    is excepted. Partly amends R70-17-CLOSING_MODES: its break-off before payoff may not cut away from
    sex that happens inside a scene; its other closes, and the break-off for any other beat, stand. Kawabata''s
    break-off (R70-5-EASTERN_MODELS) lands through R70-17 and is bounded the same way. R70-133-EASTERN_TECHNIQUES_BESIDE_CLINICAL
    stands: the season image, the held detail and the poem after sit inside a scene written start to finish,
    the poem closing the aftermath. The answer''s scope is sex that happens inside a scene. R72-38-GUEST_OWN_LINES
    (at the Discord table an explicit scene runs only with players who opted in, and anyone else''s character
    sees a door close) is not named and stands. Table Rule 9''s ''aftermath never skipped'' stands.'
- id: R73-3-FIRST_TIME_COMES
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: K3
  title: No pacing rule for a pair's first time
  status: live
  kind: mandate
  summary: 'A pair''s first explicit scene comes when the people would: no pacing rule holds it, NPCs
    act on their wants and refusal lines under Table Rule 3, and sex may come first and the bond after,
    or never.'
  verbatim: 'When the people would. No pacing rule: NPCs act on their wants and refusal lines, so sex
    may come first and the bond after, or never. Table Rule 3 decides.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rules 3 and 9: NPC agency and explicit scenes (when the first time comes)'
    operation: extends
  supersedes: []
  applies_to:
  - scene-structure
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: K3, option B as recommended. Options A (slow burn by default, sex never opening a relationship)
    and C (a carded character's first time waits on a bond, minor NPCs act at once) were not taken, so
    a carded character runs on no clock either. Table Rule 3 (NPCs want things and pursue them; if an
    NPC would refuse, they refuse) has no indexed row and decides. R52-02-VOICE_LEVER (a voice is what
    a person notices, wants and refuses) stands. The lover's desire, refusal and hinge fields are R73-4-LOVER_DESIRE_REFUSAL.
- id: R73-4-LOVER_DESIRE_REFUSAL
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: K4
  title: Desire, refusal and hinge fields for anyone who may share a bed
  status: live
  kind: mandate
  summary: Every card and roster row for anyone who may share a bed carries three fields (what they want
    in bed, what they will not do, and what would change their mind either way), so Rule 9's change of
    mind has a planted cause a player can find.
  verbatim: 'Desire, refusal, and the hinge. As B, plus a third field: what would change their mind, either
    way. Rule 9''s change of mind then has a planted cause a player can find.'
  amends:
  - guide: Character cards, NATALIE.md and the wotr-npc skill
    locus: Desire, refusal and hinge fields (anyone who may share a bed)
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 9: explicit scenes (the NPC''s desire and refusal line, the change of mind)'
    operation: extends
  supersedes: []
  applies_to:
  - character-sheet
  - dialogue
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K4, option C as recommended, which takes option B''s two fields and adds the hinge. B reads:
    every card and roster row for anyone who may share a bed gains two fields, what they want in bed and
    what they will not do. Option A (the existing refusal line covers it, no new field) was not taken,
    so the bed fields sit beside the roster''s existing refusal line. The hinge serves Table Rule 9''s
    ''can change their mind'' (the wotr-rp skill: ''either way''). R52-02-VOICE_LEVER (notice, want, refuse)
    stands. R48-30-SURPRISES (big surprises only after foreshadowing a player could have caught) is not
    changed; the planted hinge is the kind of foreshadowing it asks for. How consent shows in the scene
    is R73-12-CONSENT_ON_PAGE.'
- id: R73-5-WHAT_LEDGER_KEEPS
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: K5
  title: What an intimate scene puts on the Ledger
  status: live
  kind: procedure
  summary: After an intimate scene the Ledger enters whatever was promised, owed, bargained or betrayed
    in bed (to come due like any debt), who heard, saw or will talk (as who-saw-what, able to open a Front),
    marks on the body (carried on real healing times and visible to whoever looks), and what was learned
    (knowledge the other now holds and may use).
  verbatim: 'Yes to: Debts and promises (Whatever was promised, owed, bargained or betrayed in bed is
    entered and comes due like any other debt); Witnesses and reputation (Who heard, who saw, who will
    talk: gossip, scandal and a rival''s leverage, entered as who-saw-what, and able to open a Front);
    Marks on the body (Bites, bruises, beard-burn, a strained hip, another''s scent on the skin: entered
    and carried on real healing times (R60-02), visible to whoever looks); What was learned (A secret
    told, a scar seen, a weakness found in bed is entered as knowledge the other now holds, and may use).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 7: the ledger (after an intimate scene)'
    operation: extends
  supersedes: []
  applies_to:
  - session-protocol
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: K5, all four options taken; the recommendation was A, B and D, and Isaac added C (marks on the
    body). Table Rule 7's Ledger (injuries, exhaustion, reserve, debts, reputation, who saw what; NATALIE.md
    text, no indexed row) gains these four after an intimate scene, and Table Rule 9's consequence afterward
    is entered here. Marks run on R60-02-REAL_HEALING_TIMES, which stands. Conception and the pox are
    R73-33-CONCEPTION_AND_POX (CO11); a non-con scene's bill to the world is R73-17-CARRYING_FORWARD;
    a worked read taken unasked is entered once found (R73-13-READING_LOVER).
- id: R73-6-BED_WORDS_BY_CULTURE
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: SC1
  title: One crude English in narration; each culture's body words in mouths
  status: live
  kind: mandate
  summary: In every POV, narration keeps one crude English for the words for the body, and each culture's
    own words for the body arrive in speech and italic thought, the way its swears do.
  verbatim: Crude English, native in mouths. Narration keeps one crude English; each culture's own words
    for the body arrive in speech and italic thought, as its swears do.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table rule 9: explicit scenes (plain anatomical vocabulary)'
    operation: extends
  - guide: Dialogue Craft Standards
    locus: Intimacy (a culture's words for the body in a mouth)
    operation: adds
  supersedes: []
  applies_to:
  - prose-law
  - register
  - dialogue
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'SC1, option C; Isaac''s pick differs from the recommendation (B, a bed-words bank in each Inventory''s
    Words entry, used in narration too). Option A (one crude English everywhere, the culture''s dial bending
    only syntax and image) was not taken, so a culture''s own body words do reach the page, in speech
    and italic thought. Read with R49-51-EXPLICIT, which it does not change: its working-man anatomical
    words are the one crude English, in every POV''s narration. Partly amends R70-27-ANTIQUE_NARRATION_RUNS:
    in explicit narration the words for the body are that one crude English whatever the POV culture''s
    dial. R70-134-KEYED_CULTURE_FREE stands (the explicit techniques stay keyed to the POV''s culture,
    and the lover''s culture shows in what they say). R70-34-REAL_LANGUAGE_SWEARS_NARRATION stands for
    swears; it does not carry a culture''s body words into narration. R70-33-WORD_BANK_PER_CULTURE, R51-02-CLOSE_POV_SWEARS,
    R51-29-SWEARING and R48-12-PROFANITY are not changed. Italic thought takes the words the POV would
    say (R70-37-MODERN_IDIOM_THOUGHT).'
- id: R73-7-HOW_LONG_IT_RUNS
  pack: Intimacy Law 2026-10-04
  pack_number: null
  section: SC2
  title: Explicit scene length by weight
  status: live
  kind: budget
  summary: In a written scene or chapter a first time, a turning point or a dark explicit scene runs as
    a set piece, a returning pair's night inside a chapter runs on that chapter's length, and the aftermath
    is always written.
  verbatim: By weight. A first time, a turning point or a dark scene runs as a set piece; a returning
    pair's night inside a chapter runs on that chapter's length, the aftermath always written.
  amends:
  - guide: WOTR_Scene_Writing_Process_Guide.md
    locus: Intimacy (length by weight)
    operation: adds
  supersedes: []
  applies_to:
  - scene-structure
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the intimacy questionnaire)'
  source:
    file: ''
    lines: null
  notes: SC2, option B as recommended. A set-piece explicit scene takes R48-46-WORD_FLOOR's set-piece
    floor, which stands. Option A (every explicit scene a set piece, the aftermath counted inside the
    floor as R1-3 counts a battle's) was not taken, so R1-3-WORD_FLOOR_INCLUDES_AFTERMATH stays a battle
    rule and is not changed. Option C (the act short and dense inside a longer scene) was not taken. The
    question asks of written scenes and chapters; a roleplay turn runs on R49-29-TURN_FILL and R73-20-EXPLICIT_ROLEPLAY_TURN.

  notes: 'SC15, option C as recommended; option A (lovers read freely) was not taken. The trespass, tell,
    counter and debt are option B''s, which reads: any read past the ordinary senses waits on leave, in
    words or body; one taken unasked is trespass, felt by the one read as its tell, stopped by a Ward,

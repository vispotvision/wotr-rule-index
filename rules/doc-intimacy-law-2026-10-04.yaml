# answer's questionnaire id and the id numeral is the answer's number in that entry. R73 is the id
# numeral bucket; the old rows each answer supersedes or touches carry a note naming the R73 row.
# Standalone ruling pattern: empty source.file.
pack: Intimacy Law 2026-10-04

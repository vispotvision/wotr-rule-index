- id: R56-1-ZENITH_STRIKE_UNQUANTIFIED
  pack: Magic Docket Questionnaire 2026-09-26
  pack_number: null
  section: C-061, C-069
  title: A Zenith Striking Force is unquantified
  status: live
  kind: definition
  summary: A Stage XIV card states no joule figure for Striking Force; a blow delivers an event the local
    physics must accommodate.
  verbatim: 'Unquantified: the Primate''s Striking Force line (:78) becomes Part Eleven''s reading, an
    event the local physics must accommodate. The EX joule band leaves the card. ''No recorded instance''
    stays.'
  amends:

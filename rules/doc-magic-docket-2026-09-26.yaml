    lines: null
  notes: 'Applied 2026-09-26: Part Twenty-Three reads the gate ceiling as hard and the working band''s
    floor as no floor, so no card''s reserve was out of band and the earlier scaling was reverted (reports/eu_card_revert_2026-09-26.md).'

- id: R56-7-SCALING_PER_ENTITY
  pack: Magic Docket Questionnaire 2026-09-26
  pack_number: null
  section: C-072
  title: Card-wide EU scaling is read per entity
  status: live
  kind: procedure
  summary: A card-wide EU correction applies one factor per person, read wherever that person states a
    reserve; 'Essence Capacity' counts as a stated reserve.
  verbatim: 'Per entity: C-059 applies one factor per person, read from wherever that person states a
    reserve. ''Essence Capacity'' counts as a stated reserve. Dougou''s card and Mugen no Hatsurugi take
    the same factor as The Iron Tree and Muken''s card.'

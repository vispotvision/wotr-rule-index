- id: R56-9-SCALING_ON_LEVEL_BANDS
  pack: Magic Docket Questionnaire 2026-09-26
  pack_number: null
  section: C-059 follow-up
  title: Card-wide EU scaling reads the Level-law bands
  status: live
  kind: procedure
  summary: Card-wide EU scaling reads the Level-law bands, from each card's pre-scaling figures.
  verbatim: 'Re-run on the Level-law bands: the same C-059 method (one factor per entity, set point at
    the geometric mean of the new band) is recomputed from each card''s pre-C-059 figures, so nothing
    compounds.'
  amends:

  section: C-020
  title: Aether Class emerges at Glory; Stages I–V are unclassed
  status: live
  kind: definition
  summary: Aether Class emerges at Glory; Stages I–V are unclassed.
  verbatim: 'Aether Class emerges at Stage VI, Glory. Stages I–V are unclassed:
    the coil reads no Class, and Class Ø stays the sealed pre-Initiate Shell. Glory
    is Class I Muridic; Refraction is Class II Harmonic early and Class III Resonant
    late; Class V Radiant stays at Transcendence; everything above is unchanged.'

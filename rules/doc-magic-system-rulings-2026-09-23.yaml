  pack: Magic System Rulings 2026-09-23
  pack_number: null
  section: Tier names
  title: The nine Tiers of Standing; Tier 8 Archmaster, Tier 9 Paragon
  status: live
  kind: definition
  summary: The nine Tiers of Standing; Tier 8 Archmaster, Tier 9 Paragon.
  verbatim: The Tiers of Standing are Initiate, Apprentice, Journeyman, Adept, Expert,
    Master, Grandmaster, Archmaster, Paragon; Tier 8 is no longer "Absolute" and
    Tier 9 no longer "Chosen" (the title Chosen of the Codex stands). Tier Grades
    remain lettered F through SSS, X, EX, EX+.

# THE MOTO REVERSION. Standalone doc, no pack number; R22 in the
# four-document Büri/Moto naming cluster (R20 oldest, R23 newest). No
# pending/originated language for the document as a whole -- presented as
# "Authoritative reverse mapping" -- and the later Inner World Naming
# Amendment (R23) cites it approvingly as the settled record. Treated as
# status:live throughout except explicitly flagged open items. Reference
# mapping tables (character names, line names, system terms, works,
# coinages) are each bundled into one row rather than one row per mapped
# pair, consistent with how other packs' lexicon tables are handled.
pack: Moto Reversion Ledger
pack_number: null
source_file: WOTR_Moto_Reversion_Ledger.md
ratified: null
rules:

  - id: R22-1-HOUSE_STRUCK
    pack: Moto Reversion Ledger
    pack_number: null
    section: "I"
    title: Büri struck; Moto governs, house and bloodline
    status: live
    kind: repeal
    summary: >-
      "Büri" and "the Büri bloodline" are struck; "Moto" and "the Moto
      bloodline" govern.
    verbatim: >-
      Büri | Moto | | the Büri bloodline | the Moto bloodline
    amends:
      - guide: "WOTR_Buri_Conversion_Ledger.md"
        locus: null
        operation: strikes
    supersedes: []
    applies_to: [naming, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Moto_Reversion_Ledger.md
      lines: "13-14"
    notes: >-
      This is the authoritative reversal of the Büri Cultural Amendment,
      later reconfirmed as staying dead by the Inner World Naming
      Amendment (R23) §I: "The Mongolian register. The Büri Cultural
      Amendment in full, per WOTR_Moto_Reversion_Ledger.md."


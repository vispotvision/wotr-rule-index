  - id: R22-7-KHARVEN_INVENTORY_KEPT
    pack: Moto Reversion Ledger
    pack_number: null
    section: "VII"
    title: The Kharven Standing Inventory is kept, not reverted
    status: live
    kind: definition
    summary: >-
      The Kharven Standing Inventory (airag, borts, aaruul, the deel, the
      night-stone, blubber lamp, woodpile count, death-house/Waiting, sky
      burial, eight proverbs) is Mongolian-Inuit material culture, not
      naming register, and is load-bearing in every scene written this
      session; recommendation is to keep it.
    verbatim: >-
      The Kharven Standing Inventory. Airag, borts, aaruul, the deel, the
      night-stone, the blubber lamp, the woodpile count, the death-house
      and the Waiting, sky burial, and all eight proverbs. This is
      Mongolian-Inuit material culture, derived from permafrost and
      scarcity, and it is load-bearing in every scene written this
      session. Reverting it would strand the execution scene, the
      council, the wall scene and the manor scene all at once, and it
      would cost more than it bought. Recommendation: keep.
    amends: null
    supersedes: []
    applies_to: [standing-inventory, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Moto_Reversion_Ledger.md
      lines: "104"
    notes: >-
      A recommendation currently in force, per this document's own
      framing ("Say the word and either goes," source line 102), not a
      closed ruling.

  - id: R22-7-FUSI_VA_KEPT
    pack: Moto Reversion Ledger
    pack_number: null
    section: "VII"
    title: Fusi Vā is kept, not reverted to Saishiki
    status: live
    kind: definition
    summary: >-
      Fusi Vā, the Agamalu binding rite, replaced Saishiki (a Japonic word
      on a rite that is Agamalu in origin and Vāimoana in provenance,
      wrong for both registers on its own terms); the Büri amendment isn't
      what made that change correct, so it stays kept.
    verbatim: >-
      Fusi Vā. The Agamalu binding rite. It replaced Saishiki, which was a
      Japonic word sitting on a rite that is Agamalu in origin and
      Vāimoana in provenance, and was wrong for both registers on its own
      terms. The Büri amendment is not what made that change correct.
      Recommendation: keep.
    amends: null
    supersedes: []
    applies_to: [naming, worldbuilding, magic-mechanism]
    verification: []
    ratified: null

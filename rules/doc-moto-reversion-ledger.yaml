      Agamalu and the whole Agamalu house keep Polynesian register, which
      the amendment never governed; Tomuka, Ezo, Kuroyuki and Mizuyi were
      never converted and stay as they are.
    verbatim: >-
      Unaffected. Hild Ice and Robin Ice keep Stark maternal register.
      Filemu Agamalu and the whole Agamalu house keep Polynesian register,
      which the amendment never governed. Tomuka, Ezo, Kuroyuki and Mizuyi
      were never converted and stay as they are.
    amends: null
    supersedes: []
    applies_to: [naming, character-sheet]
    verification: []
    ratified: null
    source:
      file: WOTR_Moto_Reversion_Ledger.md
      lines: "32"
    notes: >-
      This is the key line behind the CONFLICTS.md note on
      R20-2-AGAMALU_ADDITION_STRUCK and R21-2-FILEMU_FULL_NAMING: it says
      the Agamalu house's own Polynesian register is untouched by "the
      amendment" (the Büri reversion), but doesn't address whether the
      Inner World Naming Amendment's later, broader strike of "the Agamalu
      addition" (a different, newer amendment) also reaches Filemu's own
      naming.


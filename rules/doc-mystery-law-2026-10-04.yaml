  - session-protocol
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K6, option C (as recommended): GUMSHOE (Robin Laws''s investigation system, in which the right
    look always finds the core clue) for the core, the extras earned. Options A (GUMSHOE whole) and B
    (only the right question, missed clues staying missed) were not taken. Finding is the table''s and

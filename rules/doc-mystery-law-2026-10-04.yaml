  verbatim: Core found, extras earned. Each conclusion's core clue comes to any sensible look; the further
    clues that sharpen it, speed it or name the purse (who paid) come only to the right question or instrument.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table Rule 6 (the read is the game): finding clues'
    operation: adds
  supersedes: []
  applies_to:

    lines: null
  notes: MY12, options B, C and D (digest). Option A, the drawing-room summation (one voice laying out
    the case, spending the scene's crafted speech), was not taken. The hearing is Ace Attorney's turn
    and keeps R53-11-JUSTICE's culture-by-culture justice, which stands; court speech runs long where
    R70-111-LONG_FORMAL_SPEECH_CLIPPED says, and R48-43-SPEECHES and R19-4-ICEBERG_DIALOGUE stand. The
    procedure is R71-81-FORENSIC_READING_PAGE's protocol as action. The document takes R70-67-FORMS_WORLD_DOCUMENTS'
    forms and R70-17-CLOSING_MODES' notice close; all three stand. A Watch search's docket close is R74-12-REST_OF_WATCH_SEARCH.
    How the answer lands is R74-22-REVEAL; whether a court or file can be bought is R74-42-WHEN_PROCESS_BOUGHT.

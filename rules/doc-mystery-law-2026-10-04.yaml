    half, played as a turn''s closing cutaway, shows the hand and the deed, never his face or name (note
    filed there). Outside a case all three stand. R5-C1-WRITE_FROM_LEAST_KNOWING and R71-6-PLAYER_FIGHTER_PAGE
    stand. A clue a cut carries is shown on the page, so it may serve a solution under R74-2-FAIRPLAY_TERMS,
    and the notes list it (R74-9-WHERE_TRUTH_KEPT). A written book''s mode is R74-1-HOW_MUCH_READER_SOLVES.'

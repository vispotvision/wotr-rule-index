    lines: null
  notes: 'K7, option B (as recommended). Options A (no cut touching his case) and C (cut freely, the culprit
    and his reasons shown) were not taken. Partly amends R49-09-CUTAWAYS and R72-7-CUTAWAY_SHOWS inside
    a case his PC works: the closing cut to the other side shows a hand, a room or a deed, never the actor''s
    face or name, which R72-7-CUTAWAY_SHOWS otherwise shows, and never the answer (notes filed there).

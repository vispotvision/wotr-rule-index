  notes: MY1, option A (digest). Justin Alexander's Three Clue Rule from tabletop practice, set on the
    archive's three roads (the room, a mouth, paper). Options B (three by any road), C (two sightings,
    R71-23-TELL_READ extended to investigation) and D (one clear clue) were not taken; R71-23-TELL_READ's

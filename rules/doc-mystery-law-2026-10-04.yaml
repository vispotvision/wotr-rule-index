rules:
- id: R74-1-HOW_MUCH_READER_SOLVES
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: K1
  title: Each book declares its mystery mode; undeclared work runs inverted
  status: live
  kind: mandate
  summary: Each book or thread bible names its mystery mode (inverted, fair puzzle, or the split, where
    the reader knows who but never how or why), and work that declares none runs inverted, the house mode.
  verbatim: 'Each book declares. Each book or thread bible names its mode: inverted, fair puzzle, or the
    split (the reader knows who, never how or why). Undeclared work defaults to inverted, the house mode.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Mysteries: the declared mode (book and thread bibles)'
    operation: adds
  - guide: WOTR_Scene_Writing_Process_Guide.md
    locus: 'POV lock and dramatic irony: the mystery mode'
    operation: adds
  supersedes: []
  applies_to:
  - pov
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K1, option C (as recommended). The modes come from the options: inverted is option A''s form
    (the villain''s room shown, the reader knowing who and how, the pleasure being the catch and its cost,
    Columbo''s form) and fair puzzle is option B''s (the villain''s room shut until the solution, the
    reader holding what the investigator holds). Partly amends R5-C1-WRITE_FROM_LEAST_KNOWING, a default
    its own words make breakable with reason: in an inverted book (the house mode) the villain''s room
    is shown and the reader knows who and how, so the default yields there to the declared mode, and it
    stands for every other scene (note filed there). R5-C1-INFO_TRACKED_PER_POV (what the reader knows
    that the POV does not) is the instrument a declared mode runs on and stands. R5-C1-NARRATION_NEVER_WINKS
    stands with R70-10-NARRATOR_STANCE''s threshold exception: an inverted book''s irony lives in what
    its scenes show. What a closing cut may show while his PC works a case is R74-7-CUTTING_AWAY_INSIDE_CASE;
    R49-09-CUTAWAYS is not changed here. The Mystery, Horror and Intrigue Craft Guide owed under R74-43-WHERE_MYSTERY_LAW_LANDS
    writes the modes in.'
- id: R74-2-FAIRPLAY_TERMS
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: K2
  title: 'Fair play for every mystery: nothing unseen, Codex-backed, sealed, a challenge mark'
  status: live
  kind: mandate
  summary: Every mystery, written or played, rests its solution only on what the reader or player was
    shown, a clue the investigator held and the page withheld voiding it and the notes listing every clue
    used; any working in the solution has a Codex line and its rule acted on the page first, none is invented
    to solve the case, and one that falsifies perception is planted as a held reveal or barred; the truth
    (who, how, why) is written in the notes before the first clue is placed and never moves to fit a guess;
    and a book marks the point where every clue is on the page, as a chapter-head line or a set-off notice,
    before the solution.
  verbatim: 'Yes to: Nothing unseen (The solution rests only on what the reader or player was shown. A
    clue the investigator held and the page withheld voids the solution; the notes list every clue used);
    Codex-backed solutions (Any working in a solution has a Codex line and its rule acted on the page
    first. No working is invented to solve a case; one that falsifies perception is planted (R71-30) or
    barred); Sealed solution (The truth (who, how, why) is written in the notes before the first clue
    is placed and never moves to fit a guess: R57-10''s ban on rigging made a procedure); A challenge
    mark (Ellery Queen''s device: a book marks the point where every clue is on the page, as a chapter-head
    line or a set-off notice, before the solution).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Mysteries: the fair-play terms'
    operation: adds
  - guide: author notes template
    locus: Clues used and the sealed solution
    operation: adds
  - guide: WOTR_Scene_Writing_Process_Guide.md
    locus: The challenge mark (books)
    operation: adds
  supersedes: []
  applies_to:
  - scene-structure
  - pov
  - magic-mechanism
  - codex
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K2, all four options; Isaac added D, the challenge mark, to the recommended A, B and C. Carries
    R48-30-SURPRISES (foreshadowing a player could have caught) to every solution; that row stands and
    is met. B carries R70-71-EXPLAINING_WORKING_MID_FIGHT''s rules shown beforehand into cases, which
    stands, and R12-3-NAMED_INVENTOR_RULE stands. Extends R71-30-HELD_BACK_REVEAL, a fight rule, to a
    case''s solution: a working that falsifies perception is planted as its held reveal is, signs listed
    in the notes, or it is barred (note filed there). C is R57-10-NEVER_RIGGED ''made a procedure'' in
    the answer''s own words (note filed there); the ban stands. D, Ellery Queen''s challenge to the reader,
    sits at a chapter head (R70-23-CHAPTER_HEADS, inside R70-10-NARRATOR_STANCE''s threshold) or as a
    set-off notice outside the prose; inside a scene R5-C1-NARRATION_NEVER_WINKS stands. Read with R74-9-WHERE_TRUTH_KEPT,
    whose sealed truth file holds who, how and why for an open table mystery and whose clue list sits
    in every scene''s notes; at the Desktop table the full notes are written at archive (R72-12-TABLE_TALK_NOTES).
    Codex lines come from the Master Codex, and no figure is invented (R12-5-NEVER_INVENT_NUMBER). R74-45-MYSTERY_CHECKS_VERIFY
    adds a verify_scene check that a marked solution lists an earlier planted sign.'
- id: R74-3-WHEN_SECRETS_PAY
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: K3
  title: A secret pays when caught or when its Front resolves; a few are kept
  status: live
  kind: mandate
  summary: A secret pays when Isaac's PC catches it or when its Front resolves, never on a timer, and
    a few secrets are marked 'kept' and never pay on the page, as the one-word letter does.
  verbatim: Caught or clocked. A secret pays when his PC catches it or its Front (a faction's clock of
    moves) resolves, never on a timer. A few are marked 'kept' and never pay on the page, as the one-word
    letter.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Secrets: when they pay'
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: K3, option B (as recommended). Options A (something paid every session, no secret dormant past
    two sessions) and C (large secrets only at an arc's end, none kept) were not taken, so no cadence
    is owed. The one-word letter in Isaac's Part 16, a Kharven-thread secret, is the archive's one secret
    kept from the reader as well. Catching is R74-5-WHAT_CATCHING_LIE_IS's act; Fronts tick on R72-20-MOVES_FRONT's
    calendar and show by R72-21-FRONT_SIGNS_SEEN's signs. A kept secret sits beside R47-12-MYSTERY_STAYS_OPEN,
    which stands. R70-17-CLOSING_MODES' break-off, whose next scene owes what was withheld, governs a
    scene's emotional payoff and is not changed. Each secret and its kept mark are recorded in R74-9-WHERE_TRUTH_KEPT's
    truth file ('what stays kept'); an unexplained notice marked seed is R74-19-THING_LEFT_UNEXPLAINED's.
- id: R74-4-WHAT_KNOWING_COSTS
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: K4
  title: Knowing is dangerous through who knows he knows and through records that act
  status: live
  kind: definition
  summary: Knowledge is dangerous through who notices that Isaac's PC knows (the Gate punishing unlicensed
    knowledge, the Mother reading the Watch's inserts, a witness becoming a target); every secret learned
    opens a Ledger line on who knows he knows; and a few records held in objects (Mnemata) act on whoever
    touches them through canon mechanism, priced by Resilience with the counter named in the notes and
    no invented figure.
  verbatim: Records that act. B, plus a few records act on whoever touches them through canon mechanism
    (Mnemata, records held in objects, R61-70), priced by Resilience with the counter named in the notes.
    No invented figure.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Table Rule 7 (the ledger): who knows he knows'
    operation: adds
  - guide: The Magic System
    locus: 'Anamnesis and the Mnemata: records that act on the toucher'
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  - magic-mechanism
  - adjudication
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K4, option C (as recommended), which takes option B whole: the danger is who notices (the Gate
    punishes unlicensed knowledge, The Mother reads the Watch''s inserts, a witness becomes a target),
    and every secret learned opens a Ledger line on who knows he knows. Options A (only bare-fingered
    contact with a residue costs) and D (names that call, the Lord of the Mysteries device) were not taken,
    so speaking a name draws nothing. The canon mechanism is R61-70-ANAMNESIS_READS_NOT_STORES (records
    live in ground and objects as Mnemata, which Anamnesis reads and wakes) and R61-108-MORTALIS_FULL_COST_STACK
    (every read erasing what it takes); both stand. Resilience is Pack Fourteen''s stat for what a working
    does to the Crystal (R14-3-STATS_DECIDE_TABLE); no figure is invented (R12-5-NEVER_INVENT_NUMBER),
    and a figure canon lacks prints as a marked estimate (R70-99-NUMBER_NOT_YET_CANON). The Gate is R60-13-THE_GATE,
    with unlicensed high magic punished like treason under R60-17-LEARNING_ANYWAY; The Mother is R60-23-THE_MOTHER;
    all stand. R12-2-MYSTIC_REGISTER_DEF is not changed. A held secret marks its holder the same way under
    R74-38-LEVERAGE_BLACKMAIL.'
- id: R74-5-WHAT_CATCHING_LIE_IS
  pack: Mystery Law 2026-10-04
  pack_number: null
  section: K5
  title: A lie is caught when his PC acts on the truth or names it in play
  status: live
  kind: definition
  summary: An NPC's lie counts as caught only when Isaac's PC acts on the truth or names the lie in play,
    and Isaac spotting it in chat changes nothing in the world until his PC moves.
  verbatim: His PC acts on it. Caught when his PC acts on the truth or names the lie in play. Isaac spotting
    it in chat changes nothing in the world until his PC moves.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Lies: what catching is'
    operation: adds
  supersedes: []
  applies_to:
  - dialogue
  - session-protocol
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the mystery questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K5, option A (as recommended). Options B (caught when Isaac names it, in character or out) and
    C (caught once a fact that breaks it is on the page) were not taken. Partly amends R48-42-LIES: its
    ''the player has to catch them'' now means his PC acting on the truth or naming the lie in play (note
    filed there); R72-25-HOW_MANY_LIES''s floor of one live lie for every roster NPC with a want stands.
    R49-36-LIE_TELLS (every lie leaves a catchable tell) stands, and R71-6-PLAYER_FIGHTER_PAGE''s tell
    placed, read his, holds. What an uncaught lie becomes is R74-18-LIE_NEVER_CAUGHT; a true sentence
    built to deceive is R74-14-TRUE_WORDS_THAT_DECEIVE.'

  - id: R20-5-ON_THE_PAGE
    pack: Naming Guide Amendment
    pack_number: null
    section: "Part Five"
    title: A character is introduced by whatever name the POV would use
    status: live
    kind: mandate
    summary: >-
      Introduce a character by whatever name the POV character would use
      (formal on first meeting, personal for intimates, Third Name or
      physical description for strangers); the narrator does not switch
      names without a reason, since a name-switch is a statement about
      the character's relationship to the reader.
    verbatim: >-
      Prose convention: introduce a character by whatever name the POV
      character would use. A practitioner meeting another practitioner
      for the first time uses the formal address. An intimate uses the
      personal name. A stranger uses the Third Name if they have heard it,
      and a physical description if they have not. The narrator uses the
      name the scene has established and does not switch without a
      reason, because a name-switch in narration is a statement about how
      the character's relationship to the reader has changed.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: "Three Names on the Page"
        operation: adds
    supersedes: []
    applies_to: [naming, pov, prose-law]
    verification: []
    ratified: null

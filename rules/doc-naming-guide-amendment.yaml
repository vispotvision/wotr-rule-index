  - id: R20-4-PRONUNCIATION_ADAPTATION
    pack: Naming Guide Amendment
    pack_number: null
    section: "Part Four"
    title: Cross-cultural mispronunciation is characterisation, not error
    status: live
    kind: definition
    summary: >-
      When a name crosses cultures, the speaker's own phonology imposes
      itself (a Concord human flattens Dawi consonant gradation, a Dawi
      stress-accents a Yukari pitch-accent name); these adaptations should
      appear in dialogue as characterisation, not be treated as typos.
    verbatim: >-
      When a name from one culture is spoken by someone from another, the
      speaker's phonology imposes itself. A Concord human cannot produce
      the Dawi consonant gradation and will flatten it. A Dawi cannot
      produce the Yukari pitch-accent and will stress-accent instead. A
      goblinoid speaker will add consonant clusters to Satulagi names that
      the Satulagi phonotactics do not permit. These adaptations are not
      errors. They are the reality of names crossing borders, and they
      should appear in dialogue: a character mispronouncing another
      character's name is characterisation, not a typo.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: "Names in Contact"
        operation: adds
    supersedes: []
    applies_to: [naming, dialogue, prose-law]
    verification: []
    ratified: null
    source:
      file: WOTR_Naming_Guide_Amendment.docx
      lines: "184"
    notes: null


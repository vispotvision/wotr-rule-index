  - id: R20-4-WHEN_NAMES_CHANGE
    pack: Naming Guide Amendment
    pack_number: null
    section: "Part Four"
    title: Each culture has different name-change triggers; cross-culture is never clean
    status: live
    kind: definition
    summary: >-
      Yukari rename at life-stage; Dawi add the oath-name at oath-taking;
      Elven validate or strip names publicly; Concord freezes bynames into
      surnames over generations; Beastkin hold name-keeping as a last
      resort. Which rule applies when a character moves between cultures
      is always specific to the characters involved and never clean.
    verbatim: >-
      Each culture has different triggers for name-change. The Yukari
      rename at life-stage transitions. The Dawi add the oath-name at
      oath-taking. The Elven validate or strip names publicly. The Concord
      system freezes bynames into surnames over generations. The Beastkin
      hold their name-keeping as a last resort. When a character moves
      between cultures, the question of which naming rules apply produces
      genuine conflict: does a Mahuo practitioner who swears a Dawi oath
      gain an oath-name? Does a Concord human adopted into a Yukari
      household receive a new name at coming-of-age? The answer is always
      specific to the characters involved, and the answer is never clean.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: "Names in Contact"
        operation: adds
    supersedes: []
    applies_to: [naming, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Naming_Guide_Amendment.docx
      lines: "194-196"
    notes: null


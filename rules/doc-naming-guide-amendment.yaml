  - id: R20-5-THIRD_NAME_SUPERSEDING
    pack: Naming Guide Amendment
    pack_number: null
    section: "Part Five"
    title: A dominant Third Name consumes the personal name and rank
    status: live
    kind: definition
    summary: >-
      When a Third Name becomes dominant, both the personal name and
      institutional rank recede — the title becomes the person, and the
      birth name is what the family uses and nobody else remembers.
    verbatim: >-
      When a practitioner's Third Name becomes dominant, the personal name
      and the institutional rank both recede. Nobody calls Cozbi Mahuo
      "Grandmaster Mahuo" unless they are reading from a filing. He is The
      Ledger-Keeper, and the Third Name has consumed the other two. This
      is the endgame of the naming system: the title becomes the person,
      the person becomes the title, and the birth name is what the family
      uses and nobody else remembers.
    amends:

# extension that is actually plain UTF-8 text, confirmed by direct
# inspection -- no pandoc conversion was needed or possible, and none was
# guessed at). Standalone doc, no pack number; uses R20 as the earliest
# mechanical id-numeral bucket in this cluster of four Buri/Moto-adjacent
# naming documents (R20 oldest, R23 newest -- see PROGRESS.md for the full
# chronology). No pending/originated language for the document as a whole;
# read as status:live by default except Part Two's Moto/Satulagi and
# Agamalu-addition subsections, which the later, newest document in this
# cluster (R23, the Inner World Naming Amendment) explicitly strikes, and
# the Celestial Host subsection, self-flagged "pending formal pass."

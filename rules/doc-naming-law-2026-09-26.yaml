- id: R50-01-REAL_GRAMMAR
  pack: Naming Law 2026-09-26
  pack_number: null
  section: Borrowing from real languages
  title: Real grammar
  status: live
  kind: mandate
  summary: Borrowed real-language names must be real, correct phrases in that language, and
    the gloss must match what the words actually mean.
  verbatim: Borrowed real-language names must be real, correct phrases in that language, and
    the gloss must match what the words actually mean.
  amends:
  - guide: Naming guide and the wotr-write skill
    locus: Borrowing from real languages
    operation: adds
  supersedes: []
  applies_to:
  - naming
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (naming questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question n01: Real-language names in the wiki are often loose. ''Upanga wa Msimu Nne''
    would be ''Upanga wa Misimu Minne'' in correct Swahili, ''Kibanda cha Mwanga wa Miti'' says
    hut, not lantern, and ''Shigoto no Baransu'

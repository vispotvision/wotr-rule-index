  section: necro 4
  title: The Tria Prima mapped for the dead; revenants as stalled Crossings
  status: live
  kind: definition
  summary: The Tria Prima mapped for the dead; revenants as stalled Crossings.
  verbatim: For the dead it maps the Tria Prima as Sulphur to the Volitional Trace, Salt to the Corporeal Residue
    with the Shell, and Mercury to the Noospheric Echo; a revenant is a stalled Crossing, grounded by Stillgate
    Ash or by moving the body.

- id: R69-5-MORTALIS_CATEGORIES_FLOORS
  pack: The Necrocursica Ratification 2026-09-28
  pack_number: null
  section: necro 5
  title: The Categories' floors and reservations; Category Four has none
  status: live
  kind: definition
  summary: The Categories' floors and reservations; Category Four has none.
  verbatim: 'The Mortalis Categories bind wherever a circle has signed, each with a floor, a reservation, a cost,
    a tell and a counter: One at Flourishing and the Adept gate, Two at Glory and the Expert gate, Three at Refraction
    and the Expert gate with individual review; Category Four has no floor and no gate, and an application is entered
    against the one who makes it.'
  amends:

  pack: The Necrocursica Ratification 2026-09-28
  pack_number: null
  section: necro 3
  title: Four residues inside the nine days, three after
  status: live
  kind: definition
  summary: Four residues inside the nine days, three after.
  verbatim: It reads four residues inside the nine days (the Corporeal Residue, the Aetheric Shell, the Noospheric
    Echo and the Volitional Trace), in that order of reading, and three after them (the Harmonic Imprint, the Sympathetic
    Bond Trace and the Parunic Echo); a Trace laid in ground that keeps records stays past the nine days.

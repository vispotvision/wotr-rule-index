  section: necro 1
  title: The extant Necrocursica is the sealed edition of 703, sealed 704
  status: live
  kind: definition
  summary: The extant Necrocursica is the sealed edition of 703, sealed 704.
  verbatim: The extant Necrocursica is Malphas's sealed edition, written by order at Genesio in 703 IC and sealed
    below the gate at the thaw of 704 IC at Tier VI, signed Malphas, Scribe to the Genesio Archivum, by order; its
    first manuscript was begun in the winter of 694 to 695 IC and finished in the spring of 696 IC, and lies sealed
    beside it.

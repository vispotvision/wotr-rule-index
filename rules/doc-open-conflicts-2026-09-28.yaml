  pack: Open Conflicts 2026-09-28
  pack_number: null
  section: C-107
  title: Aetheric Residue thins to a floor and stays readable
  status: live
  kind: definition
  summary: Ordinary residue fades loudly in hours, then thins toward a floor it never passes, readable
    by the patient; Mechanica residue never thins.
  verbatim: 'Aetheric Residue thins to a floor: the loud phase fades in hours; the quiet residue thins
    on a schedule set by local density toward a floor it never passes, so it stays readable by the patient.
    Mechanica residue does not thin at all. The Core Vocabulary and the Mechanica page each gain a line.'
  amends:

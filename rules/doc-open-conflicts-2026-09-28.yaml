- id: R62-7-STANDING_TWO_LAWS
  pack: Open Conflicts 2026-09-28
  pack_number: null
  section: C-108
  title: 'Over-claimed standing: nothing for Vocatia, a bodily price for a Parun Warrant'
  status: live
  kind: definition
  summary: A summoner who claims standing he lacks gets nothing; an overstated Parun Warrant seals and
    takes the gap from the body; Rimward fits neither.
  verbatim: 'Both laws are true in their own domains: Vocatia gets nothing when the summoner lacks the
    standing he claims; a Parun Warrant that overstates standing seals and takes the gap from the speaker''s
    body. Rimward fits neither: something outside both laws answered, and the eye was its price.'
  amends:

    (''*Too far. He''ll never make the gate.*'') vs free indirect narration (''Too far. He would never
    make the gate.'')? Unchanged by R70-25-FOREIGN_WORDS_PAGE (style law 2026-10-03): foreign words stay
    roman, so italics keep carrying thought.'

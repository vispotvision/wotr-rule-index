    lines: null
  notes: 'Question p07: The checker warns on named emotion (''he felt afraid'', ''a wave of relief'').
    In deep close POV, may the narration name what the POV feels? Partly amended by R70-39-CARRYING_FEELING
    (style law 2026-10-03): in chosen scenes the feeling is never named and one held, concrete image carries
    it; elsewhere this rule stands. Stands; R70-115-TEARS_SENTIMENT (style law 2026-10-03) adds the delayed
    break, full and open, at a small unexpected thing, once per character per arc.'
- id: R49-08-MEANING
  pack: Prose Law 2026-09-26
  pack_number: null
  section: POV and interiority
  title: Meaning
  status: live
  kind: mandate
  summary: After a beat lands the POV may reflect on what it meant in his own idiom, and may be wrong;
    neutral narrator summaries stay banned.
  verbatim: After a beat lands the POV may reflect on what it meant in his own idiom, and may be wrong;
    neutral narrator summaries stay banned.

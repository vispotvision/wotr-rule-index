  pack_number: null
  section: POV and interiority
  title: Whose head
  status: live
  kind: mandate
  summary: In roleplay turns the narration may go to full depth inside Isaac's character; Isaac
    overrules any thought that isn't his.
  verbatim: In roleplay turns the narration may go to full depth inside Isaac's character; Isaac
    overrules any thought that isn't his.

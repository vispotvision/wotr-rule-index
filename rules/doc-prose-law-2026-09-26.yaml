    operation: adds
  supersedes: []
  applies_to: *id001
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (prose questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question p08: Glosses are banned (a sentence that only states what the last one meant) and significance
    never lives in narration. After a beat lands, may the POV think about what it meant? Stands: R70-10-NARRATOR_STANCE
    (style law 2026-10-03) lets the narrator set down a maxim only in a chapter''s opening and closing
    lines, so neutral summaries of a beat''s meaning stay banned inside the scene.'

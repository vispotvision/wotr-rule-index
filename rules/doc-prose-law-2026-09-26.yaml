    file: ''
    lines: null
  notes: 'Question p09: The world moves whether or not your character is looking, but narration is POV-locked
    and never winks at the reader. May a turn cut away to something he cannot see (a Front advancing,
    an NPC plotting) Stands, and R70-11-WIDE_VIEW (style law 2026-10-03) adds the marked roll call in
    battles and crowds beside the closing cut. Noted by R70-72-WATCHING_CROWD_POWER_REVEAL (style law
    2026-10-03): a crowd''s chorus at a reveal stays inside the POV''s hearing and is not a cutaway; this
    rule stands.
    Partly amended by R72-7-CUTAWAY_SHOWS (table law 2026-10-04): the cut shows who acts and what
    they do and keeps the reason, so the player sees the move and his PC still has to read the why.'

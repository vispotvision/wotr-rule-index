    falls at the first pressure on him (a question to him, an offer, a threat, a clock); the turn
    runs past pauses he would let pass, and a line aimed at him always stops it. Read with
    R72-5-STANDING_ORDERS_OUTSIDE_FIGHTS (table law 2026-10-04): standing orders now run in every
    scene type, so wherever Isaac has posted conditions the stop at the next decision falls at the
    first branch they miss.'

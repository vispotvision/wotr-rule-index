- id: R49-05-ITALICS
  pack: Prose Law 2026-09-26
  pack_number: null
  section: POV and interiority
  title: Italics
  status: live
  kind: mandate
  summary: Italic direct thought appears often, whenever the POV talks to himself; more voice.
  verbatim: Italic direct thought appears often, whenever the POV talks to himself; more voice.

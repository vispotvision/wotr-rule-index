rules:
- id: R49-01-WHOSE_HEAD
  pack: Prose Law 2026-09-26
  pack_number: null
  section: POV and interiority
  title: Whose head
  status: live
  kind: mandate
  summary: In roleplay turns the narration may go to full depth inside Isaac's character; Isaac overrules
    any thought that isn't his.
  verbatim: In roleplay turns the narration may go to full depth inside Isaac's character; Isaac overrules
    any thought that isn't his.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: POV and interiority
    operation: adds
  supersedes: []
  applies_to: &id001
  - pov
  - prose-law
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (prose questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question p01: In roleplay turns your character is yours: the partner never thinks, speaks or
    acts for him. But interiority is now deep and running. Whose inner life does a turn''s narration carry?
    Partly amended by R71-6-PLAYER_FIGHTER_PAGE (combat law 2026-10-04): in a fight Natalie places
    the tell and never draws the conclusion for Isaac''s fighter, how he bears a wound stays his,
    and the inside of his working''s cost is his. Partly amended by R71-23-TELL_READ (combat law
    2026-10-04): when the POV is Isaac''s PC, the reading of a tell is his; the narration shows the
    tell and does not read it for him.
    Partly amended by R72-6-WORLD_WRITES_HIM (table law 2026-10-04): outside a fight too, the PC''s
    involuntary responses (sweat and nausea under Pressure, a startle, cold shakes, a drug taking
    hold) land on his body as facts, Natalie lays the tells and never draws his conclusion, and what
    he would know comes as plain recall from his card and canon only, never a new memory.'
- id: R49-02-TENSE
  pack: Prose Law 2026-09-26
  pack_number: null
  section: POV and interiority
  title: Tense
  status: live
  kind: mandate
  summary: 'Tense depends on the job: roleplay turns, and work improved for a roleplay, are written in
    present tense; written scenes and books are written in past tense. (Isaac: "for roleplays in specific
    or I am having you make something better for...'
  verbatim: 'Tense depends on the job: roleplay turns, and work improved for a roleplay, are written in
    present tense; written scenes and books are written in past tense. (Isaac: "for roleplays in specific
    or I am having you make something better for a roleplay it should definitely be present and past for
    things like writing scenes books etc".)'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: POV and interiority
    operation: adds
  supersedes: []
  applies_to: *id001
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (prose questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question p02: No rule sets person or tense. Which should roleplay turns use? Example: ''He steps
    into the death-house'' vs ''You step into the death-house'' vs ''He stepped into the death-house''.
    Stands: R70-12-FIRST_PERSON (style law 2026-10-03) sets person beside tense, third person for turns,
    scenes and books and first person only in documents.'

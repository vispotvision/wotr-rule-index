rules:

  - id: R35-1-NARRATION_DISTANCE_BANDS
    pack: Narration Distances (Psychic Distance by POV)
    pack_number: null
    section: "The three registers"
    title: Three narration distances define psychic distance per POV character
    status: live
    kind: definition
    summary: >-
      Every POV character carries one of three narration distances — close
      (narration fuses with the character's own idiom, italicized direct
      thought available), medium (POV locked, no head-hopping, but emotion
      arrives by external behaviour or simile, no italicized thought) or
      distant/formal (an omniscient epigrammatic voice describes the character
      from outside, occasional aphoristic italics, the one register licensed
      for more narratorial explanation) — and the field is called "narration
      register", never "Band", because Band is the unrelated FOW Coherence
      stat. This supplies the whose-idiom input that R4-13-FID_CARVEOUT
      depends on.
    verbatim: >-
      Every POV character carries a narration distance: how far the narration
      stands from the character's own idiom in that character's POV scenes.
      There are three. - Close register. Narration fuses with the character's
      own idiom. Sustained italicized direct thought is available, and even
      non-italic narration stays inside the character's trained vocabulary.
      The narration can be wrong the way the character is wrong. - Medium
      register. POV stays with the character and never head-hops, but emotion
      arrives via external behavioral description or simile rather than a
      fused personal idiom. No italicized direct thought. - Distant/formal
      register. An omniscient, epigrammatic narratorial voice describes the
      character from outside, with only occasional aphoristic italics. The
      distance is itself characterization, and it is the one register
      licensed for more narratorial explanation than the others get. The
      field is called "narration distance", not "Band". The Fracture of
      Worlds magic system already uses "Band" for a different, unrelated stat
      (Coherence Band A–F), and the two should never appear interchangeably
      in the same sentence.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§1.1 — psychic distance / narration distance"
        operation: adds
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: "§6 — psychic distance / narration distance"
        operation: adds
    supersedes: [R4-OP-PSYCHIC_DISTANCE_BANDS]
    applies_to: [pov, register, prose-law]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified as written"
    source:
      file: ""
      lines: null
    notes: >-
      Closes the open item R4-OP-PSYCHIC_DISTANCE_BANDS (Pack Four, Still
      Open), which said FID is house default but no character has a
      specified band and that Amendment Thirteen's carve-out (R4-13) depends
      on knowing whose idiom the narration runs in. Two amends loci because
      the R4-OP row itself carried amends: null and the FID licence these
      registers parametrise lives in both guides: the Master Style Directive
      §1.1 is where free indirect discourse is licensed (Pack Five C.3 cites
      "Directive Sec. 1.1" for it, and R5-C3 amends that locus), and
      R4-13-FID_CARVEOUT, the rule these registers feed, amends the Scene
      Writing Process Guide §6 (desktop/NATALIE.md also files "POV lock,
      psychic distance" under that guide). TERM COLLISION, recorded not
      resolved: Pack Five C.3 (R5-C3-NARRATION_DISTANCE_EXTENSION, live,
      demoted to flavour by R15-1) already uses "narration distances" for
      per-culture diction (Dawi / Eresse / Concord human / Moto POV) and its
      cross-reference keeps "band" (psychic distance) and "register" (culture)
      as two things to be "assigned together". Isaac ratified the draft's
      naming as written, so this row's "narration distance" means the
      psychic-distance axis; where both senses could be read, say
      "narration distance (psychic distance)" or "culture register". Logged
      in CONFLICTS.md. The published text is docs/NARRATION_DISTANCES.md
      (repo) and the Notion page "Narration Distances — Psychic Distance by
      POV" under The Rule Index, recorded in build/.notion_publish.json.

  - id: R35-2-NARRATION_DISTANCE_ASSIGNMENTS
    pack: Narration Distances (Psychic Distance by POV)
    pack_number: null
    section: "Close register / Medium register / Distant-formal register / Unassigned"
    title: Narration register assignments for the major POV cast
    status: live
    kind: definition
    summary: >-
      Close register: Darius, Aurelian, Verinus, Charles, Sodoku Moto, Niran
      Yukari, Wren, Kwon Mu-jin. Medium register: Rengai. Distant/formal
      register: Cozbi Mahuo. Each assignment carries a violation caution
      (never a narratorial verdict Darius does not voice himself; never
      validate Aurelian's certainty from outside his idiom; no neutral Church
      register for Verinus; no practitioner's jargon for Charles; no
      interpretive-summary sentences past Sodoku's procedural read; Niran's
      feeling only through his clinical vocabulary; Wren laconic and
      tactical only; Kwon Mu-jin's failing read shown from inside; no
      retrofitted first-person italics or verdicts for Rengai; Cozbi's
      explanation stays inside his self-mythologizing frame). Hild Ice and
      Dabney are unassigned until scenes in their own idiom exist for Isaac
      to rule on.
    verbatim: >-
      Close register: Darius, Aurelian, Verinus, Charles, Sodoku Moto, Niran
      Yukari, Wren, Kwon Mu-jin. Medium register: Rengai. Distant/formal
      register: Cozbi Mahuo. Unassigned, pending scenes in their own idiom:
      Hild Ice (Stark), Dabney (Corvalen Olyss). Each assigned character's
      entry below carries a violation caution, and the caution is part of the
      assignment: the register says whose idiom the narration runs in, the
      caution says where that idiom is most likely to be broken from outside.
    amends:

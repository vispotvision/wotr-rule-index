    notes: >-
      The verbatim is the roster paragraph ("Assignments at a glance"); the
      nine per-character entries with their violation cautions follow it in
      full in docs/NARRATION_DISTANCES.md (sections "Close register", "Medium
      register", "Distant/formal register", "Unassigned"). Hild Ice and

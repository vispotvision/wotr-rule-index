  - id: R24-3-HOST_SYNTAX
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "III"
    title: The Host is declarative, unhedged, and answers precisely
    status: live
    kind: definition
    summary: >-
      Declarative, present tense, unhedged — never "I think" or "perhaps";
      short flat subject-verb-object sentences; they answer precisely the
      question asked, not the question intended, which is where every
      conversation with the Host goes wrong.
    verbatim: >-
      Declarative, present tense, and unhedged. The Host does not say I
      think, perhaps, it seems or in my view, because those constructions
      describe a relationship between a speaker and a claim, and the Host
      does not have that relationship. They state.
    amends:
      - guide: "WOTR_Racial_Voice_and_Dialect_Guide.md"
        locus: "docket 20"
        operation: adds
    supersedes: []
    applies_to: [register, dialogue]
    verification: []
    ratified: null
    source:
      file: WOTR_Racial_Voice_Guide_Amendment.md
      lines: "115"
    notes: null

  - id: R24-3-HOST_CORE_DEVICE
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "III"
    title: The Host cannot be imprecise, and knows its precision is useless
    status: live
    kind: definition
    summary: >-
      A Host gives an answer that is correct and unusable, aware of this
      and unable to do anything about it — accurate rather than confident,
      which is what stops them sounding like scripture.
    verbatim: >-
      They cannot be imprecise, and they know their precision is useless.
      A Host asked how long something will take gives an answer that is
      correct and unusable.
    amends:
      - guide: "WOTR_Racial_Voice_and_Dialect_Guide.md"
        locus: "docket 20"
        operation: adds

  - id: R24-1-FLESHSHAPER_SYNTAX
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "I"
    title: Fleshshaper syntax fronts the object being worked on
    status: live
    kind: definition
    summary: >-
      Short declarative clauses in working order, sequence first and
      reason second or not at all; they front the object ("The arm, I open
      here"), naming the thing being worked on before the working.
    verbatim: >-
      Short declarative clauses in working order. They describe procedure
      the way a competent tradesman describes procedure: sequence first,
      reason second or not at all. Compound sentences are rare and always
      join a step to its consequence. They front the object. The arm, I
      open here.
    amends:
      - guide: "WOTR_Racial_Voice_and_Dialect_Guide.md"
        locus: "docket 20"
        operation: adds
    supersedes: []
    applies_to: [register, dialogue]

  - id: R24-2-ELADRIN_SYNTAX_AND_MARKERS
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "II"
    title: Eladrin syntax is archaic-formal with zero phonetic markers
    status: live
    kind: definition
    summary: >-
      No contractions ever, present tense for permanent conditions,
      questions phrased as statements with an expectant pause, no
      interrupting or overlapping; zero phonetic markers, deliberately —
      their unaccented perfection is enormous effort read as coldness.
    verbatim: >-
      Formal, complete, and slightly archaic through the retention of full
      forms: no contractions, ever, and this is the one absolute in the
      register.
    amends:
      - guide: "WOTR_Racial_Voice_and_Dialect_Guide.md"
        locus: "docket 20"
        operation: adds

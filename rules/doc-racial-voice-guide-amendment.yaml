    pack_number: null
    section: "III"
    title: The Host reports accurately; accuracy doesn't translate to mortal use
    status: live
    kind: definition
    summary: >-
      The Host is not speaking scripture; they report accurately, and
      their difficulty is that accuracy in their register does not
      translate into a mortal one.

  - id: R24-2-ELADRIN_THREE_CHANNELS
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "II"
    title: Eladrin communication runs on speech, distance and stillness
    status: live
    kind: mandate
    summary: >-
      Prose must render at least two of three simultaneous channels in any
      exchange of consequence — sparse speech that rarely carries the
      content, distance (approach is agreement, a half-step back is
      objection, turning without moving the feet is refusal), and
      stillness (complete stillness is often the loudest thing in the
      room).
    verbatim: >-
      Winter Eladrin communication runs on three channels simultaneously.
      Prose must render at least two in any exchange of consequence.
    amends:
      - guide: "WOTR_Racial_Voice_and_Dialect_Guide.md"
        locus: "docket 20"
        operation: adds
    supersedes: []
    applies_to: [dialogue, prose-law]
    verification: []
    ratified: null

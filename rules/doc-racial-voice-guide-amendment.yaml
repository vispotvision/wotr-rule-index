  - id: R24-N-OVERRIDE_CAVEAT
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "Notes"
    title: All three registers are originations, overridden by any prior lore
    status: live
    kind: definition
    summary: >-
      All three registers are originations contradicting no existing lore
      (none existed); if any culture has established speech in an
      unreached document, these are overridden by it.
    verbatim: >-
      All three are originations and none contradicts existing lore,
      because no lore existed. If any of these cultures has established
      speech in a document I did not reach, these are overridden by it and
      I would rather be told than have it discovered in prose.

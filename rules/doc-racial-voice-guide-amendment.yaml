  - id: R24-2-ELADRIN_NEVER_BARE_LINE
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "II"
    title: Never write an Eladrin line without a distance/stillness beat
    status: live
    kind: ban
    summary: >-
      Never write an Eladrin line of dialogue without a distance or
      stillness beat attached; a bare Eladrin line is an incomplete
      sentence in their language.
    verbatim: >-
      Never write an Eladrin line of dialogue without a distance or
      stillness beat attached. A bare Eladrin line is an incomplete
      sentence in their language, and the reader should be able to follow
      an entire Eladrin conversation with the dialogue removed.

  - id: R24-2-ELADRIN_GOVERNING_PRINCIPLE
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "II"
    title: Winter Eladrin speak; speech is the least of what they do
    status: live
    kind: definition
    summary: >-
      Winter Eladrin are not silent; speech is the least of what they are
      doing, and the prose has to carry the rest through distance and
      stillness.
    verbatim: >-

  - id: R24-1-FLESHSHAPER_IDIOM_AND_MARKERS
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "I"
    title: Fleshshaper idiom is anatomy applied to everything; two markers
    status: live
    kind: definition
    summary: >-
      Anatomy applied to everything, not as metaphor but as their actual
      vocabulary (a seam, badly sutured, swelling, opened, holds under
      load); exactly two phonetic markers — dropped final -g on gerunds,
      and "th" hardening to "d" only in unstressed grammatical positions.
    verbatim: >-
      Anatomy, applied to everything. Not as metaphor and not as a shock
      device. It is simply the vocabulary they have, extended outward the
      way a sailor extends rigging or a smith extends heat.
    amends:
      - guide: "WOTR_Racial_Voice_and_Dialect_Guide.md"
        locus: "docket 20"
        operation: adds

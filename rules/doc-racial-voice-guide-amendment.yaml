  - id: R24-1-FLESHSHAPER_SIGNATURES_AND_TELL
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "I"
    title: Fleshshaper signature turns and stress-tell
    status: live
    kind: definition
    summary: >-
      Signature lines "That closes" (anything settled) and "Who holds it?"
      (their first question about any structure); under stress they become
      more procedural, not less, shortening to pure sequence with the
      reasons dropped.
    verbatim: >-
      - "That closes." Said of anything settled: a wound, an argument, a
      debt, a life. Their all-purpose full stop. - "Who holds it?" Their
      first question about any structure, organisation, alliance or plan.
    amends:

  - id: R24-3-HOST_IDIOM_AND_SIGNATURES
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "III"
    title: The Host's idiom is measure and law; obvious celestial words banned
    status: live
    kind: ban
    summary: >-
      Idiom draws on measure, position and law (out of position, standing,
      no place, release a claim); light/fire/wings are banned as too
      obvious; signature lines "That is not the question" and "I do not
      have that"; under stress the Host becomes more precise and slower,
      with hedges appearing for the first time.
    verbatim: >-
      Measure, position, and law. Distance, weight, order, precedence,
      standing. Never light, never fire, never wings. The obvious
      celestial vocabulary is banned in this register precisely because it
      is obvious.
    amends:
      - guide: "WOTR_Racial_Voice_and_Dialect_Guide.md"
        locus: "docket 20"
        operation: adds
    supersedes: []
    applies_to: [register, dialogue]
    verification: []
    ratified: null

  - id: R24-2-ELADRIN_IDIOM_AND_SIGNATURES
    pack: Racial Voice and Dialect Guide Amendment
    pack_number: null
    section: "II"
    title: Eladrin idiom is weather and cold; two signature turns
    status: live
    kind: definition
    summary: >-
      Idiom draws on weather, season and the behaviour of cold as literal
      analytical vocabulary (thawing/set, keeps, melted, tracked);
      signature lines "It keeps" and "You have moved"; under stress
      stillness increases and the distance grammar stops entirely.
    verbatim: >-
      Weather, season and the behaviour of cold. Never as decoration and
      always as the actual analytical vocabulary.

  id: R85-5-CAP_BASELINE
  section: magic-audit
  title: The cap's baseline
  kind: mandate
  summary: "The two-Grade cap is read from the sustainable Grade on the card. A transient boost passes the Stage's ceiling lawfully inside the cap, and only a lasting forced stat takes the fracture rate of Part Five. Outside help adds no risk to the one receiving it unless it is forced on them, and a blessing counts as outside help."

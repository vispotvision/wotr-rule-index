  id: R85-4-AU_SPENT_AND_DELIVERED
  section: magic-audit
  title: AU/s spent and delivered
  kind: mandate
  summary: "AU/s is Flux Density times η, the rate a practitioner spends at full output, and delivered power is AU/s times η. So η counts twice on purpose: once for how much the Shell can move and once for what survives the trip. At full output a higher η empties the reserve faster; for the same delivered effect it lasts longer."

    notes: >-
      Originated 2026-09-12 (no source document -- Isaac's ruling was to
      write the mechanism itself). Resolves the open ruling previously
      flagged on wiki/Volume IV — Character Cards/The Ossuary Choir.md
      ("there is no mechanism in Fracture of Worlds for a shared Soul
      Crystal across three donors"); that card has been edited in Notion
      to carry this mechanism under its own §II and its wiki mirror
      re-exported. Grounded in Synergia and Concordia (wiki/The Magic
      System/The Magical Categories — Unified Taxonom.md) and in the
      standard Essence Core / Aether Shell / Attraction Layer split
      (wiki/The Magic System/The Core Vocabulary.md, wiki/The Magic
      System/Tier Grade, Bands & the Aether Shell.md). Written
      general-purpose: applies to any future multi-donor Soul Crystal, not
      only the Ossuary Choir, which serves here only as the worked
      example (three donors, three Wellsprings -- Dissolution and Nihiloth
      sharing the Limina House, Calcination running Caloria alongside
      them).

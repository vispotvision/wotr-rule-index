# Shared Soul Crystal Mechanism. Standalone doc, no pack number; originated
# 2026-09-12 in a Claude Code session, not extracted from any amendment
# pack. Isaac's ruling that day: "write the mechanism -- a shared/split
# Soul Crystal is now a real, documented setting-wide thing, not a one-off
# exception just for this one Choir." Uses R26 as the next standalone-doc
# id-numeral bucket after R25 (the Obsession Force / Attraction Path Gate
# Ruling, filed the same day); this does not imply pack precedence
# ordering, which pack_number:null already disables.
# Grounded in the existing single-donor Soul Crystal structure (Essence
# Core / Aether Shell / Attraction Layer, Coherence Band, eta) documented
# in wiki/The Magic System/The Core Vocabulary.md and wiki/The Magic
# System/Tier Grade, Bands & the Aether Shell.md, and built on two
# categories that already existed before this ruling: Synergia ("several
# Soul Crystals briefly sharing one Essence Core, Shell, and Layer," per
# wiki/The Magic System/The Magical Categories — Unified Taxonom.md) made
# permanent by Concordia instead of left momentary. No new Category or
# Wellspring was invented; this rule states how the existing pieces
# combine for more than one donor. Worked example: The Ossuary Choir
# (wiki/Volume IV — Character Cards/The Ossuary Choir.md), whose card
# previously flagged "there is no mechanism in Fracture of Worlds for a
# shared Soul Crystal across three donors" as an open ruling. That card
# has been edited in Notion (and its mirror re-exported) to carry this
# mechanism in full under its own §II, replacing the flag. The mechanism
# itself is written general-purpose: any future character sharing a Soul
# Crystal cites this row, not a Choir-specific exception.

rules:

  - id: R39-1-CANON_STAT_MODEL
    pack: Stat System and Scene Rulings 2026-09-13
    pack_number: null
    section: "C-014"
    title: Points buy Sub-Stats; a Primary is the sum of its eight; the Grade is the mean
    status: live
    kind: mandate
    summary: >-
      The Living System's own model governs every sheet: Sub-Stats are what
      points are spent on, a Primary is the total of its eight Sub-Stats, and
      its Grade is read off the mean. The 125 cards that bought Primaries as
      a second layer of spend are wrong and are re-costed to this shape.
    verbatim: >-
      The canon model: points are spent on Sub-Stats only; a Primary is the
      total of its eight Sub-Stats and its Grade is read off the mean. The
      125 sheets that buy Primaries as a second layer are wrong and are
      re-costed to this shape (the R38-2 re-cost proceeds on the canon
      model).
    amends:
      - guide: "Fracture of Worlds — The Living System"
        locus: "Fracture of Worlds — Part Three, Stat Points"
        operation: extends
    supersedes: []
    applies_to: [stats, character-sheet, adjudication]
    verification: []
    ratified: "Isaac, 2026-09-13, Claude Code: ruled directly (closes C-014)"
    source:
      file: ""
      lines: null
    notes: >-
      Closes CONFLICTS.md C-014. Gates the R38-2 re-cost of the 208 sheets:
      scale to the current pool on the canon model, not the cards' two-layer
      accounting.

  - id: R39-2-DOMINION_MEAN_OF_SEVEN
    pack: Stat System and Scene Rulings 2026-09-13
    pack_number: null
    section: "C-009"
    title: Dominion's Grade is the mean of its seven counted Sub-Stats
    status: live
    kind: definition
    summary: >-
      Because Throne is excluded from the Dominion total, Dominion's mean is
      the total divided by seven; Throne sits outside both the total and the
      mean.
    verbatim: >-
      Dominion's mean is the total divided by seven, the seven counted
      Sub-Stats; Throne sits outside both the total and the mean.
    amends:
      - guide: "Fracture of Worlds — The Living System"
        locus: "Fracture of Worlds — Part Three, Temperance Ceilings"
        operation: extends
    supersedes: []
    applies_to: [stats, character-sheet]
    verification: []
    ratified: "Isaac, 2026-09-13, Claude Code: ruled directly (closes C-009)"
    source:
      file: ""
      lines: null
    notes: Closes CONFLICTS.md C-009.

  - id: R39-3-STAGE_ONE_THRESHOLD_COUNTS
    pack: Stat System and Scene Rulings 2026-09-13
    pack_number: null
    section: "C-010"
    title: Stage I is a Threshold worth 100 points
    status: live
    kind: definition
    summary: >-
      Every practitioner starts with the Stage I Threshold's 100 points, so
      Part Three's worked totals stand exact; Part Eight's thirteen listed
      events are the transitions, not the count of Thresholds.
    verbatim: >-
      Stage I counts as a Threshold worth 100 points: everyone starts with
      100 Threshold points, and Part Three's worked totals stand exact (2,200
      at Level 100 / Stage IV; 9,100 through Stage XIII).
    amends:

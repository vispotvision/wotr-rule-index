  - id: R39-7-NO_NPC_THOUGHT_UNDER_POV_LOCK
    pack: Stat System and Scene Rulings 2026-09-13
    pack_number: null
    section: "C-008"
    title: No NPC italic thought inside a locked-POV scene
    status: live
    kind: ban
    summary: >-
      The narration-distance rule wins over Pack One's Scene Standards
      carve-out: a named NPC gets no private italic thought in a scene with a
      POV lock. The carve-out survives only where there is no lock —
      omniscient narration and mass combat.
    verbatim: >-
      The narration-distance rule wins: no NPC italic thought inside a
      locked-POV scene. Pack One's "one private italic thought per named NPC"
      carve-out survives only for scenes with no POV lock (omniscient and
      mass combat).
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: "§5 worked example; Scene Standards"
        operation: replaces
    supersedes: []
    applies_to: [pov, prose-law, scene-structure]
    verification: []
    ratified: "Isaac, 2026-09-13, Claude Code: ruled directly (closes C-008)"

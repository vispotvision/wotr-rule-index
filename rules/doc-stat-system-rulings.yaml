  - id: R39-4-MAX_GRADE_LETTER_BINDS
    pack: Stat System and Scene Rulings 2026-09-13
    pack_number: null
    section: "C-011"
    title: The Stage's Max Grade letter caps a Sub-Stat; the numeric ceiling above it is the instability zone
    status: live
    kind: mandate
    summary: >-
      A Sub-Stat may not be allocated past the top of the Stage's Max Grade
      bracket (V 275, VII 400, IX 550, XI 725). The band from there to the
      Stage's numeric ceiling is reachable only under strain, never by
      spending points.
    verbatim: >-
      The Max Grade letter binds: a Sub-Stat may not exceed the top of the
      Stage's Max Grade bracket (Stage V 275, VII 400, IX 550, XI 725); the
      band from there up to the Stage's numeric ceiling is the flagged
      instability zone, reachable only under strain, never by allocation.
    amends:
      - guide: "Fracture of Worlds — The Living System"
        locus: "Fracture of Worlds — Part Five, the Stage table"
        operation: extends
    supersedes: []
    applies_to: [stats, character-sheet, adjudication]
    verification: []
    ratified: "Isaac, 2026-09-13, Claude Code: ruled directly (closes C-011)"
    source:
      file: ""
      lines: null
    notes: Closes CONFLICTS.md C-011.


- id: R70-4-WESTERN_MODELS
  pack: Style Law 2026-10-03
  pack_number: null
  section: K4
  title: 'Western models: Tolkien, Dickens, Kay; Martin and Abercrombie dropped'
  status: live
  kind: definition
  summary: Name Tolkien (elegy, high style, routes, songs, many-named places), Dickens and the Victorians
    (the city as organism, money and institutions, the serial hook) and Guy Gavriel Kay as the Western
    models, plus the Eastern and LitRPG creators Isaac added (Kishimoto, Kubo, anime, Unbound, The Beginning
    After the End); Martin and Abercrombie are no longer named, and the narrator still passes no moral
    verdicts.
  verbatim: 'Yes to: Tolkien (Elegy, high style, routes, songs and many-named places stay named under
    Tolkien; his moral voice stays barred (R5-E). Unticked, the same register stays legal under R48-05
    without his name); Dickens and the Victorians (Joins the list: the city as one organism, money and
    institutions on the page, the serial hook. Fits the Draw Age''s Victorian look (R53-28); the narrator''s
    moral verdicts stay out); Guy Gavriel Kay (Joins the list: Western craft carried into Chinese-history
    settings, an elegiac storyteller who looks ahead to what the years will do, courts run on poetry and
    rank. A ready bridge for the Chinese-register halls and Korean courts). Not taken: Martin and Abercrombie.
    (Dickens/Victorians, Guy Gavriel Kay, Tolkien kept; Martin and Abercrombie unticked (dropped as named
    models). Added in his words: ''Other Eastern Writers like Creator of Naruto and Bleach and other animes
    litRPG light novel etc like unbound and beginning after the end''.)'
  amends:
  - guide: WOTR_Master_Style_Directive.md
    locus: §1
    operation: replaces
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is (the models line)
    operation: replaces
  supersedes: []
  applies_to:
  - prose-law
  - register
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: K4. Tolkien's moral voice stays barred under R5-E-NARRATION_NEVER_ADJUDICATES and R5-E-FREE_INDIRECT_CARVEOUT;
    high style stays legal under R48-05; the Dickens pick leans on R53-28. Martin and Abercrombie leave
    the models line with R5-A-FLESH_CHANGES and R5-E-MARTIN_WINS_RULING, both superseded by R70-1 and
    R70-7.
- id: R70-5-EASTERN_MODELS
  pack: Style Law 2026-10-03
  pack_number: null
  section: K5
  title: Eastern models, one per register culture
  status: live
  kind: definition
  summary: Draw on Jin Yong and the chapter novels for the Chinese-register halls, the Heike and the war
    tales for the Moto and Shirogane, Kawabata and Tanizaki for Japanese restraint, and pansori and sijo
    for Ketsuen, Hon-guk and the Mahuo.
  verbatim: 'Yes to: Jin Yong, chapter novels (The Chinese-register halls gain a model: named forms traced
    to a lineage and a manual, sect politics run like a state''s, the chapter novel''s storyteller and
    couplet chapter titles); The Heike and war tales (The Moto and Shirogane gain their tradition: the
    name-declaration before combat, armour catalogued piece by piece, impermanence felt at the fall of
    a house); Kawabata and Tanizaki (Japanese restraint gains a named model: the scene that breaks off
    before its point, the season in one exact detail, rooms described by how they hold light and shadow);
    Pansori and sijo (Ketsuen, Hon-guk and the Mahuo gain a literary voice: tempo matched to feeling,
    comedy inside tragedy, han (grief held for years, never released), and sijo, three-line verse that
    turns in its last line).'
  amends:
  - guide: WOTR_Master_Style_Directive.md
    locus: §1
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is (the models line)
    operation: adds
  supersedes: []
  applies_to:
  - prose-law
  - register
  - combat
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K5. Joins Naruto and Lord of the Mysteries, which stay named models. Its devices land through
    other rows: couplet chapter titles (R70-23), break-off endings (R70-17), the season word (R70-16).'
- id: R70-6-LITRPG_PROGRESSION_MODELS
  pack: Style Law 2026-10-03
  pack_number: null
  section: K6
  title: LitRPG and progression models
  status: live
  kind: definition
  summary: Take Cradle (rank felt in the room, breakthroughs as set pieces), Reverend Insanity (every
    gain bought and counted), Solo Leveling (the reassessment, quests with stated penalties, the drill
    as contract) and The Wandering Inn (the level-up as a quiet verdict, bracketed class and skill names)
    as progression models beside Unbound.
  verbatim: 'Yes to: Cradle (Ranks everyone in a room can sense, breakthroughs written as set pieces,
    little need for screens. Matches how Pressure already works in WOTR); Reverend Insanity (A Chinese
    cultivation novel run as a ledger: every gain bought, every resource counted, a cold calculating mind
    at the centre. The grimdark end of cultivation fiction, close to WOTR''s cost law); Solo Leveling
    (The Korean System novel: the reassessment that overturns a registered rank, quests with stated penalties,
    the daily drill as a contract. Its escalation and onlooker shock run into the R5-B tells); The Wandering
    Inn (The level-up as a quiet verdict on who a person became that day, arriving in sleep; bracketed
    class and skill names inside ordinary sentences).'
  amends:
  - guide: WOTR_Master_Style_Directive.md
    locus: §1
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is (the models line)
    operation: adds
  supersedes: []
  applies_to:
  - prose-law
  - stats
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: K6. Solo Leveling comes in knowing its escalation and onlooker shock run into the R5-B tells;
    those tells are re-ruled one by one under R70-7 (the crowd chorus R70-72, escalation inside a duel
    R70-102, the face-slap R70-112). Scaling vocabulary stays off the page (R13-6-SCALING_VOCAB_RESTRICTED

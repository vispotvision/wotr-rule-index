- id: R70-1-BLEND_MODEL
  pack: Style Law 2026-10-03
  pack_number: null
  section: K1
  title: One fused house style, tilted by the POV's culture
  status: live
  kind: mandate
  summary: Write every scene in one house style that draws on Western literary fantasy, the Eastern traditions
    and LitRPG at once, and let the POV's culture tilt the mix (further East in a Moto room, further West
    in an Accord counting-house).
  verbatim: 'Fused, tilted by culture. One house style draws on all three strands in every scene, and
    the POV''s culture tilts the mix: a Moto room leans further East, an Accord counting-house further
    West. R5-A, R5-E and R11-1 are rewritten.'
  amends:
  - guide: WOTR_Master_Style_Directive.md
    locus: §1
    operation: replaces
  - guide: NATALIE.md and the wotr-write skill
    locus: Who Natalie is (the models line)
    operation: replaces
  supersedes:
  - R5-A-FLESH_CHANGES
  - R5-E-MARTIN_WINS_RULING
  - R11-1-TONAL_SPINE_UNCHANGED
  applies_to:
  - prose-law
  - register
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: K1. Supersedes the Western-flesh doctrine rows named in its own words (R5-A, R5-E, R11-1), as
    R70-7 also does; within those short ids only the doctrine rows are reached, and R5-A-SKELETON_UNCHANGED,
    R5-E-NARRATION_NEVER_ADJUDICATES, R5-E-ELEGIAC_REGISTER_ALLOWED, R5-E-FREE_INDIRECT_CARVEOUT and the
    R11-1 visual rows stand. Works with R70-3 (which strand leads which layer) and R70-21 (cadence set
    by the POV's culture).

- id: R70-121-GROWN_COMIC_NAMES
  pack: Style Law 2026-10-03
  pack_number: null
  section: NM3
  title: Nicknames, mangled names, sound comedy and protective names
  status: live
  kind: mandate
  summary: 'Let comic names grow from use: comrades'' deed and body nicknames, names bent by a foreign
    mouth and spelled as heard, names funny for their noise inside a people''s sound rules, and cheap
    or ugly names given so that death passes a child over.'
  verbatim: 'Yes to: Soldiers'' nicknames (Deed and body bynames from comrades, literal or ironic, the
    way Abercrombie''s Logen Ninefingers counts his missing finger. Peers coin them, so the joke belongs
    to the characters); Mangled names (A name or phrase bent by a foreign mouth and written as heard,
    a real mishearing every time (R20-4). Canon already does it: the Dawi say Porin, and Common mouths
    make it Borin); Sound comedy (Names funny for their noise: hard k sounds, doubled syllables, a goblin
    mouth''s extra consonants. Built inside each people''s own sound rules, and most at home among the
    goblinoids); Protective ugly names (A child given a cheap or ugly name so death passes it over, as
    Chinese and Korean families did; R23-5 already allows a name given ''as an insult or a shield''. Comic
    to outsiders, grim at home).'
  amends:

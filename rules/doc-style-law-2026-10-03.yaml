    or tests in italic thought; R16-8-CHECK33''s cap on technical terms in italics eases); The unsaid
    (Thought may stop short of its conclusion and leave an action or an image to carry it, as Kawabata
    does; deep interiority becomes one mode of two, chosen per register); Reasoning from figures (A POV
    who can read rank or price may reason from readings and figures as evidence, as LitRPG heroes do;
    every figure still traces to a source (R12-5)).'

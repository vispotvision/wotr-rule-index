    culture's sound rules, as Dickensian talking surnames for Northern and Accord families, and as plausible
    puns built from words the Draw Age owns, never from a brand, celebrity or modern-world reference.
  verbatim: 'Yes to: Rhyming and alliterating sets (Kin, crews and sworn pairs share a name-part and change
    the sound, Borin and Snorin style, inside each culture''s own sound rules. A set meeting is a beat
    (R50-17)); Dickensian talking surnames (Surnames that tell a trade or a nature one notch past believable,
    as Gradgrind did: the Victorian imperial register R53-28 already sets, for Northern and Accord families);

- id: R70-35-HARD_BAN_LIST
  pack: Style Law 2026-10-03
  pack_number: null
  section: VB12
  title: Three stock-phrase families join the hard-ban list; three items trimmed
  status: live
  kind: ban
  summary: Narration may not use the listed cultivation-translation, Western fantasy and LitRPG stock
    phrases (qi surged, a grim smile, power surged through him and the rest the answer names), while testament
    for a will, visceral in anatomy and orbs for lamps and regalia now pass and the stock senses of those
    three still fail.
  verbatim: 'Yes to: Cultivation-translation stock (Bans ''qi surged'', ''a cold glint flashed'', ''sucked
    in a cold breath'' and ''killing intent surged'' in narration. The Eastern feel comes from method,
    never from translated filler); Western fantasy stock (Bans ''the steel sang'', ''a grim smile'', ''his
    blood ran cold'', ''every fibre of his being'' and ''darkness gathered''. Grimdark''s own worn phrasing
    goes out with the imported kind); LitRPG stock (Bans ''power surged through him'', ''stronger than
    ever'', ''a wave of power'' and ''his stats soared''. Growth shows in the body and on the instrument);
    Trim the false hits (Narrows three items to their stock sense: a will called a testament passes, ''visceral''
    passes in anatomy (the visceral pleura, R49-45), ''orbs'' passes for lamps and regalia. The stock
    senses still fail).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Vocabulary and diction
    operation: extends
  supersedes: []
  applies_to:
  - prose-law
  - register
  - verification
  verification:
  - 'verify: hard-ban list'
  - 'verify: hard-ban families'
  ratified: 'Isaac, 2026-10-03, Claude Code chat: ruled directly (the style questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Partly amends R51-10-SLOP_WORDS. Cultivation: qi surged, a cold glint flashed, sucked in a cold
    breath, killing intent surged. Western: the steel sang, a grim smile, his blood ran cold, every fibre
    of his being, darkness gathered. LitRPG: power surged through him, stronger than ever, a wave of power,
    his stats soared. R70-36-CHECKER_ENFORCES FAILs the families at first use in narration; speech formulas
    are R70-108-EASTERN_REGISTER_SPEECH_SOUNDS'' and R70-136-NEW_CHECKS_VERIFY_SCENE''s.'
- id: R70-36-CHECKER_ENFORCES
  pack: Style Law 2026-10-03
  pack_number: null
  section: VB13
  title: verify_scene gains four vocabulary checks
  status: live
  kind: procedure
  summary: verify_scene matches native words against the culture word banks (a near-miss FAILs, unknown
    words are listed for the scene log), checks Stage, Band, Wellspring and Family names for spelling
    and capitals against a wotr_terms.txt built from Fracture of Worlds, the glossary and the Codex, FAILs
    the new ban families at first use in narration (looser variants WARN), and WARNs on an italicised
    loanword, a digit where words are due and an archaic word outside its culture's dial.
  verbatim: 'Yes to: Word-bank spelling check (Native words are matched against the culture banks (VB10);
    a near-miss FAILs as a misspelt Wellspring does (R14-5-NEAR_MISS_FAIL); unknown words are listed for
    the scene log (R50-28)); Canonical term list (wotr_terms.txt is built from Fracture of Worlds, the
    glossary and the Codex; Stage, Band, Wellspring and Family names are checked for spelling and capitals
    (VB8), and a near-miss FAILs (R14-5-NEAR_MISS_FAIL, Check 37)); New ban families FAIL (The families
    chosen in VB12 FAIL at first use in narration, as R51-10 does; looser variants of a banned phrase
    WARN for a read); Style-sheet warnings (WARNs for the house style set here: an italicised loanword
    (VB2), a digit where words are due (VB7), an archaic word outside its culture''s dial (VB4). Holds
    the style without blocking a reply).'

rules:
- id: R72-1-SESSION_PROMISES
  pack: Table Law 2026-10-04
  pack_number: null
  section: K1
  title: A spine toward the set piece and a payoff each session
  status: live
  kind: mandate
  summary: Natalie keeps each thread working toward its next set piece and puts one payoff the PC can
    earn within reach every session, alongside a fresh cost.
  verbatim: 'Spine and payoff. B and C together: each thread works toward its next set piece, and every
    session on the way puts one earnable payoff in reach beside a fresh cost.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Roleplay partnership (what a session promises)
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K1, option D, which takes B and C together. B reads: situations only, plus one earnable payoff
    put in reach each session (a read that can land, a debt to collect, a Guild re-assay, the fresh measure
    of his rank) beside a fresh cost. C reads: situations, plus each thread''s next set piece held in
    view (the bout, the hearing, the delve) with Fronts leaning toward it; the route is steered and the
    outcome stays open. R57-10-NEVER_RIGGED stands: the route is steered, never the outcome. R70-18-ARC_SHAPES
    supplies set-piece shapes (the tournament, the Well delve), and a payoff that moves a number still
    needs R70-90-FAST_NUMBERS_CLIMB''s shown cause. R48-29-PACING is not named and stands. Fronts lean
    toward the set piece on R72-20-MOVES_FRONT''s calendar.'
- id: R72-2-IMPROVISE_OR_ASK
  pack: Table Law 2026-10-04
  pack_number: null
  section: K2
  title: Natalie makes every call, logged as an agent ruling
  status: live
  kind: mandate
  summary: Natalie makes every call at the table herself, a carded NPC's death or a new faction included,
    and logs each one under the turn as an agent ruling Isaac may overturn.
  verbatim: Natalie decides everything. "Bigger things wait" is struck. Natalie makes every call, even
    a carded NPC's death or a new faction, and logs each as an agent ruling (a call you may overturn)
    under the turn.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Roleplay partnership (invention)
    operation: strikes
  - guide: NATALIE.md and the wotr-write skill
    locus: Roleplay partnership (agent rulings under the turn)
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K2, option A; Isaac''s pick differs from the recommendation (B). Partly amends R48-26-INVENTION:
    its clause ''bigger things wait for Isaac'' is struck, and the rest (NPCs, places and texture invented
    without asking, logged) stands inside this wider rule. Option B, which would have held facts about
    Isaac''s own characters back for his word, was not taken. Natalie still never thinks, speaks or acts
    for his PC or the other creators'' characters (NATALIE.md; R1-1-RESTRICTED_CHARACTERS_EXCLUDED), what
    his PC knows comes only from his card and canon, never a new memory (R72-6-WORLD_WRITES_HIM), and
    R52-08-PC_IDIOM stands, his play winning over a card. An overturn is a new ruling. At the table it
    is read with R50-21-THIRD_NAMES (a Third Name for one of his characters ''sticks only if Isaac keeps
    it'') and R50-07-NEW_TONGUES (a new people''s register ''logged as pending''); both carry a note.
    Numbers are not loosened: R12-5-NEVER_INVENT_NUMBER stands, and a figure canon lacks prints as a marked
    estimate (R70-99-NUMBER_NOT_YET_CANON) that is canon on use (R20C-34-ESTIMATES_CANON_ON_USE). Each
    call is one line of the turn''s foot (R72-13-FOOT_CARRIES), and the session close follows the same
    pattern (R72-33-WRITES_CLOSE). NATALIE.md''s ''Label everything Natalie originates as pending ruling
    until Isaac ratifies it'' reads against this at the table; its rewrite is owed under R72-41-WHERE_TABLE_LAW_LANDS
    after the tests of R72-43-TEST_SESSION. R48-50-PUSHBACK is not named and stands.'
- id: R72-3-REPLIES_RUN_LONG
  pack: Table Law 2026-10-04
  pack_number: null
  section: K3
  title: Desktop turns run long, OOC answers plain, Discord posts about 1,500
  status: live
  kind: budget
  summary: A Desktop in-fiction turn runs about 3,500 words, an out-of-character answer is given plainly,
    and a Discord post runs about 1,500 words unless Isaac's beat asks for more.
  verbatim: 'Desktop fiction only. This reopens R49-30 for Discord: Desktop turns run about 3,500 and
    OOC answers are plain; a Discord post runs about 1,500 words, the house median, unless your beat asks
    for more.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Openings, endings, shape
    operation: extends
  supersedes: []
  applies_to:
  - scene-structure
  - prose-law
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K3, option C. Partly amends R49-30-SHORT_BEATS, not a supersession: the answer reopens it ''for
    Discord'' only, and at the Desktop table its own case stands, a quick in-character line or question
    still getting a full turn of about 3,500 words. Beside that, the out-of-character answer (a question,
    a ruling, a correction) is plain, and the Discord post Natalie writes from Isaac''s beat (his short
    prompt) runs about 1,500, the house median of 1,506, unless the beat asks for more. Partly amends
    R48-28-TURN_LENGTH, which stands for Desktop turns and gains the Discord length. R48-48-EXPLAIN (explanation
    only when asked) and R48-50-PUSHBACK are not changed; an explanation asked for comes as a plain OOC
    answer. Natalie''s Discord seat is R72-35-NATALIE_SEAT_DISCORD.'
- id: R72-4-WHERE_TURN_STOPS
  pack: Table Law 2026-10-04
  pack_number: null
  section: K4
  title: A turn stops at the first pressure on him
  status: live
  kind: procedure
  summary: A turn runs past pauses Isaac's PC would let pass and stops when something presses him (a question
    to him, an offer, a threat, a clock), and any line aimed at him always stops it.
  verbatim: 'The first pressure. The turn runs past pauses he would let pass and stops when something
    presses him: a question to him, an offer, a threat, a clock. A line aimed at him always stops it.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 1 (turn shape)
    operation: extends
  supersedes: []
  applies_to:
  - scene-structure
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K4, option B. Gives Table Rule 1''s ''stop at his next decision'' its meaning in talk; Table
    Rule 1 has no indexed row, and the NATALIE.md line is owed the rewrite. Partly amends R49-29-TURN_FILL:
    the stop at the next decision is the first pressure on him. R70-17-CLOSING_MODES (a turn may stop
    mid-crisis on a reveal or a threat) and R49-26-ENDINGS stand, and R48-29-PACING is not named and stands.
    Under standing orders the turn runs to the first branch they miss instead (R71-5-ROLEPLAY_TURNS_AGAINST_WRITTEN
    in a fight, R72-5-STANDING_ORDERS_OUTSIDE_FIGHTS elsewhere). With several NPCs in the room the turn
    stops when the room turns to him (R72-9-SEVERAL_NPCS_ONE_TURN), and a bill that arrives with terms
    stops it on them (R72-23-BILL_PAGE).'
- id: R72-5-STANDING_ORDERS_OUTSIDE_FIGHTS
  pack: Table Law 2026-10-04
  pack_number: null
  section: K5
  title: Standing orders in every scene type
  status: live
  kind: procedure
  summary: In any scene, not only a fight, Isaac may post conditions such as 'if she names the stair,
    I ask for the daybook'; Natalie runs them to the first branch they miss, and his PC speaks only the
    words Isaac posted.
  verbatim: Every scene type. Post conditions anywhere ("if she names the stair, I ask for the daybook").
    Natalie runs them to the first branch they miss, and any line your PC speaks is only your posted words.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 1 (turn shape)
    operation: extends
  supersedes: []
  applies_to:
  - scene-structure
  - dialogue
  - session-protocol
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K5, option B. Extends R71-5-ROLEPLAY_TURNS_AGAINST_WRITTEN, whose standing orders were a fight''s:
    talk, travel and investigation now take them too, and Table Rule 1''s exception widens with it. Any
    line his PC speaks under a standing order is his posted words, set as R19-2-NEVER_ALTERED and R19-2-FIXED_TEXT
    keep them. R70-14-KISHOTENKETSU''s ''roleplay turns still stop at Isaac''s decision'' and R49-29-TURN_FILL
    are read with it, each with a note: under standing orders the stop is the first branch the orders
    miss. Where no order is posted the turn stops as R72-4-WHERE_TURN_STOPS sets it. R48-29-PACING is
    not named and stands. The intimacy questionnaire''s SC13 asks the same for the bed.'
- id: R72-6-WORLD_WRITES_HIM
  pack: Table Law 2026-10-04
  pack_number: null
  section: K6
  title: What the world writes on his PC outside a fight
  status: live
  kind: mandate
  summary: Outside a fight a turn writes the PC's involuntary responses (sweat and nausea under Pressure,
    a startle, cold shakes, a drug taking hold) on his body as facts, lays the evidence in the room without
    drawing his conclusion, and gives what he would know only as plain recall from his card and canon,
    never a new memory.
  verbatim: 'Yes to: Reflexes as world facts (Involuntary responses (sweat and nausea under Pressure,
    a startle at a shot, cold shakes, a drug taking hold) land on his body as facts, as wounds do under
    R71-6; what he does next stays yours); Evidence, never the conclusion (In talk and investigation too,
    Natalie lays the tells in the room and never draws his conclusion; the deduction is your post, R71-6''s
    "the read his" carried outside fights); What he would know (What your PC knows and you might not (a
    custom, a Guild form, a law of his own court) comes as plain recall from his card and canon only,
    never a new memory).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: POV and interiority
    operation: extends
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 6 (the read is the game)
    operation: extends
  supersedes: []
  applies_to:
  - pov
  - prose-law
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K6, all three options. Carries R71-6-PLAYER_FIGHTER_PAGE''s wounds as world facts and ''the
    read his'' out of the fight into talk and investigation; what he does next, and the deduction, stay
    Isaac''s post. Partly amends R49-01-WHOSE_HEAD outside fights: his reflexes land as world facts, the
    conclusion is never drawn for him, and his knowledge comes as plain recall from his card and canon,
    never a new memory; the full depth R49-01-WHOSE_HEAD allows otherwise stands, Isaac overruling. This
    bounds R72-2-IMPROVISE_OR_ASK for his PC: no call writes him a new memory. R70-69-PRESSURE_AURA (the
    room first, then bodies) sets how Pressure reaches his body, and R71-23-TELL_READ''s ''the reading
    is yours'' is the fight form of the second option. R48-48-EXPLAIN is not changed. Horror and the bed
    have their own questionnaires (mystery HO3, intimacy SC12).'
- id: R72-7-CUTAWAY_SHOWS
  pack: Table Law 2026-10-04
  pack_number: null
  section: K7
  title: A cutaway shows the act and keeps the reason
  status: live
  kind: mandate
  summary: A cutaway to what the PC cannot see shows who acts and what they do and keeps their reason
    dark, so Isaac sees the move and his PC still has to read the why.
  verbatim: The act, reason kept. The cut shows who acts and what they do, and keeps the reason, as R70-76
    does for the world's magic. You see the move; your PC still has to read the why.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: POV and interiority (cutaways)
    operation: extends
  supersedes: []
  applies_to:
  - pov
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K7, option B. Partly amends R49-09-CUTAWAYS, which licensed the closing cut (''a Front advancing,
    an NPC plotting''): the cut now shows the act and its actor and keeps the reason, as R70-76-MUCH_WORLD_MAGIC
    keeps the world''s reasons. R71-52-AMBUSH_NAMED_ROUND''s shooter half works as written. A Front''s
    tick may surface as a marked cutaway (R72-21-FRONT_SIGNS_SEEN). Table Rule 6 (the read is the game)
    and the iceberg hold, and R48-48-EXPLAIN is not changed. A cut inside a case is the mystery questionnaire''s.'

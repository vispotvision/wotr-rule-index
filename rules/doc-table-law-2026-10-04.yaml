  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TU2, option B. Exposition through disagreement, the iceberg''s way; the Sallow and Harrowgate
    exchanges were the sample. R19-4-REALISTIC_SPEECH (interruption, talking past each other) and R48-36-NPC_WITS
    stand. R48-43-SPEECHES''s one crafted speech and R70-111-LONG_FORMAL_SPEECH_CLIPPED''s long court
    speech are not changed, and R48-40-NPC_THOUGHTS''s one italic thought per NPC holds. The stop is R72-4-WHERE_TURN_STOPS''s
    first pressure: the room turning to him.'
- id: R72-10-ROUTINE_TALK_SUMMARY
  pack: Table Law 2026-10-04
  pack_number: null
  section: TU3
  title: Routine talk in summary, the line that matters quoted
  status: live
  kind: mandate
  summary: Routine exchange such as prices, directions, greetings and haggling is told in a sentence or
    two, and any line that carries a want, a lie, a refusal or a tell is quoted in full.
  verbatim: Summary, then the line. Routine exchange (prices, directions, greetings, haggling) is told
    in a sentence or two; any line that carries a want, a lie, a refusal or a tell is quoted in full.
  amends:
  - guide: Dialogue Craft Standards
    locus: Scene and summary
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: Characters and dialogue
    operation: adds
  supersedes: []
  applies_to:
  - dialogue
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: TU3, option B. The novelists' movement between scene (every line given) and summary (talk reported
    in a sentence). A quoted line keeps R19-4-REALISTIC_SPEECH's real-time speech, and a lie is quoted
    in full with the catchable tell R49-36-LIE_TELLS requires. R48-43-SPEECHES and R48-42-LIES stand;
    R49-29-TURN_FILL's half of texture and talk is not changed. Lines Isaac's PC speaks are said in full
    (R72-11-WORLD_INTERRUPTS; R19-2-FIXED_TEXT).

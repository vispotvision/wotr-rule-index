- id: R72-13-FOOT_CARRIES
  pack: Table Law 2026-10-04
  pack_number: null
  section: TU6
  title: 'The foot: calls made, what it cost, the rules and the deciding row'
  status: live
  kind: mandate
  summary: The OOC foot under a turn carries one line per call Natalie made that turn, marked as an agent
    ruling Isaac may overturn, one line per Ledger line and Front tick the turn caused, and two to four
    rule ids that bound it with the stat row behind any adjudicated outcome.
  verbatim: 'Yes to: Calls made (One line per call Natalie made this turn (a new NPC, a fact, an estimate),
    each marked as an agent ruling you may overturn); What it cost (The Ledger lines and Front ticks the
    turn caused, one line each, so nothing is lost before the session close); Rules and the deciding row
    (Two to four rule ids that bound the turn and, for any adjudicated outcome, the stat row that decided
    it (R14-3, R71-7)).'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Process
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: TU6, options A, B and C (digest); D, a status line, was not taken. A is the log R72-2-IMPROVISE_OR_ASK
    asks for under the turn, R48-26-INVENTION's 'logged' made visible. B keeps the turn's costs from being
    lost before the close, which R72-33-WRITES_CLOSE applies. C carries R14-3-TRACEABILITY's deciding
    row into the foot for any adjudicated outcome, fight or not, beside R71-7-READER_SEES_CALL's 'the
    notes still name the row'; the full notes still name it. R70-98-SHEETS_CHAPTER_ARC_ENDS's changes
    block stays in the full notes. NATALIE.md's rule-index step 4 (cite the ids that most constrained
    the piece) gains its per-turn place in the foot.
- id: R72-14-PREVIOUSLY_LINE
  pack: Table Law 2026-10-04
  pack_number: null
  section: TU7
  title: A header and a short "previously" at session start
  status: live
  kind: procedure
  summary: A session's first turn opens with the scene header (place, day, hour), then two or three plain
    OOC lines on what happened last, what is owed and what is ticking that the PC knows of, and then the
    prose.
  verbatim: 'Header and "previously". The header, then two or three plain OOC lines: what happened last,
    what is owed, what is ticking that your PC knows of. Then the prose.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Session start protocol
    operation: adds
  supersedes: []
  applies_to:
  - session-protocol
  - scene-structure
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: TU7, option B. The header is the italic place, day and hour line the archived scene files open
    on (option A's header). The 'previously' lines hold only what is ticking that his PC knows of, so
    the iceberg stays. The wotr-rp skill builds its 'Previously' silently ('None of this is printed');
    that text reads against this row, and the skills follow the tests (R72-43-TEST_SESSION). R70-16-OPENING_MODES
    governs the prose that follows; R49-27-SCENE_BREAKS and R48-47-NOTES are not changed. The Rumor Mill
    also runs as a session opens (R72-16-RUMOR_MILL_RUNS).
- id: R72-15-CARRIES_RUMOR_MILL
  pack: Table Law 2026-10-04
  pack_number: null
  section: TU8
  title: 'Who carries the Rumor Mill: a gossip, print, or talk overheard'
  status: live
  kind: definition
  summary: The Rumor Mill's news may come from one NPC who wants to know things first and gets some of
    it wrong, from a notice or print where the Inventory gives literacy (never in the north), or from

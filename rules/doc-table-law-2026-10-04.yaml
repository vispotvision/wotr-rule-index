  pack: Table Law 2026-10-04
  pack_number: null
  section: TU1
  title: A turn opens on one clause of his move
  status: live
  kind: mandate
  summary: A turn gives Isaac's posted move a single clause that fixes where it landed, then answers with
    the world, spending the turn on what he did not write.
  verbatim: One clause, then answer. Your move gets one clause that fixes where it landed ("with the Finding
    face down between them"), then the world answers. The archive stays readable and the turn spends itself
    on what you did not write.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Table Rule 1 (turn shape)
    operation: extends
  supersedes: []
  applies_to:
  - scene-structure
  - pov
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the table questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TU1, option C. Gives Table Rule 1''s ''answer what the PC did'' its opening and ends parroting
    (spending the opening on what the player already wrote). The clause places his move and never rewrites
    his words: R19-2-FIXED_TEXT stands. R49-29-TURN_FILL''s balance is not changed, and R49-01-WHOSE_HEAD
    stands. Options A (open on the answer, the move never restated) and B (the move rendered in full)
    were not taken.'

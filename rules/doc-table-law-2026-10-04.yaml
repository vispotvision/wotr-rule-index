  section: TU2
  title: The room talks among itself
  status: live
  kind: mandate
  summary: When several NPCs share a room they talk to each other, interrupt and score points, the PC
    overhears what none would tell him, and the turn stops when the room turns to him.
  verbatim: The room talks. NPCs talk to each other, interrupt and score points, and your PC overhears
    what they would never tell him; the turn stops when the room turns to him.
  amends:
  - guide: Dialogue Craft Standards
    locus: Several speakers in one room
    operation: adds
  - guide: NATALIE.md and the wotr-write skill

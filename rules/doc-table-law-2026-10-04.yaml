  source:
    file: ''
    lines: null
  notes: 'TU4, option B. Puts Table Rule 1''s ban on resolving a multi-decision action in one go, and
    Table Rule 3''s NPCs who refuse, onto a chained post (''I pick the lock, slip in, read the ledger'').
    Partly amends R49-32-CUT_OFFS: a line his PC speaks is never cut off, so the ellipsis and the interrupter''s

  kind: definition
  summary: A technique's card carries three named mastery marks, Held, Drilled and Mastered, each lowering
    its Readiness and cost share by figures set on that card, and each crossing needs a shown cause entered
    in the chapter-end block.
  verbatim: Mastery marks on the card. Three named marks, Held, Drilled and Mastered; each lowers Readiness
    and cost share by figures set on that card, each crossing a shown cause entered in the chapter-end
    block.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: mastery marks'
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Documents: scenes as markdown files with author notes'
    operation: extends
  supersedes: []
  applies_to:
  - magic-design
  - stats
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE4. Partly amends R70-74-TECHNIQUE_NAME_LOOKS, where mastery reads as forms held: forms held
    still measure mastery of a school''s art, and each technique now also carries its own marks (the option
    keeping mastery to forms held and stats was not taken). Partly amends R47-4-LEDGER_COSTS: a technique
    is still priced as a share of full reserve when it is designed, and each mark it crosses lowers that
    share by a figure set on its card. The figures are set on the card, never invented (R12-5-NEVER_INVENT_NUMBER).
    Each crossing needs R70-90-FAST_NUMBERS_CLIMB''s shown cause and is entered in R70-98-SHEETS_CHAPTER_ARC_ENDS''s
    changes block; both stand. The lowered Readiness is the card figure R71-28-DECIDES_CASTING_SPEED reads,
    which stands. The answer adds no readout moment; R70-84-GROWTH_MOMENTS_THAT_EARN stands.'
- id: R75-12-WHAT_VOW_WORTH
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE5
  title: A vow lifts output within its Grade; a great vow lifts one Grade
  status: live
  kind: budget
  summary: A vow may lift a technique's delivered output no higher than the top of its own Grade band,
    at a point set on the card; a great vow that stakes life, a limb's use or Crystal mass may lift it
    one full Grade and nothing lifts it further; a release call stacks on top.
  verbatim: A great vow, one Grade. As A, and a great vow, one that stakes life, a limb's use or Crystal
    mass, may lift output one full Grade; nothing lifts it further. A release call stacks on top.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: Limit and Counter (the vow)'
    operation: extends
  supersedes: []
  applies_to:
  - magic-design
  - stats
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE5, option B, which builds on A. Option A reads: Capped at its Grade. A vow lifts delivered
    output up to the top of the technique''s own Grade band, never across it; where inside the band is
    set on the card. A release call stacks on top. Partly amends R71-32-VOWS_LIMITS: a vow still raises
    output through Attraction Force by a figure set on the card, and that figure is now bounded by the
    technique''s Grade band, or by one full Grade for a great vow. The Grades are canon''s table (Hollow
    to EX+), so no figure is invented (R12-5-NEVER_INVENT_NUMBER). The release call is R8-24-RELEASE_MECHANIC''s,
    which stands. R39-4-MAX_GRADE_LETTER_BINDS (the Sub-Stat Grade cap) stands. What a great vow stakes
    and what breaking it costs is R75-13-WHAT_ELSE_VOW_MAY_BE.'
- id: R75-13-WHAT_ELSE_VOW_MAY_BE
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE6
  title: Staked vows and vows between two
  status: live
  kind: definition
  summary: A vow may stake life, a limb's use or Crystal mass, paid at once and for good if it is broken,
    and two people may bind each other by a vow whose terms both cards carry, the one who breaks it taking
    the Shear Break.
  verbatim: 'Yes to: A stake beyond Shear Break (A vow may stake life, a limb''s use or Crystal mass;
    broken, the stake is paid at once and for good (R55-1). Under TE5''s B, only a staked vow reaches
    a full Grade); A vow between two (Two people bind each other; each card carries the terms, and whoever
    breaks them takes the Shear Break).'
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: Limit and Counter (the vow)'
    operation: extends
  - guide: character sheet template
    locus: 'Techniques section: a vow between two'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - magic-mechanism
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE6, options B and C, both recommended; A, a vow for one fight, was not taken. Partly amends
    R71-32-VOWS_LIMITS, where breaking a vow is a Shear Break: a staked vow also pays its stake when broken,
    and a vow may now bind two people. The stake is paid permanently under R55-1-SUBSTANCE_COSTS_PERMANENT,
    which stands. ''Under TE5''s B, only a staked vow reaches a full Grade'' (R75-12-WHAT_VOW_WORTH).
    A carded Synergia carries no vow (R75-20-CARDING_SYNERGIA), so a vow between two is a binding of its
    own. R17-3-LIMIT_MECHANICAL stands.'

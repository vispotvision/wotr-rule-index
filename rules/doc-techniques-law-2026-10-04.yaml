# substring of the RULINGS.md entry headed 2026-10-04, techniques-law-2026-10-04; the section is
# the answer's questionnaire id and the id numeral is the answer's number in that entry. R75 is the
# id numeral bucket; the old rows each answer supersedes or touches carry a note naming the R75 row.
# Standalone ruling pattern: empty source.file.
pack: Techniques Law 2026-10-04
pack_number: null
source_file: ''
ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
rules:
- id: R75-1-WHERE_TECHNIQUE_WRITTEN
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K1
  title: Signatures on their own pages, school arts on the school page
  status: live
  kind: mandate
  summary: Give each signature, and any art one person derived alone, its own page priced at its owner's
    exact reserve, keep each school art once on its school's page priced by Stage band, and link the card's
    technique rows to either page.
  verbatim: Signatures own, arts shared. A signature, or any art one person derived alone, gets its own
    page priced at its owner's exact reserve; a school art lives once on its school's page, priced by
    Stage band. The card's rows link to either.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique pages: signature pages and school pages'
    operation: adds
  - guide: character sheet template
    locus: Techniques section
    operation: extends
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - stats
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K1. Partly amends R47-4-LEDGER_COSTS: a school art is still priced off the Essence Ledger''s
    band for its Stage, while a signature, or any art one person derived alone, is priced at its owner''s
    exact reserve. R47-2-FIELD_FORMAT stands: both kinds of page use the field format, and the card carries
    rows that link to them. The split follows R12-3-NAMED_INVENTOR_RULE, which stands: an art on its school''s
    page is documented and counterable by study, and a self-derived art is read live. R18-3-ENTRY_AS_CANDIDATE_ROW
    stands for every page. The answer does not say whether a card row repeats the FOW line R14-8-CHARACTER_SHEET_FOW_LINE
    puts in the sheet''s Techniques section; that row stands. Read with R75-23-WHAT_SCHOOL_KEEPS_BACK
    (in the world a school writes only its lower forms), R75-17-TRAIT_ENTRY_CARRIES (a Trait''s Permission
    line lists the signatures it allows) and R75-25-ONE_CARD_SHAPE (the card''s head names techniques
    with tell and counter).'
- id: R75-2-DESIGNED_OR_FOUND
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K2
  title: A technique's core is carded before it first fires
  status: live
  kind: mandate
  summary: Before a technique first fires its card holds its mechanism, cost, limit, tell and counter,
    and its name, forms, Readiness, evolutions and What nobody knows line are filled in afterward from
    what play showed.
  verbatim: Core first, rest found. Before first fire the card holds mechanism, cost, limit, tell and
    counter. Name, forms, Readiness (its casting-time figure), evolutions and What nobody knows fill in
    from what play showed.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: what the card holds before first fire'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K2. A floor before a technique''s debut, not a new format: R47-2-FIELD_FORMAT stands and the
    entry grows into it. The tell and counter are real before the fight, so R12-3-NAMED_INVENTOR_RULE''s
    live read and R71-30-HELD_BACK_REVEAL''s planted evidence rest on a true mechanism; both stand. R17-3-COUNTER_MANDATORY
    and R12-3-COUNTER_MANDATORY stand. Readiness filling in from play matches R71-28-DECIDES_CASTING_SPEED
    (''precision grows as cards are filled''), which stands: until the card''s figure is set the Alacrity
    row decides. The What nobody knows line keeps R17-3-WHAT_NOBODY_KNOWS_SCOPE''s scope. Figures filled
    in from play are never invented (R12-5-NEVER_INVENT_NUMBER). A sketch Isaac gives for his own character
    comes back whole at once (R75-3-SKETCH_TO_CARD), and every Counter passes R75-6-COUNTER_FAIRNESS_TEST.
    No older rule is reached.'
- id: R75-3-SKETCH_TO_CARD
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K3
  title: Isaac's sketch comes back as a whole card he keeps or strikes
  status: live
  kind: procedure
  summary: When Isaac sketches an ability for his own character, Natalie returns the full R47-2 entry
    at once with a proposed true name in that character's tongue, and each choice on it (name, call, vow)
    sticks only when Isaac keeps it.
  verbatim: Whole card, yours to keep. Natalie returns the full R47-2 entry at once, a proposed true name
    in your character's tongue included; every choice on it (name, call, vow) sticks only when you keep
    it.
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Who Natalie is: supplying how an ability works the moment Isaac sketches one'
    operation: extends
  supersedes: []
  applies_to:
  - magic-design
  - character-sheet
  - naming
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: K3. Follows the keep-or-strike pattern of R50-21-THIRD_NAMES, which stands. The entry says what
    the ability is, never how to use it (R47-1-NO_APPLICATIONS, standing), and its uses in a fight stay
    Isaac's (R48-35-USES, standing); his character's choices stay his (R49-01-WHOSE_HEAD, standing). The
    whole entry comes back at once, above R75-2-DESIGNED_OR_FOUND's floor for a first fire. The proposed
    true name follows R8-21-NAME_IN_OWN_LANGUAGE and R8-22-LITERAL_GLOSS, both standing. A price Isaac
    names in the sketch is R75-4-YOUR_PRICE_AGAINST_LAW's. No older rule is reached.
- id: R75-4-YOUR_PRICE_AGAINST_LAW
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K7
  title: Isaac's named price stands and the mechanism is reworked to yield it
  status: live
  kind: procedure
  summary: When Isaac's sketch names its own cost and limit, those stand and Natalie reworks the mechanism
    until they fall out of it, and if no lawful mechanism yields them she says so in one line and offers
    the nearest.
  verbatim: Your price, new mechanism. The cost and limit you named stand; Natalie reworks the mechanism
    until they fall out of it, so R17-4 holds. If no lawful mechanism yields them, she says so in one
    line and offers the nearest.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'design order: a cost and limit named in the sketch'
    operation: adds
  - guide: NATALIE.md and the wotr-write skill
    locus: Research-grounded techniques
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - magic-mechanism
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K7. ''so R17-4 holds'': R17-4-OUTPUTS_NOT_INPUTS and R17-4-READ_OFF_MECHANISM stand, since the
    cost and limit are read off the reworked mechanism, and R17-3-COST_DERIVED and R17-3-LIMIT_MECHANICAL
    stand on the same footing. The one line is R48-50-PUSHBACK''s plain line, which stands. The sketch
    is the one R75-3-SKETCH_TO_CARD answers. No older rule is reached.'
- id: R75-5-TECHNIQUES_ON_CRYSTAL
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K4
  title: A Trait-permitted signature prints once on the Crystal
  status: live
  kind: mandate
  summary: The first time a signature that a Trait permits holds, the bearer's Crystal prints one inline
    line naming it, its Trait and its Grade, a fifth growth moment beside R70-84's four, and school arts
    never print.
  verbatim: 'Signatures print once. Adds a fifth growth moment to R70-84: the first time a Trait-permitted
    signature holds, one inline Crystal line names it, its Trait and its Grade. School arts never print.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: 'Prose standards: readouts'
    operation: extends
  supersedes: []
  applies_to:
  - stats
  - prose-law
  - magic-design
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K4. ''Adds a fifth growth moment to R70-84'': partly amends R70-84-GROWTH_MOMENTS_THAT_EARN,
    whose four moments stand. The line is the bearer''s own read of his Crystal (R70-78-WHERE_SCREEN_COMES_FROM,
    standing), inline as R70-80-READOUT_SITS_PAGE sets by default. R70-86-MANY_READOUTS_SCENE_CARRIES,
    whose cap counts R70-84''s readouts, stands. The Grade traces to the card (R12-5-NEVER_INVENT_NUMBER).
    R70-98-SHEETS_CHAPTER_ARC_ENDS stands. A Trait''s Permission line lists the signatures it allows (R75-17-TRAIT_ENTRY_CARRIES);
    a signature''s page is R75-1-WHERE_TECHNIQUE_WRITTEN''s.'
- id: R75-6-COUNTER_FAIRNESS_TEST
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K5
  title: Three tests a technique's Counter must pass
  status: live
  kind: mandate
  summary: A technique's card stands only when its Counter is within reach of a prepared practitioner
    of the technique's own Stage without a higher Stage or a rare Wellspring, rests on law someone already
    knows, and names a counter before, during and after contact.
  verbatim: 'Yes to: Same Stage can answer (The written counter is within reach of a prepared practitioner
    of the technique''s own Stage; a counter that needs a higher Stage or a rare Wellspring fails the
    card); Counter on known law (The counter rests on law someone already knows (a Wellspring''s recorded
    failure, a school''s teaching, a Family''s weakness), so a player can study toward it before he meets
    the technique); A counter at each phase (The card names a counter before, during and after contact;
    ''none once contact is made'' fails and the card is rebuilt).'
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: Counter (the fairness test)'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - adjudication
  - combat
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'K5, all three options taken: A and B were recommended and Isaac added C. Partly amends R17-3-COUNTER_MANDATORY:
    a counter still falls out of the Operation, and it now also passes these three tests before the card
    stands. R47-3-COUNTERS_AS_FACTS stands: the counter is still written as a fact. Known law includes
    a Wellspring''s recorded failure, which R47-9-INHERITED_FAILURES lets an opponent induce; that row
    stands. R12-3-NAMED_INVENTOR_RULE stands: a self-derived technique is still read live, while its counter
    rests on law a player can study before he meets it. R71-31-COUNTERS_DUEL_SCALE stands: the card''s
    Counter remains the hard answer beside the soft Family chart. An archive card whose counter reads
    ''None documented once contact is made'' fails the third test and is rebuilt; old entries are handled
    under R75-46-OLD_ENTRIES_FAILING_LAW.'
- id: R75-7-WHAT_OPENS_TECHNIQUE
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: K6
  title: A new technique needs its FOW line met and a cause on the page
  status: live
  kind: mandate
  summary: 'A character gains a technique only when he meets its FOW line and a cause appears on the page:
    a named teacher, a book studied, or the problem it answers met in a fight.'
  verbatim: 'Numbers plus a cause. The FOW line must be met, and the technique arrives only with a cause
    on the page: a teacher named, a book studied, or the problem it answers met in a fight.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Downtime
    operation: adds
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: gaining a technique
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - stats
  - character-sheet
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: K6. Carries R70-90-FAST_NUMBERS_CLIMB's shown cause from numbers to techniques; that row stands
    unchanged. The cause on the page keeps R12-3-NAMED_INVENTOR_RULE's trail (derived by somebody, in
    a place, for a problem), which stands. The FOW line is R14-8-ABILITY_GUIDE_FOW_LINE's, standing. R70-18-ARC_SHAPES's
    training montage is one way to show the teaching. Read with R75-24-LEARNING_BY_WATCHING (a witnessed
    technique re-derived in downtime) and R75-22-OWN_TECHNIQUES_COMBINED (a composite of a man's own techniques).
    No older rule is reached.
- id: R75-8-LADDER_OF_FORMS
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE1
  title: A school's ladder of forms runs long or short by its culture
  status: live
  kind: definition
  summary: Western and Kharven schools run short ladders of forms like Liechtenauer's, the lineage halls
    and the Korean-stratum houses keep long catalogues, and each school's page sets its own count.
  verbatim: By the school's culture. Western and Kharven schools run short ladders like Liechtenauer's;
    the lineage halls and the Korean-stratum houses keep long catalogues. Each school's page sets its
    count.
  amends:
  - guide: Naming guide and the wotr-write skill
    locus: Techniques, arts and items
    operation: extends
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'school pages: the ladder of forms'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - naming
  - worldbuilding
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: TE1. Sets the length R70-74-TECHNIQUE_NAME_LOOKS left open for its numbered forms; that row stands,
    as do R8-23-NAME_HIERARCHY's form level and R50-24-SCHOOL_NAMES. Johannes Liechtenauer's German longsword
    tradition taught five master cuts (the Meisterhäue), the model for a short ladder. Schools of the
    other cultures are not named by the answer, and their pages set the count. The tilt by culture follows
    R70-1-BLEND_MODEL; moves inside a fight are still named in the POV's own school (R70-100-MARTIAL_VOCABULARY_NAMES_MOVES).
    The school's page is R75-1-WHERE_TECHNIQUE_WRITTEN's; its last form is kept back under R75-23-WHAT_SCHOOL_KEEPS_BACK.
    No older rule is reached.
- id: R75-9-CUTTING_CHANT_SHORT
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE2
  title: A clipped chant trades output for Readiness
  status: live
  kind: definition
  summary: A chant's length sets its output, so each line a caster drops costs a share of output and buys
    Readiness, both figures set on the technique's card.
  verbatim: 'Clip it, lose output. A chant''s length sets its output: each line dropped costs a share
    of output and buys Readiness (casting time), both figures set on the card.'
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: Readiness (lines dropped from a chant)'
    operation: adds
  - guide: WOTR_Combat_Craft_Guide.md
    locus: A spoken working in the exchange
    operation: extends
  supersedes: []
  applies_to:
  - magic-mechanism
  - magic-design
  - combat
  - adjudication
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: TE2. Both figures are set on the card and never invented (R12-5-NEVER_INVENT_NUMBER). The Readiness
    bought is the card figure R71-28-DECIDES_CASTING_SPEED reads, which stands. A clipped chant is still
    voice, so R20C-42-LAW_V_STAGE_GATE_REFRACTION's medium below Refraction stands, and R71-27-SPOKEN_WORKING_EXCHANGE
    still cuts the chant into the exchange. The release call (R8-24-RELEASE_MECHANIC) stays a separate
    lever on output. The chant stays in the caster's own tongue on the page (R50-26-CHANT_TONGUE, R51-28-CHANT_PAGE).
    No older rule is reached.
- id: R75-10-TECHNIQUE_GROWS_TO_GRADE
  pack: Techniques Law 2026-10-04
  pack_number: null
  section: TE3
  title: A technique's output grows with the reserve up to its Grade
  status: live
  kind: definition
  summary: A technique's output rises with its owner's reserve until it reaches the top of the Grade it
    was designed in, and growing past that takes an escalated form with its suffix and a shown cause.
  verbatim: Grows to its Grade. Output rises with the reserve until it reaches the top of the Grade it
    was designed in; past that it needs an escalated form, with its suffix and a shown cause.
  amends:
  - guide: WOTR_Ability_Technique_Design_Guide.md
    locus: 'technique card format: output and its design Grade'
    operation: adds
  supersedes: []
  applies_to:
  - magic-design
  - stats
  - naming
  verification: []
  ratified: 'Isaac, 2026-10-04, Claude Code chat: ruled directly (the techniques questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'TE3. R47-4-LEDGER_COSTS stands: the cost is still a share of full reserve, which buys more joules
    as the Essence Ledger''s Level law raises the reserve, and the Grade the technique was designed in,
    read off the joules to Grade spine, is where its output stops growing. The escalated form takes R50-14-ESCALATION''s
    suffix in the art''s own tongue under R8-25-ESCALATION_SUFFIX, both standing, and its cause is R70-90-FAST_NUMBERS_CLIMB''s,
    standing. Vows lift delivered output under R75-12-WHAT_VOW_WORTH. No older rule is reached.'

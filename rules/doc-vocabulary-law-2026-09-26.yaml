- id: R51-10-SLOP_WORDS
  pack: Vocabulary Law 2026-09-26
  pack_number: null
  section: Vocabulary and diction
  title: Slop Words
  status: live
  kind: mandate
  summary: 'A hard-ban list separate from the repetition list: tapestry, testament, palpable, visceral,
    symphony of, a dance of, whisper of, orbs (eyes), ministrations, electric (touch), velvet (voice),
    shiver down the spine, a breath he didn''t know...'
  verbatim: 'A hard-ban list separate from the repetition list: tapestry, testament, palpable, visceral,
    symphony of, a dance of, whisper of, orbs (eyes), ministrations, electric (touch), velvet (voice),
    shiver down the spine, a breath he didn''t know he was holding, the coppery tang of blood, the smell
    of ozone; each fails the checker at first use, narration and dialogue.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Vocabulary and diction
    operation: adds
  supersedes: []
  applies_to:
  - register
  - prose-law
  - dialogue
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (vocabulary questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Titles are exempt (R58-04); ''the smell of ozone'' sits in tension with R51-32 (C-090). Partly
    amended by R70-35-HARD_BAN_LIST (style law 2026-10-03): the cultivation-translation, Western fantasy
    and LitRPG stock families join the list for narration, and testament, visceral and orbs now fail only
    in their stock senses. Read with R70-36-CHECKER_ENFORCES (style law 2026-10-03): the families R70-35-HARD_BAN_LIST
    adds FAIL at first use in narration as this list does, and looser variants WARN.'

- id: R48-13-PERIOD_FEEL
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Register and voice
  title: Period feel
  status: live
  kind: mandate
  summary: 'Modern words in speech only: characters may talk modern; narration keeps a timeless
    register.'
  verbatim: 'Modern words in speech only: characters may talk modern; narration keeps a timeless
    register.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Register and voice
    operation: replaces
  supersedes:
  - R15-1-LICENCE
  applies_to: *id002
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (writing questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question w13: Modern words and ideas are legal everywhere, narration included (''okay'',
    ''adrenaline'', ''trauma''), and ''reads modern'' is never flagged. Still right? Unchanged
    by R70-27-ANTIQUE_NARRATION_RUNS (style law 2026-10-03): the dial sets how antique narration''s
    words run (plain, period or archaic) and does not touch the modern-word bar. Partly amended
    by R70-37-MODERN_IDIOM_THOUGHT (style law 2026-10-03): italic thought may also carry the
    modern words the POV would say aloud; plain narration keeps the timeless register. Confirmed
    by R70-94-GAMER_SLANG (style law 2026-10-03), "Current law": gamer slang goes in a mouth
    whose voice would carry it, narration stays timeless, and verify_scene adds the words to
    its narration watch-list.'

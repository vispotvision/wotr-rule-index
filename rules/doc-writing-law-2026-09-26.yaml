  source:
    file: ''
    lines: null
  notes: 'Question w09: When a working fires, may the narration itself use technical words (pressure
    differential, the Shell, Harmonics), or only a character, instrument or document? Stands,
    confirmed by R70-28-TRADE_SCIENCE_WORDS (style law 2026-10-03): narration names apparatus
    and workings exactly, by ear.'
- id: R48-10-MIXING
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Register and voice
  title: Mixing
  status: live
  kind: mandate
  summary: 'Drop the Technical/Mystic no-mixing rule: registers mix freely by ear.'

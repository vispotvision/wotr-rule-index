    lines: null
  notes: 'Question w01: When a passage hits you as beautiful, what is usually doing the work?'
- id: R48-02-DENSITY
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Beautiful prose
  title: Density
  status: live
  kind: mandate
  summary: 'Lush throughout: every scene gets full sensory layering; slower, denser, more immersive.'
  verbatim: 'Lush throughout: every scene gets full sensory layering; slower, denser, more immersive.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Beautiful prose
    operation: adds
  supersedes: []
  applies_to: *id001
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (writing questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question w02: How thick should description run? Example: a tavern gets one sharp detail,
    or a full paragraph of smell, light and noise. Kept by R70-52-OVERALL_DENSITY (style law
    2026-10-03): R48-02 stands; the blend widens what is described (the R70-40 range rule) and
    keeps the amount.'
- id: R48-03-SIMILES
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Beautiful prose
  title: Similes
  status: live
  kind: mandate
  summary: 'Loosen similes only: a good simile is welcome when it earns its place; em dashes
    stay banned.'
  verbatim: 'Loosen similes only: a good simile is welcome when it earns its place; em dashes
    stay banned.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Beautiful prose
    operation: adds
  supersedes: []
  applies_to: *id001
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (writing questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question w03: Right now similes (''like'', ''as if'') are rationed and metaphor is
    preferred, and em dashes are banned outright. Keep that?'
- id: R48-04-METAPHORS
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Beautiful prose
  title: Metaphors
  status: live
  kind: mandate
  summary: 'Metaphors come from the POV''s own life: trade, homeland, body; metaphor doubles
    as characterisation.'
  verbatim: 'Metaphors come from the POV''s own life: trade, homeland, body; metaphor doubles
    as characterisation.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Beautiful prose
    operation: adds
  supersedes: []
  applies_to: *id001
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (writing questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question w04: Where should narration''s metaphors come from? Example: a Kharven hunter''s
    POV sees a wound ''opened like a split seal'' versus ''like a torn page''. Partly amended
    by R70-59-WHERE_COMPARISONS_COME_FROM (style law 2026-10-03): POV-life comparisons stay
    the default, and each culture''s listed set images may be used whole; R70-66-NAMED_DEVICES_ADD
    makes the epic simile an exception, and R70-44-CULTURE_KEYED_NOTICING keys what a POV notices
    to his culture.'
- id: R48-05-HIGH_STYLE
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Beautiful prose
  title: High style
  status: live
  kind: mandate
  summary: High mythic style is allowed freely in narration whenever the moment calls for it
    (not only in documents).
  verbatim: High mythic style is allowed freely in narration whenever the moment calls for it
    (not only in documents).
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Beautiful prose
    operation: replaces
  supersedes:
  - R5-E-ELEVATED_REGISTER_QUARANTINED
  applies_to: *id001
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (writing questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question w05: The high, mythic cadence (Tolkien-style invocation) is limited to in-world
    documents and myth; scene narration may only go elegiac. Should narration be allowed that
    high style at rare peaks? Stands: R70-4-WESTERN_MODELS (style law 2026-10-03) keeps Tolkien
    named for elegy and high style, and this row keeps that register legal in narration. Noted
    by R70-62-WEATHER_LAND_AS_PERSONS (style law 2026-10-03): personified weather and land is
    allowed at the mythic moments this rule licenses; it stands.'
- id: R48-06-RHYTHM_LAW
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Beautiful prose
  title: Rhythm law
  status: live
  kind: mandate
  summary: 'Keep all rhythm rules: the hit is the shortest sentence and sits last, payoffs under
    10 words, at most two long sentences in a row; the checker fails anything else.'
  verbatim: 'Keep all rhythm rules: the hit is the shortest sentence and sits last, payoffs
    under 10 words, at most two long sentences in a row; the checker fails anything else.'
  amends:
  - guide: NATALIE.md and the wotr-write skill
    locus: Beautiful prose
    operation: adds
  supersedes: []
  applies_to: *id001
  verification: []
  ratified: 'Isaac, 2026-09-26, Claude Code chat: ruled directly (writing questionnaire)'
  source:
    file: ''
    lines: null
  notes: 'Question w06: The rhythm rules are strict: the emotional hit is the shortest sentence
    and sits last, payoff sentences stay under 10 words, no more than two long sentences in
    a row. Do they help the music or cramp i Partly amended by R70-19-PAIRED_CUMULATIVE_SENTENCES
    (style law 2026-10-03): in set pieces only, matched pairs and verse lines are exempt from
    the run rule and once per scene the climax may be one long cumulative sentence; ordinary
    turns keep the full rhythm law. R70-15 keeps the hit short and last under jo-ha-kyu tempo.'
- id: R48-07-WHITE_SPACE
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Beautiful prose
  title: White space
  status: live
  kind: mandate
  summary: 'Steady paragraphs: medium paragraphs, white space used sparingly so it still means
    something.'
  verbatim: 'Steady paragraphs: medium paragraphs, white space used sparingly so it still means
    something.'
  amends:
  - guide: NATALIE.md and the wotr-write skill

  pack: Writing Law 2026-09-26
  pack_number: null
  section: Beautiful prose
  title: Beauty
  status: live
  kind: mandate
  summary: Beauty comes from exact concrete detail, images and metaphor, and what goes unsaid
    (not primarily rhythm/sound).
  verbatim: Beauty comes from exact concrete detail, images and metaphor, and what goes unsaid
    (not primarily rhythm/sound).
  amends:

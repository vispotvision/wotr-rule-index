    a new or minor POV default to?'
- id: R48-09-TECH_WORDS
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Register and voice
  title: Tech words
  status: live
  kind: mandate
  summary: Narration may use technical words freely on its own authority whenever it helps.
  verbatim: Narration may use technical words freely on its own authority whenever it helps.

    (what the world does); the two never mix. Keep that? Stands, confirmed by R70-9-TECHNICAL_MYSTIC_REGISTERS
    (style law 2026-10-03): "R48-10''s free mixing stays". Noted by R70-76-MUCH_WORLD_MAGIC
    (style law 2026-10-03): the world''s magic is stated as law and people''s workings keep
    full mechanism; free mixing by ear is not touched there and stands.'

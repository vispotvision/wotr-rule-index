    lines: null
  notes: 'Question w07: How should the page breathe? Partly amended by R70-20-PARAGRAPH_SHAPE
    (style law 2026-10-03): medium paragraphs stay the norm, but reveals, verdicts, notices
    and a fight''s last beats may run as one-line paragraphs in a cluster. Read with R70-80-READOUT_SITS_PAGE
    (style law 2026-10-03): set-off readout blocks are rare milestone events, so white space
    keeps its meaning.'

  source:
    file: ''
    lines: null
  notes: 'Question w16: Real-world figures (joules, metres per second, degrees) are legal in
    a diagnostic voice. How often should they show up in a scene? Stands, confirmed by R70-29-UNITS_MEASURE
    (style law 2026-10-03): the exact figure stays with trained eyes. Read with R70-30-NUMBERS_WORDS_DIGITS
    (style law 2026-10-03): a stated figure is written in words up to one hundred and for round
    numbers, in digits for exact large counts and system figures. Read with R70-85-SCENE_MOMENTS_THAT_EARN
    (style law 2026-10-03): in-scene readouts come at an appraisal, a wound and Essence spent,
    never at Pressure. Read with R70-86-MANY_READOUTS_SCENE_CARRIES (style law 2026-10-03):
    readouts are capped at three a scene and two a roleplay turn; the cap names readouts, not
    figures in a mouth.'

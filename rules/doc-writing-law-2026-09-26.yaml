- id: R48-16-REAL_FIGURES
  pack: Writing Law 2026-09-26
  pack_number: null
  section: Research-grounded techniques
  title: Real figures
  status: live
  kind: mandate
  summary: 'Real figures appear whenever measured: anyone with an instrument or trained eye

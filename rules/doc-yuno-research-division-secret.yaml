rules:

  - id: R36-1-YASOSHIMA_SINK_YUNO_SECRET
    pack: Yasoshima Essence Sink / What House Yuno Declined to Disclose
    pack_number: null
    section: "What the Research Division Was Not Told"
    title: Yasoshima's Essence stability is a House Yuno sink, worked by the Kagura branch at cost
    status: live
    kind: definition
    summary: >-
      Yasoshima's Essence stability is not natural. For two hundred thousand
      years House Yuno's Kagura branch has used the island as a sink,
      gathering and metabolising the world's ambient Essence drift one
      convergence rite at a time through the deepest reach of Tōbō no Michi;
      the ore-less islands are the right vessel because nothing in them
      distorts what is poured in. The working is paid for: the Kagura
      officiants who hold each convergence spend a sliver of their own
      selfhood into the pattern (Ritual Self-Dilution, the cost Ayame's own
      card names for her single-city version at Kharven). The house refuses
      the Research Division because an outside apparatus measuring the sink
      changes what it is holding (Kiyome's bar on profane or unstable use),
      because a partial account is itself a badly formed act, and because the
      mechanism is the only leverage that has kept the island unconquered.
      Consequence hook if forced open: the load backs up and discharges
      violently at Yasoshima, a mainland Measurewright reading spikes for the
      first time in recorded history, the island becomes the most contested
      ground in the four quarters, and the house's silence recoils on whoever
      breaks it like a sealed vow. Reader's knowledge only; no character
      outside the Kagura officiant line knows it.
    verbatim: >-
      It is stable because House Yuno has spent two hundred thousand years
      making it a drain. Every fracture, every fanning-out of chaotic Essence
      that the rest of the four quarters absorbs and calls weather — the
      ordinary drift that keeps Measurewrights employed everywhere else in
      the world — the Kagura branch has been quietly gathering to itself and
      metabolising, one convergence rite at a time, through the deepest reach
      of Tōbō no Michi. Yasoshima does not merely tolerate Essence better
      than anywhere else. It is where a portion of the world's disorder goes
      to stop being disorder.
    amends:
      - guide: "Yasoshima — The Eighty Isles (wiki page)"

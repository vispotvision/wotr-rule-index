      lines: null
    notes: >-
      The draft had marked the trade entry's tier, price and Carry as
      "placeholder extrapolation ... not canon until Isaac sets them";
      Isaac ratified the draft as written, so T4 / III / A / 26 / 26.0
      stand as set. The row was added to the Standing Index's T4–T5 table
      (after Gravemark Ink, the last T4 row, where the Dawi's Cask-Oath
      Pitch sits in the T1–T3 table) and, in the Material Index's own
      format, to the T4 · Reinforced Magical band of The Material Index ·
      T0–T4 as "Agano Sand, Holding · Sand · Kushara, the Paths" with no
      Resonance / Family / Domain (the draft gives none; the cell reads
      "—" like the other unassigned T4 rows). The "learns the strain it
      survives" behaviour is the item-scale echo of the hub's Ancestral
      Dominion Frame ("repeated impact against them becomes less effective
      as their body 'learns' the force").

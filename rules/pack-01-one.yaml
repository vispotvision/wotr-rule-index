  - id: R1-3-AFTERMATH_IS_WHERE_IT_HAPPENS
    pack: Pack One
    pack_number: 1
    section: "Amendment Three"
    title: Interior action of a battle occurs in its aftermath
    status: live
    kind: mandate
    summary: >-
      Whatever an engagement will do to characters' relationships happens
      in the three days afterward, over the burial detail and the
      arguments about who should have done what — the fight itself is too
      loud and too fast for anyone to change during it.
    verbatim: >-
      Rule: the interior action of a battle occurs in its aftermath.
      Whatever the engagement was going to do to your characters'
      relationships, it does in the three days afterward, over the burial
      detail, in the sick lines, and in the arguments about who should
      have done what. The fight itself is too loud and too fast for anyone
      to change during it.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, character-sheet, scene-structure]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments.md
      lines: "116"
    notes: >-

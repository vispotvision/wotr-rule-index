  - id: R1-2-SUSTAIN_DEFINED
    pack: Pack One
    pack_number: 1
    section: "Amendment Two"
    title: Sustain — how long, and at what cost to the practitioner
    status: live
    kind: definition
    summary: >-
      Sustain is how long an effect holds before Essence cost forces
      cessation, and what the practitioner cannot do while holding it —
      the load-bearing clause, since it tells you what the enemy is free
      to do during the window.
    verbatim: >-
      Sustain. How long the effect can be held before Essence cost forces
      cessation, and what the practitioner cannot do while holding it. The
      second clause is the load-bearing one, because it tells you what the
      enemy is free to do during the window and therefore where the
      scene's real tension sits.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "Scientific Mechanism Standard"
        operation: extends
    supersedes: []
    applies_to: [mass-combat, magic-design]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments.md
      lines: "84"
    notes: null

  - id: R1-2-REFORM_DEFINED
    pack: Pack One
    pack_number: 1
    section: "Amendment Two"
    title: Re-form — whether and how fast a formation recovers cohesion
    status: live
    kind: definition
    summary: >-
      Re-form is how long an affected formation needs to recover cohesion,
      and whether it recovers at all — the field that decides engagements
      and the one authors most often fail to decide before writing.
    verbatim: >-
      Re-form. How long an affected formation needs to recover cohesion,
      and whether it recovers at all. This is the field that decides
      engagements and the one authors most often fail to decide before
      writing. A technique that breaks a line for ten minutes has bought a
      local advantage. One that breaks a line permanently has ended the
      war on that flank.
    amends:

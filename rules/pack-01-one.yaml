  - id: R1-2-COUNTERPLAY_THREE_WAYS
    pack: Pack One
    pack_number: 1
    section: "Amendment Two"
    title: Counterplay to a scaled technique is one of three things
    status: live
    kind: mandate
    summary: >-
      Counterplay to any scaled technique is always exceeding its
      Frontage, outlasting its Sustain, or shortening its Re-form (via
      drill, veterancy, redundant command, or a counter-Domain).
    verbatim: >-
      The counterplay to any scaled technique is therefore always one of
      three things: 1. Exceed its Frontage so the war continues where it
      is not. 2. Outlast its Sustain so the practitioner pays and gains
      nothing. 3. Shorten its Re-form, which is what drill, veterancy,
      redundant command and a counter-Domain seated toward your own men
      are all purchased to do.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "Scientific Mechanism Standard"
        operation: extends
    supersedes: []
    applies_to: [mass-combat, adjudication]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments.md
      lines: "88-91"
    notes: null


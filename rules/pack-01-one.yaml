  - id: R1-1-PERCUSSION_VS_BLADE
    pack: Pack One
    pack_number: 1
    section: "Amendment One"
    title: Blade hunts openings; Percussion hunts fatigue
    status: live
    kind: definition
    summary: >-
      A swordsman asks where you are unguarded; a hammer asks where you
      are already carrying load — fatigue accumulates and openings do not,
      so percussion fights get more dangerous the longer they run while
      blade fights get less decisive.
    verbatim: >-
      Blade grammar hunts openings. Percussion grammar hunts fatigue. That
      is the whole distinction and it comes straight out of Dougou's own
      canonical doctrine: do not break the wall, make the wall confess
      where it was already tired.
    amends:
      - guide: "WOTR_Combat_Craft_Guide.md"
        locus: "Percussion Grammar"
        operation: adds
    supersedes: []
    applies_to: [combat]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments.md
      lines: "42"
    notes: >-
      Directly parallels Pack Three's Expenditure grammar ("hunts cost"),
      which frames itself against the same Blade/Verdict/Percussion set
      (R3-7-EXPENDITURE_GRAMMAR).

  - id: R1-1-PERCUSSION_MOVES
    pack: Pack One
    pack_number: 1
    section: "Amendment One"
    title: The four Percussion moves
    status: live
    kind: definition
    summary: >-
      The Settling breaks stance (descending full weight into the base);
      the Sweep breaks the base (horizontal, full arc and mass); the Shove
      breaks measure (haft/shoulder/boss/pommel at closed distance); the
      Return breaks recovery (the rebound redirected into a second strike)
      and is the grammar's signature.
    verbatim: >-
      | The Settling | Descending, full weight, delivered into the
      opponent's base rather than at their body | Stance. Answers anyone
      rooted, braced, or planted. The correct answer to a man who has
      decided not to move. |
    amends:
      - guide: "WOTR_Combat_Craft_Guide.md"
        locus: "Percussion Grammar"
        operation: adds
    supersedes: []
    applies_to: [combat]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments.md
      lines: "48-51"
    notes: null

  - id: R1-1-PERCUSSION_VS_PLATE_AND_TELL
    pack: Pack One
    pack_number: 1
    section: "Amendment One"
    title: Percussion uses plate rather than defeating it; the tell
    status: live
    kind: definition
    summary: >-
      Percussion does not seek to penetrate plate, it uses it — armour
      transmits force inward, so the target is the joint, base and balance,
      making the plate expensive to wear. The tell is that the fighter
      tracks breathing and footing rather than the weapon.
    verbatim: >-
      Percussion answers to plate: none of these seek to penetrate. Plate
      is not defeated by percussion, it is used. The armour transmits
      force inward, and the correct target is the joint, the base, the
      balance and the man's ability to keep standing in fifty pounds of
      steel. A percussion fighter's answer to plate is to make the plate
      expensive to wear.
    amends:
      - guide: "WOTR_Combat_Craft_Guide.md"
        locus: "Percussion Grammar"
        operation: adds
    supersedes: []
    applies_to: [combat, items]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments.md
      lines: "53"
    notes: null


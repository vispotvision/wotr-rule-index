  - id: R1-2-FRONTAGE_DEFINED
    pack: Pack One
    pack_number: 1
    section: "Amendment Two"
    title: Frontage — how much line a technique affects
    status: live
    kind: definition
    summary: >-
      Frontage is how much line a technique affects, in men or paces; the
      distinction between a personal weapon and an instrument of war is
      width, not power, and most spectacular techniques are narrow.
    verbatim: >-
      Frontage. How much line the technique affects, in men or in paces. A
      frontage of twelve men is a personal weapon used in a battle. A
      frontage of three hundred is an instrument of war. The distinction
      is width, not power, and most spectacular techniques are narrow.
    amends:

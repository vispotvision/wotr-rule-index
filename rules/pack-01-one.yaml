  - id: R1-3-NAME_THREE_RULE
    pack: Pack One
    pack_number: 1
    section: "Amendment Three"
    title: In mass combat, name three characters carry interiority
    status: live
    kind: mandate
    summary: >-
      The one-italic-thought-per-NPC standard is suspended in mass combat;
      no more than three characters carry interiority through a battle
      sequence, everyone else is exterior only, and interiority for named
      characters outside the three is deferred to the aftermath.
    verbatim: >-
      The one-private-italic-thought-per-named-NPC standard is suspended
      in mass combat. It exists to make a small cast feel populated and it
      does the opposite at scale, producing a scene that reads as a poll
      of forty consciousnesses. Replacement standard: name three. No more
      than three characters carry interiority through a battle sequence.
      Everyone else is exterior only: actions, voices, bodies. Interiority
      for named characters outside the three is deferred to the
      aftermath, where it lands harder because the reader has been
      waiting for it.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: null
        operation: replaces
    supersedes: []
    applies_to: [mass-combat, pov, scene-structure]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments.md
      lines: "104-107"

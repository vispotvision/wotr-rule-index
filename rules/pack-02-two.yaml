      lines: "17"
    notes: null

  - id: R2-5-SINGLE_ACT_CONDITIONS
    pack: Pack Two
    pack_number: 2
    section: "Amendment Five"
    title: The Single Act's four conditions
    status: live
    kind: definition
    summary: >-
      The Single Act must be physical (a thing done with the body under
      load, not a decision or realisation), unrepeatable (the circumstance
      does not recur), witnessed but not discussed during the engagement,
      and ambiguous at the moment it happens to witness, reader and actor
      alike.
    verbatim: >-
      It is physical. Not a decision, not a realisation, not a look held a
      beat too long. A thing done with the body under load.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, character-sheet, prose-law]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "25-28"
    notes: null

  - id: R2-5-RESOLUTION_IN_AFTERMATH
    pack: Pack Two
    pack_number: 2
    section: "Amendment Five"
    title: The Single Act resolves in the aftermath, never by discussion
    status: live
    kind: ban
    summary: >-
      The relationship change is legible in how the two characters handle
      an unrelated later scene; if a character ever says what the act
      meant, the amendment has been violated and the scene has been spent.
    verbatim: >-
      In the aftermath, and not by discussion of the act itself. The
      relationship has changed and both parties behave differently.
      Neither raises it. The scene three days later is about a bucket, or
      a burial detail, or who takes which watch, and the change is
      legible in how they handle the bucket. If a character says what the
      act meant, the amendment has been violated and the scene has been
      spent.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, character-sheet, prose-law]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "34-36"
    notes: null

  - id: R2-5-ONE_PER_ENGAGEMENT
    pack: Pack Two
    pack_number: 2
    section: "Amendment Five"
    title: One Single Act per engagement, not the same pairing twice
    status: live
    kind: budget
    summary: >-
      One Single Act per engagement — two dilutes both, three is a soap
      opera in armour; a campaign's several engagements should not all
      involve the same pairing, or the reader begins to expect the shape.
    verbatim: >-
      One Single Act per engagement. Two dilutes both. Three is a soap
      opera in armour. A campaign arc may run several engagements and
      therefore several Acts, and they should not all involve the same
      pairing, because the reader will begin to expect the shape and
      expectation is what kills it.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, scene-structure]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "46-48"
    notes: null

  - id: R2-5-DIAGNOSTIC_TEST
    pack: Pack Two
    pack_number: 2
    section: "Amendment Five"
    title: The removable-battle diagnostic
    status: live
    kind: procedure
    summary: >-
      If removing the battle would preserve the relationship change, the
      Act was not unrepeatable and the battle was decoration; rebuild the
      Act around something only the engagement made possible.
    verbatim: >-
      If you can remove the battle and preserve the relationship change,
      the Act was not unrepeatable and the battle was decoration. Rebuild
      the Act around something the engagement made possible and nothing
      else could.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, verification]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "52"
    notes: null

  - id: R2-6-CURRENCY_RULE
    pack: Pack Two
    pack_number: 2
    section: "Amendment Six.1"
    title: The currency rule — Essence and time do not exchange
    status: live
    kind: ban
    summary: >-
      A practitioner converts Essence into effect; an army converts time
      into ground; these do not exchange, so no technique holds ground —
      it may take, deny, break or unmake ground, never occupy it.
    verbatim: >-
      A practitioner converts Essence into effect. An army converts time
      into ground. These do not exchange. Design consequence: no
      technique holds ground. A technique may take, deny, break or unmake
      ground and it may not occupy it. Any technique whose stated function
      is holding a position for a duration has been designed wrongly and
      should be rebuilt as a denial effect with a Sustain.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, magic-design]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "65-67"
    notes: null

  - id: R2-6-MAGAZINE_RULE
    pack: Pack Two
    pack_number: 2
    section: "Amendment Six.2"
    title: The magazine rule — a practitioner always knows what's left
    status: live
    kind: mandate
    summary: >-
      Essence is finite per practitioner per day and replenishes slower
      than expenditure under load; every technique's Cost field must be
      legible to the character using it, who never discovers mid-technique
      that they are empty.
    verbatim: >-
      Essence is finite per practitioner per day, replenishment is slower
      than expenditure under load, and the practitioner always knows what
      they have left. Design consequence: every technique's Cost field
      must be legible to the character using it. A practitioner never
      discovers mid-technique that they are empty.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [magic-design, stats, character-sheet]
    verification: []
    ratified: null
    source:

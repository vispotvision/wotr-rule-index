  - id: R2-5-SINGLE_ACT_RULE
    pack: Pack Two
    pack_number: 2
    section: "Amendment Five"
    title: A battle advances exactly one relationship, by one unrepeatable act
    status: live
    kind: mandate
    summary: >-
      A battle cannot hold six relationships the way a duel holds one; a
      battle advances exactly one relationship, and it advances it by a
      single unrepeatable act.
    verbatim: >-
      The rule: a battle advances exactly one relationship, and it
      advances it by a single unrepeatable act.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, scene-structure, character-sheet]
    verification: []
    ratified: null
    source:

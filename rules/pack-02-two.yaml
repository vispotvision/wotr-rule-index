  - id: R2-6-REPLENISHMENT_RULE
    pack: Pack Two
    pack_number: 2
    section: "Amendment Six.3"
    title: A practitioner is refilled by a Wellspring or not at all
    status: live
    kind: ban
    summary: >-
      Essence cannot be shipped (it leaks in transit, needs an
      untransportable instrument to assay, dies with its owner); no
      consumable, technique or item may restore a practitioner's magazine.
    verbatim: >-
      A practitioner is refilled by a Wellspring, or not at all. Essence
      cannot be shipped: it leaks in transit, cannot be assayed without an
      instrument that does not travel, and dies with its owner. Design
      consequence: no consumable restores a practitioner's magazine. Any
      technique, item or draft proposed to do so is refused at design.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [magic-design, items, stats]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "77-79"
    notes: null

  - id: R2-6-DOMAINS_BREAK_NOT_KILL
    pack: Pack Two
    pack_number: 2
    section: "Amendment Six.4"
    title: Domains break cohesion; the rout does the killing
    status: live
    kind: mandate
    summary: >-
      A seated Domain corrodes cohesion and the line breaks, with killing
      happening in the rout; assess a Domain-class technique by Re-form
      rather than by casualties.
    verbatim: >-
      A seated Domain does not kill a formation. It corrodes cohesion, the
      line breaks, and the killing happens in the rout. Design
      consequence: assess any Domain-class technique by Re-form rather
      than by casualties. A Domain that kills sixty and does not break the
      line has failed.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, magic-design, adjudication]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "83-85"
    notes: null

  - id: R2-6-VOIDIC_COUNTER
    pack: Pack Two
    pack_number: 2
    section: "Amendment Six.5"
    title: Voidic techniques are priced as artillery, not attack
    status: live
    kind: mandate
    summary: >-
      A Voidic practitioner is a poor attacker and the finest suppression
      instrument in the world; Voidic techniques are priced as artillery —
      slow to bring, slow to move, unable to defend themselves, needing a
      guard detachment, and affecting friendly output as readily as
      hostile.
    verbatim: >-
      Aether Class VI devours where others emit. A Voidic practitioner is
      a poor attacker and the finest suppression instrument in the world,
      and those are the same fact. Design consequence: Voidic techniques
      are priced as artillery. Slow to bring, slow to move, cannot defend
      themselves,
      require a guard detachment, and affect friendly output as readily as
      hostile. A Voidic technique with a friendly-side exemption has been
      designed wrongly.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, magic-design, stats]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "89-91"
    notes: null

  - id: R2-6-SPEED_RULING
    pack: Pack Two
    pack_number: 2
    section: "Amendment Six.6"
    title: Movement techniques are priced as expenditure, not mobility
    status: live
    kind: mandate
    summary: >-
      Speed is Essence; a character who arrives fast arrives depleted, and
      there is no free travel at Grade — a scene with one has spent a
      resource silently.
    verbatim: >-
      High-Grade couriers give functional real-time command across a
      theatre. Speed is Essence, couriers are interdicted first, and
      formations trained on instantaneous command collapse harder when
      they lose it than formations that never had it. Design consequence:
      movement techniques are priced as expenditure, not as mobility. A
      character who arrives
      fast arrives depleted. There is no free travel at Grade and a scene
      that has one has spent a resource silently.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, magic-design, stats]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "95-97"
    notes: null

  - id: R2-6-FRONTAGE_SUSTAIN_REFORM
    pack: Pack Two
    pack_number: 2
    section: "Amendment Six.7"
    title: Scaled techniques carry Frontage, Sustain and Re-form
    status: live
    kind: mandate
    summary: >-
      Any technique deployed against a formation carries Frontage, Sustain
      and Re-form alongside the standard seven fields, or it does not
      belong on a battlefield; counterplay is always exceeding Frontage,
      outlasting Sustain, or shortening Re-form.
    verbatim: >-
      Any technique deployed against a formation carries all three fields
      in addition to the standard seven. A technique that cannot be given
      all three does not belong on a battlefield. Counterplay to any
      scaled technique is always one of three things: exceed its Frontage,
      outlast its Sustain, or shorten its Re-form.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [mass-combat, magic-design, character-sheet]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Two.md
      lines: "101-103"
    notes: >-
      Restated from Pack One; check Pack One's own extraction for the
      original statement of these three fields once it is processed.


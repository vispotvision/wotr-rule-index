  - id: R3-8-NAVAL_SENSORY_HIERARCHY
    pack: Pack Three
    pack_number: 3
    section: "Amendment Eight §12"
    title: The naval sensory hierarchy inverts to sight-motion-sound-smell
    status: live
    kind: definition
    summary: >-
      At sea the sensory order runs sight, motion, sound, smell (versus
      land's sound, pressure, smell, sight), because a ship gives a
      horizon and takes away footing.
    verbatim: >-
      The sensory hierarchy inverts. Section 1's order (sound, pressure,
      smell, sight) was built for a man in a press. At sea it runs sight,
      motion, sound, smell, and the reason is that a ship gives you a
      horizon and takes away your footing.
    amends:
      - guide: "Mass Combat Craft Guide"
        locus: "§11, naval"
        operation: adds
    supersedes: []
    applies_to: [mass-combat, pov, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Three.md
      lines: "61"

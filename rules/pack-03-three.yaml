  - id: R3-7-COZBI_CRAFT_NOTE
    pack: Pack Three
    pack_number: 3
    section: "Amendment Seven"
    title: Writing Cozbi — refuse the spectacular exchange
    status: live
    kind: mandate
    summary: >-
      An Expenditure fighter is boring to write badly and terrifying to
      write correctly; refuse the temptation to give him a spectacular
      exchange — the scene should feel like the opponent is winning,
      repeatedly, at increasing cost, until the arithmetic arrives.
    verbatim: >-
      Craft note for writing him: an Expenditure fighter is boring to
      write badly and terrifying to write correctly. The temptation is to
      give him a spectacular exchange. Refuse it. The scene should feel
      like the opponent is winning, repeatedly, at increasing cost, until
      the arithmetic arrives. Everything before the Ledger is the opponent
      succeeding.
    amends:
      - guide: "WOTR_Combat_Craft_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [combat, character-sheet, prose-law]
    verification: []

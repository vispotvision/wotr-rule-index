  - id: R3-9-PRACTITIONER_POV_RULING
    pack: Pack Three
    pack_number: 3
    section: "Amendment Nine"
    title: Practitioner POV is available before/after a mass action, closed during
    status: live
    kind: mandate
    summary: >-
      A high-Stage practitioner inside a battle experiences none of the
      constraints the guide is built on; handing the reader that POV
      mid-engagement dissolves the fog, pressure and helplessness every
      other section exists to construct, so the POV is open before and
      after an engagement and closed during it.
    verbatim: >-
      A high-Stage practitioner inside a battle experiences none of the
      constraints this guide is built on. They can see. They are not in
      the press. They know what is happening. Handing the reader that POV
      during an engagement dissolves the fog, the pressure and the
      helplessness that every other section exists to construct. Ruling:
      the practitioner POV is available before and after an engagement and
      is closed during it.
    amends:
      - guide: "Mass Combat Craft Guide"
        locus: "§15"
        operation: adds
    supersedes: []
    applies_to: [mass-combat, pov]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Three.md
      lines: "97-99"
    notes: null

  - id: R3-9-BEFORE_AFTER_DURING
    pack: Pack Three
    pack_number: 3
    section: "Amendment Nine"
    title: What the practitioner POV covers before, after, and during
    status: live
    kind: definition
    summary: >-
      Before covers the costing-out arithmetic and the decision what to
      spend and on whom; after covers what the practitioner looks at on a
      field they made and whether they can name anyone; during, use the
      soldier, with the practitioner appearing only as weather the POV
      soldier experiences and doesn't understand.
    verbatim: >-
      - Before is where it belongs. The costing-out arithmetic, the
      decision about what to spend and on whom, the knowledge that the
      levy in front of them exists to be expensive. That is the most
      damning interiority available in the setting and it is wasted if it
      appears while they are fighting. - After is the second place. What a
      practitioner looks at on a field they made. Whether they can name
      anyone. - During, use the soldier. If the practitioner must appear,
      they appear as weather: something the POV soldier experiences and
      does not understand, arriving from outside the four-foot wedge.
    amends:
      - guide: "Mass Combat Craft Guide"
        locus: "§15"
        operation: adds
    supersedes: []
    applies_to: [mass-combat, pov]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Three.md
      lines: "101-103"
    notes: null

  - id: R3-9-COSTED_OUT_EXCEPTION
    pack: Pack Three
    pack_number: 3
    section: "Amendment Nine"
    title: The costed-out exception, spend it once
    status: live
    kind: procedure
    summary: >-
      The single exception to the practitioner-POV ruling: a practitioner
      who has been costed out inherits every section-1 constraint the
      moment their magazine empties, so a POV beginning able to see the

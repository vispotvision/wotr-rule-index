  - id: R3-8-CAVALRY_FIELD_REGISTER_POV
    pack: Pack Three
    pack_number: 3
    section: "Amendment Eight §14"
    title: Cavalry is the only ordinary POV that carries the Field Register
    status: live
    kind: definition
    summary: >-
      A cavalry POV is the only ordinary soldier who can carry the Field
      Register honestly, since the rider both sees and moves; use for
      orientation when needed, aware of the cost paid in intimacy.
    verbatim: >-
      The rider sees, and the rider moves. They have both things the
      infantryman lacks, and the consequence is that a cavalry POV is the
      only ordinary soldier who can carry the Field Register honestly. Use
      them for orientation when you need it and be aware you are paying in
      intimacy.
    amends:

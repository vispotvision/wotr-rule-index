    pack: Pack Three
    pack_number: 3
    section: "Amendment Eight §12"
    title: Motion is the naval sensory channel with no land equivalent
    status: live
    kind: mandate
    summary: >-
      Every physical action on a moving deck costs balance; fighting on a
      moving surface is closer to fighting drunk than to fighting on a
      slope and should be written that way.
    verbatim: >-
      Motion is the second channel and has no land equivalent. The deck
      under a body that cannot plant. Every physical action costs balance.
      Fighting on a moving surface is closer to fighting drunk than to
      fighting on a slope and should be written that way.

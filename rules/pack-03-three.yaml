  - id: R3-8-CAVALRY_CHARGE_TIMING
    pack: Pack Three
    pack_number: 3
    section: "Amendment Eight §14"
    title: A charge is three seconds of decision and forty of consequence
    status: live
    kind: definition
    summary: >-
      The decision (will the enemy line hold) is made at distance by both
      sides simultaneously; if it holds, the charge fails before contact,
      if it breaks, there is no contact at all, only pursuit.
    verbatim: >-
      A charge is three seconds of decision and forty of consequence. The
      decision is whether the enemy line will hold, made at distance, by
      both sides simultaneously. If it holds, the charge fails before
      contact. If it breaks, there is no contact at all, only pursuit.
    amends:

  - id: R3-7-EXPENDITURE_GRAMMAR
    pack: Pack Three
    pack_number: 3
    section: "Amendment Seven"
    title: The fourth grammar — Expenditure hunts cost
    status: live
    kind: definition
    summary: >-
      Expenditure grammar does not seek to defeat the opponent; it makes
      the exchange asymmetric so everything the opponent does is expensive
      and everything the practitioner does is spent from somewhere else.
      Victory is arithmetic and arrives late.
    verbatim: >-
      Expenditure grammar hunts cost. The practitioner does not seek to
      defeat the opponent. They seek to make the exchange asymmetric, so
      that everything the opponent does is expensive and everything they
      themselves do is spent from somewhere else. Victory is arithmetic
      and arrives late.
    amends:
      - guide: "WOTR_Combat_Craft_Guide.md"
        locus: null
        operation: extends
    supersedes: []

  - id: R3-7-EXPENDITURE_MOVES
    pack: Pack Three
    pack_number: 3
    section: "Amendment Seven"
    title: The four Expenditure moves
    status: live
    kind: definition
    summary: >-
      The Offering converts opponent capability into expenditure; the
      Standing converts time into advantage (only for a fighter who
      doesn't experience time as a resource); the Ledger converts the
      whole preceding engagement into one effect, un-repeatable per
      encounter; the Absence converts a victory into nothing by destroying
      the vessel while the practitioner is unaffected.
    verbatim: >-
      | The Offering | Something expendable is put where the opponent
      must deal with it | Converts the opponent's capability into
      expenditure. The construct is not expected to win. It is expected to
      cost. |
    amends:
      - guide: "WOTR_Combat_Craft_Guide.md"
        locus: "Expenditure grammar"
        operation: extends
    supersedes: []
    applies_to: [combat, magic-mechanism]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Three.md
      lines: "31-34"
    notes: null

  - id: R3-7-EXPENDITURE_VS_PLATE
    pack: Pack Three
    pack_number: 3
    section: "Amendment Seven"
    title: Expenditure treats plate armour as irrelevant
    status: live
    kind: definition
    summary: >-
      Plate is a cost problem rather than a defence problem to an
      Expenditure fighter, who is content to let armour do its job for as
      long as the wearer can afford to keep wearing it.
    verbatim: >-
      Expenditure answers to plate: irrelevant. Plate is a cost problem
      rather than a defence problem, and an expenditure fighter is content
      to let armour do its job for as long as the wearer can afford to
      keep wearing it.

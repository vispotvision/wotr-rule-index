  - id: R3-7-EXPENDITURE_TELL_AND_COUNTERPLAY
    pack: Pack Three
    pack_number: 3
    section: "Amendment Seven"
    title: The Expenditure tell and its two documented counterplays
    status: live
    kind: definition
    summary: >-
      The tell is that the fighter is not looking at the opponent.
      Counterplay is reaching through the projection to the claims it
      carries (a Rescind-type working) or forcing a direct physical
      contest against the practitioner's own below-ceiling frame; both are
      documented as having worked once, neither is easy.
    verbatim: >-
      Expenditure tell: the fighter is not looking at the opponent. In
      prose, have them looking at something adjacent, or crouching to
      examine something on the ground, which is Cozbi's documented posture
      and reads as either serene or obscene depending on what the reader
      already thinks of him. Counterplay, per canon: reach through the
      projection to the claims it carries, which has been done once and
      required a Rescind-type working. Or force a direct physical contest,
      which has also been done once and worked, because his own frame is
      genuinely below his ceiling.
    amends:
      - guide: "WOTR_Combat_Craft_Guide.md"
        locus: "Expenditure grammar"
        operation: extends
    supersedes: []
    applies_to: [combat, adjudication]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Three.md
      lines: "38-40"
    notes: null

  - id: R3-7-COZBI_ASSIGNED
    pack: Pack Three
    pack_number: 3
    section: "Amendment Seven"
    title: Cozbi Mahuo's canonical combat assignment
    status: live
    kind: definition
    summary: >-
      Grammar Expenditure; signature move the Standing into the Ledger,
      not a bluff; answers plate with indifference; tells by crouching to
      examine rather than posturing, with speeded cadence signalling
      genuine alarm; status canonical, transcribed from the character card.
    verbatim: >-
      | Grammar | Expenditure | | Signature | The Standing into the
      Ledger. He will do nothing for as long as it takes and this is not a
      bluff. | | Answer to plate | Indifference. He is not trying to get
      through it. | | Tell | Crouches to examine, never postures to
      threaten. Stress default is speed, so a Cozbi who has begun talking
      faster than his usual cadence has been genuinely alarmed and the
      reader should notice before the other characters do. | | Status |
      Canonical. Transcribed from the character card and the combat
      material, not invented. |

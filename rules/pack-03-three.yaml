  - id: R3-8-CAVALRY_PURSUIT_FUNCTION
    pack: Pack Three
    pack_number: 3
    section: "Amendment Eight §14"
    title: The pursuit is cavalry's real function, and it is not combat
    status: live
    kind: mandate
    summary: >-
      Per Section 6, pursuit is butchery of the unresisting from behind at
      a canter for as long as the horses last; the honest version does not
      let the cavalry POV enjoy it and does not let them refuse it either.
    verbatim: >-
      The pursuit is the cavalry's real function and it is not combat. Per
      section 6, it is butchery of the unresisting from behind at a
      canter for as long as the horses last. Writing a cavalry POV means
      writing the person who does that work, and the honest version does
      not let them enjoy it and does not let them refuse it either.

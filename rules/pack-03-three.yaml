  - id: R3-8-NAVAL_NO_ROUT
    pack: Pack Three
    pack_number: 3
    section: "Amendment Eight §12"
    title: The rout rule does not apply at sea
    status: live
    kind: ban
    summary: >-
      A broken crew cannot run, so Section 6's rout rule does not apply;
      naval casualties concentrate in the fighting and the sinking rather
      than in a pursuit, making sea actions bloodier per engagement and
      rarer.
    verbatim: >-
      The rout has nowhere to go. Section 6's central rule does not apply.
      A broken crew cannot run, so naval casualties concentrate in the
      fighting and in the sinking rather than in a pursuit. This is the
      single largest structural difference and it makes sea actions
      bloodier per engagement and rarer.
    amends:
      - guide: "Mass Combat Craft Guide"
        locus: "§6"
        operation: demotes
    supersedes: []
    applies_to: [mass-combat, adjudication]
    verification: []

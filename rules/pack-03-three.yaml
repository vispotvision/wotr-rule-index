  - id: R3-8-NAVAL_SIGHT_HELPLESSNESS
    pack: Pack Three
    pack_number: 3
    section: "Amendment Eight §12"
    title: Naval sight is rationed by capability, not visibility
    status: live
    kind: mandate
    summary: >-
      A sailor's Field Register is available continuously and is rationed
      by what the character can do about what they see, not by what they
      can see; write the helplessness of watching rather than the
      confusion of not seeing.
    verbatim: >-
      Sight extends and becomes reliable. A sailor can see the whole
      engagement, which is the exact opposite of the infantryman's
      condition, and it changes the POV problem completely. The Field
      Register is available continuously and must therefore be rationed by
      a different instrument: not what the character can see, but what
      they can do about it. Write the helplessness of watching rather than
      the confusion of not seeing.
    amends:
      - guide: "Mass Combat Craft Guide"
        locus: "§11, naval"
        operation: adds
    supersedes: []
    applies_to: [mass-combat, pov]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Three.md
      lines: "63"
    notes: null


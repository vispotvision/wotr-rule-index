    section: "Amendment Thirteen"
    title: A gloss is a sentence that only states prior significance
    status: live
    kind: definition
    summary: >-
      A gloss is any sentence whose only function is to state the
      significance of the sentence before it, disguised as texture or
      observant narration.
    verbatim: >-
      Name it. A gloss is any sentence whose only function is to state the
      significance of the sentence before it.

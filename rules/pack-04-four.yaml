  - id: R4-15-LICENSED_CLASS
    pack: Pack Four
    pack_number: 4
    section: "Amendment Fifteen"
    title: The Licensed Class of abstractions that genuinely are objects
    status: live
    kind: definition
    summary: >-
      A debt, claim, verdict, name, standing, bearing, holding, writ,
      seal, title, warrant, attribution or tally is a closed-class WOTR
      abstraction the world already treats as a thing that moves between
      hands; reifying these is description, not device, and is unbudgeted
      and free.
    verbatim: >-
      A debt is a transferable instrument that can be declared never to
      have existed. A claim is carried. A verdict is issued and can be
      rescinded. A name, a standing, a bearing, a holding, a writ, a seal,
      a title, a warrant, an attribution, a tally: the Guild Accord, The
      Bearing and the Holding, Value, Coin and Trade and the Bench of
      Attribution all treat these as things that move between hands and can
      be seized, forged, voided or lost. Licensed instruments are
      unbudgeted and free.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "Metaphor and Simile Calibration"
        operation: adds
    supersedes: []
    applies_to: [prose-law, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Four.md
      lines: "157-159"
    notes: null


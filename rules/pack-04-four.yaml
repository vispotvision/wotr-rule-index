  - id: R4-15-REIFICATION_DEFINED
    pack: Pack Four
    pack_number: 4
    section: "Amendment Fifteen"
    title: Reification is an abstraction handled as a physical object
    status: live
    kind: definition
    summary: >-
      Reification gives an abstract noun a physical verb, handled by
      characters as an object in the room; the tell is the verb, not the
      noun (hand, pass, set, carry, place, take, give, hold, put, return,
      offer, lift, drop, weigh, lay, arrive, land, sit, settle, drain).
    verbatim: >-
      An abstract noun given a physical verb and handled by the characters
      as an object in the room. The silence sat between them. He handed
      her the governance of it. The arithmetic moved across his face.
      Permission changed hands.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "Metaphor and Simile Calibration"
        operation: adds
    supersedes: []
    applies_to: [prose-law]

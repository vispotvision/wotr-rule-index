  - id: R4-13-DELETION_TEST
    pack: Pack Four
    pack_number: 4
    section: "Amendment Thirteen"
    title: The deletion test for a suspected gloss
    status: live
    kind: procedure
    summary: >-
      Delete the candidate sentence and read the passage; if it means the
      same thing, it was a gloss and stays deleted; if meaning is
      genuinely lost, the failure is in the line above and that line is
      rebuilt, never the gloss restored.
    verbatim: >-
      Delete the candidate sentence. Read the passage without it. - The
      passage means the same thing. It was a gloss. It stays deleted. -
      The passage genuinely loses the meaning. The failure is in the line
      above, not the line below. Rebuild the original so it carries its
      own freight. Never restore the gloss.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: "§6"
        operation: replaces
    supersedes: []
    applies_to: [prose-law, verification]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Four.md
      lines: "35-38"
    notes: null

  - id: R4-13-WHERE_SIGNIFICANCE_LIVES
    pack: Pack Four
    pack_number: 4
    section: "Amendment Thirteen"
    title: Significance lives in three places, never in narration
    status: live
    kind: definition
    summary: >-
      Significance may live in a physical tell adjacent to the line, in
      another character's bodily reaction, or in a governed callback —
      never in narration itself.
    verbatim: >-
      Three places, and narration is not one of them. 1. A physical tell
      adjacent to the line. Hild's hand on the arm of the chair. Whether
      it opens or closes. 2. The other character's reaction. Somebody in
      the room hears the word and does something about it with their
      body. 3. A callback, governed by the rule below.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: "§6"
        operation: replaces
    supersedes: []
    applies_to: [prose-law, dialogue]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Four.md
      lines: "44-48"
    notes: null

  - id: R4-13-THIRD_RECURRENCE
    pack: Pack Four
    pack_number: 4
    section: "Amendment Thirteen"
    title: The Third Recurrence rule for a loaded word
    status: live
    kind: mandate
    summary: >-
      A loaded word gets one physical response on first use and no
      comment; meaning arrives on the third appearance through change —
      another character uses it, the usual user withholds it, or register
      makes earlier uses retroactively legible. Withholding is the
      strongest of the three.
    verbatim: >-
      A loaded word gets one physical response on first use and no comment
      at all. Meaning arrives on the third appearance, and it arrives
      through change: someone else uses the word, or the person who always
      uses it withholds it, or it lands in a register that makes the
      earlier uses retroactively legible. Withholding is the strongest of
      the three.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: "§6"
        operation: replaces
    supersedes: []
    applies_to: [prose-law, dialogue, standing-inventory]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Four.md
      lines: "52-54"
    notes: null

  - id: R4-13-FID_CARVEOUT
    pack: Pack Four
    pack_number: 4
    section: "Amendment Thirteen"
    title: Free indirect discourse is not gloss
    status: live
    kind: definition
    summary: >-
      A sentence in the POV's own idiom that could be wrong and reveals
      the character interpreting is characterisation and is kept; a
      sentence in the narrator's neutral, authoritative register that
      reveals nothing about anybody's interior is cut.
    verbatim: >-
      Free indirect discourse is not gloss, and this amendment must not be
      used to strip interiority. The test is whose vocabulary: - The
      sentence is in the POV character's idiom, could be wrong, and
      reveals the character doing the interpreting. Keep it. That is
      characterisation. Sodoku mis-reading a room is worth three
      paragraphs. - The sentence is in the narrator's neutral analytic
      register, is authoritative, and reveals nothing about anybody's
      interior. Cut it. That is the author explaining their own scene.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: "§6"
        operation: replaces
    supersedes: []
    applies_to: [prose-law, pov]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Four.md
      lines: "58-63"
    notes: null


  - id: R4-14-APPROACH_LADDER
    pack: Pack Four
    pack_number: 4
    section: "Amendment Fourteen"
    title: The approach ladder, decelerate into the hit
    status: live
    kind: mandate
    summary: >-
      Decelerate into the hit (long, then medium, then the landing) so the
      reader's eye slows as it arrives, then expand again afterward since
      consequence is cumulative and belongs in cumulative syntax.
    verbatim: >-
      Decelerate into the hit. Long, then medium, then the landing, so the
      reader's eye is slowing as it arrives and the short sentence reads
      as a stop instead of one more item. Expand again afterwards:
      consequence is cumulative in fact and belongs in cumulative syntax,
      which is the register's proper home.
    amends:
      - guide: "WOTR_AI_Writing_Tells_to_Avoid.md"
        locus: "§2"
        operation: adds
    supersedes: []
    applies_to: [prose-law]

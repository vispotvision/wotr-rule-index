  - id: R4-15-DENSITY_PROBLEM
    pack: Pack Four
    pack_number: 4
    section: "Amendment Fifteen"
    title: Reification is legal; density is the failure
    status: live
    kind: definition
    summary: >-
      Reification is a genuine Hermetic-register instrument and any single
      instance reads well; the failure is density — ten good instances in
      a scene leave nothing solid for the reader to stand on.
    verbatim: >-
      This is not a bad move and it will not be banned. It is a genuine
      Hermetic-register instrument, it belongs to the native tongue, and
      any single instance reads well. That is the problem exactly. The
      calibration section waves it through because it evaluates instances,
      and the failure is density.
    amends:

  - id: R4-13-THREE_DISGUISES
    pack: Pack Four
    pack_number: 4
    section: "Amendment Thirteen"
    title: The three disguises of a gloss
    status: live
    kind: definition
    summary: >-
      The etymological gloss explains why a character chose a word; the
      register gloss explains what a tone signified; the stakes gloss
      restates in abstract vocabulary an event the reader already watched
      concretely, usually at paragraph-end.
    verbatim: >-
      The etymological gloss. The narrator explains why a character chose
      the word they chose.
    amends:
      - guide: "WOTR_Scene_Writing_Process_Guide.md"
        locus: "§6"
        operation: replaces
    supersedes: []
    applies_to: [prose-law, verification]

  - id: R5-E-ELEVATED_REGISTER_QUARANTINED
    pack: Pack Five
    pack_number: 5
    section: "E"
    title: The elevated register is quarantined to documents and myth
    status: superseded
    kind: ban
    summary: >-
      The elevated register (invocation, myth-cadence, high style) is
      available only to in-world documents, songs, oral-tradition passages,
      mythic strata, prophetic/Celestial Host material, and the
      opening/closing frame of a mythic-scale event — not ordinary scene
      narration.

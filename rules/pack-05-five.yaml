  - id: R5-A-SKELETON_UNCHANGED
    pack: Pack Five
    pack_number: 5
    section: "A"
    title: The Eastern mechanical skeleton stays exactly as it is
    status: live
    kind: definition
    summary: >-
      WOTR runs an Eastern skeleton under Western flesh; the systematic
      density (Stages, Wellsprings, Bands/Grades/Coherence/eta, Codex glyph
      grammar, Family/Physics Domain, the character sheet, the Design
      Chain, EU costs) does not get diluted, softened, or made
      impressionistic.
    verbatim: >-
      WOTR runs an Eastern skeleton under Western flesh. The skeleton stays
      exactly as it is. Sixteen Temperance Stages, sixty Wellsprings, Bands
      and Grades and Coherence and eta, the Master Codex glyph grammar,
      Family and Physics Domain assignment, the seventeen-section
      character sheet, Trigger through Counterplay, EU costs to the unit.
      That systematic density is a light-novel and xianxia inheritance and
      it is the correct engine for this project. It does not get diluted,
      softened, or made impressionistic. Section 3.3's division of hard and
      soft labour stands untouched.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§1"
        operation: adds
    supersedes: []
    applies_to: [magic-mechanism, stats, register]

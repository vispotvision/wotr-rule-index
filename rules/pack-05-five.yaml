  - id: R5-C3-NARRATION_REGISTER_EXTENSION
    pack: Pack Five
    pack_number: 5
    section: "C.3"
    title: Per-culture narration registers, extended from dialogue
    status: live
    kind: mandate
    summary: >-
      Free indirect discourse's per-character register licence is raised to
      a per-culture one: proposed narration registers include Dawi
      (stressed monosyllables, concrete nouns, sentence-level distrust of
      abstraction), Eresse (subordination, latinate diction, periodic
      sentences), Concord human (the house baseline), and Moto (to be
      built, highest-priority gap).
    verbatim: >-
      The extension raises it from a per-character instruction to a
      per-culture one. Proposed narration registers, to be built out per
      culture as POVs arrive: - Dawi POV. Stressed monosyllables, short
      clauses, concrete nouns, tools named by their proper names.
      Abstractions distrusted at sentence level as well as in dialogue. -
      Eresse POV. Subordination, latinate diction, periodic sentences that
      withhold the verb. Time referenced in long units. - Concord human
      POV. The house baseline. Everything else is measured against it. -
      Moto POV. To be built. Flagged as the highest-priority gap since it
      carries the current arc.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§1.1"
        operation: extends
    supersedes: []
    applies_to: [register, pov, worldbuilding]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: Pack Five's remaining proposed rows ratified"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Five.md
      lines: "92-99"
    notes: >-
      This is the "register by culture" rule Pack Fifteen §1 strikes down
      to flavour ("Available as flavour. Not law."): see
      R15-1-REGISTER_BY_CULTURE, which should be backfilled to reference
      this row by id (a demotion since flavour use remains available, so no
      supersedes link — same policy as other demotions in this corpus).
      Partly amended by R70-21-CADENCE_CULTURE (style law 2026-10-03): cadence
      keyed to the POV's culture is now law and each narration register states
      it; the rest of this row stays flavour under R15-1-REGISTER_BY_CULTURE.
      Under R70-1 the POV's culture also tilts the strand mix, and R70-27 adds
      a diction dial per culture. Read with R70-27-ANTIQUE_NARRATION_RUNS
      (style law 2026-10-03): how antique narration's words run (plain, period
      or archaic) is now law per culture, set in each Standing Inventory; the
      rest of this per-culture register is not named by the answer.


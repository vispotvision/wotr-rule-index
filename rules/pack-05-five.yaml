  - id: R5-A-OPERATIVE_CONSEQUENCE
    pack: Pack Five
    pack_number: 5
    section: "A"
    title: The system lives in the Codex, never in prose texture
    status: superseded
    kind: mandate
    summary: >-
      The system is author-facing and document-facing — it lives in the
      Codex, character sheets, in-world treatises and technical-reveal
      beats; it does not live in prose texture, narrator commentary, or
      character affect.
    verbatim: >-
      The operative consequence: the system is author-facing and
      document-facing. It lives in the Codex, the character sheets, the
      in-world treatises, and the technical-reveal beats where a mechanism
      earns explicit naming. It does not live in prose texture, narrator
      commentary, or character affect. A reader who never opens a codex
      should experience WOTR as a Western epic that happens to be unusually
      rigorous about what magic costs.

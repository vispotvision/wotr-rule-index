    section: "B"
    title: The Manhwa Energy Directive is struck in full
    status: live
    kind: repeal
    summary: >-
      Personality vomiting, reaction shots as characterisation, loud
      opinions as a default register, bizarre/exaggerated minor NPCs,
      absurdist method alongside genuine stakes, humour as a tone

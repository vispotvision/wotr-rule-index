  - id: R5-B-DECLARATION_TO_INFERENCE
    pack: Pack Five
    pack_number: 5
    section: "B"
    title: Characterisation moves from declaration to inference
    status: live
    kind: mandate
    summary: >-
      A character is established by what they choose under pressure, what
      they refuse, what they notice first, and what others say about them
      when absent — not by being vividly themselves in every line; the
      reader assembles the person.
    verbatim: >-
      Characterisation moves from declaration to inference. A character is
      no longer established by being vividly themselves in every line.
      They are established by what they choose under pressure, what they
      refuse, what they notice first in a room, and what other people say
      about them when they are not present. The reader assembles the
      person.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§4"
        operation: replaces

  - id: R5-B-MANHWA_DIRECTIVE_REPEALED
    pack: Pack Five
    pack_number: 5
    section: "B"
    title: The Manhwa Energy Directive is struck in full
    status: live
    kind: repeal
    summary: >-
      Personality vomiting, reaction shots as characterisation, loud
      opinions as a default register, bizarre/exaggerated minor NPCs,
      absurdist method alongside genuine stakes, humour as a tone
      exception, and escalation as a prose-level pacing register are no
      longer craft law and become active tells; escalation survives only as
      plot architecture (Scene Writing Process Guide §2).
    verbatim: >-
      Struck in full from the project instructions and from Section 4's
      sanctioned-exception clause. The following are no longer craft law
      and should be treated as active tells if they appear in a draft.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§4"
        operation: strikes
    supersedes: []
    applies_to: [prose-law, register, verification]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Five.md
      lines: "28-36"
    notes: >-
      Re-ruled tell by tell under R70-7-FAR_MOVE (style law 2026-10-03), not
      superseded whole. Re-ruled: reaction shots as characterisation are
      struck for a crowd speaking in waves within the POV's hearing at a
      reveal (R70-72-WATCHING_CROWD_POWER_REVEAL), and a public reversal
      before a reassessing room is a licensed payoff that opens a Front or a
      Ledger debt (R70-112-FACE_FACE_SLAP); humour as a tone exception gives
      way in part, comedy and dread being set hard against each other by
      design, each played straight, while jokes inside the danger stay gallows
      wit (R70-116-COMEDY_BESIDE_DANGER); escalation as a pacing register is
      legal inside a practitioner's duel while reserve lasts
      (R70-102-STILLNESS_TRACED_PASSES_LONG), and R70-18-ARC_SHAPES'
      tournament and delve arcs run escalation as plot architecture, which
      this row already left legal. R70-6 takes Solo Leveling knowing its
      escalation and onlooker shock run into these tells. Still tells:
      personality vomiting, loud opinions as a default register, bizarre or
      exaggerated minor NPCs (R52-31's comic minor NPCs aside), and absurdist
      method alongside genuine stakes. Partly re-ruled by
      R70-72-WATCHING_CROWD_POWER_REVEAL (style law 2026-10-03), one of the
      tell-by-tell re-rulings R70-7 calls for: 'R5-G's reaction-shot tell is
      struck for crowds', and that tell (R5-G-TELL_BANK_ADDITIONS) comes from
      this list's reaction shots as characterisation, so at a reveal a crowd
      may speak in waves inside the POV's hearing. R70-72 reaches no other
      case and none of the other listed tells. Partly re-ruled, tell by tell
      as R70-7-FAR_MOVE directs (style law 2026-10-03); not superseded.
      Re-ruled within R70-100 to R70-138: escalation as a pacing register is
      legal inside a practitioner's duel while reserve lasts
      (R70-102-STILLNESS_TRACED_PASSES_LONG; R60-03-HARD_RESERVE_CLOCK ends
      it); absurdist method beside genuine stakes gives way to comedy set hard
      against dread by design, each played straight, while inside the danger
      only gallows wit is legal, so that tell still holds there
      (R70-116-COMEDY_BESIDE_DANGER). R70-112-FACE_FACE_SLAP licenses the
      face-slap (a public reversal the room reassesses, with a bill) but names
      no tell on this list; the room's reassessment is where it meets reaction
      shots as characterisation, which R70-72 re-rules for crowds. Still tells
      as far as R70-100 to R70-138 reach: personality vomiting, reaction shots
      as characterisation, loud opinions as a default register, bizarre or
      exaggerated minor NPCs (R70-122-MAY_CARRY_ONE gives minor NPCs comic
      names, not exaggerated conduct) and humour as a tone exception
      (R70-113-DOUBLE_ACT_COMIC_BEAT keeps full comic beats a property of
      carded comic voices).
      Partly re-ruled by R74-34-WITNESS_FACE (mystery law 2026-10-04): reaction
      shots as characterisation (the tell R5-G-TELL_BANK_ADDITIONS carries)
      give way for one witness's face before the thing in a horror beat, once a
      scene, and stay a tell everywhere else. The rest of this list stands as
      already re-ruled.


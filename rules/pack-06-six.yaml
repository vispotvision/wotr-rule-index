# Pack Six: no pack-level Status: line exists (same situation as Pack
# Twelve) — only a Precedence line ("beats Packs One through Five and every
# base guide") with no pending/originated language anywhere. Every later
# pack treats its content as settled (Pack Twelve S7 strikes/retains
# specific pieces of it by name as existing live rules; Pack Thirteen S6
# and Pack Fifteen S1 both cite Pack Six content as still governing).
# Treated as status:live throughout except SS13's numbered pending rulings,
# which are explicitly unresolved. Same interpretive-call caveat as Pack
# Twelve's header comment.
pack: Pack Six
pack_number: 6
source_file: WOTR_Companion_Guide_Amendments_Pack_Six.md
ratified: null
rules:

  - id: R6-1-LADDER_BAN
    pack: Pack Six
    pack_number: 6
    section: "PART I.1"
    title: The Ladder — two abstraction-chain clauses is an automatic cut
    status: live
    kind: ban
    summary: >-
      Two or more clauses of the form "X was Y and Y was Z" in one sentence
      is an automatic cut, never a rewrite; cut back to the first concrete
      noun. Restating a concrete observation as an abstraction in the
      following sentence is barred the same way.
    verbatim: >-
      The rule. Two or more clauses of the form X was Y and Y was Z in the
      same sentence is an automatic cut, never a rewrite. Cut back to the
      first concrete noun and stop there.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§1"
        operation: adds
    supersedes: []
    applies_to: [prose-law, verification]
    verification: ["check-18"]
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "30"
    notes: >-
      Explicitly reaffirmed by Pack Twelve §7: "Retained in full: the
      Ladder ban... Explaining a mechanism is no licence to write badly."
      (R12-7-AI_TELLS_RETAINED).

  - id: R6-2-ONE_READ_PER_SCENE
    pack: Pack Six
    pack_number: 6
    section: "PART I.2"
    title: One reading per scene cap
    status: superseded
    kind: budget
    summary: >-
      A perceptive faculty may deliver a single explicit read per scene;
      after that it is silent and the character perceives with a body.
    verbatim: >-
      One reading per scene. A perceptive faculty may deliver a single
      explicit read. After that it is silent and the character perceives
      with a body: eyes, nose, skin, memory, guesswork.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§3.1"
        operation: adds
    supersedes: []
    applies_to: [pov, magic-mechanism]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "50"
    notes: >-
      Superseded by R12-7-APPARATUS_CAP_REPLACED ("Struck: the Apparatus
      Rule's one-read-per-scene cap... Replaced by a cost").

  - id: R6-2-READ_DELIVERS_FACT
    pack: Pack Six
    pack_number: 6
    section: "PART I.2"
    title: The read delivers a fact, never an interpretation
    status: live
    kind: mandate
    summary: >-
      A faculty's read delivers a bare fact ("Twenty-three"), never an
      interpretation woven around it; the faculty is an instrument and
      instruments produce numbers, not meaning.
    verbatim: >-
      The read delivers a fact, never an interpretation. Twenty-three. Not
      twenty-three, and the Cymorath filed the count with the flat
      unasked-for fidelity it filed everything. The faculty is an
      instrument, and instruments produce numbers, not meaning.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§3.1"
        operation: adds
    supersedes: []
    applies_to: [pov, prose-law]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "52"
    notes: null

  - id: R6-2-FACULTY_NEVER_SUBJECT
    pack: Pack Six
    pack_number: 6
    section: "PART I.2"
    title: The faculty is never the grammatical subject
    status: live
    kind: ban
    summary: >-
      A named faculty is never the grammatical subject of a perception
      verb; the character perceives, the apparatus does not act on its own
      behalf.
    verbatim: >-
      The faculty is never the grammatical subject. Barred: his Cymorath
      mapped the thinning. Permitted: the fourth layer had thinned. The
      character perceives. The apparatus does not act on its own behalf.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§3.1"
        operation: adds
    supersedes: []
    applies_to: [prose-law, pov, verification]
    verification: ["check-19"]
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "54"
    notes: >-
      Only the one-read-per-scene frequency cap is struck by Pack Twelve
      §7; this grammatical-subject rule is never named as struck and is
      part of the "every AI tell in the checklist" retained in full.

  - id: R6-2-CHEMISTRY_BAN
    pack: Pack Six
    pack_number: 6
    section: "PART I.2"
    title: The chemistry ban corollary
    status: live
    kind: ban
    summary: >-
      Real-world scientific vocabulary explaining a sensory impression is
      barred unless the POV is a practitioner of that specific craft
      actively diagnosing; the Mechanism Standard governs technique trigger
      points and nothing else, never a licence for ambient exposition.
    verbatim: >-
      Corollary, the chemistry ban. Real-world scientific vocabulary
      explaining a sensory impression is out unless the POV is a
      practitioner of that specific craft actively diagnosing. Calcium
      oxide releasing its held breath is the narrator being a chemist in a
      scene about a burned village.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§3.1"
        operation: adds
    supersedes: []
    applies_to: [prose-law, register, magic-mechanism]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "56"
    notes: >-
      Explicitly confirmed surviving by Pack Thirteen §6
      (R13-6-CHEMISTRY_BAN_SCOPE): "Pack Six's chemistry ban survives for
      ambient sensory impression. It does not touch a hit, a wound, or a
      working."

  - id: R6-3-IGNORANCE_QUOTA
    pack: Pack Six
    pack_number: 6
    section: "PART I.3"
    title: The ignorance quota, minimum one per scene
    status: live
    kind: mandate
    summary: >-
      At least one thing per scene the POV notices and cannot interpret;
      the narration does not rescue him, and resolution comes in a later
      scene or chapter.
    verbatim: >-
      Minimum one per scene, mandatory. The POV notices something and
      cannot interpret it. The narration does not rescue him. Resolution
      comes in a later scene, and preferably a later chapter.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§9"
        operation: adds
    supersedes: []
    applies_to: [pov, prose-law, scene-structure]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "60"
    notes: >-
      Explicitly reaffirmed and elevated by Pack Twelve §7
      (R12-7-IGNORANCE_MISREADING_RETAINED): "now more important... the
      wrong explanation is the load-bearing device."

  - id: R6-4-MISREADING_BUDGET
    pack: Pack Six
    pack_number: 6
    section: "PART I.4"
    title: The misreading budget, at least one wrong inference per scene
    status: live
    kind: mandate
    summary: >-
      At least one POV inference per scene is wrong and is not corrected on
      the page; the misreading must be reasonable, consistent with what the
      POV knows, and left standing for the reader to find later.
    verbatim: >-
      At least one POV inference per scene is wrong, and is not corrected
      on the page. Competent characters reaching wrong conclusions from
      good reasoning is the whole Ned Stark instrument. A character who is
      never wrong is a camera. The misreading must be reasonable, must be
      consistent with what that POV knows, and must be left standing so
      the reader can find it later.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§9"
        operation: adds
    supersedes: []
    applies_to: [pov, prose-law]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "68"
    notes: >-
      Explicitly reaffirmed and elevated by Pack Twelve §7
      (R12-7-IGNORANCE_MISREADING_RETAINED).

  - id: R6-5-MATERIAL_DENSITY_SURVIVES
    pack: Pack Six
    pack_number: 6
    section: "PART I.5"
    title: Material density stays; described at full density, interpreted at zero
    status: live
    kind: definition
    summary: >-
      Material density (rust, weathering, wear, labour) stays described in
      full per the Directive; the distinction is that the world is
      described exhaustively but interpreted at zero — meaning and thematic
      weight are withheld.
    verbatim: >-
      The material density stays. Seven of thirty-two structures burned.
      Hanuri re-spinning thread from an older garment. Bedding planes in
      limestone. The rust described in full remains house law (Directive
      Sec. 1.2) and Pack Six removes nothing from it.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§1.2"
        operation: null
    supersedes: []
    applies_to: [prose-law, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "74"
    notes: null

  - id: R6-5-INTERPRET_AT_ZERO_STRUCK
    pack: Pack Six
    pack_number: 6
    section: "PART I.5"
    title: "\"Interpret it at zero\" is struck"
    status: superseded
    kind: ban
    summary: >-
      The blanket rule that objects, weather, injury, wear and labour are
      rendered exhaustively but never interpreted is struck.
    verbatim: >-
      The distinction: describe the world at full density, interpret it at
      zero. Objects, weather, injury, wear, labour, all rendered
      exhaustively. Meaning, significance, thematic weight, all withheld.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§1"
        operation: strikes
    supersedes: []
    applies_to: [prose-law, magic-mechanism]

  - id: R6-9-RECURRENCE_RULE
    pack: Pack Six
    pack_number: 6
    section: "PART II.9"
    title: Identity is repetition; every scene draws from the Inventory first
    status: live
    kind: mandate
    summary: >-
      Every scene draws texture from the Inventory before inventing
      anything; anything newly invented is entered into the Inventory the
      same session or it does not exist; each culture designates
      three-to-five high-frequency signature items on the Recurrence
      Ledger.
    verbatim: >-
      Identity is repetition. Novelty is its enemy.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "Standing Inventory"
        operation: adds
    supersedes: []
    applies_to: [standing-inventory, worldbuilding, prose-law]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Six.md
      lines: "112-120"
    notes: null

  - id: R6-10-INVENTORY_AND_ELEGY
    pack: Pack Six
    pack_number: 6
    section: "PART II.10"
    title: The Inventory is where elegiac things live
    status: live
    kind: definition
    summary: >-
      Pack Five's elegiac register requires a named concrete thing that is
      gone, and the Inventory is where those things live; elegy without an
      Inventory is grief for abstractions, which Pack Five already bars.
    verbatim: >-
      Pack Five's elegiac register (Sec. C.2) requires a named concrete
      thing that is gone. The Inventory is where those things live. A dye
      colour no longer made, a dish nobody can assemble since the corridor
      closed, a proverb whose second half has been lost.
    amends:
      - guide: "WOTR_Companion_Guide_Amendments_Pack_Five.md"
        locus: "§C.2"
        operation: extends
    supersedes: []
    applies_to: [standing-inventory, register, worldbuilding]
    verification: []
    ratified: null

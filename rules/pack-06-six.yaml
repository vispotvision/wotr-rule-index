  - id: R6-8-STANDING_INVENTORY_CATEGORIES
    pack: Pack Six
    pack_number: 6
    section: "PART II.8"
    title: The Standing Inventory's nine required categories
    status: live
    kind: definition
    summary: >-
      Food, the greeting, oaths and obscenity, colloquial time, the dead,
      the household object, exchange, proverbs, and the body — each entry
      must be causally downstream of the culture's material conditions;
      flavour-only invention is rejected.
    verbatim: >-
      A per-culture register of non-magical material idiom, built and
      maintained as canon. Nine required categories:
    amends:

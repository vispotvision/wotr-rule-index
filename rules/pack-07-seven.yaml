# Pack Seven, the Soft Magic Amendment. "This pack is the latest and
# therefore governs" (source line 5) at the time it was written — it was
# live canon until Pack Twelve S1 declared it "dead in full" ("Confirmed
# by Isaac's ruling"). Per BRIEF's known live-fire case, every row here
# defaults to status: superseded, pointing at R12-1-PACK_SEVEN_REPEALED or
# a more specific R12-1-*/R12-8-* sibling where the match is clean. A
# handful of rows are status: live instead, because Pack Twelve's own text
# explicitly says so in quotable words (R12-1-PACK_SEVEN_SURVIVORS,
# R12-8-ABILITY_GUIDE_REWRITE's character-first line, R12-A's Epoch-scale
# dread language) — those are called out in their own notes.

  - id: R7-2-TRIGGER_POINT_STANDARD
    pack: Pack Seven
    pack_number: 7
    section: "PART TWO"
    title: The physical-disclosure standard at trigger points
    status: superseded
    kind: definition
    summary: >-
      At a trigger point, the page gets what the body did, what the room
      did, what the target felt, and what it cost, visibly — the mechanism
      stays in the workbook.
    verbatim: >-
      What replaces it at trigger points. At a first display, a major
      injury, a Domain activation or a finisher, the page gets: - What the
      body did. - What the air, the ground and the objects in the room did.
      - What the target felt, in the target's own physical terms. - What it
      cost, visibly.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§3.1"
        operation: adds
    supersedes: []
    applies_to: [magic-mechanism, combat, prose-law]

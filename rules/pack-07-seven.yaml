    notes: >-
      Superseded in substance by R12-3-COMBAT_EXCHANGE_OWES and later
      expanded by R13-4-COMBAT_FLOOR's eight-item version.

  - id: R7-2-HARD_SOFT_DIVISION
    pack: Pack Seven
    pack_number: 7
    section: "PART TWO"
    title: Hard by kind — cost, limit, weight and the numbered facts
    status: superseded
    kind: definition
    summary: >-
      Hard, never bending: cost, limit, relative weight, cause and
      consequence, the sixteen Stages, the eight Families, the sixty
      Wellsprings, the Codex grammar, and relative strength. Soft, never
      explained: how any of it works, how much exists, and where it came
      from.
    verbatim: >-
      Hard, and it never bends: cost, limit, relative weight, cause and
      consequence, the sixteen Stages, the eight Families, the sixty
      Wellsprings, the Codex grammar, and who is stronger than whom. Soft,
      and never explained: how any of it works, how much of it exists, and
      where it came from.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§3.3"
        operation: adds
    supersedes: []
    applies_to: [magic-mechanism, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seven.md
      lines: "54-56"
    notes: >-
      The "how any of it works" clause is superseded by Pack Twelve's
      general mechanism-explanation repeal; "where it came from" (Origin)
      surviving as mythic is exactly what Pack Twelve's own R12-A pitches
      as a recommendation, so that half continues in spirit even though
      this specific row is marked dead along with the rest of the pack.


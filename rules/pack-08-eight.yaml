  - id: R8-23-NAME_HIERARCHY
    pack: Pack Eight
    pack_number: 8
    section: "2.3"
    title: Art carries the character; techniques do not
    status: live
    kind: mandate
    summary: >-
      Naming runs art, then technique, then form; the art carries the
      character and is spoken once at release then assumed, while
      individual techniques are spoken every time they are used.
    verbatim: >-

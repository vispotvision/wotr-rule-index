  - id: R8-21-NAME_IN_OWN_LANGUAGE
    pack: Pack Eight
    pack_number: 8
    section: "2.1"
    title: A true name belongs to the practitioner's own language
    status: live
    kind: mandate
    summary: >-
      The true name is in the practitioner's own language; neither the
      Accord, the Guild, nor the Family has a claim on it, and a register's
      Latin gloss never appears in the practitioner's own mouth.
    verbatim: >-
      The true name is in the practitioner's own language. The Accord has
      no claim on it, and neither does the Guild or the Family. A Ketsuen
      swordsman inducted into the Accord does not rename his house's work
      in Latin because a clerk in Stannvaard needs it alphabetised.

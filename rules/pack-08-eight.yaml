  - id: R8-24-RELEASE_MECHANIC
    pack: Pack Eight
    pack_number: 8
    section: "2.4"
    title: The release, an optional imperative call
    status: live
    kind: definition
    summary: >-
      An art with a true name may carry a release call (imperative verb
      plus name); it is never required for the art to function, costs a
      beat for a measurable output increase, and is spoken indistinguishably
      by a man in real danger or a man showing off.
    verbatim: >-
      An art with a true name may carry a call: an imperative verb plus
      the name. - The release is never required for the art to function. -
      Speaking it costs a beat and buys a measurable increase in output. -
      The man in real danger says it and the man showing off says it, and
      the difference is not visible from outside.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [naming, dialogue, combat]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: Pack Eight ratified; see CONFLICTS.md C-003 for R8-11 against Twelve"
    source:

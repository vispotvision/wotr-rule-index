  - id: R8-22-LITERAL_GLOSS
    pack: Pack Eight
    pack_number: 8
    section: "2.2"
    title: The gloss is flat and literal, never poetic
    status: live
    kind: mandate
    summary: >-
      The gloss is the true name's plain English meaning, flat and
      literal, no poetry or interpretation; if the literal meaning is
      dull, the name is wrong and gets rebuilt rather than dressed up.
    verbatim: >-
      True name, then plain English meaning in parentheses. Kagemusha
      reads Shadow Warrior. It does not read the technique of hidden
      purpose. Flat, literal, no poetry, no interpretation. If the literal
      meaning is dull, the name is wrong and gets rebuilt, and the gloss is
      never used to dress it up.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [naming]

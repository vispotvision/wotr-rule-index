  - id: R8-13-ENTRY_STRUCTURE
    pack: Pack Eight
    pack_number: 8
    section: "1.3"
    title: The ten-part entry structure, in order
    status: live
    kind: definition
    summary: >-
      An entry runs, in order: true name and gloss, classification block,
      release (where carried), description (2-6 sentences), techniques
      (1-3 functional lines each), cost, limit, counter (mandatory on
      Signature), what nobody knows, and Codex (one line at the foot).
    verbatim: >-
      True name and gloss. Script where the register has one,
      romanisation, literal English meaning in parentheses, then the
      by-name if the art has earned one.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "entry structure"
        operation: adds
    supersedes: []
    applies_to: [character-sheet, magic-design, naming]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: Pack Eight ratified; see CONFLICTS.md C-003 for R8-11 against Twelve"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eight.md
      lines: "30-39"
    notes: >-
      This is an "entry" (an art, potentially with several named
      techniques under it), a different granularity from Pack
      Twelve/Seventeen's per-technique summary card; possible overlap not
      reconciled by any pack's own text, so no supersedes/amends
      contradiction is asserted either way.

  - id: R8-14-CLASSIFICATION_BLOCK
    pack: Pack Eight
    pack_number: 8
    section: "1.4"
    title: The eight-field classification block, nothing invented
    status: live
    kind: definition
    summary: >-
      Class (Offensive/Defensive/Supplementary), Family (one of the Eight),
      Wellspring (from the Sixty, primary first), Method (one of eight
      named methods), Physics Domain (one of the Nine), Grade (fixed Tier
      Grade scale), Range (real units), and Medium — all drawn from live
      WOTR taxonomy, nothing invented.
    verbatim: >-

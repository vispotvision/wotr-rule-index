# line 5); Ratification Ledger reiterates "Nothing below is canon until
# Isaac rules." No section marked confirmed, so every row is status:
# proposed. Section numbers use dotted form in the source (1.1, 2.3, ...);
# the schema's id pattern has no room for a dot, so id tokens drop it
# (R8-11-..., R8-23-...) while the human "section" field keeps "1.1" etc.
pack: Pack Eight
pack_number: 8
source_file: WOTR_Companion_Guide_Amendments_Pack_Eight.md
ratified: null
rules:

  - id: R8-11-SHEET_EXPLAINS
    pack: Pack Eight
    pack_number: 8
    section: "1.1"
    title: The sheet explains; the page never does
    status: live
    kind: mandate
    summary: >-
      A character sheet, codex entry or technique writeup states the
      literal operation in plain functional language, with no atmosphere or
      withholding, so a reader can adjudicate a fight from the sheet alone.
    verbatim: >-
      The sheet explains. The page never does. A character sheet, codex
      entry or technique writeup states the literal operation: what the
      ability acts on, by what process, and what result it produces. Plain
      functional language. No atmosphere, no withholding, no rendering the
      mechanism as sensation. A reader must be able to adjudicate a fight
      from the sheet alone.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "§1.1"
        operation: adds
    supersedes: []
    applies_to: [character-sheet, magic-mechanism]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: Pack Eight ratified; see CONFLICTS.md C-003 for R8-11 against Twelve"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eight.md
      lines: "16-18"
    notes: null

  - id: R8-11-PROSE_RETAINS_PACK7
    pack: Pack Eight
    pack_number: 8
    section: "1.1"
    title: Prose keeps every Pack Seven restriction without exception
    status: superseded
    kind: ban
    summary: >-
      No sentence in a scene explains why a working produced its effect, no
      metaphysical quantities appear on the page, and the sheet's full
      mechanism appears in a scene only as body, room, target and cost.
    verbatim: >-
      Prose retains every Pack Seven restriction without exception. No
      sentence in a scene explains why a working produced its effect. No
      metaphysical quantities on the page. The mechanism written in full on
      the sheet appears in a scene only as body, room, target and cost.
    amends:
      - guide: "WOTR_Companion_Guide_Amendments_Pack_Seven.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [magic-mechanism, prose-law, character-sheet]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: C-003 ruled -- Twelve wins everywhere, no exceptions"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eight.md
      lines: "20"
    notes: >-
      RULED 2026-09-12 (C-003): Pack Twelve's repeal reaches this row too.
      Later pack beats earlier pack, no carve-out (unlike C-001's firearms
      exception). Mechanism-on-the-page is the regime everywhere; this
      restatement is dead letter. See CONFLICTS.md and RULINGS.md.


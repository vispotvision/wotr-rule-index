  - id: R8-15-DESCRIPTION_STYLE
    pack: Pack Eight
    pack_number: 8
    section: "1.5"
    title: The description is written as a manual entry
    status: live
    kind: mandate
    summary: >-
      The description is written the way a man teaching it would write it:
      flat operational prose, no mood, no cadence work, no elegiac
      register — that belongs in scenes.
    verbatim: >-
      Written the way a man who has to teach it would write it. How the
      resource divides, what the working acts on, what the target
      experiences, what breaks it, what happens when it fails. Flat
      operational prose. No mood, no cadence work, no elegiac register.
      That belongs in scenes.
    amends:

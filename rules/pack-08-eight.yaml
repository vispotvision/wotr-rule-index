  - id: R8-21-REGISTER_TABLE
    pack: Pack Eight
    pack_number: 8
    section: "2.1"
    title: Naming register by practitioner origin
    status: live
    kind: definition
    summary: >-
      Where a request specifies a register, that register governs and the
      name is built in it first: Concord/Accord/Guild/Sanctum Lux is
      Latinate; Ketsuen/Japonic houses use Japanese; Korean-register houses
      use Korean; Büri is Mongolian; Dawi is stressed Germanic-Norse
      compound; Eresse is Latinate with elvish morphology; Parunic and
      older strata use Parun etymology.
    verbatim: >-
      Where a request specifies a register, that register governs, and the
      name is built in it before anything else about the ability is
      decided. Japonic ask, Japonic name. Korean ask, Korean name.
    amends:
      - guide: "WOTR_Character_Naming_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [naming, worldbuilding, register]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: Pack Eight ratified; see CONFLICTS.md C-003 for R8-11 against Twelve"
    source:

  - id: R9-2-CLASS_MARKED_CRAFT_WORDS
    pack: Pack Nine
    pack_number: 9
    section: "PART TWO"
    title: Which craft word a mouth reaches for is class-marking
    status: live
    kind: mandate
    summary: >-
      Which word a character uses for a craft is characterisation: an
      Engraver says "the cutting," a Kharven soldier says "a man who can do
      the writing," and nobody says "Runecraft" aloud except an Accord
      examiner filling in a form.
    verbatim: >-
      Which word a mouth reaches for is characterisation: an Engraver says
      the cutting. A Kharven soldier wanting help says he needs a man who
      can do the writing. Nobody says "Runecraft" aloud except an Accord
      examiner filling in a form.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "Diction Palette"
        operation: adds
    supersedes: []
    applies_to: [register, dialogue]

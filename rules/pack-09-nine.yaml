  - id: R9-3-SCOPE
    pack: Pack Nine
    pack_number: 9
    section: "PART THREE"
    title: The power-display register applies to a narrow beat list only
    status: live
    kind: definition
    summary: >-
      The new power-display register applies only to Stage-ascension beats,
      a Pressure drop, and a technique's first display or finisher; the
      Visual Aesthetic Guide's grounded North Star governs everywhere else
      (wounds, environment, objects, ordinary combat, material culture).
    verbatim: >-
      Scope, and it is narrow on purpose. This applies only to
      Stage-ascension beats, a Pressure drop, and a technique's first
      display or finisher — the same short list the Ability Guide and Pack
      Seven already flag for the physical standard (what the body did, what
      the room did, what the target felt, what it cost). Everywhere else —
      wounds, environment, objects, ordinary combat, material culture — the
      Visual Aesthetic Guide's Berserk/Vinland grounded North Star stands
      untouched.
    amends:
      - guide: "WOTR_Visual_Aesthetic_Guide.md"
        locus: "Section 4a"
        operation: adds
    supersedes: []
    applies_to: [worldbuilding, magic-mechanism, combat]
    verification: []
    ratified: "Ratified by Isaac's direction, live this session"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Nine.md
      lines: "33"
    notes: >-
      "The Berserk/Vinland grounded North Star stands untouched" is stale
      as of Pack Eleven §1, which retires that North Star entirely
      (R11-1-NORTH_STAR_RETIRED); no supersedes link is set since Eleven's
      text retires the North Star generally and never cites Pack Nine PART
      THREE by name.

  - id: R9-3-EYES_AS_TELL
    pack: Pack Nine
    pack_number: 9

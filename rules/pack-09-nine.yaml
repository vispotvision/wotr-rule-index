    section: "PART THREE"
    title: Aura reads as fracture, not glow
    status: live
    kind: ban
    summary: >-
      Essence discharge reads as broken, shard-edged geometry around the
      body rather than a soft glow; "it glowed" stays banned, replaced for
      Stage-display beats specifically, not as a general phenomenon
      substitute.
    verbatim: >-

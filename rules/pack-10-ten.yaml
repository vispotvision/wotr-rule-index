  - id: R10-2-CATEGORY_READ_EXCEPTION
    pack: Pack Ten
    pack_number: 10
    section: "PART TWO"
    title: The Apparatus Rule's one read may name a category instead
    status: live
    kind: procedure
    summary: >-
      A scene's single diagnostic read (the Apparatus Rule's existing
      budget, not a new one) may be spent naming the category instead of a
      Wellspring or Family; naming a category doesn't trip Check 20, but it
      still costs the scene's only read.
    verbatim: >-
      One exception, and it is the Apparatus Rule's existing budget, not a
      new one. A scene's single explicit diagnostic read may be spent
      naming the category instead of naming a Wellspring or Family — a
      scholar, examiner, or rival practitioner gets one line: "That's
      Animatria. It isn't a real animal." Naming a category is not
      accounting for why it works, so it does not trip Check 20. It still
      costs the scene's only read, and after it the faculty goes silent
      same as always.
    amends:
      - guide: "WOTR_Companion_Guide_Amendments_Pack_Six.md"
        locus: "Apparatus Rule"
        operation: extends
    supersedes: []
    applies_to: [codex, register, verification]
    verification: ["check-20"]
    ratified: "Ratified by Isaac's direction, live this session"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Ten.md
      lines: "25"
    notes: >-
      This budget is later struck outright by Pack Twelve §7
      (R12-7-APPARATUS_CAP_REPLACED, replacing the one-read cap with a
      tempo cost); no supersedes link is set here since the underlying
      target (the Apparatus Rule itself) isn't identified by a specific
      Pack Six rule id yet — confirm and cross-reference once Pack Six is
      extracted.


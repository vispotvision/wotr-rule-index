  - id: R10-3-ANIMATRIA_SHAPE
    pack: Pack Ten
    pack_number: 10
    section: "PART THREE"
    title: Animatria — directed, semi-independent, line-dependent
    status: live
    kind: definition
    summary: >-
      An Animatria shape moves with the caster's active attention, can obey
      or strain against instruction, and stops being anything if the live
      line back to its maker is severed (Silence, a killed caster, a broken
      focus).
    verbatim: >-
      Animatria — the shape is directed and semi-independent. It moves
      with intent the caster is actively spending attention on, it can
      obey or strain against instruction, and its continuity depends on a
      live line back to whoever made it — sever that line (Silence, a
      killed caster, a broken focus) and it stops being anything.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "Projected-Form license"
        operation: extends
    supersedes: []
    applies_to: [magic-design, codex]
    verification: []
    ratified: "Ratified by Isaac's direction, live this session"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Ten.md

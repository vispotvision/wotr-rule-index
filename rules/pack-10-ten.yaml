  - id: R10-1-CRAFT_VS_CATEGORY
    pack: Pack Ten
    pack_number: 10
    section: "PART ONE"
    title: Craft is the mouth; Category is the shape
    status: live
    kind: definition
    summary: >-
      Craft and Category cross like Family and Method at a coarser grain —
      Craft is the mouth a working comes out of, Category is the shape of
      the thing that comes out; the same category can be delivered by
      different crafts with different results.
    verbatim: >-
      The two cross the same way Family and Method already do, at a
      coarser grain: Craft is the mouth it comes out of. Category is the
      shape of the thing that comes out.
    amends:

  - id: R10-3-EFFECT_PHYSICAL_ONLY
    pack: Pack Ten
    pack_number: 10
    section: "PART THREE"
    title: A projected shape's Effect is physical only, never causal
    status: live
    kind: ban
    summary: >-
      A projected shape's Effect describes only what it looks/does/feels
      like, never why the Wellspring resolved as that particular shape; if
      that answer exists at all, it stays workbook, one line, never on the
      page.
    verbatim: >-
      Effect is physical only. What the shape looks like, what it does,
      what the room and the target feel. Never why the Wellspring resolved
      as a tiger and not a wolf — if that answer exists at all, it is
      workbook, one line at the foot, never on the page.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "Projected-Form license"
        operation: extends

  - id: R11-2-CLASS_GEOGRAPHY
    pack: Pack Eleven
    pack_number: 11
    section: "§2"
    title: Class geography follows draw distance from a site
    status: live
    kind: definition
    summary: >-
      A city's street plan follows where the current runs shallowest; the
      rich live over the pool, the poor live at the thin margin where lamps
      gutter through the Thin Weeks.
    verbatim: >-
      Cities sit on sites, not on rivers. A seat's street plan is dictated
      by where the current runs shallowest. Draw falls off with distance
      from the site. The rich live over the pool. The poor live at the
      margin where output is thin and the lamps gutter through the Thin
      Weeks.
    amends: null
    supersedes: []
    applies_to: [worldbuilding]
    verification: []

  - id: R11-4-SURVEY_PROTOCOL
    pack: Pack Eleven
    pack_number: 11
    section: "§4"
    title: The Well survey protocol, seven rules as plot devices
    status: live
    kind: procedure
    summary: >-
      Deploy in pairs with one member outside the radius; take Crystal
      baselines before the march, never after; never carry Object
      Wellsprings into Site Wellsprings; withdrawal is not retreat; report
      Medium-type as priority; every rule is one a character can break, and
      the Guild has buried those who did.
    verbatim: >-
      The survey protocol is already written and is pure scene structure.
      On Walking Into the Current gives seven rules and every one of them
      is a plot device. Deploy in pairs with one member outside the radius,
      because the external observer is the only reliable instrument. Take
      Crystal baselines before the march, never after. Do not carry Object
      Wellsprings into Site Wellsprings. Two laws sharing one Shell,
      unpredictable and frequently catastrophic. Withdrawal is not retreat.
      Report Medium-type as priority.
    amends: null
    supersedes: []
    applies_to: [worldbuilding, adjudication, scene-structure]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: the originated parts of Pack Eleven ratified with the packs already confirmed"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eleven.md
      lines: "99"
    notes: >-
      The "Object Wellsprings into Site Wellsprings" rule is the same
      canon example Pack Twelve S6 uses for Mystic Register grammar (see
      R12-6-RULES_AS_RULES); consistent restatement, not a duplicate rule
      or a conflict.

  - id: R11-4-WELLS_ECONOMY
    pack: Pack Eleven
    pack_number: 11
    section: "§4"
    title: Wells are extraction, never adventure
    status: live
    kind: definition
    summary: >-
      A Core-density Well is the richest draw site that exists; the Guild
      licenses descents, the Accord taxes them, chartered companies fund
      them, and delvers are paid like miners — sack-and-contribution logic,
      no treasure chest.
    verbatim: >-
      What the Wells are economically. Extraction, and never adventure. A
      Well at Core density is the richest draw site that exists and the
      reason it has not been sunk is that the survey team keeps not coming
      back. So the Guild licenses descents, the Accord taxes them,
      chartered companies fund them, and the delvers who go down are paid
      like miners, which is to say badly and with a bonus that their widow
      collects. Sack-and-contribution logic. The treasure chest does not
      exist here.
    amends: null
    supersedes: []
    applies_to: [worldbuilding]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: the originated parts of Pack Eleven ratified with the packs already confirmed"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eleven.md
      lines: "103"
    notes: null

  - id: R11-4-DESCENT_PROSE_LAW
    pack: Pack Eleven
    pack_number: 11
    section: "§4"
    title: A descent's sensory opening inverts toward the body
    status: live
    kind: mandate
    summary: >-
      A descent's sensory opening favours the body (feet, teeth, pack
      weight) over the room; the ignorance quota becomes the ambient
      condition rather than a per-scene quota, and a misidentified encounter
      type is the best-shaped disaster the setting offers.
    verbatim: >-
      Sensory opening inverts toward the body, not the room: what the feet
      report, what the teeth taste, what the pack's weight is doing. The
      ignorance quota is not a quota inside a Well, it is the ambient
      condition. The Apparatus Rule still holds at one read per scene and
      it should usually be spent wrong, because a misidentified encounter
      type is the best-shaped disaster available in this setting.
    amends: null
    supersedes: []
    applies_to: [worldbuilding, pov, prose-law]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code ruling session: the originated parts of Pack Eleven ratified with the packs already confirmed"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eleven.md
      lines: "105"
    notes: >-
      "The Apparatus Rule still holds at one read per scene" is now stale
      against the live R12-7-APPARATUS_CAP_REPLACED, which struck that cap;
      not raised as a CONFLICTS.md row since this whole row is
      status:proposed (unconfirmed), not live, so nothing live actually
      contradicts Twelve.


    section: "§3"
    title: Powder weapons open an engagement, they do not decide one
    status: live
    kind: mandate
    summary: >-
      Powder weapons are slow, loud and honest; a practitioner above
      roughly the middle Stages is not reliably killed by common shot,
      which is why the enchanted round exists at the cost it does.

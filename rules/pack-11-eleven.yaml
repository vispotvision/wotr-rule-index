  - id: R11-2-SILHOUETTE
    pack: Pack Eleven
    pack_number: 11
    section: "§2"
    title: The Draw-Age silhouette, sensory texture
    status: live
    kind: definition
    summary: >-
      No smokestacks or soot; standpipes, gauge-housings, sealed conduit,
      brass and slate and Guild seals, a district's low draw-hum, and the
      politically loaded silence when a district's draw is cut.
    verbatim: >-
      Silhouette. No smokestacks, no soot, no coal. Instead: standpipes and
      gauge-housings, sealed conduit run along building faces like
      plumbing, brass and slate and Guild seals, the constant low draw-hum
      of a district that is drinking, and the sudden silence when a
      district's draw is cut. That silence is a political act and everyone
      in earshot knows it.
    amends: null

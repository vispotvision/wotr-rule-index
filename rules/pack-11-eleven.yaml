  - id: R11-2-HYDROLOGY_MODEL
    pack: Pack Eleven
    pack_number: 11
    section: "§2"
    title: The industrial age is hydrology, not combustion
    status: live
    kind: definition
    summary: >-
      The technological age runs on Wellsprings as standing currents that
      pool where substrate/competing-currents/time allow, per The Mechanism
      of the Sixty; nobody built an engine, they sank a well.
    verbatim: >-
      So the industrial age is not combustion. It is hydrology. Nobody
      built an engine. They sank a well, put a town around it, and grew a
      guild that decides who may sink another.
    amends: null

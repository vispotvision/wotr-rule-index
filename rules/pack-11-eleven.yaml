  - id: R11-3-FIREARM_PROSE_LAW
    pack: Pack Eleven
    pack_number: 11
    section: "§3"
    title: No sentence explains why a proofed round defeats plate
    status: live
    kind: ban
    summary: >-
      The gun is furniture, not spectacle; no sentence explains why a
      proofed round defeats proofed plate — the physical account of the
      hole stays, the causal account is cut.
    verbatim: >-
      Prose law for firearms. The gun is furniture, not spectacle. Powder
      smells of rotten egg and it stays in the wool for days. Misfires are
      common in wet weather and a soldier's relationship with his own
      weapon is superstitious and practical at once. No sentence explains
      why a proofed round defeats a proofed plate. The physical account of
      the hole stays. The causal account is cut, per Pack Seven.
    amends:
      - guide: "WOTR_Item_and_Equipment_Writing_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [items, combat, magic-mechanism, prose-law]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eleven.md
      lines: "76"
    notes: >-
      C-001 ruled 2026-09-12: Eleven's ban stands. No sentence explains why a proofed round defeats proofed plate, even after Twelve's general repeal; firearms are the carve-out from mechanism-on-the-page.


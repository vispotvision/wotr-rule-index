  - id: R11-3-ARMOUR_STOPS_SHRINKING
    pack: Pack Eleven
    pack_number: 11
    section: "§3"
    title: Why plate stops shrinking in WOTR
    status: live
    kind: definition
    summary: >-
      Shot is chemically cheap and does not care about a soul; a working is
      not shot, so mass and material still buy a fraction of a second
      against a Wellspring-carried strike, which is why armour retreats to
      the cuirass-and-helm silhouette and stops there.
    verbatim: >-
      Shot is chemically cheap and does not care what a man's soul is
      doing. A working is not shot. Against a Wellspring-carried strike,
      mass and material still buy the fraction of a second in which a man
      can be somewhere else. So armour retreats to the historical
      cuirass-and-helm silhouette and then stops there, because the last
      article you would take off is the one standing between your chest
      and something that was not there a moment ago.
    amends:
      - guide: "WOTR_Item_and_Equipment_Writing_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [items, worldbuilding, combat]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eleven.md
      lines: "65"
    notes: null


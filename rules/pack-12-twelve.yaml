  - id: R12-3-NAMED_INVENTOR_RULE
    pack: Pack Twelve
    pack_number: 12
    section: "§3"
    title: Documented techniques are counterable by study; originals by live read
    status: live
    kind: mandate
    summary: >-
      Every technique was derived by somebody for a specific problem; a
      documented technique is counterable by anyone who studied it, while a
      self-derived technique must be read live in the exchanges before it
      kills, shown in full rather than summarised.
    verbatim: >-
      The named inventor rule. Every technique was derived by somebody, in a
      specific place, for a specific problem, and the text may say so. A
      documented technique is counterable by anyone who studied it. A
      self-derived technique must be read live, in the two or three
      exchanges before it kills you, and the reading is now shown in full
      instead of summarised.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [magic-design, combat, adjudication]

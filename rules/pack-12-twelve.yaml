  - id: R12-4-VOICE_ONE_POV
    pack: Pack Twelve
    pack_number: 12
    section: "§4"
    title: "Voice one: the POV's own read"
    status: live
    kind: definition
    summary: >-
      Free indirect explanation ceilinged at the POV character's actual
      competence; an out-of-depth character explains wrong, and a
      confidently wrong technical explanation is now the primary vehicle
      for the misreading budget.
    verbatim: >-
      The POV's own read. Free indirect, inside his competence. The
      ceiling is what this character actually knows, and a character who
      is out of his depth explains wrong. A wrong technical explanation
      delivered confidently is now the most valuable tool in the kit and
      replaces the misreading budget as its primary vehicle.
    amends: null
    supersedes: []
    applies_to: [dialogue, pov, magic-mechanism]
    verification: []
    ratified: null

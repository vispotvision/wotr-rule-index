    pack: Pack Twelve
    pack_number: 12
    section: "§4"
    title: "Voice two: the knowledgeable second"
    status: live
    kind: definition
    summary: >-
      A present observer who understands what the POV does not, narrating
      the read to a third party or himself (the Kakashi model); requires an
      actual reason to be present and talking, best carried by teachers,
      rivals, Measurewrights, or the Research and Archives Division.
    verbatim: >-

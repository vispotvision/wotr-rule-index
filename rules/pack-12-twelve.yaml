  - id: R12-A
    pack: Pack Twelve
    pack_number: 12
    section: "§6"
    title: The Origin layer, whether it stays mythic
    status: pending
    kind: open_ruling
    summary: >-
      Whether mechanism becomes fully explicable while Origin (where the
      Titans, Archons, the Crevice, the Withering and Epoch-scale events
      came from) stays permanently mythic and unresolved.
    verbatim: >-
      My recommendation, pitched not decided: mechanism becomes fully
      explicable, and where any of it came from stays mythic. Titans,
      Archons, the Crevice, the Withering, Epoch-scale events. They
      generate dread and problems. They never resolve a plot.
    amends: null
    supersedes: []
    applies_to: [worldbuilding, magic-mechanism]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Twelve.md
      lines: "103"
    notes: >-
      Recommendation: keep Origin mythic (Naruto explains chakra
      exhaustively but never its origin, and loses nothing); pitched, not
      decided. Confirmed added to the Open Docket at §8.


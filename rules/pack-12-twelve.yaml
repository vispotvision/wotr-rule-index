    pack: Pack Twelve
    pack_number: 12
    section: "§4"
    title: "Voice three: the opponent"
    status: live
    kind: definition
    summary: >-
      A practitioner explains exactly what he is doing to his target while
      doing it, because he does not believe the explanation will help; the
      most economical and characterful voice, barred to anyone without
      standing to be arrogant.
    verbatim: >-
      The opponent. Contempt as instruction. A practitioner explaining
      exactly what he is doing to you while doing it, because he does not
      believe the explanation will help. This is the most economical of
      the four and the most characterful, and it is barred to anyone who
      does not have the standing to be arrogant.
    amends: null

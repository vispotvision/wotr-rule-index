  - id: R12-5-NUMBERS_DIAGNOSTIC_ONLY
    pack: Pack Twelve
    pack_number: 12
    section: "§5"
    title: Metaphysical numbers reach the page only in diagnostic voice
    status: live
    kind: ban
    summary: >-
      EU, AU/s, eta, Coherence, Grade and Band numbers may not reach
      third-person narration on the narration's own authority; they are
      legal only in diagnostic voice (a faculty reading, a practitioner
      counting reserve, a document, an instrument, or a speaking
      character).
    verbatim: >-
      They may not reach the narration. Numbers are legal in diagnostic
      voice only: a perceptive faculty actively reading, a practitioner
      counting his own reserve, a document, an instrument, or a character
      speaking. Third-person narration does not state a metaphysical
      figure on its own authority.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§5"
        operation: adds
    supersedes: []
    applies_to: [stats, prose-law, register]
    verification: []

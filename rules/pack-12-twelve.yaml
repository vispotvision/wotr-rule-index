  - id: R12-1-PACK_SEVEN_SURVIVORS
    pack: Pack Twelve
    pack_number: 12
    section: "§1"
    title: What Pack Seven got right survives the repeal
    status: live
    kind: definition
    summary: >-
      The power economy remains a hard rail (finite, spent, shown on the
      page), the ladder remains real, and explaining a mechanism does not
      license a free technique; a fully explained technique that costs
      nothing is worse than an unexplained one.
    verbatim: >-
      The economy is still a hard rail: power is finite, spent, and the
      spending shows on the page or it did not happen. The ladder is still
      real and higher is still felt before it is seen. Explaining a
      mechanism does not license a free one. A fully explained technique
      that costs nothing is worse than an unexplained one.
    amends: null
    supersedes: []
    applies_to: [magic-mechanism, magic-design, adjudication]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Twelve.md
      lines: "22"
    notes: null

  - id: R12-2-TECHNICAL_REGISTER_DEF
    pack: Pack Twelve
    pack_number: 12
    section: "§2"
    title: The Technical Register, defined
    status: live
    kind: definition
    summary: >-
      The Technical Register governs combat, craft, injury and anything a
      practitioner does on purpose; exhaustive, tactical, delivered
      in-fight, explaining the read, the fault, the counter, the reserve
      and why the answer worked, in real vocabulary.
    verbatim: >-
      The Technical Register governs combat, craft, injury, and anything a
      practitioner does on purpose. It is Naruto. It is exhaustive,
      tactical, and delivered in-fight. It explains the read, the fault,
      the counter, the reserve, and the reason the answer worked. It uses
      real vocabulary and does not flinch from detail.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [register, magic-mechanism, combat]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Twelve.md
      lines: "30"
    notes: null

  - id: R12-2-MYSTIC_REGISTER_DEF
    pack: Pack Twelve
    pack_number: 12
    section: "§2"
    title: The Mystic Register, defined
    status: live
    kind: definition
    summary: >-
      The Mystic Register governs Wellsprings, sites, rites, oaths, the
      Veil, and anything the world does regardless of who is watching; it
      is stated as law, never as physics — imperative rules, prices given
      as prices, taboos given without justification.
    verbatim: >-
      The Mystic Register governs Wellsprings, sites, rites, oaths, the
      Veil, and anything the world does regardless of who is watching. It
      is Lord of the Mysteries. It is stated as law, never as physics:
      rules given in the imperative, prices given as prices, taboos given
      without justification.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: null
        operation: adds
    supersedes: []
    applies_to: [register, magic-mechanism, worldbuilding]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Twelve.md
      lines: "32"
    notes: >-
      Pack Fifteen §1 cites "the Mystic Register's rules stated as law,
      never physics clause (Twelve §6)" when striking its document-facing
      application (R15-1-MYSTIC_REGISTER_NEVER_PHYSICS_STRUCK) — that
      strike is partial (this register survives for documents that want to
      withhold), so no supersedes link is set here; a full supersedes would
      incorrectly kill this still-live definition.


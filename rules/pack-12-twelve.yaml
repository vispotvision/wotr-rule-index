  - id: R12-6-MYSTIC_GRAMMAR
    pack: Pack Twelve
    pack_number: 12
    section: "§6"
    title: The grammar of the Mystic Register, five features
    status: live
    kind: definition
    summary: >-
      The Mystic Register's grammar: imperative without justification,
      price stated exactly with no reason given, correspondence in place
      of causation, attribution to an uncertain institution, and the
      recorded failure documented in flat administrative prose.
    verbatim: >-
      The grammar of the Mystic Register: - The imperative without
      justification. Do this, never that. - The price stated exactly and
      the reason for the price never. - Correspondence in place of
      causation. This answers to that. Nobody says why. - Attribution to an
      institution that is itself uncertain. The register says. The older
      register said otherwise. Both are filed. - The recorded failure.
      Somebody did it wrong once and what happened to them is documented in
      flat administrative prose.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: "§6"
        operation: adds
    supersedes: []
    applies_to: [register, magic-mechanism, worldbuilding, documents]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Twelve.md
      lines: "94-99"
    notes: null


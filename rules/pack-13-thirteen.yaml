  - id: R13-3-INVENTION_STEP
    pack: Pack Thirteen
    pack_number: 13
    section: "§3"
    title: The invention step, one step past the textbook
    status: live
    kind: mandate
    summary: >-
      Textbook physics is the floor for a technique, not the ceiling; the
      technique is what a practitioner does with the phenomenon that a
      physicist could not.
    verbatim: >-

  - id: R13-7-RESEARCH_RULE
    pack: Pack Thirteen
    pack_number: 13
    section: "§7"
    title: Every set piece is researched before writing
    status: live
    kind: procedure
    summary: >-
      Before any set piece, first display, finisher or new working, Natalie
      searches at minimum once each for the real phenomenon, the real
      weapon/injury/physiology, and the nearest anime or CRP precedent for
      the shape, consulting the Codex Spell Index and Magical Categories
      page, and names what was consulted in the author notes; a set piece
      written from memory is a failed set piece.
    verbatim: >-
      Before any set piece, first display, finisher, or new working,
      Natalie searches, at minimum, once each for: the real phenomenon; the
      real weapon, injury, or physiology; and the nearest anime or CRP
      precedent for the shape. The Codex Spell Index and the Magical
      Categories page are consulted for assignment. The author notes name
      what was consulted. A set piece written from memory is a failed set
      piece.

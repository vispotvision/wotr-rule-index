  - id: R13-2-STRATUM_ONE_AETHER
    pack: Pack Thirteen
    pack_number: 13
    section: "§2"
    title: "Stratum one: the Aether"
    status: live
    kind: definition
    summary: >-
      The Aether stratum is what was already in the room before a draw:
      Aetheric Density (AU/s ceiling), Residue, Saturation, and in the Draw
      Age the district main/standpipe/meter; its real-science analogue is
      field, gradient, reservoir, saturation, conduction, and a working
      changes with local density.
    verbatim: >-
      Stratum one, the Aether. The ocean. Material Plane. What was in the
      room before anyone drew on it: Aetheric Density (sets the AU/s ceiling
      for that location), Aetheric Residue from prior workings, Aetheric
      Saturation if the room is already flooded, and in the Draw Age the
      district main, the standpipe, the meter, and whether the district is
      cut off.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "§2"
        operation: extends
    supersedes: []
    applies_to: [magic-mechanism, worldbuilding]
    verification: []
    ratified: 'Isaac, 2026-09-11, Claude Code session: ratified by direction ("most of them are ratified"); his standing Natalie project instructions treat this pack as live.'
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Thirteen.md
      lines: "27"
    notes: null

  - id: R13-2-STRATUM_TWO_WELLSPRING
    pack: Pack Thirteen
    pack_number: 13
    section: "§2"
    title: "Stratum two: the Wellspring"
    status: live
    kind: definition
    summary: >-
      The Wellspring stratum is the law: each of the Sixty carries a Core
      Law, Family and Physics Domain assigned as real physics, and its law
      is stated as that real law with a directional operator; the glyph
      constrains degrees of freedom rather than creating the effect.
    verbatim: >-
      Stratum two, the Wellspring. The law. Each of the Sixty carries a Core
      Law, a Family, and a Physics Domain, and the Codex assigns the Physics
      Domain as real physics: Thermodynamics, Electromagnetism, Mechanics,
      Spatial Geometry, Material Science, Biochemistry, Fluid Dynamics,
      Abstract/Entropic Systems, Cross-Family Boundary Physics. The
      Wellspring's law is stated as that real law with a directional
      operator on it.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "§2"
        operation: extends
    supersedes: []
    applies_to: [magic-mechanism, codex]
    verification: []
    ratified: 'Isaac, 2026-09-11, Claude Code session: ratified by direction ("most of them are ratified"); his standing Natalie project instructions treat this pack as live.'

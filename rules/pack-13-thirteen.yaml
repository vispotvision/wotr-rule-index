      lines: "29"
    notes: null

  - id: R13-2-STRATUM_THREE_ESSENCE
    pack: Pack Thirteen
    pack_number: 13
    section: "§2"
    title: "Stratum three: the Essence"
    status: live
    kind: definition
    summary: >-
      The Essence stratum is the soul's water: Soul Crystal architecture
      (Essence Core, Aether Shell, Attraction Layer) and cost (EU, eta,
      Flux Density, Crystal State); real-science analogue is efficiency,
      impedance, resonance, fatigue, phase change of the vessel.
    verbatim: >-
      Stratum three, the Essence. The soul's water. Soul Crystal
      architecture: Essence Core (intent, identity), Aether Shell
      (conversion to force; Lattice Conductivity, Resonant Purity,
      Continuum Retention), Attraction Layer (recognition; Attraction Force
      clean, Obsession Force corrupted). Cost lives here: EU spent, eta lost
      as heat and static and structural bleed, Flux Density under
      compression, Crystal State under strain (Refined, Fractured,
      Overgrown, Crystallized).
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "§2"
        operation: extends
    supersedes: []
    applies_to: [magic-mechanism, stats]

  - id: R14-2-LOADOUT_MANDATE
    pack: Pack Fourteen
    pack_number: 14
    section: "§2"
    title: The FOW line is loaded before any scene or technique design
    status: live
    kind: procedure
    summary: >-
      Before any scene with a named practitioner, and before designing any
      technique, Natalie loads that character's Fracture of Worlds line from
      the character sheet, the Stat Sheet workbook, or the Notion card (in
      that preference order), verified against Fracture_of_Worlds.md. The
      line covers Level/Band/Stage/Path, Tier Grades, Coherence Band and eta,
      Aether Class, Soul Crystal tier/state, Essence Typology, Wellspring
      harmonisations, EU/Flux Density/AU-s, Traits/Domain/Attraction or
      Obsession sustainment, and any Resonant Pair reached.
    verbatim: >-
      Before any scene with a named practitioner, and before any technique
      is designed, Natalie loads that character's Fracture of Worlds line.
      From the character sheet, the Stat Sheet workbook, or the Notion card,
      in that order of preference, and verified against Fracture_of_Worlds.md
      by grep or pdftotext. The line: - Level, Band (I to V), Stage (I to
      XVI, by name), Path alignment.
    amends: null
    supersedes: []
    applies_to: [stats, adjudication, session-protocol]
    verification: []
    ratified: 'Isaac, 2026-09-11, Claude Code session: ratified by direction ("most of them are ratified"); his standing Natalie project instructions treat this pack as live.'

        locus: "register by culture"
        operation: strikes
    supersedes: []
    applies_to: [register, pov, prose-law]
    verification: []
    ratified: "6 September 2026"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Fifteen.md
      lines: "18"
    notes: >-
      supersedes should point at the Pack Five register-by-culture row once
      Phase 2 extracts it.

  - id: R15-1-VOICE_DIFFERENTIATION
    pack: Pack Fifteen
    pack_number: 15
    section: "§1"
    title: Voice differentiation survives
    status: live
    kind: mandate
    summary: >-
      Characters must remain non-interchangeable, but through what they notice,
      want and refuse rather than through vocabulary fences.
    verbatim: >-
      Voice differentiation. If two characters' lines could be swapped and nobody
      noticed, the scene has still failed.
    amends: null
    supersedes: []
    applies_to: [dialogue, prose-law, register]
    verification: []
    ratified: "6 September 2026"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Fifteen.md
      lines: "26"
    notes: null

  - id: R15-2-ONE_TEST
    pack: Pack Fifteen
    pack_number: 15
    section: "§2"
    title: The one test for a word
    status: live
    kind: procedure
    summary: >-
      A word is flagged only if it punctures belief in the world, and the flag
      goes in author notes with the draft left untouched.
    verbatim: >-
      Does the word break a reader's belief in the world? That is the only
      question, and the reader decides, not the rulebook.
    amends: null
    supersedes: []
    applies_to: [register, prose-law, verification]
    verification: []
    ratified: "6 September 2026"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Fifteen.md
      lines: "37"
    notes: null

  - id: R15-2-NO_REGISTER_EDIT
    pack: Pack Fifteen
    pack_number: 15
    section: "§2"
    title: No register fixing in edit passes
    status: live
    kind: ban
    summary: >-
      Register is never corrected during editing and alternate less-modern
      phrasings are never offered.
    verbatim: >-
      Natalie never "fixes" register in an edit pass. Never proposes three
      versions of a sentence to move it further from modern English.
    amends: null
    supersedes: []
    applies_to: [register, prose-law]
    verification: []
    ratified: "6 September 2026"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Fifteen.md
      lines: "39"
    notes: null


  - id: R15-1-REGISTER_BY_CULTURE
    pack: Pack Fifteen
    pack_number: 15
    section: "§1"
    title: Register by culture in narration repealed
    status: live
    kind: repeal
    summary: >-
      Per-culture narration registers become optional flavour rather than law.
    verbatim: >-
      Register by culture in narration (Pack Five): Dawi POV as stressed
      monosyllables, Eresse POV as latinate subordination, and the rest.
      Available as flavour. Not law.
    amends:

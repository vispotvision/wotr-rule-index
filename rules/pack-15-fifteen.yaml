        locus: "§8"
        operation: strikes
    supersedes: []
    applies_to: [prose-law, register, dialogue, documents]
    verification: []
    ratified: "6 September 2026"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Fifteen.md
      lines: "11-13"
    notes: null


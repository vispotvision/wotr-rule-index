  - id: R15-1-LICENCE
    pack: Pack Fifteen
    pack_number: 15
    section: "§1"
    title: The modern-language licence
    status: live
    kind: mandate
    summary: >-
      Modern words, concepts and frames are legal in every channel of the prose,
      including narration and in-world documents.
    verbatim: >-
      Modern words, modern concepts, and modern ideas are prose-legal everywhere:
      narration, dialogue, documents, thought.
    amends:

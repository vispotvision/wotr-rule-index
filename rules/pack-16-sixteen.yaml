  - id: R16-3-COMPOUND_SENTENCE
    pack: Pack Sixteen
    pack_number: 16
    section: "§3"
    title: The compound sentence, mechanism and system term in one breath
    status: proposed
    kind: definition
    summary: >-
      The signature WOTR technical sentence names the real phenomenon, gives
      the system term as its name/boundary/address, and states the physical
      consequence, in one sentence or short group; neither element is a
      gloss on the other.
    verbatim: >-
      The signature WOTR technical sentence carries the real mechanism and
      the system term in the same breath and attaches the physical
      consequence to both. Three elements, one sentence or one short group:
      [the real phenomenon, correctly named] + [the system term as its
      name, its boundary condition, or its address] + [what the body or the
      room did]. Neither element is a gloss on the other. The science is
      not a metaphor for the magic and the magic is not decoration on the
      science. They are the same event described at two strata, per Pack
      Thirteen §2.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [prose-law, register, magic-mechanism]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Sixteen.md
      lines: "40-44"
    notes: null


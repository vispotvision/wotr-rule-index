  - id: R16-2-FOUR_ROUTES
    pack: Pack Sixteen
    pack_number: 16
    section: "§2"
    title: Every rough term is routed to one of four destinations
    status: proposed
    kind: procedure
    summary: >-
      Every content-bearing noun and verb in Isaac's rough prose is routed
      to a WOTR system term, a real scientific/technical term, the compound
      of both, or kept verbatim as a defined WOTR term; nothing is silently
      dropped.
    verbatim: >-
      Conversion, not substitution. Every content-bearing noun and verb in
      Isaac's rough is routed to one of four destinations. Nothing is
      silently dropped.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [prose-law, register]
    verification: []
    ratified: null

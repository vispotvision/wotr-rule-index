      file: WOTR_Companion_Guide_Amendments_Pack_Sixteen.md
      lines: "25-32"
    notes: null

  - id: R16-2-DELETION_REQUIRES_NOTE
    pack: Pack Sixteen
    pack_number: 16
    section: "§2"
    title: A dropped term must be logged in the author notes
    status: proposed
    kind: procedure
    summary: >-
      If a rough-draft term does not survive into the finished prose in one
      of the four routed forms, the author notes must say which term was
      dropped and why, in one line, or the pass has failed.
    verbatim: >-
      Deletion requires a note. If a term from the rough does not appear in
      the finished prose in one of the four forms above, the author notes
      say which term was dropped and why, in one line. A rough draft handed
      back with vocabulary quietly missing is a failed pass.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [prose-law, register, verification]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Sixteen.md

  - id: R16-7-NOT_CONVERTED
    pack: Pack Sixteen
    pack_number: 16
    section: "§7"
    title: What conversion does not touch
    status: proposed
    kind: definition
    summary: >-
      Conversion applies to mechanism, phenomenon, technical read, injury
      and the physics of an exchange, but never to the body's plain
      physicality, grief and the elegiac beat, dialogue (outside a
      practitioner's diagnostic voice or a document), or the ignorance
      quota.
    verbatim: >-
      The conversion applies to mechanism, phenomenon, technical read,
      injury, and the physics of an exchange. It does not apply to: - The
      body. Chest, hands, gut. Story first (Master Style Directive) survives
      Pack Sixteen intact. - Grief and the elegiac beat. Describe the rust
      in full and the grief in three words (Pack Six). A converted grief is
      a failed grief. - Dialogue, except in a practitioner's diagnostic
      voice or a document's. - The ignorance quota (Pack Six). One thing per
      scene the POV perceives and cannot name. Conversion never rescues it.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [prose-law, register, dialogue, pov]
    verification: []
    ratified: null
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Sixteen.md
      lines: "102-109"
    notes: null


  - id: R16-5-VOICES_VS_VOCABULARY
    pack: Pack Sixteen
    pack_number: 16
    section: "§5"
    title: The four explaining voices carry argument, not vocabulary
    status: proposed
    kind: definition
    summary: >-
      The four explaining voices remain the delivery system for causal
      explanation only; narration itself may carry technical terms without
      needing a voice to speak them.

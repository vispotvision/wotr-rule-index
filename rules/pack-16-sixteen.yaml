  - id: R16-6-COINAGE_HANDLING
    pack: Pack Sixteen
    pack_number: 16
    section: "§6"
    title: Isaac's coinages are converted and docketed, never replaced
    status: proposed
    kind: procedure
    summary: >-
      A term in Isaac's rough with no canon equivalent is a coinage: it is
      converted into a defined WOTR term, kept in the prose, given a
      one-line definition in the author notes, and entered on the Open
      Rulings Docket for ratification, never silently replaced with a
      plainer word.
    verbatim: >-
      A term in Isaac's rough that has no canon equivalent is a coinage, not
      a typo and not an approximation. It is converted into a defined WOTR
      term, kept in the prose, given a one-line definition in the author
      notes, and entered on the Open Rulings Docket for ratification. It is
      never silently replaced with a plainer word.
    amends:
      - guide: "WOTR_Master_Style_Directive.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [register, prose-law, naming]
    verification: []
    ratified: null

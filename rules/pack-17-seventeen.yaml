  - id: R17-5-TRAIT_SCOPE
    pack: Pack Seventeen
    pack_number: 17
    section: "§5"
    title: Traits state the substrate property altered
    status: live
    kind: mandate
    summary: >-
      A Trait must specify the Lattice property it alters, and therefore
      which injuries behave differently and which identically; a Trait that
      only restates its effect ("harder to kill") is not a Trait.
    verbatim: >-
      Traits state what they change about the practitioner's substrate. A
      Trait that reads he is harder to kill is not a Trait. A Trait that
      specifies the Lattice property altered, and therefore which injuries
      behave differently and which behave identically, is one.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "§5, Traits"
        operation: extends
    supersedes: []
    applies_to: [magic-design, magic-mechanism, character-sheet]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "72"
    notes: null

  - id: R17-5-SKILL_SCOPE
    pack: Pack Seventeen
    pack_number: 17
    section: "§5"
    title: Skills state their operating principle at the level of the body
    status: live
    kind: mandate
    summary: >-
      A Skill entry must name the real cognitive cues a read operates on, or
      the mechanics, measure and tempo a martial skill operates on.
    verbatim: >-
      Skills state their operating principle at the level of the body. A
      read is a real cognitive operation on real cues, and the entry names
      the cues. A martial skill is mechanics, measure and tempo, and the
      entry names them.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "§5, Skills"
        operation: extends
    supersedes: []
    applies_to: [magic-design, character-sheet]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:

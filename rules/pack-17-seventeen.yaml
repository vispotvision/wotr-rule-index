  - id: R17-4-READ_OFF_MECHANISM
    pack: Pack Seventeen
    pack_number: 17
    section: "§4"
    title: Design order adds a derivation step after the mechanism
    status: live
    kind: procedure
    summary: >-
      Design order stays what refuses/survived/costs-belief, then
      phenomenon, then mechanism, then Codex, unchanged from the sixth
      edition; Pack Seventeen adds that once the mechanism exists, cost,
      limit and counter are derived from it rather than chosen.
    verbatim: >-
      once the mechanism exists, the cost, the limit and the counter are
      read off it rather than chosen.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: extends
    supersedes: []

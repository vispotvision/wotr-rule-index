    pack_number: 17
    section: "§3"
    title: Codex assignment is made after the phenomenon, never before
    status: live
    kind: procedure
    summary: >-
      The Codex line (glyphs / Wellspring / Family / Physics Domain /
      Category / Stage) is assigned after the phenomenon is designed, never
      before.
    verbatim: >-

      lines: "74"
    notes: null

  - id: R17-5-ARTEFACT_SCOPE
    pack: Pack Seventeen
    pack_number: 17
    section: "§5"
    title: An artefact's working carries a full Operation line
    status: live
    kind: mandate
    summary: >-
      Beyond the Item Guide's existing proof-marks, mass, balance and armour
      response requirements, any working an artefact performs must carry a
      full Operation line of its own.
    verbatim: >-
      Proof-marks, mass, balance and the response of the armour tier are
      already required by the Item Guide; Pack Seventeen adds that any
      working the object performs carries a full Operation line of its own.

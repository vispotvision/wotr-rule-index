  - id: R17-6-MECHANISM_VS_ORIGIN
    pack: Pack Seventeen
    pack_number: 17
    section: "§6"
    title: How it works is required; why it is possible is not
    status: live
    kind: definition
    summary: >-
      Entries must state mechanism but never need explain cosmic origin —
      why a Wellspring answers, where the Sixty came from, how many workings
      exist, or why the laws are the laws; that permanent gap is where "What
      nobody knows" lives.
    verbatim: >-
      The line is exact: how it works is required, why it is possible is
      not.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [magic-design, magic-mechanism, worldbuilding]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "88"
    notes: null


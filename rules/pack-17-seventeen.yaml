  - id: R17-8-CHECK36
    pack: Pack Seventeen
    pack_number: 17
    section: "§8"
    title: "Check 36 — The assertion sweep"
    status: live
    kind: procedure
    summary: >-
      Flags phrases that assert an outcome instead of stating a process
      (e.g. "is assayed", "is converted", "responds to"); each is replaced
      with the operation it stands in for, or deleted.
    verbatim: >-
      Check 36 — The assertion sweep. Flag every phrase that states an
      outcome in place of a process: is assayed, is converted, is
      transferred, responds to, is affected by, is empowered by, resonates
      with, attunes to. Each one is either replaced with the operation it is
      standing in for or deleted.
    amends:
      - guide: "Manual Verification Guide"
        locus: "check 36"
        operation: adds
    supersedes: []
    applies_to: [magic-design, magic-mechanism, verification]
    verification: ["check-36", "--entry"]
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"

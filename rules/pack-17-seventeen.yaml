rules:

  - id: R17-2-FOUR_ELEMENTS
    pack: Pack Seventeen
    pack_number: 17
    section: "§2"
    title: Every entry states the four mechanism elements
    status: live
    kind: mandate
    summary: >-
      Every technique entry's Effect line (or immediately under it) must
      name the quantity acted on, the governing law, the operation performed
      on the quantity, and the causal chain from trigger to outcome; missing
      any one makes the entry unfinished and not canon.
    verbatim: >-
      Every entry states how the thing works. Four elements, all four
      required, in the Effect line or immediately under it. An entry missing
      any one of them is not finished and is not canon.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [magic-design, magic-mechanism]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "25-27"
    notes: null

  - id: R17-2-THE_TEST
    pack: Pack Seventeen
    pack_number: 17
    section: "§2"
    title: The it-does-X-to-Y sentence test
    status: live
    kind: procedure
    summary: >-
      A technique must be statable as "it does X to Y, which under Z
      produces W"; if that sentence cannot be written, the technique is not
      designed regardless of the prose around it.
    verbatim: >-
      State the working as: it does X to Y, which under Z produces W. If
      that sentence cannot be written, the technique is not designed and no
      amount of prose will hide it.
    amends: null
    supersedes: []
    applies_to: [magic-design, magic-mechanism, verification]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "34"
    notes: null

  - id: R17-3-SIX_LINE_CARD
    pack: Pack Seventeen
    pack_number: 17
    section: "§3"
    title: The five-line card is replaced by a six-line card, mechanism first
    status: superseded
    kind: consequential_edit
    summary: >-
      The technique card format becomes six ordered lines — Operation,
      Manifestation, Cost, Limit, Counter, What nobody knows — with the
      Operation (mechanism) line first because every other line derives from
      it, plus a small Codex-assignment line at the foot.
    verbatim: >-
      The five-line page format is replaced by six lines. Order matters: the
      mechanism comes first, because everything below it is derived from it.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "technique card format"
        operation: replaces
    supersedes: []
    applies_to: [magic-design, character-sheet]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "40"
    notes: >-
      Backfilled: the five-line predecessor is R12-3-CARD_PLUS_CHAIN (Pack
      Twelve §3). No supersedes link is set since that row also carries
      Pack Twelve's still-relevant Design Chain restoration and isn't fully
      dead, only its card-format portion is replaced here.

  - id: R17-3-COST_DERIVED
    pack: Pack Seventeen
    pack_number: 17
    section: "§3"
    title: Cost must derive from the Operation
    status: live
    kind: mandate
    summary: >-
      The Cost line must be derived from the Operation line; a cost that
      could be swapped for a different cost without changing the mechanism
      is decoration.
    verbatim: >-
      Cost. What it does to the body and what remains after. Derived from
      the Operation. If the cost could be swapped for a different cost
      without changing the mechanism, it is decoration.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "technique card format"
        operation: extends
    supersedes: []
    applies_to: [magic-design, magic-mechanism]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "44"
    notes: null

  - id: R17-3-LIMIT_MECHANICAL
    pack: Pack Seventeen
    pack_number: 17
    section: "§3"
    title: A Limit must have a mechanical source
    status: live
    kind: mandate
    summary: >-
      The Limit line must state why the mechanism forbids the thing it
      forbids; a limit with no mechanical source is a rule the author
      imposed rather than a derived limit.
    verbatim: >-
      Limit. What it structurally cannot do, and why the mechanism forbids
      it. A limit with no mechanical source is a rule the author imposed.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "technique card format"
        operation: extends
    supersedes: []
    applies_to: [magic-design, magic-mechanism]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "45"
    notes: null

  - id: R17-3-COUNTER_MANDATORY
    pack: Pack Seventeen
    pack_number: 17
    section: "§3"
    title: Counter is mandatory on Signature techniques and must derive
    status: live
    kind: mandate
    summary: >-
      A Counter is mandatory on Signature techniques and must fall out of
      the Operation line; a counter that is just "hit him harder" means the
      technique has no mechanism.
    verbatim: >-
      Counter. Mandatory on Signature techniques. It falls out of the
      Operation or it is not a counter. If the counter is hit him harder,
      the technique has no mechanism.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "technique card format"
        operation: extends
    supersedes: []
    applies_to: [magic-design, magic-mechanism, combat]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Seventeen.md
      lines: "46"
    notes: null

  - id: R17-3-WHAT_NOBODY_KNOWS_SCOPE
    pack: Pack Seventeen
    pack_number: 17
    section: "§3"
    title: What nobody knows is constrained to origin, not mechanism
    status: live
    kind: definition
    summary: >-
      The one-line-per-art "What nobody knows" field must be a question
      about why the law holds, never about what the working does; mechanism
      belongs on the page, origin does not.
    verbatim: >-
      What nobody knows. One line per art. Now constrained: it must be a
      question about why the law holds, never about what the working does.
      Mechanism is on the page. Origin is not.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "technique card format"
        operation: extends
    supersedes: []
    applies_to: [magic-design, magic-mechanism, character-sheet]

  - id: R17-5-BLOODLINE_SCOPE
    pack: Pack Seventeen
    pack_number: 17
    section: "§5"
    title: Bloodline faculties state the substrate difference
    status: live
    kind: mandate
    summary: >-
      A bloodline faculty entry must state what quantity the faculty acts on
      (e.g. what the eye does), what it costs to hold open, and what it
      cannot resolve; restating the faculty ("the Moto see") is not an entry.
    verbatim: >-
      The Moto see is not an entry. What the eye is doing to what quantity,
      and what it costs to hold open, and what it cannot resolve, is one.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: "§5, bloodline faculties"
        operation: extends
    supersedes: []
    applies_to: [magic-design, character-sheet, worldbuilding]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"

  - id: R18-4-ROLE_VS_CLASS_AXES
    pack: Pack Eighteen
    pack_number: 18
    section: "§4"
    title: Glyph Role and Glyph Class are orthogonal, non-substitutable axes
    status: live
    kind: definition
    summary: >-
      Glyph Role (Authorization, Boundary, Direction, Sealing) describes
      function within a working; Glyph Class (Root, Derivative by Extension,
      Compound, Synonym, Counter) describes provenance; neither may stand in
      for the other.
    verbatim: >-
      The four Glyph Roles from the Notion Lexicon (Authorization, Boundary,
      Direction, Sealing) describe function within a working. Glyph Class
      from the Codex (Root, and Derivative by Extension, Compound, Synonym or
      Counter) describes provenance. They are orthogonal axes and neither
      substitutes for the other.
    amends: null
    supersedes: []
    applies_to: [codex, magic-mechanism]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eighteen.md
      lines: "63"
    notes: null

  - id: R18-5-ALCHEMY_SOURCE_ORDER
    pack: Pack Eighteen
    pack_number: 18
    section: "§5"
    title: Three alchemy sources, consulted in a fixed order
    status: live
    kind: procedure
    summary: >-

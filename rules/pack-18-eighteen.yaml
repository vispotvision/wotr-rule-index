    pack: Pack Eighteen
    pack_number: 18
    section: "§3"
    title: Pack Seventeen's card and the Spell Index share one schema
    status: live
    kind: definition
    summary: >-
      Pack Seventeen's technique card fields (Operation, Manifestation, Cost,
      Limit, Counter, Codex line) map exactly onto Spell Index columns
      (Mechanism/Trigger, Effect/Numerical-Physical-Effect/Target Response,
      Cost/Backlash, Temperance Min plus Mechanism's constraint, Counterplay,
      and Category/Primary Glyphs/Wellsprings/Family/Physics Domain
      respectively), and the Codex column governs.
    verbatim: >-
      Pack Seventeen's card and the Spell Index schema are the same object.
      The mapping is exact and the Codex column governs:

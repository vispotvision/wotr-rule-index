  - id: R18-3-CODEX_OVERRIDES_LEXICON
    pack: Pack Eighteen
    pack_number: 18
    section: "§3"
    title: The Codex outranks Pack Sixteen's conversion lexicon on conflict
    status: live
    kind: consequential_edit
    summary: >-
      Pack Sixteen's route-1 rough-prose conversion now means routing to a
      Codex term, and where the Pack Sixteen §4 conversion lexicon disagrees
      with the Codex sheet, the sheet wins.
    verbatim: >-
      And when converting Isaac's rough prose (Pack Sixteen §2), route 1 now
      means route to a Codex term. The conversion lexicon in Pack Sixteen §4
      is subordinate to the Codex: where the two disagree, the sheet wins.
    amends:
      - guide: "WOTR_Companion_Guide_Amendments_Pack_Sixteen.md"
        locus: "§4"
        operation: demotes
    supersedes: []
    applies_to: [codex, register]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eighteen.md
      lines: "53"
    notes: >-
      Demotes Pack Sixteen §4's conversion lexicon to subordinate status
      rather than striking it; not a supersedes link since Pack Sixteen §4
      still applies wherever it does not conflict with the Codex.


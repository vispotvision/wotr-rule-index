  - id: R18-5-ALCHEMY_DOCTRINE_BINDING
    pack: Pack Eighteen
    pack_number: 18
    section: "§5"
    title: The alchemical doctrine line, and the operations it binds
    status: live
    kind: mandate
    summary: >-
      Reagents are the nouns, the Wellspring is the verb, and Glyphica is the
      grammar; any working touching Calcination, Dissolution, Coagulatio,
      Distillation, Sublimare or Transmutatio is bound by Alchemetrica's
      entries for them.
    verbatim: >-
      the reagents are the nouns, the Wellspring is the verb, Glyphica is the
      grammar that makes the sentence lawful. It also fixes the eight
      Wellsprings that are simultaneously Wellspring, cosmic principle and
      alchemical operation, and any working that touches Calcination,
      Dissolution, Coagulatio, Distillation, Sublimare or Transmutatio is
      bound by their entries there.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [magic-design, codex, items]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eighteen.md
      lines: "73"
    notes: null

  - id: R18-6-SESSION_START_4A
    pack: Pack Eighteen
    pack_number: 18
    section: "§6"
    title: New Session Start step 4a, open the Master Codex
    status: live
    kind: procedure
    summary: >-
      Inserted between the current steps four and five of the Session Start
      Protocol, a new step 4a requires querying the Spell Index, Glyph Index,
      Alchemical Index and Lists sheet for everything the scene will work,
      before the FOW line and before the Standing Inventory.
    verbatim: >-
      4a. Open the Master Codex for anything the scene will work. Query the
      Spell Index for existing precedent, the Glyph Index for the phenomenon,
      the Alchemical Index for any reagent, and the Lists sheet for every
      assignment the scene will name. Do this before the FOW line and before
      the Standing Inventory, because the Codex determines what the working
      is and the others determine what it costs and how it reads.
    amends:
      - guide: "Session Start Protocol"
        locus: "step 4a"
        operation: adds
    supersedes: []
    applies_to: [session-protocol, codex]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eighteen.md
      lines: "85"
    notes: null


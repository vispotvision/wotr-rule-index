  - id: R18-2-CODEX_FIRST_MANDATE
    pack: Pack Eighteen
    pack_number: 18
    section: "§2"
    title: The Codex is consulted before a working is designed
    status: live
    kind: procedure
    summary: >-
      Before naming, pitching, converting or writing a working, the design
      order is fixed: read the Spell Index for precedent, then the Master
      Glyph Index, take Wellspring/Family/Physics Domain/Temperance
      Min/Category/Glyph Class assignment from the Lists sheet (never from
      memory), route alchemy to the Alchemical Index, and only then design
      and write.
    verbatim: >-
      The Codex is opened before the working is designed, not after.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [magic-design, codex]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eighteen.md
      lines: "23"
    notes: null

  - id: R18-2-NO_NEW_CATEGORY_WITHOUT_CHECK
    pack: Pack Eighteen
    pack_number: 18
    section: "§2"
    title: No new Codex category without a demonstrated absence
    status: live
    kind: ban
    summary: >-
      A new Wellspring, Family, Physics Domain, Archon, Titan, Glyph Class,
      Tier or alchemical Type may not be proposed until the existing
      enumeration has been read and shown not to already cover it; a proposal
      that does not name what was checked is not a proposal.
    verbatim: >-
      No new Wellspring, Family, Physics Domain, Archon, Titan, Glyph Class,
      Tier or alchemical Type may be proposed until the existing enumeration
      has been read and the absence demonstrated. A proposal that does not
      name what was checked and why it failed is not a proposal.
    amends:
      - guide: "WOTR_Ability_Technique_Design_Guide.md"
        locus: null
        operation: extends
    supersedes: []
    applies_to: [magic-design, codex]
    verification: []
    ratified: "Isaac, 2026-09-12, Claude Code: ratified wholesale"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Eighteen.md
      lines: "34"
    notes: null


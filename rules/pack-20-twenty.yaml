  - id: R20C-50-FLESHSHAPER_VOICE
    pack: Pack Twenty
    pack_number: 20
    section: "R20C-50"
    title: "Fleshshaper Goblin"
    status: live
    kind: definition
    summary: "Fleshshaper Goblin. Old Vaross substrate."
    verbatim: "Fleshshaper Goblin. Old Vaross substrate. Verbs of making dominate the clause. A Fleshshaper does not say it broke, they say someone unmade it, and if nobody did then it was never whole. No passive voice at all. Possession marked on the body and not the object: knife-at-my-hand, never my knife. Counting by pairs and hands. Discourse marker: a confirming particle at clause-end, roughly yeh, dropped when the speaker stops caring whether you follow. Bodies discussed as material, their own included, which is the part that unsettles everyone else."
    amends: null
    supersedes: []
    applies_to: ["dialogue", "register"]
    verification: []
    ratified: "live on reading (Pack Eighteen); Isaac, 2026-09-13"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Twenty_Clearance.md
      lines: "122"
    notes: "Read beside R24-1; no contradiction found at extraction."

  - id: R20C-51-WINTER_ELADRIN_VOICE
    pack: Pack Twenty
    pack_number: 20
    section: "R20C-51"
    title: "Winter Eladrin"
    status: live
    kind: definition
    summary: "Winter Eladrin. Speech is the secondary channel; stillness and the angle of the hands are primary."
    verbatim: "Winter Eladrin. Speech is the secondary channel; stillness and the angle of the hands are primary. Craft rule: meaning arrives in a physical clause before the spoken one, and the spoken clause is shorter than the gesture that preceded it. They never repeat themselves — a repeated sentence accuses the listener of inattention. No greetings exist; arrival is announced by being seen, and a Winter Eladrin who says hello is being deliberately hostile."
    amends: null
    supersedes: []

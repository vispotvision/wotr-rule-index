  - id: R20C-17-SITES_RECHARGE_UNHELPFULLY
    pack: Pack Twenty
    pack_number: 20
    section: "R20C-17"
    title: "Sites recharge, and it does not help"
    status: live
    kind: definition
    summary: "Sites recharge, and it does not help. Decades to centuries, and the rate falls with every working — eighty years the first time, two hundred the second."
    verbatim: "Sites recharge, and it does not help. Decades to centuries, and the rate falls with every working — eighty years the first time, two hundred the second. Short-run: managed and corrupt, because the Guild sells renewal honestly. Long-run: predatory and doomed, because the curve bends one way. The Thin Weeks are this arriving early in the periphery."

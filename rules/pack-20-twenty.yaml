  - id: R20C-PD-PSYCHIC_DISTANCE_BANDS
    pack: Pack Twenty
    pack_number: 20
    section: "Psychic-distance bands — assigned"
    title: "Psychic-distance bands per POV, 1 most distant to 5 deepest interior"
    status: live
    kind: definition
    summary: "| POV | Band | Note | |---|---|---| | Sodoku Moto | 3 | To 4 only at the moment of a decision his body has already made. Never 5."
    verbatim: "| POV | Band | Note | |---|---|---| | Sodoku Moto | 3 | To 4 only at the moment of a decision his body has already made. Never 5. | | Verinus VII | 2 | The institution thinks in him. Narration near-procedural. | | Aurelian Prudentius | 4 | High FID. His vocabulary all over the narration, deliberately. | | Darius | 2 | Close and hot. To 1 under violence; the world reduces to what is in reach. | | Kwon Mu-jin | 3 | Drifts cold to 4 when he is counting. The drift is the tell. | | Renard Greymane | 3 | Narration picks up bar-idiom without comment. | | Ilthára Korvaeth | 4 | The Korvaeth arc runs on her lexicon. | | Yoko Mishiro | 3 | Sensory-first. Nose ahead of eye in narration as well as dialogue. | | Wren Greymane | 2 | Held at distance deliberately. Not explained. | | Charles, Dabney, Sesk | 3 | House baseline. Everything else measured against these. | | Emira | 2 | Tight, unrescued. She notices and does not interpret; neither does the narration. | | Cozbi | 5 | The one character licensed to have the narration become him. |"
    amends: null
    supersedes: []
    applies_to: ["pov"]
    verification: []
    ratified: "live on reading (Pack Eighteen); Isaac, 2026-09-13"

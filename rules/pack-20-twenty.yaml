    verbatim: "The Celestial Host (also closes R20-2). The Host has no native register, and that is the ruling. It speaks in the language of whoever recorded it, which is why Verantha, Kaethren Vareth, Dazgrim and Urstia do not match and never will. Those four names are confirmed canon, not placeholders. What is consistent is grammar: the Host speaks entirely in the completed aspect. No future tense, no conditional, no question. A Host that wants something says it has happened."
    amends: null
    supersedes: []

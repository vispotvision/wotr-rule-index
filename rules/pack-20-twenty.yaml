  - id: R20C-CA-BAN_DEAD
    pack: Pack Twenty
    pack_number: 20
    section: "The two conflicts"
    title: "C-001, the proofed round"
    status: superseded
    kind: definition
    summary: "C-001, the proofed round. Resolved: the ban is dead."
    verbatim: "C-001, the proofed round. Resolved: the ban is dead. Pack Eleven §3's firearms clause cited Pack Seven as its whole authority; a rule does not survive the repeal of the thing it quotes. A Measurewright, proof-master or opponent in diagnostic voice may explain why a proofed round defeats proofed plate. The surviving constraint is R20C-26: the steel stops the shot, never the working. Explain metallurgy and terminal ballistics; never let the coupling be the thing that saved him."
    amends: null
    supersedes: []
    applies_to: ["adjudication", "prose-law"]
    verification: []
    ratified: "superseded on arrival, Isaac, 2026-09-13"
    source:
      file: WOTR_Companion_Guide_Amendments_Pack_Twenty_Clearance.md

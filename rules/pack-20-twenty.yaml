  - id: R20C-9-ANCESTRAL_SEAT_WORKED_CORE
    pack: Pack Twenty
    pack_number: 20
    section: "R20C-9"
    title: "What ruined the ancestral seat: the seat was sited on a Core concentration and the line worked it"
    status: live
    kind: definition
    summary: "What ruined the ancestral seat: the seat was sited on a Core concentration and the line worked it. No battle, no plague, no enemy."
    verbatim: "What ruined the ancestral seat: the seat was sited on a Core concentration and the line worked it. No battle, no plague, no enemy. They held the deepest draw anyone ever had, for generations, and the residual saturation Saruul reads there is the day the site gave out under a full household drawing at once. The Moto descend from whoever was standing furthest from the tap. What nobody knows: why that site and no other. Every survey since reads it as ordinary depleted ground. Largest call in the pack."

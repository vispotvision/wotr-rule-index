[package]
name = "wotr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wotr-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
fancy-regex = "0.20"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }

[profile.release]
lto = "thin"

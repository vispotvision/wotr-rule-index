[package]
name = "wotr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wotr-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
yaml-rust2 = "0.10"
serde_yaml_ng = "0.10"
fancy-regex = "0.20"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
# embeddings: the system ONNX Runtime (onnxruntime-cpu), loaded at run time, and the model's own tokenizer
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
unicode-normalization = "0.1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[profile.release]
lto = "thin"

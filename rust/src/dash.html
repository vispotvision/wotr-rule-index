<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOTR MCP Keys</title>
<style>
:root {
  --bg: #0f0e0c; --panel: #181613; --line: #2c2823; --text: #ece6da; --dim: #9a917f;
  --gold: #d4a64a; --gold-soft: #d4a64a22; --ok: #5fbf7a; --idle: #c9a227; --off: #6b655a; --bad: #e0634f;
  --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
h1 { font: 600 22px/1.2 Georgia, "EB Garamond", serif; color: var(--gold); margin: 0; letter-spacing: .02em; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.sub { color: var(--dim); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 160px; }
input[type=text], select { background: #0c0b0a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
input[type=text]:focus, select:focus { outline: 1px solid var(--gold); }
input.name { font-weight: 600; font-size: 16px; width: 100%; background: transparent; border-color: transparent; padding-left: 0; }
input.name:hover, input.name:focus { border-color: var(--line); padding-left: 9px; }
button { background: #24211c; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.online { background: var(--ok); } .idle { background: var(--idle); } .offline { background: var(--off); } .disabled { background: var(--bad); }
.status { font-size: 13px; color: var(--dim); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; margin: 10px 0 4px; font-size: 13px; color: var(--dim); }
.meta b { color: var(--text); font-weight: 500; }
.link { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.link code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12.5px var(--mono); background: #0c0b0a; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; color: var(--dim); }
.link span { width: 92px; flex: none; font-size: 12px; color: var(--dim); }
details { margin-top: 10px; } summary { cursor: pointer; color: var(--gold); font-size: 13px; }
.tools { columns: 220px; column-gap: 18px; margin-top: 8px; font-size: 13px; }
.tools label { display: block; break-inside: avoid; padding: 2px 0; }
.tag { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--gold-soft); color: var(--gold); margin-left: 4px; }
.tag.w { background: #e0634f22; color: var(--bad); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #1a1408; padding: 7px 14px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.empty { color: var(--dim); text-align: center; padding: 30px; }
@media (max-width: 560px) { .link span { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>WOTR MCP keys</h1><div class="sub" id="summary">loading…</div></div>
    <div class="sub">This page is only reachable from this PC.</div>
  </header>

  <div class="card">
    <div class="row">
      <input type="text" id="new-name" class="grow" placeholder="Name, e.g. Gorgi's Claude">
      <select id="new-preset"></select>
      <button class="primary" id="new-btn">Create key</button>
    </div>
    <div class="sub" style="margin-top:6px" id="preset-help"></div>
  </div>

  <div id="keys"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const HELP = {
  "full": "Every tool, writes included (archive, wiki, ledger, git pushes).",
  "core": "The writing core: rules, wiki, scenes, verify, the table, archiving.",
  "read-only": "Reads only: rules, wiki, cards, scenes, verify. Nothing it calls changes the repo.",
  "custom": "Exactly the tools you tick below the key."
};
let S = null, openTools = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) { toast(await r.text()); throw new Error(r.status); }
  const t = await r.text();
  try { return JSON.parse(t); } catch { return t; }
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1600); }
function ago(t) {
  if (!t) return "never";
  const s = S.now - t;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return new Date(t * 1000).toLocaleDateString();
}
function status(k) {
  if (!k.enabled) return ["disabled", "disabled"];
  if (k.online) return ["online", `online · ${k.sessions} session${k.sessions === 1 ? "" : "s"}`];
  if (k.sessions > 0) return ["idle", `idle · ${k.sessions} session${k.sessions === 1 ? "" : "s"} open`];
  return ["offline", "offline"];
}
function copy(text, what) { navigator.clipboard.writeText(text).then(() => toast(what + " copied")); }

function keyCard(k) {
  const [cls, label] = status(k);
  const toolCount = k.preset === "custom" ? k.tools.length : S.tools.filter(t => k.preset === "full" || (t.core && (k.preset === "core" || t.read_only))).length;
  const tools = S.tools.map(t => `<label><input type="checkbox" data-tool="${esc(t.name)}" ${k.tools.includes(t.name) ? "checked" : ""}> ${esc(t.name)}${t.read_only ? "" : '<span class="tag w">writes</span>'}</label>`).join("");
  return `<div class="card" data-id="${k.id}">
    <div class="row">
      <span class="dot ${cls}" title="${label}"></span>
      <div class="grow"><input type="text" class="name" value="${esc(k.name)}" data-act="name"></div>
      <select data-act="preset">${S.presets.map(p => `<option ${p === k.preset ? "selected" : ""}>${p}</option>`).join("")}</select>
      <button data-act="toggle">${k.enabled ? "Disable" : "Enable"}</button>
      <button data-act="rotate" class="danger">Rotate</button>
      <button data-act="delete" class="danger">Delete</button>
    </div>
    <div class="meta">
      <div>Status <b>${label}</b></div>
      <div>Last used <b>${ago(k.last_used)}</b></div>
      <div>Calls <b>${k.calls}</b></div>
      <div>Last IP <b>${esc(k.last_ip || "none")}</b></div>
      <div>Tools <b>${toolCount}</b></div>
      <div>Created <b>${new Date(k.created * 1000).toLocaleDateString()}</b></div>
    </div>
    <div class="link"><span>Connector URL</span><code>${esc(k.mcp_url.replace(k.token, "•".repeat(12)))}</code><button data-copy="mcp_url">Copy</button></div>
    <div class="link"><span>With a header</span><code>${esc(k.header_url)} · Authorization: Bearer •••</code><button data-copy="header">Copy</button></div>
    <div class="link"><span>Token</span><code>${esc(k.token.slice(0, 6))}${"•".repeat(20)}</code><button data-copy="token">Copy</button></div>
    <div class="link"><span>Audio</span><code>${esc(k.audio_url.replace(k.token, "•".repeat(12)))}</code><button data-copy="audio_url">Copy</button></div>
    ${k.preset === "custom" ? `<details ${openTools.has(k.id) ? "open" : ""} data-act="details"><summary>Tools this key can call (${k.tools.length})</summary><div class="tools">${tools}</div></details>` : ""}
  </div>`;
}

function render() {
  const on = S.keys.filter(k => k.online).length;
  $("#summary").textContent = `${S.keys.length} key${S.keys.length === 1 ? "" : "s"} · ${on} online · links point at ${S.base}`;
  const focused = document.activeElement && document.activeElement.closest(".card[data-id]");
  if (focused && document.activeElement.matches("input.name")) return; // don't clobber a rename in progress
  $("#keys").innerHTML = S.keys.length ? S.keys.map(keyCard).join("") : '<div class="empty">No keys yet. Create one above.</div>';
}
// redraw only when a key changed (or once a minute for the "ago" times), so a poll never
// swaps the page out from under a click
let sig = "", drawn = 0;
async function load(force) {
  S = await api("GET", "/api/state");
  const now = JSON.stringify(S.keys);
  if (force === true || now !== sig || S.now - drawn >= 60) { sig = now; drawn = S.now; render(); }
}

$("#new-preset").innerHTML = ["read-only", "core", "full", "custom"].map(p => `<option>${p}</option>`).join("");
const help = () => $("#preset-help").textContent = HELP[$("#new-preset").value];
$("#new-preset").onchange = help; help();
$("#new-btn").onclick = async () => {
  const name = $("#new-name").value.trim() || "New key";
  const k = await api("POST", "/api/keys", { name, preset: $("#new-preset").value, tools: [] });
  $("#new-name").value = "";
  if (k.preset === "custom") openTools.add(k.id);
  toast("key created"); await load(true);
};

$("#keys").addEventListener("click", async e => {
  const card = e.target.closest(".card[data-id]"); if (!card) return;
  const id = card.dataset.id, k = S.keys.find(x => x.id === id);
  const c = e.target.dataset.copy;
  if (c === "header") return copy(`URL: ${k.header_url}\nAuthorization: Bearer ${k.token}`, "header setup");
  if (c) return copy(k[c], c === "token" ? "token" : "link");
  const act = e.target.dataset.act;
  if (act === "toggle") { await api("PATCH", `/api/keys/${id}`, { enabled: !k.enabled }); toast(k.enabled ? "disabled; its sessions ended" : "enabled"); }
  else if (act === "rotate") { if (!confirm(`Rotate the token for "${k.name}"? Its old links stop working at once.`)) return; await api("POST", `/api/keys/${id}/rotate`); toast("new token; copy the new link"); }
  else if (act === "delete") { if (!confirm(`Delete "${k.name}"? Anyone using it is cut off.`)) return; await api("DELETE", `/api/keys/${id}`); toast("deleted"); }
  else return;
  await load(true);
});
$("#keys").addEventListener("change", async e => {
  const card = e.target.closest(".card[data-id]"); if (!card) return;
  const id = card.dataset.id;
  if (e.target.dataset.act === "name") { await api("PATCH", `/api/keys/${id}`, { name: e.target.value }); toast("renamed"); e.target.blur(); }
  else if (e.target.dataset.act === "preset") { if (e.target.value === "custom") openTools.add(id); await api("PATCH", `/api/keys/${id}`, { preset: e.target.value }); toast("permissions saved"); }
  else if (e.target.dataset.tool) {
    const tools = [...card.querySelectorAll("[data-tool]:checked")].map(x => x.dataset.tool);
    await api("PATCH", `/api/keys/${id}`, { tools }); toast("permissions saved");
  } else return;
  await load();
});
$("#keys").addEventListener("toggle", e => {
  const card = e.target.closest(".card[data-id]"); if (!card || e.target.dataset.act !== "details") return;
  e.target.open ? openTools.add(card.dataset.id) : openTools.delete(card.dataset.id);
}, true);
$("#keys").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input.name")) e.target.blur(); });

load(); setInterval(load, 5000);
</script>
</body>
</html>

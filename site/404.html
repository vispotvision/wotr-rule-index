<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Road Ends · War of the Realms</title>
<link rel="icon" href="/wotr-rule-index/static/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Crimson+Pro:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0d0a07; --gold: #d8ab4f; --text: #efe2c4; --muted: #b9a583; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: linear-gradient(180deg, rgba(13,10,7,.55), rgba(13,10,7,.92)), url(/wotr-rule-index/assets/northern-shield.webp) center / cover no-repeat, var(--ink);
    color: var(--text); font-family: 'Crimson Pro', Georgia, serif; text-align: center;
  }
  main { max-width: 34rem; }
  .mark { color: var(--gold); letter-spacing: .4em; font-size: .8rem; }
  h1 {
    font-family: 'Cormorant Garamond', Garamond, serif; font-weight: 700; font-size: clamp(2.4rem, 8vw, 4rem); margin: .6rem 0 .4rem;
    background: linear-gradient(180deg, #fff1cf, #e7bd62 55%, #b07a24); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 1.2rem; font-style: italic; color: var(--text); line-height: 1.6; }
  nav { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; margin-top: 1.6rem; }
  a {
    font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .95rem;
    color: var(--gold); text-decoration: none; padding: .7rem 1.3rem; border: 1px solid rgba(216,171,79,.6); border-radius: 4px;
    background: rgba(13,10,7,.5); transition: background .2s, color .2s;
  }
  a:hover { background: var(--gold); color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="mark">◆ WAR OF THE REALMS ◆</div>
  <h1>The Road Ends Here</h1>
  <p>Whatever stood on this spot has been moved, renamed or struck from the register. The cold keeps the dead quiet; it keeps old links quiet too.</p>
  <nav>
    <a href="/wotr-rule-index/">The Front Gate</a>
    <a href="/wotr-rule-index/start-here">Start Here</a>
    <a href="/wotr-rule-index/every-page">Every Page</a>
  </nav>
</main>
</body>
</html>

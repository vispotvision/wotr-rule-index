# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: War of the Realms
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: vispotvision.github.io/wotr-rule-index
  ignorePatterns:
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Cormorant Garamond
      body: Crimson Pro
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f5eedf"
        lightgray: "#e3d7bf"
        gray: "#a3916f"
        darkgray: "#3a3026"
        dark: "#1c1510"
        secondary: "#8a5a12"
        tertiary: "#b5832e"
        highlight: rgba(181, 131, 46, 0.12)
        textHighlight: "#e9c46a66"
      darkMode:
        light: "#100d0a"
        lightgray: "#2b241c"
        gray: "#7a6a54"
        darkgray: "#dcd0bb"
        dark: "#f4e7c8"
        secondary: "#d8ab4f"
        tertiary: "#f0c96b"
        highlight: rgba(216, 171, 79, 0.10)
        textHighlight: "#d8ab4f44"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: absolute
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: selfHosted
      title: Cormorant Garamond
      header: Cormorant Garamond
      body: Crimson Pro
      code: JetBrains Mono
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: The Realms
      sortFn: |
        (a, b) => {
              const O = ["Start Here", "A Reader", "Who", "The Magic System", "Races & Peoples", "Factions, Bloodlines", "Geography & the Four", "Cosmology & Metaphysics", "Lore & History", "The War Cycle", "The Bestiary", "Materials, Alchemy", "Every Page", "First Steps", "The Foundations", "The Soul and the Climb", "Power in Use", "Practice and Institution", "Reference and Craft", "Fracture of Worlds", "How Magic Works", "The Measures at a Glance", "One Exchange", "The Core Vocabulary", "The Physical Account", "The Eight Families", "The Master Glyph", "The Descent of Parun", "The Trait System", "The Four Paths", "The Sixteen Stages", "The Ladder and the Draft", "Tier Grade", "Release Forms", "The Color of Essence", "Reinforcement", "Stacking and Spending", "Runes and Tags", "The Four Crafts", "Counterplay", "The Gate", "The Derivation", "The Standing and the Title", "Training and Sects", "The Imperial Age", "On Walking", "Mechanica", "Factions at a Glance", "Powers and Polities", "Houses and Bloodlines", "Orders, Faiths", "I. ", "II. ", "III. ", "IV. ", "V. ", "VI. ", "VII. ", "VIII. ", "IX. ", "X. "];
              const r = (n) => { const d = n.displayName || ""; const i = O.findIndex((o) => d.startsWith(o)); return i < 0 ? 999 : i; };
              const d = r(a) - r(b);
              if (d) return d;
              if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
              return (a.displayName || "").localeCompare(b.displayName || "", undefined, { numeric: true, sensitivity: "base" });
            }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Home: https://vispotvision.github.io/wotr-rule-index/
        Start Here: https://vispotvision.github.io/wotr-rule-index/start-here
        Every Page: https://vispotvision.github.io/wotr-rule-index/every-page
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}

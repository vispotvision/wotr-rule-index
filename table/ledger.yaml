  category: debts
  who: Xanelor Rafiminar
  text: His Omoro recurve, the blackwood bow built for island weather, split through the upper limb at
    the overdraw and hangs in two pieces joined by the string. He has no bow. Replacing it means an Academy
    bowyer, a debt to someone, or going without.
  opened: '2026-09-22'
  opened_session: 1
  due: Before the Class X Open Tournament. An archer with no bow is a masked boy with a dagger.
  status: open
- id: L032
  category: who knows what
  who: Xanelor Rafiminar
  text: All of Class X watched Xanelor, recorded at intake as "no detectable pressure" (underlined), raise
    raw essence pressure hard enough to crack the arena ward and throw a supersonic arrow. Every student
    now knows the masked boy with no Crystal is not the soft bracket. Naori saw his thread go from ending
    at his own feet to one committed line; Dabney recognised unsuppressed pressure from the inside; Mu-jin
    saw him break a constellation net at its anchor points and cannot tell whether the boy ever read the
    book that describes it.
  opened: '2026-09-22'
  opened_session: 1
  due: When the tournament bracket is seeded, or when anyone at the Academy re-examines his intake sheet.
  status: open

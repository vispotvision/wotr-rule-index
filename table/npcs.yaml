- name: Josse Osricsson
  thread: Kwon Mu-jin
  want: 'His Academy bow-contract renewed at the Ice-out audit, which means a clean book: every bow on
    the Academy''s roll repaired, or written off with a signature against it. Xanelor''s split Omoro recurve
    is a bow on nobody''s roll — island-built, never proofed by him, now broken on Academy sand — and
    until it is entered as something his book is not clean.'
  refusal_line: '"I''ll build you anything. I''ll not put my name on a thing I didn''t bend myself." He
    signed a bow as proofed once, young, on a master''s word, and a boy on a practice floor took the limb
    through the forearm. He will not sign again.'
  knows:
  - The Omoro limb did not fail at the overdraw. It failed where the blackwood had already dried out of
    true, and he can put a thumb on the line. Xanelor's bow was dying before the duel — which changes
    whether the overdraw was reckless (L031).
  - There is no blackwood at the Academy and none coming before Ice-out. Anything he builds in seven days
    is yew-and-horn and will not hold Xanelor's draw weight.
  - A Class S student came to his counter and asked, politely, which Class X bows were on the repair shelf.
    He answered, because it was a civil question. (The Class Below tick, from the inside.)
  lied_about:
  - 'Says the Academy bought the Omoro recurve in and it has been on the roll since spring. He believes
    it: a clerk entered it that way to keep the intake tidy. Uncorrected until someone reads the intake
    sheet — the same failure mode as L032.'
  last_seen: Not yet on the page. Built for the Class Below tick and L031 (WAR-95, 2026-09-25). Northern
    register, unchartered family, so a live patronymic and disambiguation by trade — the Academy roll
    writes him Josse Bowyer (Inner World Naming Amendment II).
  voice: 'Notices hands first, then the grain of whatever a person is leaning on. Short sentences and
    he finishes them; never trails off. Heads a sentence with "Right." as a door closing on the last topic.
    Fixed saying: "Wood tells you twice" (NOT from a ratified Standing Inventory — no desktop/inventories
    file covers this culture; flagged for Isaac). Never calls a weapon good or bad; says it holds or it
    does not. Gloss rights: diagnostic only — he may name what a limb is doing, because that is his trade,
    and nothing else. Swap test: not Mu-jin (who explains), not Frithia (who commands), not Xanelor (who
    reads before he speaks). No line — not a practitioner.'
  last_updated: '2026-09-25'
- name: Lei Yanshu
  thread: Kwon Mu-jin
  want: A Class X seat before the Ice-out audit — specifically the seat the Academy will have to vacate
    if a Class X student cannot take the tournament floor. Not the designation. She wants to be measured
    in the bracket where measurement counts, because her lineage's answer to every question is the book
    and she has worked out that the book does not have her in it yet.
  refusal_line: '"I will not write a figure I did not take." She will withhold a number, sit on it, decline
    to hand it over — but she will not shade one, round one her way, or sign another hand''s reading.
    Her lineage entered a figure wrong in a hall ledger once, a house lost a contract over it, and she
    was made to copy the corrected page out eleven times.'
  knows:
  - 'What Xanelor''s arrow did to the arena ward, at the anchor, in her own hand: she was in the gallery
    with a bracket-glass. Nobody else at the Academy has that number, and L033 asks who answers for the
    arena.'
  - Xanelor has no bow and the Academy bowyer has no blackwood before Ice-out.
  - That she does not know whether Xanelor has a Soul Crystal — and she has recorded that she does not
    know. She is the one person at the Academy treating his intake sheet as an open question rather than
    a settled one (L032).
  lied_about:
  - Says Class S's own instructor sent her to take the assessment. Nobody sent her; she came on her own
    and wrote the order slip herself, and she knows it. Uncorrected until someone asks that instructor.
  last_seen: 'Not yet on the page. Built as the actor of the Class Below tick (WAR-95, 2026-09-25). Fourteen,
    Class S, uncapped, so no courtesy name yet and the class uses her given name — Chinese lineage-hall
    register, a Measurewright family, per Inner World Naming Amendment II and III. NEW NAME, not previously
    in canon: flagged for Isaac to overturn.'
  voice: 'Notices what a thing measures, then who is watching her take it. Medium, complete sentences
    with a number in most of them; restates a question before answering it, to be sure of the terms. Discourse
    marker: "To be exact —", then a figure. Never says "I think"; says "I have" or "I have not" measured
    it. No fixed saying from a ratified Standing Inventory — none exists for this culture (flagged for
    Isaac). Gloss rights: yes — a Measurewright lineage''s child in diagnostic voice may name Categories
    and figures, and she works it to the edge of R13-A and R14-D. Swap test: not Naori (threads, not figures),
    not Dabney, not Mu-jin (who teaches rather than records). LINE NOT SET: Band I — Mortal Foundation
    (1–100) by cohort placement, the band Xanelor Rafiminar''s card states for this class; Level, Stage,
    Path, Essence Family and Aether Class are null, no source. Counterplay: everything she holds is a
    measurement, so a false measurement is the whole of the counter. Tell: she must get a glass or a hand
    onto a thing before she will commit a figure to the slip.'
  last_updated: '2026-09-25'

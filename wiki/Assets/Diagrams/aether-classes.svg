<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"><defs><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#5a5048"/><stop offset=".45" stop-color="#d8ab4f"/><stop offset=".8" stop-color="#fff2c4"/><stop offset="1" stop-color="#ffffff"/></linearGradient><filter id="bl7"><feGaussianBlur stdDeviation="5"/></filter></defs><defs><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#110d09"/></radialGradient></defs><rect width="1000" height="560" rx="14" fill="url(#glow)"/><rect x="8" y="8" width="984" height="544" rx="10" fill="none" stroke="#d8ab4f" stroke-opacity=".45"/><text x="500.0" y="58" text-anchor="middle" fill="#d8ab4f" font-size="34" font-weight="600" letter-spacing="3">THE SEVEN CLASSES</text><text x="500.0" y="88" text-anchor="middle" fill="#a8957a" font-size="19" font-style="italic" font-family="'Crimson Pro', Georgia, serif">How cleanly the Aether Shell conducts: clarity, not size</text><path d="M380.0 100 L488.0 100 M512.0 100 L620.0 100" stroke="#d8ab4f" stroke-opacity=".5"/><polygon points="500.0,94 506.0,100 500.0,106 494.0,100" fill="#d8ab4f"/><line x1="60" y1="300" x2="950" y2="300" stroke="url(#beam)" stroke-width="10" filter="url(#bl7)" opacity=".8"/><line x1="60" y1="300" x2="950" y2="300" stroke="url(#beam)" stroke-width="3"/><polygon points="90,260 120,300 90,340 60,300" fill="#5a5048" fill-opacity=".9" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="90,260 120,300 90,300" fill="#ffffff" fill-opacity=".18"/><text x="90" y="307" font-size="20" fill="#fff4dc" text-anchor="middle" font-weight="700" >Ø</text><text x="90" y="372" font-size="18" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="1.5">DORMANT</text><text x="90" y="394" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >sealed</text><polygon points="250,260 280,300 250,340 220,300" fill="#8a6a4a" fill-opacity=".9" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="250,260 280,300 250,300" fill="#ffffff" fill-opacity=".18"/><text x="250" y="307" font-size="20" fill="#fff4dc" text-anchor="middle" font-weight="700" >I</text><text x="250" y="372" font-size="18" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="1.5">MURIDIC</text><text x="250" y="394" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >awakening</text><polygon points="410,260 440,300 410,340 380,300" fill="#b0904f" fill-opacity=".9" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="410,260 440,300 410,300" fill="#ffffff" fill-opacity=".18"/><text x="410" y="307" font-size="20" fill="#fff4dc" text-anchor="middle" font-weight="700" >II</text><text x="410" y="372" font-size="18" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="1.5">HARMONIC</text><text x="410" y="394" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >attuned</text><polygon points="570,260 600,300 570,340 540,300" fill="#d8ab4f" fill-opacity=".9" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="570,260 600,300 570,300" fill="#ffffff" fill-opacity=".18"/><text x="570" y="307" font-size="20" fill="#1a120a" text-anchor="middle" font-weight="700" >III</text><text x="570" y="372" font-size="18" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="1.5">RESONANT</text><text x="570" y="394" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >conductor</text><polygon points="760,260 790,300 760,340 730,300" fill="#fff0c0" fill-opacity=".9" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="760,260 790,300 760,300" fill="#ffffff" fill-opacity=".18"/><text x="760" y="307" font-size="20" fill="#1a120a" text-anchor="middle" font-weight="700" >V</text><text x="760" y="372" font-size="18" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="1.5">RADIANT</text><text x="760" y="394" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >world-bending</text><polygon points="920,260 950,300 920,340 890,300" fill="#ffffff" fill-opacity=".9" stroke="#d8ab4f" stroke-width="1.6"/><polygon points="920,260 950,300 920,300" fill="#ffffff" fill-opacity=".18"/><text x="920" y="307" font-size="20" fill="#1a120a" text-anchor="middle" font-weight="700" >Ω</text><text x="920" y="372" font-size="18" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="1.5">ABSOLUTE</text><text x="920" y="394" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >threshold</text><path d="M570 300 Q618 220 665 176" fill="none" stroke="#d8ab4f" stroke-width="1.6" stroke-dasharray="5 6" stroke-opacity=".8"/><path d="M760 300 Q712 220 665 176" fill="none" stroke="#d8ab4f" stroke-width="1.6" stroke-dasharray="5 6" stroke-opacity=".8"/><polygon points="665,104 692,140 665,176 638,140" fill="#bfe6ff" stroke="#d8ab4f" stroke-width="1.8"/><text x="665" y="147" font-size="18" fill="#1a120a" text-anchor="middle" font-weight="700" >IV</text><text x="713" y="138" font-size="18" fill="#bfe6ff" text-anchor="start" font-weight="700" letter-spacing="1.5">LUMINOUS</text><text x="713" y="160" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >lucid, the Shell&#x27;s own peak</text><text x="713" y="178" font-size="15" fill="#a8957a" text-anchor="start" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >a side branch, not a step</text><path d="M570 300 Q618 380 665 424" fill="none" stroke="#d8ab4f" stroke-width="1.6" stroke-dasharray="5 6" stroke-opacity=".8"/><path d="M760 300 Q712 380 665 424" fill="none" stroke="#d8ab4f" stroke-width="1.6" stroke-dasharray="5 6" stroke-opacity=".8"/><polygon points="665,424 692,460 665,496 638,460" fill="#3a1d55" stroke="#c89bff" stroke-width="1.8"/><text x="665" y="467" font-size="18" fill="#e9d6ff" text-anchor="middle" font-weight="700" >VI</text><text x="713" y="458" font-size="18" fill="#c89bff" text-anchor="start" font-weight="700" letter-spacing="1.5">VOIDIC</text><text x="713" y="480" font-size="15" fill="#f1e4c6" text-anchor="start" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >inverted polarity</text><text x="713" y="498" font-size="15" fill="#a8957a" text-anchor="start" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >a side branch, not a step</text><text x="500.0" y="532" font-size="15.5" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >Class I loses a third of every spend as heat and noise; Class III loses a tenth; Class V gives back more than it takes.</text></svg>
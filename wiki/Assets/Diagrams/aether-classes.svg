-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Stage sets the ceiling and practice climbs to it. Thread has no Stage climb: a grip by blood or blessing, plus decades.</text><text x="500.0" y="652" font-size="15" fill="#a8957a" text-anchor="middle" font-style="italic" font-family="'Crimson Pro', Georgia, serif">VI is an inverted way of holding that power. A Class is another thing: the name a soul offers from Glory on, with no ladder of its own.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"><defs><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#110d09"/></radialGradient></defs><rect width="1000" height="660" rx="14" fill="url(#glow)"/><rect x="8" y="8" width="984" height="644" rx="10" fill="none" stroke="#d8ab4f" stroke-opacity=".45"/><text x="500.0" y="58" text-anchor="middle" fill="#d8ab4f" font-size="34" font-weight="600" letter-spacing="3">THE THREE RELEASES</text><text x="500.0" y="88" text-anchor="middle" fill="#a8957a" font-size="19" font-style="italic" font-family="'Crimson Pro', Georgia, serif">The soul’s standing law let off its limit, in a learned shape</text><path d="M380.0 100 L488.0 100 M512.0 100 L620.0 100" stroke="#d8ab4f" stroke-opacity=".5"/><polygon points="500.0,94 506.0,100 500.0,106 494.0,100" fill="#d8ab4f"/><rect x="50" y="210" width="280" height="410" rx="12" fill="#d8ab4f" fill-opacity="0.05" stroke="#d8ab4f" stroke-opacity=".55"/><circle cx="190" cy="290" r="18" fill="none" stroke="#d8ab4f" stroke-opacity="0.85" stroke-width="2.4"/><polygon points="190,279 198,290 190,301 182,290" fill="#fff2c4"/><text x="190" y="380" font-size="26" fill="#d8ab4f" text-anchor="middle" font-weight="600" >First Release</text><text x="190" y="404" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >From Stage IV · Flourishing</text><text x="190" y="432" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="600" letter-spacing="3">THE BODY</text><text x="190" y="458" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >One signature change to the</text><text x="190" y="477" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >body or the weapon.</text><text x="190" y="505" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The Trait strikes at the top</text><text x="190" y="524" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >of its Grade.</text><text x="190" y="552" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >Spent and shaking; the pain</text><text x="190" y="571" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >arrives.</text><rect x="360" y="170" width="280" height="450" rx="12" fill="#d8ab4f" fill-opacity="0.09" stroke="#d8ab4f" stroke-opacity=".55"/><circle cx="500" cy="250" r="18" fill="none" stroke="#d8ab4f" stroke-opacity="0.85" stroke-width="2.4"/><circle cx="500" cy="250" r="36" fill="none" stroke="#d8ab4f" stroke-opacity="0.63" stroke-width="1.9"/><polygon points="500,239 508,250 500,261 492,250" fill="#fff2c4"/><text x="500" y="340" font-size="26" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Second Release</text><text x="500" y="364" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >From Stage VII · Refraction</text><text x="500" y="392" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="600" letter-spacing="3">THE FIELD</text><text x="500" y="418" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The change spreads into the</text><text x="500" y="437" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >ground around them; the Domain</text><text x="500" y="456" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >opens.</text><text x="500" y="484" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >Inside the field, one full</text><text x="500" y="503" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >Grade higher.</text><text x="500" y="531" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The Crystal runs Overgrown</text><text x="500" y="550" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >until a full night’s sleep.</text><rect x="670" y="130" width="280" height="490" rx="12" fill="#d8ab4f" fill-opacity="0.13" stroke="#d8ab4f" stroke-opacity=".55"/><circle cx="810" cy="210" r="18" fill="none" stroke="#d8ab4f" stroke-opacity="0.85" stroke-width="2.4"/><circle cx="810" cy="210" r="36" fill="none" stroke="#d8ab4f" stroke-opacity="0.63" stroke-width="1.9"/><circle cx="810" cy="210" r="54" fill="none" stroke="#d8ab4f" stroke-opacity="0.41" stroke-width="1.4"/><polygon points="810,199 818,210 810,221 802,210" fill="#fff2c4"/><text x="810" y="300" font-size="26" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Third Release</text><text x="810" y="324" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >From Stage IX · Invocation</text><text x="810" y="352" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="600" letter-spacing="3">THE LAW</text><text x="810" y="378" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >A field that can hold other</text><text x="810" y="397" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >fields inside it.</text><text x="810" y="425" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The Trait’s effect becomes</text><text x="810" y="444" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >local law, two Grades over</text><text x="810" y="463" font-size="15" fill="#f0d48a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >base.</text><text x="810" y="491" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >Held past the limit, the Trait</text><text x="810" y="510" font-size="15" fill="#a8957a" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >itself may fail.</text></svg>
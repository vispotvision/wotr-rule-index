<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"><defs><linearGradient id="res" x1="0" x2="1"><stop offset="0" stop-color="#d8ab4f"/><stop offset=".55" stop-color="#b3742a"/><stop offset=".85" stop-color="#7a3a1e"/><stop offset="1" stop-color="#3a1712"/></linearGradient></defs><defs><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#110d09"/></radialGradient></defs><rect width="1000" height="520" rx="14" fill="url(#glow)"/><rect x="8" y="8" width="984" height="504" rx="10" fill="none" stroke="#d8ab4f" stroke-opacity=".45"/><text x="500.0" y="58" text-anchor="middle" fill="#d8ab4f" font-size="34" font-weight="600" letter-spacing="3">READING THE RESERVE</text><text x="500.0" y="88" text-anchor="middle" fill="#a8957a" font-size="19" font-style="italic" font-family="'Crimson Pro', Georgia, serif">The body tells on the reserve, and the ladder is the same for everyone</text><path d="M380.0 100 L488.0 100 M512.0 100 L620.0 100" stroke="#d8ab4f" stroke-opacity=".5"/><polygon points="500.0,94 506.0,100 500.0,106 494.0,100" fill="#d8ab4f"/><rect x="70" y="150" width="860" height="26" rx="13" fill="url(#res)" stroke="#d8ab4f" stroke-opacity=".7"/><line x1="70" y1="140" x2="70" y2="186" stroke="#f1e4c6" stroke-width="2"/><path d="M70 186 L155 232" stroke="#d8ab4f" stroke-opacity=".35" fill="none"/><circle cx="155" cy="262" r="26" fill="#d8ab4f" fill-opacity="0.50" stroke="#d8ab4f" stroke-opacity="1.00" stroke-width="3" /><circle cx="155" cy="262" r="9" fill="#fff2c4" fill-opacity="1.00"/><text x="155" y="320" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Full</text><text x="155" y="348" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The aura bright in</text><text x="155" y="368" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >its own colour;</text><text x="155" y="388" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >breath easy.</text><line x1="500.0" y1="140" x2="500.0" y2="186" stroke="#f1e4c6" stroke-width="2"/><path d="M500.0 186 L335 232" stroke="#d8ab4f" stroke-opacity=".35" fill="none"/><circle cx="335" cy="262" r="26" fill="#d8ab4f" fill-opacity="0.35" stroke="#d8ab4f" stroke-opacity="0.70" stroke-width="3" /><circle cx="335" cy="262" r="9" fill="#fff2c4" fill-opacity="0.70"/><text x="335" y="320" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Half</text><text x="335" y="348" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >Breath shortens and</text><text x="335" y="368" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >stays short. The aura</text><text x="335" y="388" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >dims, as if a hand</text><text x="335" y="408" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >cupped the lamp.</text><line x1="715.0" y1="140" x2="715.0" y2="186" stroke="#f1e4c6" stroke-width="2"/><path d="M715.0 186 L515 232" stroke="#d8ab4f" stroke-opacity=".35" fill="none"/><circle cx="515" cy="262" r="26" fill="#d8ab4f" fill-opacity="0.23" stroke="#d8ab4f" stroke-opacity="0.45" stroke-width="3" /><circle cx="515" cy="262" r="9" fill="#fff2c4" fill-opacity="0.45"/><text x="515" y="320" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >A quarter</text><text x="515" y="348" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >A tremor in the hands</text><text x="515" y="368" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >and knees. The colour</text><text x="515" y="388" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >thins toward grey;</text><text x="515" y="408" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >the edges fray.</text><line x1="844.0" y1="140" x2="844.0" y2="186" stroke="#f1e4c6" stroke-width="2"/><path d="M844.0 186 L695 232" stroke="#d8ab4f" stroke-opacity=".35" fill="none"/><circle cx="695" cy="262" r="26" fill="#d8ab4f" fill-opacity="0.12" stroke="#d8ab4f" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="4 4"/><circle cx="695" cy="262" r="9" fill="#fff2c4" fill-opacity="0.25"/><text x="695" y="320" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >A tenth</text><text x="695" y="348" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The aura flickers</text><text x="695" y="368" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >like a lamp on a</text><text x="695" y="388" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >failing main. Traits</text><text x="695" y="408" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >stutter: late, half,</text><text x="695" y="428" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >or not at all.</text><line x1="930.0" y1="140" x2="930.0" y2="186" stroke="#f1e4c6" stroke-width="2"/><path d="M930.0 186 L875 232" stroke="#d8ab4f" stroke-opacity=".35" fill="none"/><circle cx="875" cy="262" r="26" fill="#d8ab4f" fill-opacity="0.04" stroke="#d8ab4f" stroke-opacity="0.08" stroke-width="3" stroke-dasharray="4 4"/><circle cx="875" cy="262" r="9" fill="#fff2c4" fill-opacity="0.08"/><text x="875" y="320" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="600" >Starvation</text><text x="875" y="348" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The coat fails and</text><text x="875" y="368" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >the base stats sag.</text><text x="875" y="388" font-size="15" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >The Shell degrades.</text><text x="500.0" y="492" font-size="16" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >Maxing out shows heat first, then blood, then a cracking aura. Waste is loud and hot; mastery is quiet.</text></svg>
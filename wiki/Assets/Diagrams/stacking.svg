<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"><defs><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#110d09"/></radialGradient></defs><rect width="1000" height="660" rx="14" fill="url(#glow)"/><rect x="8" y="8" width="984" height="644" rx="10" fill="none" stroke="#d8ab4f" stroke-opacity=".45"/><text x="500.0" y="58" text-anchor="middle" fill="#d8ab4f" font-size="34" font-weight="600" letter-spacing="3">STACKING</text><text x="500.0" y="88" text-anchor="middle" fill="#a8957a" font-size="19" font-style="italic" font-family="'Crimson Pro', Georgia, serif">Every boost of one’s own counts toward a single cap: two Grades over sustainable</text><path d="M380.0 100 L488.0 100 M512.0 100 L620.0 100" stroke="#d8ab4f" stroke-opacity=".5"/><polygon points="500.0,94 506.0,100 500.0,106 494.0,100" fill="#d8ab4f"/><rect x="90" y="520" width="520" height="58" rx="8" fill="#5a4630" fill-opacity=".85" stroke="#d8ab4f" stroke-opacity=".5"/><text x="114" y="546" font-size="21" fill="#fff6e0" text-anchor="start" font-weight="600" >Base stats</text><text x="114" y="567" font-size="15" fill="#fbecd0" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >the body’s passive floor, always on</text><rect x="100" y="456" width="500" height="58" rx="8" fill="#7a5a30" fill-opacity=".85" stroke="#d8ab4f" stroke-opacity=".5"/><text x="124" y="482" font-size="21" fill="#fff6e0" text-anchor="start" font-weight="600" >The coat</text><text x="124" y="503" font-size="15" fill="#fbecd0" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >active reinforcement, bought with reserve</text><rect x="110" y="392" width="480" height="58" rx="8" fill="#94702f" fill-opacity=".85" stroke="#d8ab4f" stroke-opacity=".5"/><text x="134" y="418" font-size="21" fill="#fff6e0" text-anchor="start" font-weight="600" >Focus</text><text x="134" y="439" font-size="15" fill="#fbecd0" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >the coat gathered to one place: +1 Grade there</text><rect x="120" y="328" width="460" height="58" rx="8" fill="#b0852f" fill-opacity=".85" stroke="#d8ab4f" stroke-opacity=".5"/><text x="144" y="354" font-size="21" fill="#fff6e0" text-anchor="start" font-weight="600" >A vow</text><text x="144" y="375" font-size="15" fill="#fbecd0" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >to the top of the band; a great vow, one Grade</text><rect x="130" y="264" width="440" height="58" rx="8" fill="#c99a3a" fill-opacity=".85" stroke="#d8ab4f" stroke-opacity=".5"/><text x="154" y="290" font-size="21" fill="#fff6e0" text-anchor="start" font-weight="600" >A release</text><text x="154" y="311" font-size="15" fill="#fbecd0" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >First to the top, Second +1, Third +2 for one effect</text><rect x="140" y="200" width="420" height="58" rx="8" fill="#e0b04f" fill-opacity=".85" stroke="#d8ab4f" stroke-opacity=".5"/><text x="164" y="226" font-size="21" fill="#fff6e0" text-anchor="start" font-weight="600" >A Draft or an overchannel</text><text x="164" y="247" font-size="15" fill="#fbecd0" text-anchor="start" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >as graded; overchannel always damages</text><line x1="60" y1="190" x2="640" y2="190" stroke="#e2603a" stroke-width="2.5" stroke-dasharray="9 6"/><text x="64" y="180" font-size="15" fill="#f0906a" text-anchor="start" font-weight="700" letter-spacing="2">THE CAP · +2 GRADES OVER SUSTAINABLE</text><rect x="680" y="200" width="270" height="250" rx="12" fill="#14918c" fill-opacity=".14" stroke="#3fd0c0" stroke-opacity=".7"/><text x="815" y="236" font-size="24" fill="#7fe6da" text-anchor="middle" font-weight="600" >Help from outside</text><text x="815" y="270" font-size="17" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >An ally’s working, a standing</text><text x="815" y="294" font-size="17" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >array, a Domain someone</text><text x="815" y="318" font-size="17" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >else holds.</text><text x="815" y="342" font-size="17" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" ></text><text x="815" y="366" font-size="17" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >Stacks freely, above the cap,</text><text x="815" y="390" font-size="17" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >and adds no risk to the</text><text x="815" y="414" font-size="17" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-family="'Crimson Pro', Georgia, serif" >one receiving it.</text><text x="500.0" y="638" font-size="16" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >Each layer stacked at once raises the risk of a Crystal Fracture Event. Two is a gamble veterans take.</text></svg>
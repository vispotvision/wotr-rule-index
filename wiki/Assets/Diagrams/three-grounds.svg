<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"><defs><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#110d09"/></radialGradient></defs><rect width="1000" height="600" rx="14" fill="url(#glow)"/><rect x="8" y="8" width="984" height="584" rx="10" fill="none" stroke="#d8ab4f" stroke-opacity=".45"/><text x="500.0" y="58" text-anchor="middle" fill="#d8ab4f" font-size="34" font-weight="600" letter-spacing="3">THREE GROUNDS OF AUTHORITY</text><text x="500.0" y="88" text-anchor="middle" fill="#a8957a" font-size="19" font-style="italic" font-family="'Crimson Pro', Georgia, serif">On what grounds does anyone get to say what happens?</text><path d="M380.0 100 L488.0 100 M512.0 100 L620.0 100" stroke="#d8ab4f" stroke-opacity=".5"/><polygon points="500.0,94 506.0,100 500.0,106 494.0,100" fill="#d8ab4f"/><path d="M40 520 L40 200 Q175 120 310 200 L310 520 Z" fill="#9fd6ff" fill-opacity=".06" stroke="#9fd6ff" stroke-opacity=".55" stroke-width="1.5"/><path d="M53 510 L53 206 Q175 136 297 206 L297 510" fill="none" stroke="#9fd6ff" stroke-opacity=".2"/><path d="M131 230 Q175 196 219 230 Q175 264 131 230 Z" fill="none" stroke="#9fd6ff" stroke-width="2"/><circle cx="175" cy="230" r="12" fill="#9fd6ff" fill-opacity=".6"/><circle cx="175" cy="230" r="22" fill="none" stroke="#9fd6ff" stroke-opacity=".3" stroke-dasharray="2 4"/><circle cx="175" cy="230" r="30" fill="none" stroke="#9fd6ff" stroke-opacity=".3" stroke-dasharray="2 4"/><text x="175" y="318" font-size="22" fill="#9fd6ff" text-anchor="middle" font-weight="700" letter-spacing="2">BY MEASUREMENT</text><line x1="115" y1="334" x2="235" y2="334" stroke="#9fd6ff" stroke-opacity=".5"/><text x="175" y="368" font-size="19" fill="#d8ab4f" text-anchor="middle" font-weight="normal" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif" >THE GUILD ACCORD</text><text x="175" y="404" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >the coil reads a soul in under</text><text x="175" y="424.15" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >a minute, and the reading is</text><text x="175" y="444.29999999999995" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >honest</text><path d="M365 520 L365 200 Q500 120 635 200 L635 520 Z" fill="#d8ab4f" fill-opacity=".06" stroke="#d8ab4f" stroke-opacity=".55" stroke-width="1.5"/><path d="M378 510 L378 206 Q500 136 622 206 L622 510" fill="none" stroke="#d8ab4f" stroke-opacity=".2"/><g transform="translate(455.0 180.0) scale(0.450)" fill="none" stroke="#d8ab4f" color="#d8ab4f" stroke-width="4.89" stroke-linejoin="round" stroke-linecap="round" opacity="1.0">

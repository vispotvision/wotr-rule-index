      <polygon points="100,104 112,120 100,136 88,120" fill="currentColor" fill-opacity=".45"/></g><text x="500" y="318" font-size="22" fill="#d8ab4f" text-anchor="middle" font-weight="700" letter-spacing="2">BY DESCENT</text><line x1="440" y1="334" x2="560" y2="334" stroke="#d8ab4f" stroke-opacity=".5"/><text x="500" y="368" font-size="19" fill="#d8ab4f" text-anchor="middle" font-weight="normal" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif" >THE ARCHAIC BLOODLINES</text><text x="500" y="404" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >Moto · Zettari · Yukari ·</text><text x="500" y="424.15" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >Agamalu, descended from the</text><text x="500" y="444.29999999999995" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >Epochs themselves</text><path d="M690 520 L690 200 Q825 120 960 200 L960 520 Z" fill="#d0453a" fill-opacity=".06" stroke="#d0453a" stroke-opacity=".55" stroke-width="1.5"/><path d="M703 510 L703 206 Q825 136 947 206 L947 510" fill="none" stroke="#d0453a" stroke-opacity=".2"/><line x1="825" y1="196" x2="825" y2="260" stroke="#d0453a" stroke-width="2"/><line x1="781" y1="210" x2="869" y2="210" stroke="#d0453a" stroke-width="2"/><path d="M765 238 L781 210 L797 238 Q781 248 765 238 Z" fill="#d0453a" fill-opacity=".3" stroke="#d0453a" stroke-width="1.5"/><path d="M853 238 L869 210 L885 238 Q869 248 853 238 Z" fill="#d0453a" fill-opacity=".3" stroke="#d0453a" stroke-width="1.5"/><path d="M807 264 L843 264" stroke="#d0453a" stroke-width="2.4"/><text x="825" y="318" font-size="22" fill="#d0453a" text-anchor="middle" font-weight="700" letter-spacing="2">BY ATTRIBUTION</text><line x1="765" y1="334" x2="885" y2="334" stroke="#d0453a" stroke-opacity=".5"/><text x="825" y="368" font-size="19" fill="#d8ab4f" text-anchor="middle" font-weight="normal" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif" >THE BENCH OF</text><text x="825" y="392" font-size="19" fill="#d8ab4f" text-anchor="middle" font-weight="normal" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif" >ATTRIBUTION</text><text x="825" y="428" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >who did this, and by what</text><text x="825" y="448.15" font-size="15.5" fill="#f1e4c6" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >warrant</text><text x="500.0" y="550" font-size="15.5" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >The Accord does not need to depose a king. It needs only to stop pumping.</text><text x="500.0" y="574" font-size="15.5" fill="#a8957a" text-anchor="middle" font-weight="normal" font-style="italic" font-family="'Crimson Pro', Georgia, serif" >A crown passes to a body. Rank does not.</text></svg>